# Derived from the unprivileged base image's own nginx.conf. Two things carry over and must:
# the pid under /tmp, and every temp path under /var/cache/nginx or /tmp — those are the only
# two writable mounts, and nginx dies at start on any other.

worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # Hides the version and nothing more — nginx still sends `Server: nginx`. Removing the header
    # outright needs a third-party module the official images do not ship, and compiling one
    # against the runtime base's exact source in lockstep with every base bump is real maintenance
    # coupling bought for a banner that now discloses only "nginx". The scanner alert that
    # motivated stripping it at the distribution fires on a VERSION, so it does not regress.
    server_tokens off;

    # Dynamic compression, for what has no pre-compressed sibling — the rendered configuration
    # document above all. The assets are handled by `gzip_static` in their own location.
    #
    # No brotli: it needs the same third-party compile stage the `Server` header was refused over,
    # and accepting it there while rejecting it here would be incoherent. The residual is real and
    # not papered over — brotli-capable browsers, which is all of them, receive gzip, so the bundle
    # transfers larger than it did through the distribution.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    # NO `include /etc/nginx/conf.d/*.conf`, and its absence is load-bearing. The base image ships
    # a default site there that also listens on 8080; whichever server is parsed first becomes the
    # default, so leaving it in place is a coin toss between this configuration and one with no
    # security headers at all. The Dockerfile deletes the file; this drops the include as well, so
    # neither alone is what protects it.
    include /tmp/nginx-conf/*.conf;
}
