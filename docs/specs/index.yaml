    title: "One Run, One Trace — the Mechanism and the Success Path"
    description: "Makes each control-plane run one trace on its success path by minting the traceparent at the API, threading it through the state and adopting it in every verb before its span opens, for operators."
    spec_status: "Completed"
    depends_on: ["SPEC-128", "SPEC-130", "SPEC-224"]
    arc: "observability-continuation"
    path: "docs/specs/SPEC-225-one-run-one-trace.md"
  - id: "SPEC-226"
    title: "Child Spans for the Seven Flat Planes"
    description: "Adds child spans around bounded internal steps in the seven planes that had none (archive, file-ops, file-send, results-conversion, shared-space, table-builder, table-share), for operators diagnosing slow verbs."
    spec_status: "Completed"
    depends_on: ["SPEC-130", "SPEC-224"]
    arc: "observability-continuation"
    path: "docs/specs/SPEC-226-child-spans-in-the-shared-control-plane-helpers.md"
  - id: "SPEC-227"
    title: "The Failure Path Joins the Trace, and the Cross-Check Nobody Wrote"
    description: "Brings a run's failure path into the same trace and widens the failure-seed guard to check every state that feeds a failure terminal, for operators and developers."
    spec_status: "Completed"
    depends_on: ["SPEC-225"]
    arc: "observability-continuation"
    path: "docs/specs/SPEC-227-the-failure-path-joins-the-trace.md"
  - id: "SPEC-228"
    title: "The Pre-Identity Failure Joins the Trace, from the Envelope the State Already Carries"
    description: "Lets a pre-identity failure's notify-failure verb join the run's trace by reading the traceparent from the raw queue envelope already on the state, which it adds to the four planes lacking it, for operators."
    spec_status: "Completed"
    depends_on: ["SPEC-227", "SPEC-229"]
    path: "docs/specs/SPEC-228-the-pre-identity-failure-joins-the-trace.md"
  - id: "SPEC-229"
    title: "Bound the Fields Nothing Bounds, and Measure the Cap Against the Limit That Binds"
    description: "Bounds every caller-controlled field in the control-plane request chain and re-derives the message cap from the Step Functions 256 KiB limit, so no request can overflow a state and silence its failure notice."
    spec_status: "Completed"
    depends_on: []
    path: "docs/specs/SPEC-229-bound-the-fields-and-measure-the-cap.md"
  - id: "SPEC-230"
    title: "Bound Excel by Cells, Because the Converter's Memory Binds per Cell and Not per Byte"
    description: "Bounds Excel result saves by cell count rather than bytes, refusing an over-limit export within seconds with a message naming rows, cells and the limit instead of timing out after ten minutes, for users."
    spec_status: "Completed"
    depends_on: ["SPEC-222"]
    path: "docs/specs/SPEC-230-bound-excel-by-cells.md"
  - id: "SPEC-231"
    title: "Count a Result's Rows from Athena's Own Statistics, Not by Walking Every Page"
    description: "Shows a succeeded query's exact row count from Athena's runtime statistics through one API route instead of walking every result page, still counting by walking where Athena does not count, for Query users."
    spec_status: "Completed"
    depends_on: ["SPEC-080", "SPEC-199"]
    path: "docs/specs/SPEC-231-count-rows-from-athenas-statistics.md"
  - id: "SPEC-232"
    title: "Every Query Route Proves the Execution Is the Caller's, Because an Execution Id Is a Claim"
    description: "Makes the API's query status, results and stop routes verify that the Athena execution belongs to the caller, answering unknown and foreign ids identically, so one user cannot read or stop another's query."
    spec_status: "Completed"
    depends_on: ["SPEC-199", "SPEC-220", "SPEC-221"]
    path: "docs/specs/SPEC-232-every-query-route-proves-the-execution-is-the-callers.md"
  - id: "SPEC-233"
    title: "A Failed Status Poll Ends the Query Tab's Run, and Says Why"
    description: "Makes a failed status poll end a Query tab's run after one retry and show the error code's wording in the tab's error banner, instead of spinning on Running for five minutes with no message."
