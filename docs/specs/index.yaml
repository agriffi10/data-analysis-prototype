    depends_on: ["SPEC-183", "SPEC-242", "SPEC-243"]
    path: "docs/specs/SPEC-247-a-saved-exploration-reopens-as-an-exploration.md"
  - id: "SPEC-248"
    title: "A Name Is One User's or One Space's, and Only the Plane Writes a Membership"
    description: "Closes the access gap where a signup or shared-space name could be claimed as the other's Glue database name and anyone could write any name into their own membership list, so only the plane writes memberships."
    spec_status: "Draft"
    depends_on: ["SPEC-012", "SPEC-051", "SPEC-056"]
    path: "docs/specs/SPEC-248-a-name-is-one-users-or-one-spaces.md"
  - id: "SPEC-249"
    title: "Filter by Value Lists a Column's Values to Tick"
    description: "Replaces the one-cell Filter by this value action with a Filter by value dialog listing a column's values with row counts to tick as is-one-of or is-not-one-of, for Data Explorer users."
    spec_status: "Completed"
    depends_on: ["SPEC-238", "SPEC-243"]
    path: "docs/specs/SPEC-249-filter-by-value-lists-a-columns-values-to-tick.md"
  - id: "SPEC-250"
    title: "An Archive Has a Name, and a Restore Picks It From a List"
    description: "Lets a user name an archive and pick a restore from a list of the space's archives by name, date and contents instead of pasting an id, and explains in the confirmation where data goes and how restore works."
    spec_status: "Completed"
    depends_on: ["SPEC-168", "SPEC-170", "SPEC-172", "SPEC-246"]
    path: "docs/specs/SPEC-250-an-archive-has-a-name-and-a-restore-picks-it-from-a-list.md"
  - id: "SPEC-251"
    title: "A Filter Is Built From Conditions and Groups, Not Typed as SQL"
    description: "Replaces the Data Explorer's raw-SQL Filter expression box with a Filter rows builder of conditions grouped as all or any, plus is like and is not like, keeping existing expressions read-only."
    spec_status: "Completed"
    depends_on: ["SPEC-238", "SPEC-243", "SPEC-247", "SPEC-249"]
    path: "docs/specs/SPEC-251-a-filter-is-built-from-conditions-and-groups.md"
  - id: "SPEC-252"
    title: "The Control Planes Are One Module, Composed From the Root"
    description: "Replaces the eight copy-built control-plane modules with one control-plane building block that the root calls eight times, so the next reader maintains one machine instead of eight, with a CI plan proving nothing deployed changed."
    spec_status: "Completed"
    depends_on: ["SPEC-213"]
    arc: "infra-building-blocks"
    path: "docs/specs/SPEC-252-the-control-planes-are-one-module-composed-from-the-root.md"
  - id: "SPEC-253"
    title: "The Deploy Role's Plane Grants Are One Template"
    description: "Renders the deploy role's eight per-plane managed policies from one template and one map of planes, so a grant fix is one edit and a new plane is one map entry, with a CI plan showing no IAM document changed."
    spec_status: "Completed"
    depends_on: ["SPEC-252"]
    arc: "infra-building-blocks"
    path: "docs/specs/SPEC-253-the-deploy-roles-plane-grants-are-one-template.md"
  - id: "SPEC-254"
    title: "The Standalone Functions Are Building-Block Calls"
    description: "Moves the scheduled functions and the two single-writer queues onto the scheduled-function module and a new queue-consumer module, composed from the root, with a CI plan showing nothing deployed changed."
    spec_status: "Completed"
    depends_on: ["SPEC-252"]
    arc: "infra-building-blocks"
    path: "docs/specs/SPEC-254-the-standalone-functions-are-building-block-calls.md"
  - id: "SPEC-255"
    title: "The Portal Is a Next.js App Served by a Node Container"
    description: "Moves the portal from a Vite build behind nginx and CloudFront to a Next.js app on a Node server: the existing app mounts client-only in one catch-all route, the server renders the runtime document and the per-request CSP, and the Fargate web tier becomes the only front door."
    spec_status: "Completed"
    depends_on: []
    arc: "nextjs"
    path: "docs/specs/SPEC-255-the-portal-is-a-nextjs-app-served-by-a-node-container.md"
  - id: "SPEC-256"
    title: "The App Router Owns the Shell, and Navigation Goes Through One Seam"
    description: "Moves the providers and the signed-in shell into the root layout behind the boot, puts every navigation behind one seam that works under both routers, and splits the route table and its cross-area tests into one module per area, so the area moves that follow each edit only their own files."
    spec_status: "In Progress"
    depends_on: ["SPEC-255"]
    arc: "nextjs"
    path: "docs/specs/SPEC-256-the-app-router-owns-the-shell-and-navigation-goes-through-one-seam.md"
  - id: "SPEC-257"
    title: "The Next.js Server Holds the Session"
    description: "The portal's Next.js server becomes an OIDC client that holds each browser's session in DynamoDB behind an opaque httpOnly cookie and forwards same-origin API calls with the session's token, built beside Amplify and not yet used by the browser, so SPEC-262 can switch the browser onto it."
    spec_status: "Completed"
    depends_on: ["SPEC-255"]
    arc: "nextjs"
    path: "docs/specs/SPEC-257-the-nextjs-server-holds-the-session.md"
  - id: "SPEC-258"
    title: "Files, Notifications and Help Move Onto the App Router"
    description: "Serves the Files, Notifications and Help pages from App Router pages instead of the react-router catch-all, with nothing a user does on them changing."
    spec_status: "Draft"
    depends_on: ["SPEC-256"]
    arc: "nextjs"
    path: "docs/specs/SPEC-258-files-notifications-and-help-move-onto-the-app-router.md"
  - id: "SPEC-259"
    title: "Query Moves Onto the App Router"
    description: "Serves the Query workspace from an App Router page instead of the react-router catch-all, with its editor, its runs and its hand-offs unchanged."
    spec_status: "Draft"
    depends_on: ["SPEC-256"]
    arc: "nextjs"
    path: "docs/specs/SPEC-259-query-moves-onto-the-app-router.md"
  - id: "SPEC-260"
    title: "Explore and Connections Move Onto the App Router"
    description: "Serves the Data Explorer and the Connections page from App Router pages instead of the react-router catch-all, with the Explorer's deep links and hand-offs unchanged."
    spec_status: "Draft"
    depends_on: ["SPEC-256"]
    arc: "nextjs"
    path: "docs/specs/SPEC-260-explore-and-connections-move-onto-the-app-router.md"
  - id: "SPEC-261"
    title: "Data Quality and Its Report Route Move Onto the App Router"
    description: "Serves the data-quality runs page and the report route from App Router pages instead of the react-router catch-all, with the report still gated before it reads anything and its space link still waiting for a fresh read."
    spec_status: "Draft"
    depends_on: ["SPEC-256"]
    arc: "nextjs"
    path: "docs/specs/SPEC-261-data-quality-and-its-report-route-move-onto-the-app-router.md"
  - id: "SPEC-262"
    title: "The Browser Signs In Through the Server"
    description: "The browser stops holding tokens: it signs in, signs out and calls the API through the Next.js server's session routes and /api/ pass-through, Amplify and the public Cognito client retire, local development signs in through its own client, and every allowlist that served the old path narrows in a second merge."
    spec_status: "Draft"
    depends_on: ["SPEC-256", "SPEC-257", "SPEC-258", "SPEC-259", "SPEC-260", "SPEC-261"]
    arc: "nextjs"
    path: "docs/specs/SPEC-262-the-browser-signs-in-through-the-server.md"
