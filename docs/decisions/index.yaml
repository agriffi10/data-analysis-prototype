      - title: "A delete removes people, not things — and retention keys on a durable fact, never live status (SPEC-205)"
        fence: "**A shared-space delete removes PEOPLE, not things**, keyed on the durable `everActive` — never live `status`, which moves `active → deleting → failed` over intact data, and where `deleting` is **not** evidence a space was usable (delete is gated on ownership alone). **One predicate**, `is_destroyable`, routes the delete AND refuses the add; complements written twice drift silently both ways. Inert because the `owner` **field** is cleared, or for the member actions `emptiedAt` — so test it **as the original owner** AND on a live record. A name is never reusable. **The route and the owner are decided INSIDE the swap that claims the record** (`begin_delete`, for delete and forget), never on a read before it: a route read first tore down a space a create turned active in between. `finalize` refuses any record that is no longer its own reservation, so a create cannot turn a claimed space usable after the claim either (`a-delete-decides-its-route-on-the-record-it-claims-and-a-removal-cannot.md`). **A partial teardown never frees the name.** `delete_objects` returns **HTTP 200 with a per-item `Errors` array**, so a partial failure reads as success; raise, and leave the registry record — the record *is* the name lock."
        status: "stable"
