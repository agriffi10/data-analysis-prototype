      - title: "Every plane notifies on a pre-verb failure, and `failure_reason` is the only decoder (SPEC-152)"
        fence: "**Every plane notifies on a pre-verb failure** — a `NotifyFailure` before `Fail`, reached on every path, because the no-verb-ran paths cannot be selected for in ASL."
