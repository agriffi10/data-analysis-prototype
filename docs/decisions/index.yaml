      - title: "A group id orders the STARTS, not the runs, and what overlap costs on each plane (control-plane-wide)"
        fence: "**An `IF NOT EXISTS` create reports somebody's success, not necessarily yours.** It is what makes a retry a no-op, and a run that lost a race runs exactly the same no-op — so the statement succeeding is no evidence THIS run built the table, and a plane that reports on it alone is speaking for whoever won. Table-builder confirms instead: it reads the table back and refuses `table_exists` unless the catalog carries the LOCATION, the partition keys and the projection this run declared, compared through the parser and the renderer that built the statement rather than a second copy of either. Table-share's create is the same statement and still tells both runs they succeeded. **A `MessageGroupId` orders the STARTS, not the runs, on every Pipe-fed plane.** The Pipe starts a Standard machine `FIRE_AND_FORGET`, and the message leaves the queue when `StartExecution` returns, so the next one in its group starts while the first still runs. A plane whose runs must not overlap needs a guard of its own: a lock, a conditional write, or a key unique to the run. Notifications and feedback are the exception: an event-source mapping drains them, and that does hold a group to one invocation. What overlap costs, plane by plane."
        status: "stable"
        path: "docs/decisions/control-planes/a-group-id-orders-the-starts-not-the-runs-and-what-overlap-costs-on.md"
