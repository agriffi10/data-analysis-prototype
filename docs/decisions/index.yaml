      - title: "Every control-plane machine that can run for hours declares a TimeoutSeconds (SPEC-161)"
        fence: "**`TimeoutSeconds` is TOP-LEVEL and cannot notify on its own**: catchers do not cover top-level execution failures, so a ceiling ships **with** an EventBridge `TIMED_OUT` rule (never `FAILED`, or every caught failure double-notifies). The cost, an uncaught `DataLimitExceeded` or `Runtime` telling nobody, is accepted, and a `FAILED` door has three traps (`every-plane-notifies-on-a-pre-verb-failure-and-failure-reason-is-the.md`)."
