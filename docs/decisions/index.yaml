        path: "docs/decisions/control-planes/every-plane-notifies-on-a-pre-verb-failure-and-failure-reason-is-the.md"
      - title: "Everything unbounded on the state travels by pointer — including the definition (SPEC-161, extending SPEC-090/160)"
        fence: "**Everything unbounded travels by pointer**, never on the state, and **a cap is not a substitute**. The exception is a value the system did not choose to put there: `$$.Execution.Input` is bounded by Step Functions admitting the execution and there is no pointer to it, because nothing wrote it anywhere a verb could fetch it. **Every plane's `RecordFailure` now carries that envelope**, which is what lets a failure that replaced the state name its own run — so the exception is load-bearing on eight states rather than theoretical. What stops it generalising is the cap SPEC-229 supplies: **every caller-controlled field on an enqueue request declares a bound**, and the four-link chain is measured against the 256 KiB state limit for every route rather than argued about. **Table share CLONES the source definition, never re-infers it**, and pushes without consent."
        status: "stable"
        path: "docs/decisions/control-planes/everything-unbounded-on-the-state-travels-by-pointer-including-the.md"
      - title: "Excel is bounded by cells, because the converter's memory is spent per cell (SPEC-230)"
        fence: "**Excel is capped by a cell count, because the converter's memory is spent per cell**: a byte cap admitted a result the converter could not hold. **A refusal that cannot fire is a fence that misleads everyone downstream.** Excel's 16,384-column ceiling is unreachable here — the described columns ride the 256 KB state, which a realistic column entry fills between ~2,500 and ~6,400 — so the cap that exists is the TRANSPORT's, sits in describe-results, and applies to every format. Reasoning: `the-converters-shape-is-decided-by-what-cannot-stream-and-what-cannot.md`."
        status: "stable"
        path: "docs/decisions/control-planes/excel-is-bounded-by-cells-because-the-converters-memory-is-spent-per.md"
