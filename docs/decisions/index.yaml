        fence: "**A space's Glue database and a user's personal one share ONE namespace under the bare name**, and a space may be named after a user. So the create **marks** the database it makes, refuses a name whose database exists unmarked as taken, and the teardown revokes on and drops **only a marked one** — `teardown.owns_database` is the one test all three read."
        status: "stable"
        path: "docs/decisions/control-planes/a-space-named-after-a-user-finds-that-users-database-and-a-teardown.md"
      - title: "A space's NAME is held to the catalog rule where it is CHOSEN, and the refusal is create-only (2026-09-22)"
        fence: "**A shared space's NAME is held to the catalog rule where it is CHOSEN, and was held nowhere before.** One string is four things — a Glue database, an S3 prefix segment, a principal tag VALUE the portal role interpolates into a resource ARN, and, raw and deliberately, the table-build and table-share `MessageGroupId` — and every reader was written against `CATALOG_IDENTIFIER_RE` while only the browser's create dialog applied it. A live check made `live0922 odd` through the API: it provisions, uploads and queries, and **Create table and Table share are permanently impossible in it**, because SQS's key grammar admits no space. The create path now refuses `CreateNameUnusable` in the dialog's own words, and **the refusal is create-only on purpose** — a space already carrying such a name has to stay deletable, or its membership slot is stranded with it. The downstream refusals stay rather than being made redundant."
        status: "stable"
        path: "docs/decisions/control-planes/a-spaces-name-is-held-to-the-catalog-rule-where-it-is-chosen-and-the.md"
      - title: "A transfer's refusals are RETURN VALUES, because a raise in the validator reaches nobody (SPEC-208)"
        fence: "**Past the `Catch`, a raised refusal keeps its reason and loses its `tokens`**, which never reach a `Cause`. So a raise names what its verb found — a column, a colliding item, for a refusal of the whole request — only when that verb tells it on the way out, as `columns_removed` does; a name told further down, by an end producer or `NotifyFailure`, travels on the state as a RETURN VALUE. And most planes' `NotifyFailure` drop a `TerminalError` as already told, so one its verb did not tell reaches nobody, and so can a validator's untold raise, since not every notifier recovers the actor from `raw`. Collapse what a REQUESTER reads, or it is an oracle."
        status: "stable"
        path: "docs/decisions/control-planes/a-transfers-refusals-are-return-values-because-a-raise-in-the-validator.md"
      - title: "Control-plane DLQ drain → user notification (SPEC-126)"
        fence: "**The DLQ drain** sweeps request DLQs and notifies from **`identity.actor`**; its redaction blanks the two LEGACY token fields, one of which holds a token in any message enqueued before the API stopped sending one. Two are undrained: notifications (circular), feedback (no identity in its body)."
