      - title: "A run is ONE trace on the success path, and the extractor is a security boundary (SPEC-225)"
        fence: "**A run is ONE trace**, adopted from FIVE event shapes — the state payload, the Pipe envelope, a Distributed Map's `ItemBatcher.BatchInput`, an inline Map's `request`, and the forwarded envelope a failure terminal carries on the state as `raw`, which is the only one of the five reachable when the error REPLACED the state. **The shape list is a security boundary**: the body branch fires for a LIST only, because a bare dict's `body` is an API Gateway caller's own, and nothing overwrites an adopted trace. Adoption comes **after** the per-invocation reset, which clears it; `run_traceparent()` returns the value **verbatim**, since rebuilding it re-emits an inbound `-00` as `-01`. A Map's `BatchInput` pair is **per-plane** — table-share's state has no `requestId`, so demanding one is `States.Runtime` on every share. The failure path is threaded too, since SPEC-227, and the case that could not be threaded is CARRIED instead since SPEC-228."
