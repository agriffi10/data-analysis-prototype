        path: "docs/decisions/control-planes/no-asl-state-decodes-an-error-cause-pr-252-control-plane-wide.md"
      - title: "Not every success notice links, and the table planes' do not on purpose"
        fence: "Table-build and table-share success notices carry no `link`, and the restore's started notice has none either, by decision; ask Andrew before adding one to make the producers uniform."
