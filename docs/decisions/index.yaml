      - title: "A post-identity failure needs its own seed, and the fleet guard cannot see it (SPEC-165)"
        fence: "**A post-identity failure needs its own seed.** A `Pass` hard-fails on an ABSENT key — an uncatchable `States.Runtime`, raised *before* the notifier — so a catch may only route to a state whose every read its seed supplies, whatever the key is called. Nothing reads `$.raw` any more, which is what retired the instance of this that used to bite; the rule is the general one, and a fleet guard walks every seed's forward path to hold it."
        status: "stable"
        path: "docs/decisions/control-planes/a-post-identity-failure-needs-its-own-seed-and-the-fleet-guard-cannot.md"
