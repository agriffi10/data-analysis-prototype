      - title: "One producer, after the release, reached from BOTH of ReleaseLock's edges (SPEC-191)"
        fence: "**The outcome producer sits after `ReleaseLock`, and `ReleaseLock`'s `Catch` moves with its `Next`**: pointed at the terminal, that catch skips the producer, so a release whose `Retry` a throttle exhausts completes the operation and tells the user nothing. **Where a plane has an end producer, it is the ONE voice for every per-item outcome** — not each verb. Table-share has none, and its verbs each tell the outcome only they know."
        status: "stable"
