        fence: "The vault class is `GLACIER` Flexible Retrieval, set once in `ARCHIVE_STORAGE_CLASS`; no code may branch on it, a restore is `RestoreObject`, a wait and a copy, and the confirm dialog must state the 90-day minimum."
        status: "stable"
        path: "docs/decisions/archive-and-restore/glacier-and-why-the-other-two-were-rejected.md"
      - title: "One front door, one `Validated` Pass, and two message prefixes"
        fence: "The restore validator is a branch of validate-authorize: both modes return the same five top-level keys, check unknown fields per mode, and carry `mode` on the failure path to pick between two message prefixes."
        status: "stable"
        path: "docs/decisions/archive-and-restore/one-front-door-one-validated-pass-and-two-message-prefixes.md"
      - title: "One plane, one `mode` branch, and no grant this spec did not need"
        fence: "One machine serves archive and restore, branching on `mode`; every `Choice` comparison is guarded with `IsPresent`, and its `Default` seeds a reason code, never `TerminalError`."
        status: "stable"
        path: "docs/decisions/archive-and-restore/one-plane-one-mode-branch-and-no-grant-this-spec-did-not-need.md"
      - title: "Only three outcomes needed a producer, and one of them had to be invented"
        fence: "Only `archived`, `restored` and `restore_started` come from the outcome producer, the other six from existing failure paths; the ASL seeds which, `restore_started` fires after `RetrieveObjects`, and the producer can never fail the run."
        status: "stable"
        path: "docs/decisions/archive-and-restore/only-three-outcomes-needed-a-producer-and-one-of-them-had-to-be-invented.md"
      - title: "Retention is a CEILING, not a WORM floor — and the lifecycle rule is unfiltered on purpose"
        fence: "Archived objects expire after 2557 days by one unfiltered bucket-wide rule, and earlier deletes stay allowed; Object Lock is out, and a second content class means revisiting the rule, never adding a filter."
        status: "stable"
        path: "docs/decisions/archive-and-restore/retention-is-a-ceiling-not-a-worm-floor-and-the-lifecycle-rule-is.md"
      - title: "Retrieval as the point of no return, and the four asymmetries the restore introduces (SPEC-171)"
        fence: "Retrieval is where a restore becomes billed and uncancellable, so the guard runs twice, the two Maps tolerate opposite failure, the poll budget keeps headroom, and the gate protects the archive."
        status: "stable"
        path: "docs/decisions/archive-and-restore/retrieval-as-the-point-of-no-return-and-the-four-asymmetries-the.md"
      - title: "Review closed two holes, and one of them was a silent, unrecoverable deletion"
        fence: "A user's file named `_manifest.json` at the space root is refused whole as `reserved_object_name`, and only at that exact key; the guard stops at the round that finds its first collision."
        status: "stable"
        path: "docs/decisions/archive-and-restore/review-closed-two-holes-and-one-of-them-was-a-silent-unrecoverable.md"
      - title: "The archive surface: a confirm that is not a confirm, folder names as identity, and the first prefix write gate (SPEC-172)"
        fence: "In the browser, Enter can never confirm an archive, the receipt folder names are the archive ids, and write gating follows each space bucket's own Deny."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-archive-surface-a-confirm-that-is-not-a-confirm-folder-names-as.md"
      - title: "The archive vault, and the four choices that shape the whole arc (SPEC-168)"
        fence: "Archived data sits in a separate `GLACIER` vault the browser cannot reach, under keys that encode their origin, and one machine serves both archive and restore."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-archive-vault-and-the-four-choices-that-shape-the-whole-arc.md"
      - title: "The artifacts are ordered most durable to least, and the receipt's failure is terminal"
        fence: "Artifacts land in the order manifest, source deletion, receipt, so a receipt exists only for a completed archive; a receipt failure fails the run and names the request id, and nothing may depend on the manifest."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-artifacts-are-ordered-most-durable-to-least-and-the-receipts.md"
      - title: "The bound is botocore's connection pool, not the thread count"
        fence: "`RESTORE_HEAD_CONCURRENCY` stays at 8, inside botocore's default pool of 10, and the verb's timeout pays for the work; `RESTORE_CONFLICT_SAMPLE` is only a presentation bound."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-bound-is-botocores-connection-pool-not-the-thread-count.md"
      - title: "The bucket the browser has no relationship with"
        fence: "The browser reaches the vault only by a restore request: no CORS, no `connect-src`, no portal-role statement, and a bucket Deny that includes `s3:RestoreObject`; it also may not write to the archive receipt folders."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-bucket-the-browser-has-no-relationship-with.md"
      - title: "The ceiling ships with its rule, again"
        fence: "The top-level `TimeoutSeconds` ships together with an EventBridge rule on `TIMED_OUT` only, never `FAILED`, and a notify-failure door with the `DescribeExecution` fallback."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-ceiling-ships-with-its-rule-again.md"
      - title: "The commit gate, and the four choices that make a deletion safe (SPEC-169)"
        fence: "Deleting an archive's source is guarded in layers: a commit gate, a rollback confined to the run's own prefix, a narrow delete grant, a single-use request id and refusal of anything undeletable."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-commit-gate-and-the-four-choices-that-make-a-deletion-safe.md"
      - title: "The delete grant is the one this role could not inherit"
        fence: "The archive role may delete only on the two space buckets, with an explicit Deny on `system_settings/athenaresults/`, `user_settings/`, `system_settings/archive/` and any `DO_NOT_DELETE.txt`; `assert_deletable` checks the whole list first and fails loudly."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-delete-grant-is-the-one-this-role-could-not-inherit.md"
      - title: "The destination guard runs TWICE, because this spec turned a guarantee into a promise"
        fence: "**It runs TWICE**, and the second pass is the spec correcting itself: those billed hours are spent telling the user a restore is in flight, so re-creating a file meanwhile is the ordinary case — and the copy-back would have overwritten it, reported success and swept the vault."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-destination-guard-runs-twice-because-this-spec-turned-a-guarantee.md"
      - title: "The folder names ARE the archive ids, so the folder must stay visible"
        fence: "An archive's id is its receipt folder's name, so that folder stays visible one click in under `system_settings` and undestroyable, and all user-facing prose must name that path."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-folder-names-are-the-archive-ids-so-the-folder-must-stay-visible.md"
      - title: "The group id orders the STARTS, not the runs, and the restore guard is not absolute at the write"
        fence: "**No restore message may tell the user to destroy anything, or state the archive's condition as fact** — two restores of one archive still both run, and the first to finish sweeps the vault, so the files a message names can be the other run's output and the only copy left. The remediation is **\"move or rename\"**; the one permitted claim is time-scoped (*\"was still complete when this restore stopped\"*) and must be **earned by counting** the prefix. Both rules are enforced over the whole table and the receipt by a test with its own plant corpus, because per-sentence fixes were tried first and each review round found another sentence. **Both rules are DENYLISTS and neither is finished** — a security review walked twelve ordinary instructions (\"destroy\", \"trash\", \"get rid of\", \"send them to the recycle bin\") past the first seven-word version — so the corpus of escapes found so far is kept as a test rather than the coverage being asserted, and widening the list is the cheap side of the trade. Two residuals stand: rule 2 does not catch `destination_occupied_after_retrieval`'s \"will stay ready for a few days\", which invites no deletion; and the rules run over TEMPLATES, so a colliding key rendered into `{sample}` is attacker-chosen text in a safety-critical sentence when the space is shared."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-group-id-orders-the-starts-not-the-runs-and-the-restore-guard-is.md"
      - title: "The guard is absolute, and it runs before the retrieval"
        fence: "**The restore guard is ABSOLUTE and runs before the bill:** any occupied destination refuses the **whole** restore, and a **403 counts as occupied**. **It holds at the CHECK and at every WRITE**, by two mechanisms that are not redundant: the guard refuses the whole restore up front with the colliding paths named, and every copy-back line is a **conditional write**, so a file arriving while the Map runs is left alone one object at a time. A refused write is **resolved by comparing destination against source**, never read as occupied outright — a batch retrying after a transient fault meets its own earlier writes, and reading those as collisions would report the files it just restored as being in the way. **Every test of the condition runs against a fake**; the deployed behaviour is owed (`docs/testing/owed.md`, *the conditional copy-back*). **The comparison rests on an ETag, which under `AES256` is an MD5** — so a co-member of a shared space who knows an archived object's bytes could in principle write a same-length MD5 collision at the destination and have the item counted copied and the vault swept. It needs a chosen-prefix collision, the target's content, and write access to the path — which already allows overwriting the file directly — so what the attack adds is the sweep. Not repaired here; the repair is to prefer `ChecksumSHA256` when the object carries one."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-guard-is-absolute-and-it-runs-before-the-retrieval.md"
      - title: "The key layout: the archived key carries its own origin, partitioned by space kind"
        fence: "Vault keys are `{kind}/{name}/archive/{uuid}/…` and encode their origin; the kind segment must stay, and the browser-supplied uuid is validated as v4 and lowercased before any concatenation."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-key-layout-the-archived-key-carries-its-own-origin-partitioned-by.md"
      - title: "The lookup reads the KEYS; the record is a cross-check it can do without"
        fence: "A restore derives destinations from the archive prefix's keys with no ignore predicate; `_manifest.json` is excluded by exact root key, may be absent or unreadable, and refuses only when its count disagrees."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-lookup-reads-the-keys-the-record-is-a-cross-check-it-can-do-without.md"
      - title: "The metadata fix: a latent bug on all three planes, surfaced by a round trip"
        fence: "Copies keep content type and user metadata on both paths, with the multipart path re-stating them from a `HeadObject`; tag sets are still lost above 5 GiB, so any plane that starts tagging must fix that."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-metadata-fix-a-latent-bug-on-all-three-planes-surfaced-by-a-round.md"
      - title: "The one dialog in this app where the confirm is not the default, and Enter does nothing"
        fence: "`ArchiveDialog` is built on `ConfirmDialog`, never `FormDialog`, so focus lands on Cancel and Enter cancels; it must not say \"This can't be undone\" and states how long a restore takes instead."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-one-dialog-in-this-app-where-the-confirm-is-not-the-default-and.md"
      - title: "The receipt is rewritten, never re-rendered, and the counts come from the run"
        fence: "A restore rewrites two receipt lines by label and keeps the rest verbatim; only a proven 404 composes a fresh receipt, the ASL seeds the stage, the run supplies the counts, and only the pre-retrieval write can fail the run."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-receipt-is-rewritten-never-re-rendered-and-the-counts-come-from-the.md"
      - title: "The receipt's paths name the ROOTS, and the expansion keeps what every other plane drops"
        fence: "Receipt paths name the space root and archive root, never the selection; the expansion keeps zero-byte placeholders and hidden or underscore segments, and an empty expansion is a refusal."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-receipts-paths-name-the-roots-and-the-expansion-keeps-what-every.md"
      - title: "The request id is browser-supplied, so a reused one is refused twice over"
        fence: "A request id is single-use: `plan.load` refuses a plan that does not describe its request, inspect-source refuses a non-empty archive prefix, and a create-only claim decides between concurrent runs."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-request-id-is-browser-supplied-so-a-reused-one-is-refused-twice-over.md"
      - title: "The restore guard, and the four choices that make it safe to start a bill (SPEC-170)"
        fence: "A restore checks every destination before any billed `RestoreObject`, using heads inside the client's pool, destinations derived from the keys, and authorization from the route's space."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-restore-guard-and-the-four-choices-that-make-it-safe-to-start-a-bill.md"
      - title: "The restore's FIFO group id hashes the archive ROOT, not the bucket and the root"
        fence: "The restore's FIFO group id is the digest of `{kind}/{name}/archive/{archiveId}/`, without the bucket, derived by the API; it groups one archive's restores and orders only their starts."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-restores-fifo-group-id-hashes-the-archive-root-not-the-bucket-and.md"
      - title: "The restore's gate is the commit gate's MIRROR IMAGE, not its twin"
        fence: "A restore's failure arm deletes nothing, neither landed objects nor the archive, and no path from it reaches `DeleteArchived`; a failed vault sweep only flags `cleanupIncomplete` on a successful run."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-restores-gate-is-the-commit-gates-mirror-image-not-its-twin.md"
      - title: "The retrieval budget has deliberate headroom, and the ceiling moved for the whole plane"
        fence: "The poll budget is seven hours against a five-hour tier, so the one top-level `TimeoutSeconds` is 43,200 for both arms; a test keeps the archive arm's worst legal run more than 4× clear of it."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-retrieval-budget-has-deliberate-headroom-and-the-ceiling-moved-for.md"
      - title: "The retrieval Map tolerates NO failure, and the copy tolerates every one"
        fence: "**Retrieval is the point of no return.** Its Map tolerates **no** failure (the copy's tolerates 100%): a fault means nothing copied and the archive untouched. What makes that free is that the **verb** tolerates two codes — `RestoreAlreadyInProgress` and `InvalidObjectState` — which is also what keeps the path unconditional on the storage class. **Do not \"harden\" the verb by removing them.**"
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-retrieval-map-tolerates-no-failure-and-the-copy-tolerates-every-one.md"
      - title: "The rollback deletes what is THERE, not what it was told about"
        fence: "The rollback deletes by listing the run's own archive prefix with no ignore predicate, never from a collector's list; a partial rollback only reports its residue, and a collector that cannot read the export does not roll back."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-rollback-deletes-what-is-there-not-what-it-was-told-about.md"
      - title: "The source is deleted only when EVERY object is confirmed copied"
        fence: "**The source is deleted only when EVERY object is confirmed copied**, and the gate is a **state** — the rollback arm cannot reach `DeleteSource`, asserted by walking the ASL graph, and an unrecognisable verdict fails closed. **And all or nothing on the ETag the plan recorded**: every copy is pinned to it, and delete-source heads every original first — one that changed refuses the whole deletion and removes the vault copy, because a partial one deletes into a vault the user holds no receipt for (`the-source-is-deleted-only-while-it-is-unchanged-since-the-plan-listed.md`). **It, not the queue, is what makes two overlapping archives of one space safe when their ids differ** — the group id orders their starts and nothing else. **One id sent twice is closed by a CLAIM**, not by the queue and not by the prefix listing, which two runs reaching it together both pass: inspect-source takes a create-only write on `archive/{requestId}/claim.json` after the listing and before anything else, so S3 decides which run proceeds. It **expires** with the admin prefix at 30 days, which is safe only while no second run of an id can start that late — a test reads the queue retentions and the machine's ceiling and fails when the margin closes."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-source-is-deleted-only-when-every-object-is-confirmed-copied.md"
      - title: "The source is deleted only while it is UNCHANGED since the plan listed it"
        fence: "`delete-source` heads every original against the plan's ETag and counts the vault whole before deleting any, all or nothing, and records its verdict create-only so every retry follows it; each copy is pinned to that ETag."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-source-is-deleted-only-while-it-is-unchanged-since-the-plan-listed.md"
      - title: "The space comes from the request, and the two ids are different things"
        fence: "Restore authorization uses the space the route names, so another space's archive is plain `archive_not_found`; `requestId` must differ from `archiveId`, and the pasted id passes the one UUID regex and is lowercased."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-space-comes-from-the-request-and-the-two-ids-are-different-things.md"
      - title: "The write gate mirrors each bucket's own Deny, and averaging them gets one case wrong"
        fence: "`isWriteLockedPrefix` takes the space kind, because personal Denies only the caller's root archive folder and shared Denies `archive` at any depth; the query-results and data-quality-reports refusals are separate exceptions."
        status: "stable"
        path: "docs/decisions/archive-and-restore/the-write-gate-mirrors-each-buckets-own-deny-and-averaging-them-gets.md"
      - title: "This spec adds no IAM, and that is asserted rather than assumed"
        fence: "The restore guard adds no IAM: its heads rest on the existing `s3:GetObject` grant rather than `ListBucket`, and a test pins that distinction."
        status: "stable"
        path: "docs/decisions/archive-and-restore/this-spec-adds-no-iam-and-that-is-asserted-rather-than-assumed.md"
      - title: "Three caps, and the one the spec does not name"
        fence: "An archive is capped at 20,000 objects, 3 TiB and 10 GiB per object, each computed by a test reading `locals.tf`; the per-object cap must stay, because nothing else bounds one object's copy time."
        status: "stable"
        path: "docs/decisions/archive-and-restore/three-caps-and-the-one-the-spec-does-not-name.md"
      - title: "Two things the fleet's own guards caught while this was being written"
        fence: "Path containment lives in `cpcommon.paths` and is not copied into `arcommon`; `ARCHIVE_BUCKET` stays out of `_REQUIRED_VARS` and is read through the function `arcommon.config.archive_bucket()`."
        status: "stable"
        path: "docs/decisions/archive-and-restore/two-things-the-fleets-own-guards-caught-while-this-was-being-written.md"
  - name: "The browser"
    slug: "browser"
    path: "docs/decisions/browser/browser.md"
    governs: ["apps/portal/src/**"]
    decisions:
      - title: "A default that an empty string can defeat is not a default (SPEC-186)"
        fence: "A default must survive an empty string, and a live check must be one somebody can run: a check whose assertion no principal or surface can reach is indistinguishable from one that passes."
        status: "stable"
        path: "docs/decisions/browser/a-default-that-an-empty-string-can-defeat-is-not-a-default.md"
      - title: "A discontiguous selection copies as a rectangle, and a SQL INSERT names a placeholder"
        fence: "A discontiguous selection copies as its bounding rectangle with blanks, a copied `INSERT` names the placeholder `\"results\"`, and copy reads the raw row, never a transformed value."
        status: "stable"
        path: "docs/decisions/browser/a-discontiguous-selection-copies-as-a-rectangle-and-a-sql-insert-names.md"
      - title: "A display page is not a listing page, and the space selector is gated (SPEC-174)"
        fence: "**A display page is not a listing page.** A pager over filtered rows keeps fetching while the listing is truncated — and **stops on error**, because a failed fetch leaves \"has more\" true, which is the fill's own trigger: without the guard one failure spins forever. **The space selector is gated at the view** on `sharedWorkspaces`: with it off, it offers the personal space alone."
        status: "stable"
        path: "docs/decisions/browser/a-display-page-is-not-a-listing-page-and-the-space-selector-is-gated.md"
      - title: "A failed status poll ends the Query tab's run, and the poll is disabled rather than left to answer (SPEC-233)"
        fence: "A failed status poll ends the Query tab's run after one retry and shows the reason, sending no stop; the status bar takes its verdict from the batch, not from the last status. **A poll's stop is `enabled` resolving `false`**, never only an interval returning `false`: a failed query is stale whatever its `staleTime`, so a reconnect refetches it."
        status: "stable"
        path: "docs/decisions/browser/a-failed-status-poll-ends-the-query-tabs-run-and-the-poll-is-disabled.md"
      - title: "A flag can be neither an area nor a kill switch (SPEC-223)"
        fence: "`resultsConversion` is a presentation flag over the Save-results format choice only: off, the format is always CSV, and a CSV save still goes to the plane when the grid hides or reorders columns."
        status: "stable"
        path: "docs/decisions/browser/a-flag-can-be-neither-an-area-nor-a-kill-switch.md"
      - title: "A hidden column is still part of the row"
        fence: "Formatting is evaluated over every column, hidden ones included, and the dialogs judge applicability over the same list, so hiding a column a rule reads does not stop the rule."
        status: "stable"
        path: "docs/decisions/browser/a-hidden-column-is-still-part-of-the-row.md"
      - title: "A link in a grid is not a tab stop, and the app must not manufacture backtracking"
        fence: "A link in `role=\"grid\"` carries `tabIndex={-1}` with a focusable copy in the Value panel, and runs of `%` in a `LIKE` pattern collapse to one wildcard, or the regex backtracks catastrophically."
        status: "stable"
        path: "docs/decisions/browser/a-link-in-a-grid-is-not-a-tab-stop-and-the-app-must-not-manufacture.md"
      - title: "A link is gated by its destination's flags, derived rather than listed (2026-09-25)"
        fence: "A control navigating into another feature asks `useCanFollowLink()`, whose `linkFlags` derives the destination's flags from the registry and the space the URL names, never from a hand-written list."
        status: "stable"
        path: "docs/decisions/browser/a-link-is-gated-by-its-destinations-flags-derived-rather-than-listed.md"
      - title: "A long query settles at the ceiling, judged on a read after it, and says where its results go (SPEC-234)"
        fence: "The status watch lasts 30 minutes, then the first read after the ceiling settles the run with a \"Still running\" warning saying where the results go; nothing cancels the query, and the verdict is never cached. **A watch's ceiling is a verdict on a read after it, never on the clock**: the poll pauses while the page is hidden."
        status: "stable"
        path: "docs/decisions/browser/a-long-query-settles-at-the-ceiling-judged-on-a-read-after-it-and-says.md"
      - title: "A NULL and an empty string stay apart in all six formats, and quoting is what disambiguates the WORD"
        fence: "Copy keeps NULL and the empty string apart in all six formats; in a delimited format only `quoteValues` tells a NULL from the text `NULL`, and it is disabled in JSON, SQL and XML."
        status: "stable"
        path: "docs/decisions/browser/a-null-and-an-empty-string-stay-apart-in-all-six-formats-and-quoting-is.md"
      - title: "A palette is measured, not chosen; a link's encoding depends on where the value lands (SPEC-184)"
        fence: "Formatting changes how a value looks, never what is fetched: it starts no new execution, and no module it added may be reachable from `renderExplorationSql.ts`."
        status: "stable"
        path: "docs/decisions/browser/a-palette-is-measured-not-chosen-a-links-encoding-depends-on-where-the.md"
      - title: "A persistent in-flight surface is NEW scope, with no precedent here (SPEC-190)"
        fence: "Async file operations show a session-scoped in-flight surface, never persisted, whose entries settle on a notification with their `requestId`, on dismissal, or at the machine's own timeout."
        status: "stable"
        path: "docs/decisions/browser/a-persistent-in-flight-surface-is-new-scope-with-no-precedent-here.md"
      - title: "A procedure that cannot produce its claimed outcome invites a false bug report"
        fence: "A live-check script must describe a procedure that can produce its outcome, and one needing a raw ID token says so up front and keeps it out of shell commands; schema inference samples only the first key listed."
        status: "stable"
        path: "docs/decisions/browser/a-procedure-that-cannot-produce-its-claimed-outcome-invites-a-false-bug.md"
      - title: "A refusal announced after the confirm is worse than no affordance at all"
        fence: "An action that can never succeed is refused at the control through `Button.disabledReason`, so no confirm is reachable; `busy` stays natively `disabled`, because in flight is not a refusal."
        status: "stable"
        path: "docs/decisions/browser/a-refusal-announced-after-the-confirm-is-worse-than-no-affordance-at-all.md"
      - title: "A rule's `scope` is a field the spec's model did not have"
        fence: "A colour rule's `column` says what it tests and `scope` (`cell` or `row`) what it paints; layers override per property, and a NULL matches nothing, `<>` included."
        status: "stable"
        path: "docs/decisions/browser/a-rules-scope-is-a-field-the-specs-model-did-not-have.md"
      - title: "A `?space=` the cached list lacks is refused only on a read after the link (2026-09-15)"
        fence: "A space link the cached list lacks waits, through `useSpaceLinkPending`, for one read settled after the link before it is refused; presence is trusted at once, and a POP is not a follow, read from the navigation seam's `useNavigationType()` on the App Router. **The refusal is a verdict on a read after the link, never on `isLoading`**, which clears on any cached list, however old — every cold-load test passes while a just-joined space is refused; a link consumer calls `useSpaceLinkPending`."
        status: "stable"
        path: "docs/decisions/browser/a-space-the-cached-list-lacks-is-refused-only-on-a-read-after-the-link.md"
      - title: "A stored formatting block is discarded WHOLE"
        fence: "A stored `formatting` block is validated whole and replaced with defaults if any part is wrong, colours against the palette; a rule naming an absent column is kept and shown as inapplicable."
        status: "stable"
        path: "docs/decisions/browser/a-stored-formatting-block-is-discarded-whole.md"
      - title: "A switch-dependent option gets a guide of its own, gated by that switch (2026-09-26)"
        fence: "An option in a dialog that another switch can remove gets its own guide, gated by that switch, and a guide whose main action sits behind a flag gets a registry row for it; conditional wording is not used."
        status: "stable"
        path: "docs/decisions/browser/a-switch-dependent-option-gets-a-guide-of-its-own-gated-by-that-switch.md"
      - title: "An App Router page sets its title as it mounts, and its view owns every change after (2026-11-14)"
        fence: "**Every App Router page whose view loads through `next/dynamic` calls `usePageTitleOnMount` with the name its view titles itself by (the landing page `''`, the root not-found page `Not Found`), because Next's route announcer reads `document.title` in a passive effect of the commit that changes the router's tree, and on a first visit that commit holds the page but not its view.** Without it a screen reader hears the page the user left, while every test that does not read the stand-in's announcer stays green. The page writes in a layout effect, and never twice for one name, so the view's `usePageTitle`, a passive effect, still wins any commit holding both. A first visit announces that name, so a title the view derives from state (an unread count, a flag that is off) is read when the page is shown again. A `metadata` title does not fix it (measured) and overwrites the page's own. The not-found page is reached only by a document load, which the announcer never reads. The `routeAnnouncement` tests under `src/app/` hold each page's first visit."
        status: "stable"
        path: "docs/decisions/browser/an-app-router-page-sets-its-title-as-it-mounts-and-its-view-owns-every.md"
      - title: "Archive and restore get their own kill switch (SPEC-246)"
        fence: "`archive` is one default-on, presentation-only kill switch over archive and restore: off, the controls and guide leave the UI, while the routes stay live and the notifications remain."
        status: "stable"
        path: "docs/decisions/browser/archive-and-restore-get-their-own-kill-switch.md"
      - title: "At `tablet` the words stay and the decoration waits — the top bar and the selection toolbar (2026-09-10)"
        fence: "Between `tablet` and `desktop` the top bar and selection toolbar keep every word and drop the decoration; labels never wrap, and a new tab, control or action owes the band sweep."
        status: "stable"
        path: "docs/decisions/browser/at-tablet-the-words-stay-and-the-decoration-waits-the-top-bar-and-the.md"
      - title: "Building a table is desktop-only, and that was decided rather than discovered (2026-09-04)"
        fence: "The create-table control is deliberately absent below 900px and Help says a wider screen is needed; the limit is on the control, not the capability, and any mobile path goes in the selection toolbar."
        status: "stable"
        path: "docs/decisions/browser/building-a-table-is-desktop-only-and-that-was-decided-rather-than.md"
      - title: "`components/` may not import from `features/` (SPEC-155)"
        fence: "**`components/` may not import from `features/`** — enforced by lint. A leaf feature that becomes a shared layer gets **extracted before its second consumer**, not after."
        status: "stable"
        path: "docs/decisions/browser/components-may-not-import-from-features.md"
      - title: "Contrast is spent by translucency too, and neither the token harness nor axe can see it"
        fence: "**A palette is measured, not chosen**, in **both** themes; a colour that fails is measured **out**. Every theme trap in this area ships green — that is what makes them traps, and a count of them here went two out of date without anyone noticing, so they are numbered in their own entries and not here. A harness measures **tokens**, so anything painted at less than full strength is invisible to it: **opacity is never how a live element is made quieter** — reach for a quieter TOKEN, because a tint of the same one spends contrast the pairing list has already counted. A translucent **fill** declares what is behind it, and **each thing that can be behind it is its own pairing**, because which one is worst flips between the themes. And **`accent` is a fill, a ring and an icon colour, not text**: in the dark palette it clears 1.4.11's 3:1 against every surface and fails 1.4.3's 4.5 against all of them."
        status: "stable"
        path: "docs/decisions/browser/contrast-is-spent-by-translucency-too-and-neither-the-token-harness-nor.md"
      - title: "Copy is the selection-shaped tool and export is the result-shaped one, and reusing the save path meant moving it (SPEC-185)"
        fence: "Copy takes the cell selection from rows already fetched and export copies the execution's whole results object server-side; neither runs a second query, and exporting a selection is out of scope."
        status: "stable"
        path: "docs/decisions/browser/copy-is-the-selection-shaped-tool-and-export-is-the-result-shaped-one.md"
      - title: "Dialog Enter-to-submit fires from ONE field, never from the form (SPEC-155)"
        fence: "**Dialogs:** Enter submits from **one** field, not implicitly; Escape dispatches by **tree depth** through one registry, and a busy modal swallows it. `cx()` returns `undefined`, never `''` — `??` does not fall back on the empty string, and that cost nine dialogs their width. **The one irreversible surface refuses the affordance that would fire it.** The archive dialog is built on the confirm dialog *because* the form dialog has Enter-to-submit — focus sits on Cancel, Enter cancels — and it never says \"this can't be undone\", which would be its one false sentence."
        status: "stable"
        path: "docs/decisions/browser/dialog-enter-to-submit-fires-from-one-field-never-from-the-form.md"
      - title: "`??` does not fall back on `''`, and a helper returning `''` is a trap for every consumer"
        fence: "`cx()` returns `undefined` when nothing is truthy and `Modal` falls back with `||`, because `??` does not fall back on `''`: a shared helper returning an empty string defeats every consumer's default."
        status: "stable"
        path: "docs/decisions/browser/does-not-fall-back-on-and-a-helper-returning-is-a-trap-for-every.md"
      - title: "Escape dispatches by tree depth, not per-component opt-out (SPEC-155, supersedes `closeOnEscape`)"
        fence: "Escape goes only to the innermost enabled layer through `useEscapeKey`'s one registry, and `Modal`'s `dismissible={false}` swallows it; `Drawer`'s `closeOnEscape` is gone."
        status: "stable"
        path: "docs/decisions/browser/escape-dispatches-by-tree-depth-not-per-component-opt-out.md"
      - title: "Every guide row before this spec lived in the section the Help page opens on"
        fence: "The Data Explorer has its own Help section with a registry row per guide, guide recipes select the section first, and the guides say plainly that every filter and sort runs a query that scans data."
        status: "stable"
        path: "docs/decisions/browser/every-guide-row-before-this-spec-lived-in-the-section-the-help-page.md"
      - title: "Geometry is keyed by NAME, NULL is kept apart from empty, and a page nobody watched is not \"no rows\" (SPEC-180)"
        fence: "**Column geometry is keyed by NAME**, so geometry for a column the result no longer has is discarded by construction. **SQL NULL stays apart from the empty string** from `getQueryResults` on, because nothing downstream can undo collapsing them. **A remembered page index must not outlive its cached pages**: an absent page reads as an empty one, so the grid drew \"No rows returned\" over a full result."
        status: "stable"
        path: "docs/decisions/browser/geometry-is-keyed-by-name-null-is-kept-apart-from-empty-and-a-page.md"
      - title: "Help & guides (SPEC-074)"
        fence: "**Help & guides document only what is shipped and wired end to end.**"
        status: "stable"
        path: "docs/decisions/browser/help-and-guides.md"
      - title: "Help is read where the work is, and a gated page's help is gated by derivation (SPEC-207)"
        fence: "The header help control opens a panel over the current route through `HELP_SURFACES`, which holds no flags; the panel reads flag-filtered sections and is not addressable."
        status: "stable"
        path: "docs/decisions/browser/help-is-read-where-the-work-is-and-a-gated-pages-help-is-gated-by.md"
      - title: "jsdom has no layout, so a containment property must be arithmetic"
        fence: "jsdom reports every rect as zero, so a containment property is asserted as arithmetic over a pure function such as `listPlacement()`; the DOM test asserts only that the bound is a measurement."
        status: "stable"
        path: "docs/decisions/browser/jsdom-has-no-layout-so-a-containment-property-must-be-arithmetic.md"
      - title: "Layout boundaries reset by prop, never by `key`; a signed-in page's sits inside the shell (2026-09-10)"
        fence: "**The signed-in shell outlives every signed-in page, and no ancestor may remount it.** It holds the upload queue, the in-flight file operations and the Query workspace's runs, so it lives in the ROOT layout, under the chrome, which decides by the address through the area records whether a page is signed in. A per-page React `key` above it aborts the uploads on a nav-tab click — and passes every test that composes its own layouts. Boundaries reset by **`resetKey`**; a page's throw is caught **inside** the shell. While an upload is unfinished the shell asks before the document unloads, and sign-out disarms that first. The proof renders the **real chrome around the page the file system selects** (`renderApp`)."
        status: "stable"
        path: "docs/decisions/browser/layout-boundaries-reset-by-prop-never-by-key-a-signed-in-pages-sits.md"
      - title: "`no-restricted-imports` matches the SOURCE STRING, so a sibling rule needs relative patterns"
        fence: "`no-restricted-imports` matches the source string, so the sibling-feature clause needs relative patterns (`'../query/**'`) and is proven by committing a violation each way; tests are not exempt."
        status: "stable"
        path: "docs/decisions/browser/no-restricted-imports-matches-the-source-string-so-a-sibling-rule-needs.md"
      - title: "One `apply` per gesture, a numeric refusal at the INPUT, and a failure that keeps the rows (SPEC-181)"
        fence: "Every description change goes through one `apply`, so one gesture is at most one execution; a bad numeric value is refused at the input, and a failed query keeps the last good rows."
        status: "stable"
        path: "docs/decisions/browser/one-apply-per-gesture-a-numeric-refusal-at-the-input-and-a-failure-that.md"
      - title: "One split, two clamp domains, and the pair has to agree (SPEC-209)"
        fence: "The split is a stored fraction clamped in two domains that must agree: pixel floors are the whole clamp on a measured column, fraction bounds apply only to an unmeasured one, and the 24px divider counts in the results cap."
        status: "stable"
        path: "docs/decisions/browser/one-split-two-clamp-domains-and-the-pair-has-to-agree.md"
      - title: "Navigation goes through one seam on Next's App Router, which fed react-router inside the catch-all until it retired (SPEC-256, SPEC-263)"
        fence: "**Every navigation goes through one seam, `lib/navigation/`, on Next's App Router alone: a navigation that keeps the committed pathname is written with `history.pushState`, every other one is Next's `router.push`, and one to a path no page serves Next turns into a document load.** Written natively, a move between two pages leaves the first on screen under the second's address. The seam decides by the COMMITTED address (`window.location`), never its own render; classifies a traversal while rendering, never in a popstate listener; holds state in memory, never in history; refuses an off-site target; and matches paths case-sensitively with its own `matchPath`. Each rule rests on a Next 16.4.6 behaviour the Vitest stand-in (`src/test/nextNavigation.ts`) models with a test of its own; re-measure them on a Next upgrade."
        status: "stable"
        path: "docs/decisions/browser/react-router-in-the-catch-all-is-a-matcher-the-navigation-seam-feeds.md"
      - title: "Responsive (SPEC-095)"
        fence: "Style mobile-first on one tree with only `tablet:` (≥900) and `desktop:` (≥1300) compiled; `useBreakpoint`/`useIsMobile` gates mounting, never styling."
        status: "stable"
        path: "docs/decisions/browser/responsive.md"
      - title: "Reuse required a MOVE, and the move closed a live flag defect"
        fence: "`useSaveResults` lives in `features/catalog/` and takes its destinations as a parameter, so each view passes a gated list; Export's refusal is judged on the results location, not the grid."
        status: "stable"
        path: "docs/decisions/browser/reuse-required-a-move-and-the-move-closed-a-live-flag-defect.md"
      - title: "Sibling features hand off through navigation state, read once per history entry (SPEC-242)"
        fence: "**Sibling features cross by navigation state, never by import.** `features/query/` and `features/data-explorer/` may not import each other, so a gesture on one that opens the other navigates through the seam with a hand-off whose builder and reader live in `lib/routeHandoff.ts` — one module per shape, and never the URL, which history and logs keep. The state lives only in the seam's memory for the entry the navigation made, on the App Router, so a reload or a traversal delivers none. The receiver reads it once per seam `location.key` (`StrictMode` runs the effect twice) and replaces the entry with no state whatever happened. **A `<StrictMode>` handed to a test as the element under test doubles nothing** — React double-runs effects only under the StrictMode it places — so `renderWithProviders({strictMode})` renders it as the root; a guard proven under the nested one is unproven."
        status: "stable"
        path: "docs/decisions/browser/sibling-features-hand-off-through-router-state-read-once-per-history.md"
      - title: "State"
        fence: "TanStack Query owns server state and Context with `useReducer` owns UI state; Redux is not used."
        status: "stable"
        path: "docs/decisions/browser/state.md"
      - title: "The `@aws-sdk/*` ban is a lint rule AND a manifest sweep, because Amplify vendors the SDK (SPEC-202)"
        fence: "**The `@aws-sdk/*` ban is a lint rule AND a `package.json` sweep.** The rule is declared in **every** clause governing `src/` because flat config REPLACES rather than merges, and the sweep reads the **manifest, never `node_modules`** — a dependency may vendor the SDK, as Amplify did, so a tree assertion fails for what nobody imports and gets deleted. A dependency nobody imports is invisible to an import rule, and that leftover is how the next import arrives. **Narrowed by 257 to one exception:** `src/server/` may import `@aws-sdk/client-dynamodb` and nothing else, by a clause declared LAST so it replaces the `src/**` one; the manifest names exactly that package; and `check:bundle` fails on `DynamoDB_20120810` in any static chunk, because a lint rule reads import paths, not what shipped. **Amplify is gone (262)**: `check:bundle` also fails on `AWSCognitoIdentityProviderService`, and the manifest guard-the-guard is anchored on `next`."
        status: "stable"
        path: "docs/decisions/browser/the-aws-sdk-ban-is-a-lint-rule-and-a-manifest-sweep-because-amplify.md"
      - title: "The byte formatters share a unit ceiling, and it goes to TB (SPEC-155 FR-007)"
        fence: "`formatSize` and `formatBytes` stay separate for their `undefined` handling but share one unit table whose ceiling is TB, so one number reads the same on every screen."
        status: "stable"
        path: "docs/decisions/browser/the-byte-formatters-share-a-unit-ceiling-and-it-goes-to-tb.md"
      - title: "The dark palette is derived under the harness, not chosen, and the theme boundary put four fences there (SPEC-210)"
        fence: "Dark values are whatever passes the `lib/palette.ts` contrast harness in both themes, and every token is in a pairing or a named decorative exemption; themed shadows, dual-role tokens, fixed brand surfaces and non-hex colours each ship green if wrong."
        status: "stable"
        path: "docs/decisions/browser/the-dark-palette-is-derived-under-the-harness-not-chosen-and-the-theme.md"
      - title: "The divider needs a click path, because a drag is not an alternative to itself (SPEC-209)"
        fence: "**A drag is not an alternative to itself.** WCAG 2.5.7 wants a *single-pointer, non-dragging* path; a keyboard is not one and **no axe rule detects the absence**, so a drag-only control regresses it in silence — and a pointer path that only *resets* to a default is not one either, because it restores neither the chosen value nor the drag's functionality. Sizing the replacement is its own trap: the root font is **14px**, so `rem` spacing lies about the 24px minimum — write an absolute threshold in an absolute unit. jsdom can measure no target at all, which is why `target-size` is **disabled rather than trusted** and a static sweep covers what a class name can answer."
        status: "stable"
        path: "docs/decisions/browser/the-divider-needs-a-click-path-because-a-drag-is-not-an-alternative-to.md"
      - title: "The key namespace moves with the module, and a prefix is not cosmetic"
        fence: "A query-key prefix moves with its module, so `catalogKeys` is rooted at `['catalog']`, and invalidating one feature's keys cannot reach another feature's caches."
        status: "stable"
        path: "docs/decisions/browser/the-key-namespace-moves-with-the-module-and-a-prefix-is-not-cosmetic.md"
      - title: "The kill switch is a flag key, and it is the sixth (SPEC-190)"
        fence: "`asyncFileOperations` is a default-on flag over copy, move and delete routing: off, a single file stays synchronous and a folder or multi-item selection is refused; the conflict view stays under `files`."
        status: "stable"
        path: "docs/decisions/browser/the-kill-switch-is-a-flag-key-and-it-is-the-sixth.md"
      - title: "The palette is a bounded token set, because the contrast criterion is otherwise unassertable"
        fence: "Formatting colours are a bounded set of five foreground and four `*-soft` background tokens, never a free picker, so the whole cross product is measured per theme, selection included."
        status: "stable"
        path: "docs/decisions/browser/the-palette-is-a-bounded-token-set-because-the-contrast-criterion-is.md"
      - title: "The producer decides where a type lives, not the consumer"
        fence: "Where a producer sits in a lower layer than its consumer, the type lives with the producer, as `DatabaseSchema` does in `catalog.types.ts`."
        status: "stable"
        path: "docs/decisions/browser/the-producer-decides-where-a-type-lives-not-the-consumer.md"
      - title: "The raw value drives everything, and the transform lives at the cell"
        fence: "`transformCell` runs only at the cell, so filters, colour rules, Calc and copy all read the raw row; NULL and the empty string are returned untransformed."
        status: "stable"
        path: "docs/decisions/browser/the-raw-value-drives-everything-and-the-transform-lives-at-the-cell.md"
      - title: "The shared layer is extracted before its second consumer exists, and the rule that guards it had to be verified by violating it (SPEC-176)"
        fence: "A layer two features will share is extracted before its second consumer exists, with no behaviour change; `features/catalog/` is that layer for Query and the Data Explorer."
        status: "stable"
        path: "docs/decisions/browser/the-shared-layer-is-extracted-before-its-second-consumer-exists-and-the.md"
      - title: "The two ways out divide on the line the whole arc divides on"
        fence: "**Client state is computed in the browser; billed work is not.** A selection aggregate issues **zero** executions, and says which page it counted."
        status: "stable"
        path: "docs/decisions/browser/the-two-ways-out-divide-on-the-line-the-whole-arc-divides-on.md"
      - title: "The URL transformer's encoding is position-dependent, and both simple rules are wrong"
        fence: "A URL transformer substitutes raw at the template's leading position and encoded everywhere later, and the resolved URL must pass an `https:` allowlist; `isSafeInAppPath` does not apply."
        status: "stable"
        path: "docs/decisions/browser/the-url-transformers-encoding-is-position-dependent-and-both-simple.md"
      - title: "There is no progress percentage, and there cannot be one (SPEC-190)"
        fence: "Async file operations show what is running and since when, never a percentage: the plane reports only at the end of a run, and polling the execution for progress would be a second read path."
        status: "stable"
        path: "docs/decisions/browser/there-is-no-progress-percentage-and-there-cannot-be-one.md"
      - title: "User-facing error messaging (SPEC-106)"
        fence: "**Raw AWS/Cognito text is NEVER shown, and Athena's only as a failed query's closed Details.** `lib/errorMessages.ts` is the single source of wording; never render `error.message`. The Details come from a CLOSED list of user-SQL error classes, refused on any locator — a class pattern would admit `HIVE_*` split errors, which name S3 objects. Three classes quote cell values, safe only while grants are table- or column-grained: **revisit them before any row filter ships.**"
        status: "stable"
        path: "docs/decisions/browser/user-facing-error-messaging.md"
      - title: "What did not move, and why"
        fence: "The extraction moved the domain, not its consumers: `SchemaBrowser`, `DatabaseNode` and `QueryResultsTable` stay in `features/query/`, and the pure `formatBytes` lives in `lib/format.ts`."
        status: "stable"
        path: "docs/decisions/browser/what-did-not-move-and-why.md"
  - name: "Control planes — one pattern, eight planes, and the traps are shared"
    slug: "control-planes"
    path: "docs/decisions/control-planes/control-planes.md"
    governs: ["lambdas/**", "infra/modules/control-plane/**", "infra/modules/scheduled-function/**", "infra/modules/shared-space-storage/**", "infra/control-planes.tf", "infra/planes/shared-spaces/**", "infra/plane-shared-spaces.tf", "infra/planes/table-builder/**", "infra/plane-table-builder.tf", "infra/planes/table-share/**", "infra/plane-table-share.tf", "infra/planes/data-quality/**", "infra/plane-data-quality.tf", "infra/planes/file-send/**", "infra/plane-file-send.tf", "infra/planes/file-ops/**", "infra/plane-file-ops.tf", "infra/planes/results-conversion/**", "infra/plane-results-conversion.tf", "infra/planes/archive/**", "infra/plane-archive.tf", "infra/modules/queue-consumer/**", "infra/function-notifications.tf", "infra/functions/notifications/**", "infra/function-feedback.tf", "infra/functions/feedback/**", "infra/function-control-plane-dlq-drain.tf", "infra/functions/control-plane-dlq-drain/**", "infra/modules/observability/**", "infra/function-log-sweep.tf", "infra/functions/log-sweep/**", "apps/portal/src/features/shared-spaces/**", "apps/portal/src/features/notifications/**", "apps/portal/src/features/data-quality/**"]
    decisions:
      - title: "A closed vocabulary is type-checked before it is looked up (PR #662, control-plane-wide)"
        fence: "**A closed vocabulary is TYPE-CHECKED before it is looked up** — `cpcommon.events.in_vocabulary`, never a bare `value not in VOCAB`. `in` **hashes its left operand**, so a request field holding a list or a dict raises `TypeError` out of the membership test itself, before the plane can raise its named refusal, and `notifies_on_failure` records that instead of a reason code. It is a **predicate, not a raise**, because the wording is the domain's; it is a `TypeGuard[str]`, so a caller that refuses on False keeps its narrowing. Its vocabulary is typed as a **set or mapping, never `Container`** — `in` on a `str` is a SUBSTRING test, so a string vocabulary would admit every infix of itself. A **positive-form** test (`x if x in V else …`) hashes exactly the same, and one hid in each of the two mode readers that pick a plane's wording (`_wording_mode`, `_mode_from_raw_request`) — including the notifier of last resort, documented as raising nothing."
        status: "stable"
        path: "docs/decisions/control-planes/a-closed-vocabulary-is-type-checked-before-it-is-looked-up-pr-662.md"
      - title: "A control-plane queue may have a second producer, admitted by SenderId (SPEC-208)"
        fence: "**The planes do not verify — they read the API's `identity` block**, whose writers are enumerated: the API, and one reader by `SenderId`. Dropping a verification is NOT dropping an authorization: `authorize`/`authorize_source` have **zero diff**. `cpcommon.actor` **cannot verify** (no `jwt`, `auth`, network or env — import sweep), and the flat `actor` is **never** read: it carried a raw JWT, and a JWT and a username are both non-empty, so the guard is the **shape rule**. `assurance` fails closed on an unknown value **including an absent one**. Do **NOT** add a queue resource policy — a blanket `Deny` there silences EVERY notifying role in the fleet, invisibly, and the fleet grows. A pre-cutover message is `unauthorized` and does **not** dead-letter (`FIRE_AND_FORGET`), so plane allowed-field sets stay untightened."
        status: "stable"
        path: "docs/decisions/control-planes/a-control-plane-queue-may-have-a-second-producer-admitted-by-senderid.md"
      - title: "A conversion may keep a subset of the result's columns, and four layers refuse a list that is not one (results conversion)"
        fence: "A conversion names the columns it keeps by result POSITION, and the API, validate-authorize, describe-results and the converter each refuse a bad list, because a wrong list writes a file rather than failing; `convertsFor` alone decides copy or convert."
        status: "stable"
        path: "docs/decisions/control-planes/a-conversion-may-keep-a-subset-of-the-results-columns-and-four-layers.md"
      - title: "A conversion reads the RESULT, never the source, and ownership is a question about a path (SPEC-221)"
        fence: "**A conversion's input is the EXECUTION'S RESULT OBJECT, never the source table, and it may keep a SUBSET of that object's columns**, named by position and refused at four depths — the API bounds the list's length, validate-authorize its shape, describe-results each position against the result, and the converter re-checks before it indexes, because a negative position writes the LAST column and reports success. An execution is the actor's **iff Athena wrote it under `cpcommon.results.user_results_prefix`** — the one builder the API starts every query with, so a guessed id names nothing the actor cannot already read. A plane refusing protected destinations mirrors its role's **any-depth** Deny rather than the browser's root-anchored picker: an IAM wildcard matches `/`, so a validator anchored at the root accepts a key IAM then refuses at the write."
        status: "stable"
        path: "docs/decisions/control-planes/a-conversion-reads-the-result-never-the-source-and-ownership-is-a.md"
      - title: "A data-quality request id is claimed by one execution before anything is named from it (data quality)"
        fence: "`inspect-source` claims a data-quality request id under `If-None-Match: *` at `data-quality/claims/{requestId}.json` before anything is named from it; no lifecycle rule may expire that prefix, and only a lower-case hyphenated UUID is accepted."
        status: "stable"
        path: "docs/decisions/control-planes/a-data-quality-request-id-is-claimed-by-one-execution-before-anything.md"
      - title: "A delete decides its route on the record it claims, and a removal cannot take the owner off the roster (2026-09-26)"
        fence: "`registry.begin_delete` is the first write of delete and forget and decides route and owner inside its swap; `save_members` refuses a removal naming the current owner, and `finalize` refuses a record absent, `deleting`, re-owned or last written by another request."
