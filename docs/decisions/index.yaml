        path: "docs/decisions/control-planes/per-plane-instrumentation-rules.md"
      - title: "`requestId` rides on every row, including a clean run's and a failed run's (SPEC-191)"
        fence: "**`requestId` rides on every row**, a clean run's and a failed run's included, because a reader settles its in-flight record by matching it; the validator and both doors of the failure terminal must name it, since every validate-stage refusal once landed with `payload: null` in production. **The browser's async switchover consults the routing predicate ONCE**, above every submission point, in one dispatcher. The in-flight record is **session-scoped, never persisted**, and settles on a notification carrying its request id."
        status: "stable"
        path: "docs/decisions/control-planes/requestid-rides-on-every-row-including-a-clean-runs-and-a-failed-runs.md"
      - title: "Structured-logging narrative primitives & the one-door rule (SPEC-130/131)"
        fence: "**Structured logging** goes through `cpcommon.observability` only — and \"only\" includes the library's **private names**, which no module outside it and the two named test harnesses may reach: one such reach survived as a silent no-op after the name behind it was deleted upstream. **No `@traced`/`@step` function may be a generator** — the library refuses one at decoration, so it is a cold start that never completes rather than a bad span. The logs queue is FIFO with **one message group per EVENT** — a FIFO group gives up ten messages until they are deleted, so the group is the sweep's ceiling, and one per service saturated under a single session — swept on a schedule, appended under ETag CAS, retained forever. `@traced` outermost — **except the API**, where one decorator sits outside it to turn an unpredicted fault into a declared code: a catch INSIDE the span ends every failed request successfully and the fault is recorded nowhere. Messages are literals. The **`error.stack` exemption covers file contents, NOT credentials**, and it covers **no field a call site chooses to emit** — neither a **SQL statement** nor an Athena **`stateChangeReason`** may be one: both quote a user's cell values back; `sql_bytes` and `state` instead. The API **prevents rather than redacts**: there is no scrubber, a handler is never given a credential, and an AST sweep is what holds it."
        status: "stable"
        path: "docs/decisions/control-planes/structured-logging-narrative-primitives-and-the-one-door-rule.md"
      - title: "Structured-logging pipe (SPEC-127→129)"
        fence: "Every control-plane function logs through the FIFO logs queue, swept on a 10-minute schedule into one ETag-CAS-appended JSONL object per service-day under a `logs/` prefix retained forever; `LOGS_QUEUE_URL` stays optional so a function without it logs to stdout."
        status: "stable"
        path: "docs/decisions/control-planes/structured-logging-pipe.md"
      - title: "The chain a request travels is bounded at its inputs and measured against the limit that binds (SPEC-229)"
        fence: "**Every cap is COMPUTED against the budget that sized it** — memory, makespan, or a service quota — and it names that budget. A hard-coded number hides a wrong model, and so does the right number against the wrong quota: the fleet message cap was derived from SQS's message limit, which bounds what the QUEUE takes and not what an execution can carry. **A cap the request must clear before a verb runs is computed in PRODUCTION code**, because every per-plane cap runs inside `validate-authorize`, after the request that would overflow has already arrived. And **check the unit**: bytes on the wire, bytes in the value, and a count are three different questions that look alike as integers."
        status: "stable"
        path: "docs/decisions/control-planes/the-chain-a-request-travels-is-bounded-at-its-inputs-and-measured.md"
      - title: "The converter's shape is decided by what cannot stream and what cannot be retried (SPEC-222)"
        fence: "**A conversion reads from the ACTOR'S space and writes to the DESTINATION'S**, and the two coincide only for a personal destination — which is why a suite whose fixtures are all personal cannot tell them apart, and why one shipped reading the result object out of the shared bucket. Its **types come from the metadata**, where a decimal's parameters are **never in `Type`** — captured — and are read from `Precision`/`Scale`, which no capture route available here can show are populated; the verb refuses the column rather than guessing a scale, so being wrong about that costs a loud refusal and not a silently rounded number. The vocabulary is closed and **refuses rather than falling back**. Excel is the one format that cannot stream, and its memory is spent per **CELL** — a one-byte NULL costs ~250 bytes — so it is capped by a cell count taken from the CSV **before** anything is built, while the others are set by the disk. A byte cap alone cannot be both safe and useful, and one admitted a result that ran the converter out of memory. `Convert` retries **`TransientError` only** of what can follow a run: a `Lambda.*` service-error retry can re-run an invocation that already completed its conditional `PutObject`, and it then meets its own object and reports `destination_occupied` for a save that succeeded. Its other retrier names only refusals before the function runs."
        status: "stable"
        path: "docs/decisions/control-planes/the-converters-shape-is-decided-by-what-cannot-stream-and-what-cannot.md"
      - title: "The copy is a top-level Distributed Map, and attribution is a verb (SPEC-160)"
        fence: "Table-share's copy is one top-level Distributed Map over a flat recipient-by-object manifest, and `collect-transfer-results` attributes by reading both the SUCCEEDED and the FAILED/PENDING exports; one failed item means that recipient gets no table."
        status: "stable"
        path: "docs/decisions/control-planes/the-copy-is-a-top-level-distributed-map-and-attribution-is-a-verb.md"
      - title: "The deliberate twins are discharged: one implementation per cross-plane helper (SPEC-156)"
        fence: "**`cpcommon` owns the algorithm; a domain layer owns its wording.** Do **NOT** merge the domain layers wholesale."
        status: "stable"
        path: "docs/decisions/control-planes/the-deliberate-twins-are-discharged-one-implementation-per-cross-plane.md"
      - title: "The destination prefix is relative, and the doubling it invites is refused by nothing (SPEC-223)"
        fence: "**A conversion's destination prefix is RELATIVE to the space root; the browser's picker is absolute.** Passing one through writes `alice/alice/…` and **nothing refuses it** — containment only proves the key starts with the root, which a doubled root does. Derive the root from the string being sliced: a lookup needs a fallback, and the only one available is the bug."
        status: "stable"
        path: "docs/decisions/control-planes/the-destination-prefix-is-relative-and-the-doubling-it-invites-is.md"
      - title: "The emptied record is inert because the `owner` FIELD is cleared (SPEC-205)"
        fence: "An emptied space is inert because the `owner` field is cleared, or for `add_members` and `remove_members` because `emptiedAt` refuses first; no authorization path reads `previousOwner`, and `revoke_portal_role` is not called on the emptying route."
        status: "stable"
        path: "docs/decisions/control-planes/the-emptied-record-is-inert-because-the-owner-field-is-cleared.md"
      - title: "The engine's attribution vocabulary belongs to the CALLER, not to cpcommon (SPEC-189)"
        fence: "`cpcommon.transfer` takes a caller-supplied `echo_fields` with no default, in both its failure-record builders, so attribution vocabulary belongs to the caller; an echoed field stays bounded, so echo a name and never a key set."
        status: "stable"
        path: "docs/decisions/control-planes/the-engines-attribution-vocabulary-belongs-to-the-caller-not-to-cpcommon.md"
      - title: "The failure path joins the trace, including where ASL cannot reach the value (SPEC-227, SPEC-228)"
        fence: "**A PRE-identity seed — `\"error.$\": \"$\"`, where the error REPLACED the state — supplies LITERALS for everything its terminal reads, including `traceparent`.** Omitting the key instead of supplying a literal `null` makes `RecordFailure`'s read the uncatchable error this whole rule exists to prevent. Everything post-identity reads `$.traceparent`. **Such a failure DOES join the run's trace, and not through ASL:** the value is still reachable nowhere ASL can read — that half stands and is why the machines are shaped this way — so `RecordFailure` carries the forwarded envelope from `$$.Execution.Input` and `notify-failure` parses the traceparent and the request id out of it in Python. **\"Pre-identity\" names the CATCH SHAPE, not the absence of an identity**: every validate-authorize failure lands on that seed, an authorized actor's refused request included."
        status: "stable"
        path: "docs/decisions/control-planes/the-failure-path-joins-the-trace-including-where-asl-cannot-reach-the.md"
      - title: "The field rule — what may be logged (SPEC-130)"
        fence: "Logs may carry user-derived metadata such as keys, usernames and column names, but never a field holding file contents, a token, a credential or an email; there is no runtime redaction filter, and `error.stack` is exempt for file contents only."
        status: "stable"
        path: "docs/decisions/control-planes/the-field-rule-what-may-be-logged.md"
      - title: "The lock protocol is `cpcommon`'s, extracted ahead of its second consumer (SPEC-187)"
        fence: "**The lock protocol lives once, in `cpcommon`**, extracted ahead of its second consumer rather than copied. **Locks are objects claimed under ETag CAS**, released by **overwriting**: with `DeleteObject` denied, \"free\" is a state rather than an absence. The holder is the **execution ARN**, because a request id is whatever the caller sent, so two executions can carry the same one. A redelivered message should not be one of them: reusing an execution name was measured (`../infra/modules/control-plane/README.md`) to return the original run while it is going and `ExecutionAlreadyExists` once it has closed. That a redelivery reuses its name is inferred from the Pipe's v5 UUIDs, not proven, so no lock relies on it."
        status: "stable"
        path: "docs/decisions/control-planes/the-lock-protocol-is-cpcommons-extracted-ahead-of-its-second-consumer.md"
      - title: "The log-foundry pin, and what a library upgrade owes the code written around it (SPEC-224)"
        fence: "The fleet pins `log-foundry==1.0.0` exactly and core-only, and a bump owes a check of everything built around the old version: a workaround the library makes redundant is retired, and a claim anchored to a version is re-checked."
        status: "stable"
        path: "docs/decisions/control-planes/the-log-foundry-pin-and-what-a-library-upgrade-owes-the-code-written.md"
      - title: "The logs queue is grouped per event, because a FIFO group is the sweep's ceiling (2026-09-11)"
        fence: "The logs queue has one message group per event (`log_id`), because each FIFO group drains only ten messages per wave; do not group by service or trace, and while a backlog exists the queue's age is the only completeness check."
        status: "stable"
        path: "docs/decisions/control-planes/the-logs-queue-is-grouped-per-event-because-a-fifo-group-is-the-sweeps.md"
      - title: "The machine's ceiling cannot notify on its own, and this plane's timeout door needs a fallback (SPEC-166)"
        fence: "File-send's machine has a 10,800 s top-level `TimeoutSeconds` with a `TIMED_OUT` rule, and its timeout door reads the input back with `states:DescribeExecution` because EventBridge drops an input over 256 KB; the Lambda execution role holds that grant."
        status: "stable"
        path: "docs/decisions/control-planes/the-machines-ceiling-cannot-notify-on-its-own-and-this-planes-timeout.md"
      - title: "The notification sender bounds every dedup id, by digest rather than by dropping it (control-plane-wide)"
        fence: "`emit_notification` sends a dedup id the queue accepts unchanged and any other as its SHA-256, so the bound holds for every composition; it never drops the id to None, which would hand the send to content-based deduplication."
        status: "stable"
        path: "docs/decisions/control-planes/the-notification-sender-bounds-every-dedup-id-by-digest-rather-than-by.md"
      - title: "The notifications `create` boundary is a runtime check, because IAM cannot express it (SPEC-206)"
        fence: "**The notifications `create` boundary is IAM and the API first, a RUNTIME check behind the grant.** The portal role holds no grant on the queue, and the API's route accepts only `markRead` and `markAllRead`. The writer's check names only the portal role, so against the API's own role the route is the only fence; the check is runtime because no SQS condition key reaches a message body. It compares the **role-id half** of the `SenderId`, and a refusal **logs and drops, never raises** — dead-lettering per forged request would drown its undrained DLQ. The actor reader replaces the `USER_ACTIONS` arm **only**: `create` is the trusted producer (body username, no actor, no token), and hoisting the reader above that branch refuses **every notification the fleet produces**, silently."
        status: "stable"
        path: "docs/decisions/control-planes/the-notifications-create-boundary-is-a-runtime-check-because-iam-cannot.md"
      - title: "The operator door widens to member management, and that is a threat-model decision (SPEC-217)"
        fence: "`OPERATOR_ACTIONS` also admits `add_members` and `remove_members`, so whoever can write the operator inbox can grant a stranger live access to a space, and `SenderId` is no fence against them; a requester's refusal is one sentence that distinguishes nothing."
        status: "stable"
        path: "docs/decisions/control-planes/the-operator-door-widens-to-member-management-and-that-is-a-threat.md"
      - title: "The outcome link: destination, source, or the common folder of the items' PARENTS (SPEC-191)"
        fence: "A copy or move that landed anything, `duplicate` included, links to the destination and anything else to the source; a `delete` links to the deepest folder its items' PARENTS share, and the prefix is percent-encoded at mint."
        status: "stable"
        path: "docs/decisions/control-planes/the-outcome-link-destination-source-or-the-common-folder-of-the-items.md"
      - title: "The outcome wording reuses the failure bodies and is deliberately NOT a resolver (SPEC-191)"
        fence: "File-operations outcomes reuse the failure table for the six reasons it already words, and the outcome table is never registered as a `Resolver`, since that would make a per-item outcome a valid whole-request reason."
        status: "stable"
        path: "docs/decisions/control-planes/the-outcome-wording-reuses-the-failure-bodies-and-is-deliberately-not-a.md"
      - title: "The polars 1.44 pin, and what the move owed the code written around 1.12 (SPEC-245)"
        fence: "**polars reads only bytes this code fetched, and a polars panic is not an `Exception`.** Over a Python file object on S3, 1.44 reads the whole object, so the Parquet probe hands it the footer alone (`bounded_read.read_parquet_footer`); and a Rust panic surfaces as pyo3's `PanicException`, a `BaseException` that walks past `except Exception`, so both schema probes catch it beside `Exception`. The converter's sinks do not: what they read is Athena's own CSV, not a user's file."
        status: "stable"
        path: "docs/decisions/control-planes/the-polars-1-44-pin-and-what-the-move-owed-the-code-written-around-1-12.md"
      - title: "The run's ONE sentence opens neutrally, because its residue is not all failure (SPEC-191)"
        fence: "A file-operations outcome sentence opens with `N need your attention` rather than a denial, since its residue includes `duplicate` and `noop`, and a mixed run names what succeeded first."
        status: "stable"
        path: "docs/decisions/control-planes/the-runs-one-sentence-opens-neutrally-because-its-residue-is-not-all.md"
      - title: "Two budgets, and both were wrong before they were computed (SPEC-189)"
        fence: "File operations' joint budget adds the lock give-up to every serial timeout and the copy makespan against the 10,800 s ceiling, which is why the cap is 2 TiB; the deletable list, per-item counts and deletion records travel by pointer."
        status: "stable"
        path: "docs/decisions/control-planes/two-budgets-and-both-were-wrong-before-they-were-computed.md"
      - title: "Where a child span may go, and the four places it may not (SPEC-226)"
        fence: "**A `@step` goes only where a caller reaches it ONCE per invocation.** Not on a shared function called per recipient/member/target — five look eligible and are not; not inside `copy_batch`'s worker pool, where `contextvars` do not reach and spans arrive parentless in their own traces; and **never under a name any verb in the fleet uses for its own span**, since `function` carries both — checking against its *own* verb is a different, weaker claim. A guard over decorators resolves the name a decorator is **bound to**: matching rendered text was defeated by two ordinary import spellings. The fourth prohibition — **no generator** — is in `structured-logging-narrative-primitives-and-the-one-door-rule.md`, since it binds `@traced` too."
        status: "stable"
        path: "docs/decisions/control-planes/where-a-child-span-may-go-and-the-four-places-it-may-not.md"
  - name: "Gates, scanners and tests"
    slug: "gates-and-tests"
    path: "docs/decisions/gates-and-tests/gates-and-tests.md"
    governs: ["scripts/**", ".github/scripts/**", ".github/workflows/**", "pyproject.toml", "apps/portal/eslint.config.js", "apps/portal/vite.config.ts", "apps/portal/vitest.globalSetup.ts"]
    decisions:
      - title: "A change-detection gate answers three ways, and one of them is not an answer (2026-09-04)"
        fence: "**Every way a change-detection gate goes wrong answers \"nothing changed\", the cheap direction, behind a green check.** Read paths RAW with `-z`, because `git diff --name-only` C-quotes a path out of every anchored pattern; prove the pattern list with a POSITIVE CONTROL, a path it must always select, because `grep` answers three ways and some broken lists exit an ordinary 1; hold `pipefail`, because a pipeline's status is `tr`'s; and print the change set a skip decided over. **A script a test EXECUTES must keep its scratch files private.** A workflow step naming a fixed path under `/tmp` is one file per *job* on a runner, and one file per *machine* under the suite — which runs those scripts verbatim, on a checkout several sessions work at once. Two runs truncate and rewrite it: the loud half is a `jq` parse error on spliced bytes, the quiet half is a clean read of the OTHER run's fixture, which answered a wrong verdict with no error and passed as a flake on a different test each time. Create the file with `mktemp`; `$RUNNER_TEMP` is for one that must cross steps. **No silent caps.** If a check bounds coverage, say what was dropped — silent truncation reads as \"covered everything\"."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-change-detection-gate-answers-three-ways-and-one-of-them-is-not-an.md"
      - title: "A citation is a promise, and the ratchet is exact in both directions (2026-09-08)"
        fence: "**Naming a test in a comment is a PROMISE, and the doc gate now holds you to it.** A comment saying some named guard reads this number is worse than a stale comment when the guard is gone: it talks the next reader out of the check they were about to make. Citations in `.py`, `.tf`, `.tftpl`, `.ts`, `.tsx` and `.md` are resolved against the suite — in backticks, as a filename, or BARE inside a comment, the form a backticks-only reader cannot see and the one 11 of this repo's citations use. Specs, delivery docs and test modules are **not** judged, for reasons the checker states; a citation there is on you. Two consequences that apply green and fail later. **Deleting a test silently breaks every doc that cites it**, so the sweep for its name comes before the deletion, not after CI. And **a past-tense record of a retirement must contain the word \"retired\"** within a hundred characters of the name — that is the whole exemption, deliberately not \"deleted\" or \"removed\", which this repo uses constantly in live claims about deletion semantics. A record worded any other way reddens a ratchet whose end state is zero, and the answer is to reword the sentence rather than to raise the number."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-citation-is-a-promise-and-the-ratchet-is-exact-in-both-directions.md"
      - title: "A page's hydration chunks are judged from Next's bundle analysis, tied to the build it describes (2026-11-15)"
        fence: "**`npm run check:pages` fails a build in which a route's hydration chunks carry the portal's own source outside `src/app/`, `src/lib/`, `src/hooks/`, `src/types/` and `src/assets/`, or a lazy load of such source that is not `next/dynamic`.** Production chunks name modules by number, so it reads the analysis `next build --analyze` writes, and `ci.yml`'s build carries the flag. Traps that pass a wrong analysis green: its module list leaves out a module merged into another, which only the chunk parts name, so both are read; Next keeps `.next/diagnostics` across builds and `next analyze` writes an analysis while building nothing, so the build's route statistics must fall between the analysis's data and its snapshot; and it names chunks its own way, so each route's chunks must hold as many modules, chunk for chunk, as the shipped files register, counted by factory. The build cannot tell a hand-written `turbopack-transition` import attribute from `next/dynamic`'s own, so lint refuses every import attribute under `src/`. Do NOT trust the module list alone."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-pages-hydration-chunks-are-judged-from-nexts-bundle-analysis-tied-to.md"
      - title: "A parity fixture becomes a floor once the cutover it guarded is closed (2026-09-05)"
        fence: "A parity fixture stays frozen after its cutover and acts as a floor: every captured function must keep its captured fields, additions are named and accepted, and the environment comparison is retired in favour of deriving each function's variables from its code."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-parity-fixture-becomes-a-floor-once-the-cutover-it-guarded-is-closed.md"
      - title: "A refusal is the half of the system no user exercises (2026-08-28)"
        fence: "**A refusal is the half of the system no user exercises**, and a coverage number is blind to it: a `raise` is one line, so deleting its test barely moves the percentage while the happy path — which runs on every dev run and every real action — keeps the function covered. Assert the **reason code by name**, never that \"something raised\". The check is mechanical: enumerate the codes raised against the codes asserted. A review samples this; a sweep counts it. **Mutation-test the guard whose failure would be SILENT** — not every assertion. This project ships assertions that pass while the thing they name is false, so one targeted break-and-revert when the guard is written is worth it. A **sweep** of every guard afterwards is not: it costs a full suite run each and finds what writing the test carefully already would. The cheaper habit that catches the same class: assert the **reason** — the message, the named item — never just an exit code or a count, since the neighbouring path usually returns the same code."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-refusal-is-the-half-of-the-system-no-user-exercises.md"
      - title: "A scanner gate blocks on a narrowed count, never a total (2026-08-09, completes SPEC-138)"
        fence: "**A gate blocks on a NARROWED count, never a total.** Checkov enforces check IDs measured at **zero** — enforcing what passes rather than suppressing what does not — and the plan scan accepts by check ID **and** resource. **A line matching no finding is a hard error.** **What a scanner cannot READ is refused too**, because a finding there reaches no count. For Checkov: a file OpenTofu loads that the terraform framework does not parse (`.tofu`, `.tf.json`, an override file), a variable file beside a module, a module called from outside the checkout, and a NEW IAM policy the plan marks unknown until apply, which Checkov passes unread; an updated one is only named. A value Checkov cannot resolve can score UNKNOWN, which it prints nowhere, or PASSED, and that route is recorded, not closed. Reasoning: `a-scanners-configuration-is-its-command-line-and-what-it-discovers-is.md`, *What the scanner cannot read is refused too*. **A new finding is scoped, not accepted.** Every shipped scanner failure carries a written disposition; the enforce list is regenerated by **any** spec adding a resource family."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-scanner-gate-blocks-on-a-narrowed-count-never-a-total.md"
      - title: "A scanner's configuration is its command line, and what it discovers is refused (2026-09-14)"
        fence: "**A scanner's configuration is its COMMAND LINE, and what it DISCOVERS is refused.** Checkov reads a `.checkov.yml` from the `-d` directory, the working directory and `$HOME`; Semgrep skips whatever a `.semgrepignore` anywhere in the tree matches; gitleaks reads a `.gitleaks.toml` and a `.gitleaksignore` from the repository, and never sees a path a `-diff` attribute hides from `git log -p`; and all three read variables. Measured, each took a finding off a blocking gate while the job read as clean, from a file no reviewer reads as part of a gate. So every Checkov, Semgrep and gitleaks scan runs through its `*-scan.sh` wrapper, which asks the tool what decided the scan (`--show-config`, the report's skip reasons, gitleaks's debug log, `git check-attr`) and refuses anything but the command line and the defaults. A corpus plants each source against the installed version before the job's scans. Refuse, never ignore: an ignored suppression file reads as one. The empty root `.semgrepignore` only switches off Semgrep's built-in list, which skips every `test/` directory under the same reason. Still open: Checkov's flagless variables, and inline `nosemgrep` and `gitleaks:allow`."
        status: "stable"
        path: "docs/decisions/gates-and-tests/a-scanners-configuration-is-its-command-line-and-what-it-discovers-is.md"
      - title: "`ACCEPTED_` tripwires: what the project knows it has not verified (SPEC-153)"
        fence: "**`ACCEPTED_` tripwires record what has NOT been verified**: pin today's behaviour, name the reasoning, and say *revisit the decision, don't delete the test*."
        status: "stable"
        path: "docs/decisions/gates-and-tests/accepted-tripwires-what-the-project-knows-it-has-not-verified.md"
      - title: "An axe rule that cannot measure is disabled, and what replaces it (2026-09-01)"
        fence: "An axe rule that passes what it cannot measure is disabled with a reason: `target-size` is off under jsdom through one shared constant, and a static sweep in `src/lib/targetSize.test.ts` reports candidates under 24px, not violations."
        status: "stable"
        path: "docs/decisions/gates-and-tests/an-axe-rule-that-cannot-measure-is-disabled-and-what-replaces-it.md"
      - title: "Compiler and coverage defaults are declared, never inherited (SPEC-150)"
        fence: "Coverage floors and `\"strict\": true` are **declared, never inherited**. The floors are a flat **85**, no longer ratchets at the measured level — a ratchet fails CI on any deliberate reduction in test volume, and is bought back by testing internals. Never lower one for a regression, and never read a floor as evidence a guard exists: four mutations of production code once passed the whole suite with coverage unchanged. **Mutate the guard instead.**"
        status: "stable"
        path: "docs/decisions/gates-and-tests/compiler-and-coverage-defaults-are-declared-never-inherited.md"
      - title: "IAM policy scanning = the rendered plan, not the templates (SPEC-139)"
        fence: "Checkov reads IAM policies only in the rendered-plan scan, never in the `.tf` scan or a loose policy file; both scans and the `.tftpl` extension stay, and a plan holding `aws_iam_policy` resources with no IAM check evaluated fails the job."
        status: "stable"
        path: "docs/decisions/gates-and-tests/iam-policy-scanning-the-rendered-plan-not-the-templates.md"
      - title: "Security scanning (SPEC-138)"
        fence: "**\"Did not run\" is never \"clean.\"** A broken scanner fails the job even in report mode, and `--quiet` must never come back: without `passed_checks` the gate cannot tell a pass from a check that never ran. **The ZAP baseline skips LOUDLY while the web tier is off**: on exactly `false` it writes a warning annotation and a job-summary section and stays green, and any other value scans."
        status: "stable"
        path: "docs/decisions/gates-and-tests/security-scanning.md"
      - title: "The hook refuses a stale base, and the doc gate a spec without the template's shape (2026-09-08)"
        fence: "**A rule that prose asks every session to remember is a rule nothing enforces.** The queue told sessions to rebase after the wait for as long as it existed, and the hook checked only the lock; it now refuses a push whose commits do not contain the remote's trunk. When a document says \"always X before pushing\", ask what refuses the push without X — and if the answer is a paragraph, write the check. **A gate's POPULATION is a claim, and an EXEMPTION is a hole shaped like one.** Two wildcard rules read 2 of 17 IAM documents and passed on the 2 they read. Counting the population against the directory it came from catches an ADDITION and nothing else — both sides shrink together on a deletion, so only a comparison against an **independent** source sees that. And an exemption carved for a real case must name the ITEM it excuses, never the container: \"a conditioned wildcard is narrowed\" admitted an account-wide `iam:PassRole` behind `aws:RequestedRegion`, where \"this ACTION is narrowed by this measured key\" costs nothing and admits none. All three were found by planting, not by reading."
        status: "stable"
        path: "docs/decisions/gates-and-tests/the-hook-refuses-a-stale-base-and-the-doc-gate-a-spec-without-the.md"
      - title: "The queue reads `main`'s build from its push runs, and nothing else that records its sha (2026-09-10)"
        fence: "`main`'s build is only the runs a push to `main` triggers, filtered by the API's `--event push`; the queue and `watch_ci.py` ignore Dependabot, dispatch and scheduled runs on that sha, so a head with only non-push runs waits for a human override."
        status: "stable"
        path: "docs/decisions/gates-and-tests/the-queue-reads-mains-build-from-its-push-runs-and-nothing-else-that.md"
      - title: "Vitest's default workers and test timeout stay, and a slow file budgets its own work (2026-11-15)"
        fence: "**`apps/portal/vite.config.ts` declares `testTimeout: 5_000`, Vitest's default, and leaves `maxWorkers` to scale with the machine.** Measured under parallel load, the defaults failed nothing, a 10 s timeout bought nothing they lacked, and one run capped at half its workers was the slowest in every round. A case whose waits cover real slow work (a lazy editor, statements run through the real workspace) gets its own budget, narrowest first: a wait's `{timeout}`, then the case's or its `describe`'s timeout, or a file's `asyncUtilTimeout` with a restore; and says why. Do NOT raise the suite-wide timeout to quiet a flake: it makes every genuine hang fail later, and a missed signal is fixed by waiting for the value asserted, not by more time."
        status: "stable"
        path: "docs/decisions/gates-and-tests/vitests-default-workers-and-test-timeout-stay-and-a-slow-file-budgets-its-own.md"
      - title: "Vitest's module cache stays off, because it freezes the file list of a glob it does not recognise (2026-11-14)"
        fence: "**`fsModuleCache: false` in `apps/portal/vite.config.ts`, and a test refuses a run that resolved it on.** Vitest 5 skips caching a module whose source holds the literal `import.meta.glob(`, but caches one that spells the call any other way Vite accepts, such as `import.meta.glob<T>(`, with the glob's file list frozen in, so a page added after one run stays invisible to `renderApp` until the cache is cleared. The skip is a substring test, and what it misses fails silently, so do NOT turn the cache back on and rely on how globs are spelled. The cost is measured in the entry."
        status: "stable"
        path: "docs/decisions/gates-and-tests/vitests-module-cache-stays-off-because-it-freezes-a-globs-file-list.md"
  - name: "Identity, access and the name that ties them together"
    slug: "identity-and-access"
    path: "docs/decisions/identity-and-access/identity-and-access.md"
    governs: ["lambdas/api/**", "lambdas/pre-signup/**", "lambdas/post-confirmation/**", "lambdas/user-directory-build/**", "infra/modules/api/**", "infra/modules/auth/**", "infra/function-user-directory.tf", "infra/functions/user-directory/**", "infra/modules/verification/**", "apps/portal/src/features/auth/**", "apps/portal/src/server/session/**", "infra/modules/session-store/**", "apps/portal/src/features/feature-flags/**", "apps/portal/src/features/user-directory/**"]
    decisions:
      - title: "A feature flag is presentation, never authorization — and it lives beside the username directory (SPEC-162)"
        fence: "**A feature flag is presentation, never authorization** — and the flag document lives beside the username directory in the **user-space** bucket, not the admin one: the admin bucket was specced first, and its grant would not have worked. Gating is by **registry**, not per-component opt-in, and one test walks every gated surface in **both** states. **A document that belongs to no user has no space, so it gets its OWN route** — `_config/` and `_directory/` are not prefixes any caller's claims authorize, and leaving one on the object surface makes every read a 403 that falls back to defaults, which looks exactly like health. **The flags resolve first on the Next.js server and are sent with the page** (one held set per process, refreshed in the background with a session's token); the browser's read is the second line, for a page sent with no set and a stale tab. **The API pass-through never consults the flags** — a route handler, the proxy or a session module reaching them would make a flag authorization — and one set serves every user only because the document is bucket-wide."
        status: "stable"
        path: "docs/decisions/identity-and-access/a-feature-flag-is-presentation-never-authorization-and-it-lives-beside.md"
      - title: "A presigned URL is a bearer token (SPEC-198)"
        fence: "**A presigned URL is a BEARER TOKEN** — minted only after exactly the authorization the direct call would have had, signed by the **caller's own assumed session**, and in **no emitted record** (the span carries the key's *length*). Its lifetime is clamped to the **credential that signed**, read in the same call — never to `DurationSeconds`, which agrees today and will not under Access Grants, and never by assuming a second time."
        status: "stable"
        path: "docs/decisions/identity-and-access/a-presigned-url-is-a-bearer-token.md"
      - title: "A route may carry PATH parameters, and a value that is not one segment is refused in the browser (SPEC-199)"
        fence: "A route may carry path templates: the browser encodes each segment and the server never unquotes, a value that is not one segment is refused client-side as `UnsendableParameter`, and a missing parameter is a compile error."
        status: "stable"
        path: "docs/decisions/identity-and-access/a-route-may-carry-path-parameters-and-a-value-that-is-not-one-segment.md"
      - title: "A verification principal is read-only, or it is a back door"
        fence: "The verification role is read-only and audit-shaped, with no data-path grant (`SELECT`, `lakeformation:GetDataAccess`, a data-bucket ARN, `Resource: \"*\"`), and exists only once a named principal is set; the archive trail is unconditional."
        status: "stable"
        path: "docs/decisions/identity-and-access/a-verification-principal-is-read-only-or-it-is-a-back-door.md"
      - title: "An execution id is a claim, and every route that names one proves it first (SPEC-232)"
        fence: "**An execution id is a CLAIM, not an authorization.** Athena authorizes by workgroup and there is one, so every route that names an execution proves it is the caller's **first** (its recorded output location under the caller's own `user_results_prefix`) before it answers or acts. Results is included, because S3 guards the rows but not the state. An unknown id and a foreign one get **one 404 body**, and the span says which. A route that skips the proof passes every test that drives only the caller's own execution, which is why the guard is derived from the contract. **A workgroup that enforces its own result location makes every one of them 404** for every user's own queries, so the proof moves with the location."
        status: "stable"
        path: "docs/decisions/identity-and-access/an-execution-id-is-a-claim-and-every-route-that-names-one-proves-it.md"
      - title: "`apiRequest` retries nothing, and idempotency is declared per route (SPEC-197)"
        fence: "**Browser-side, `apiRequest` retries NOTHING, under any status**: a 401 is one request, one call of the unauthenticated handler and `SessionExpired`, because the portal server's `/api/` route refreshes the token before it forwards. Idempotency is declared **per route**, never derived from the method, and a path parameter that is not **one segment** is **refused in the browser**. **The client's 50-second timeout sits above the server's worst path**, held by a test that sums the server's own constants."
        status: "stable"
        path: "docs/decisions/identity-and-access/apirequest-retries-nothing-and-idempotency-is-declared-per-route.md"
      - title: "`assurance` fails closed on an unknown value, including an absent one (SPEC-201)"
        fence: "A plane refuses terminally as `unsupported_assurance` any `identity.assurance` but `interactive`, including `delegated`, empty or absent; the accepted set is defined once in `cpcommon.actor`, and `delegated_by` must be present and null."
        status: "stable"
        path: "docs/decisions/identity-and-access/assurance-fails-closed-on-an-unknown-value-including-an-absent-one.md"
      - title: "Auth"
        fence: "Cognito User Pool with ABAC: one shared IAM role, per-user isolation by `${aws:PrincipalTag/username}`, and the tag is stamped server-side from the verified token claim, never client-asserted."
        status: "stable"
        path: "docs/decisions/identity-and-access/auth.md"
      - title: "Authorization lives in the router, not in an API Gateway authorizer (SPEC-193)"
        fence: "Authorization lives in the router behind one `$default` route, with no API Gateway authorizer, so one reader judges the token; the API resolves a principal before dispatch and an unidentified caller gets 401 whatever the path."
        status: "stable"
        path: "docs/decisions/identity-and-access/authorization-lives-in-the-router-not-in-an-api-gateway-authorizer.md"
      - title: "Bucket 2 (shared-space)"
        fence: "Shared-space mutations run through an async control plane of single-task verb Lambdas sharing one `orchestrator` role; access is one session tag per space across ten `custom:shared_space_k` slots, which caps a user's spaces and not a space's members."
        status: "stable"
        path: "docs/decisions/identity-and-access/bucket-2-shared-space.md"
      - title: "One session covers the browser, and the browser holds no token (rewritten 2026-11-15)"
        fence: "The portal server holds the session, so one sign-in covers every tab and a sign-out in one ends the others at their next request. **A tab never acts as another user**: every API request names the tab's user in `x-dq-user`, and the server refuses one that names nobody or someone else. A 401 under a page re-reads the session and signs the tab out in LOCAL state only — never a logout, because the cookie may already be someone else's."
        status: "stable"
        path: "docs/decisions/identity-and-access/cognito-tokens-are-held-per-tab-not-per-browser.md"
      - title: "Collapsing five claim readers cost four things the spec did not list (SPEC-201)"
        fence: "Control planes read the actor through one reader, but `notifications_writer`'s `create` arm must stay outside it, as hoisting it refuses every notification; `COGNITO_USER_POOL_ID` is required lazily, on the planes that call `AdminGetUser`."
        status: "stable"
        path: "docs/decisions/identity-and-access/collapsing-five-claim-readers-cost-four-things-the-spec-did-not-list.md"
      - title: "Dev-unauth path"
        fence: "`VITE_S3_DEV_UNAUTH` no longer exists: the unsigned, no-auth local browsing path is gone, and no browser call to S3 runs unsigned."
        status: "stable"
        path: "docs/decisions/identity-and-access/dev-unauth-path.md"
      - title: "Every authenticated user can read the username directory (SPEC-146)"
        fence: "`_directory/usernames.json` is readable by every authenticated user, deliberately, and holds usernames only, never display names or emails; the daily builder is its only writer."
        status: "stable"
        path: "docs/decisions/identity-and-access/every-authenticated-user-can-read-the-username-directory.md"
      - title: "Gating is by REGISTRY, not per-component opt-in (SPEC-163)"
        fence: "`GATED_SURFACES` names every surface each flag hides and one test walks it in both states; consumers ask through `useFeature`, `FeatureGate` or `useFeatureSet`, and a hidden surface is removed from the tree, never `display: none` or disabled."
        status: "stable"
        path: "docs/decisions/identity-and-access/gating-is-by-registry-not-per-component-opt-in.md"
      - title: "Hosted UI = Managed Login v2"
        fence: "The Cognito domain runs Managed Login v2, never the classic Hosted UI; sign-in and sign-up both start at the portal server's `/auth/login`, whose Managed Login page links to sign-up, and CI ensures every app client's default branding until the provider reaches 6.x."
        status: "stable"
        path: "docs/decisions/identity-and-access/hosted-ui-managed-login-v2.md"
      - title: "Member join status (SPEC-073)"
        fence: "Join status is an `acknowledged` list beside `members`, flipped to active by the member-only `acknowledge-membership` verb; it is display and bookkeeping only, because access is granted at add time."
        status: "stable"
        path: "docs/decisions/identity-and-access/member-join-status.md"
      - title: "Member roster for members (SPEC-075)"
        fence: "Every member sees a read-only roster, owner first, fanned out to each member's cache with the same join-status projection the owner sees; non-owners get no management power and no new IAM."
        status: "stable"
        path: "docs/decisions/identity-and-access/member-roster-for-members.md"
      - title: "No backend"
        fence: "The browser holds no AWS credentials and no token, and fetches presigned S3 bytes and its own origin, nothing else; Cognito is reached only by navigation, through the portal server's `/auth/` routes. The live rules are no second API and no new browser-side AWS SDK call on a path an API route serves."
        status: "stable"
        path: "docs/decisions/identity-and-access/no-backend.md"
      - title: "No shared-space directory is published; suggestions come from your own cache (SPEC-158)"
        fence: "**No shared-space directory is published** — the share dialog suggests only spaces you belong to. A full list would be more useful and is declined as a disclosure with no equivalent."
        status: "stable"
        path: "docs/decisions/identity-and-access/no-shared-space-directory-is-published-suggestions-come-from-your-own.md"
      - title: "Table-share's dedup id is keyed on the verified actor, not the token (SPEC-200)"
        fence: "Table-share's FIFO dedup id hashes the verified actor in position 0 and no token, so a token refresh cannot defeat the double-submit guard; the actor must stay in it, or one user's share collapses into another's."
        status: "stable"
        path: "docs/decisions/identity-and-access/table-shares-dedup-id-is-keyed-on-the-verified-actor-not-the-token.md"
      - title: "The API is a verifier, not an OIDC client (SPEC-195)"
        fence: "**The API VERIFIES a bearer, and is not an OIDC client.** The API takes no cookie, so it has no CSRF surface; the portal server's session cookie, which is not the API's, carries its own `Origin` check. **A key-retrieval fault is 5xx, never 401**; refusals are byte-identical and **expiry is not disclosed**: a discriminator buys a caller nothing and costs an oracle."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-api-is-a-verifier-not-an-oidc-client.md"
      - title: "The API makes exactly ONE AWS call per request, and every loop stays in the browser (SPEC-199)"
        fence: "**The API's remaining fences live beside it** — `@lambdas/info/planes/api.md` for the plane, this area's other decisions for the rest — and they are traps rather than reference: **no route waits, sleeps or paginates** and no call count grows with the user's data (a small fixed number is fine); the error shape is a machine **CODE** whose wording is chosen client-side; the wire is declared in **Python** and the TypeScript is **generated** from a **closed** vocabulary that never falls back; **`$default` matches OPTIONS**, so the router answers a preflight **before authentication** and only a browser can see that fail; and **no route waits**, every poll and page walk staying in the browser against a **non-raisable** 30-second integration ceiling."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-api-makes-exactly-one-aws-call-per-request-and-every-loop-stays-in.md"
      - title: "The API reads the same claims and assumes the same role with the same tag set (SPEC-196)"
        fence: "**The API assumes the SAME role with the SAME tags from the SAME claims** — one computation over one input, which is why no policy is rewritten. The role is **reused, never minted** (`aws:PrincipalArn` resolves to the *role's* ARN, so the hand-maintained bucket-policy allowlist stays correct), `DurationSeconds` 3600 is a ceiling **both ways** — shorter caps every presigned link, longer is refused as role chaining — and tag-key agreement is **asserted, not structural** — the trust statement's `sts:TagKeys` is a ceiling that **cannot require a tag was stamped**."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-api-reads-the-same-claims-and-assumes-the-same-role-with-the-same.md"
      - title: "The browser's queue grants come off with the switchover, not with the trust flip (SPEC-200)"
        fence: "The browser's `sqs:SendMessage` grants had to come off before the trust flip, because once `identity.actor` is authoritative any tab able to write a queue could name any actor; the grants are gone and recovery from here is forward."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-browsers-queue-grants-come-off-with-the-switchover-not-with-the.md"
      - title: "The contract is declared in Python and the TypeScript is generated (SPEC-197)"
        fence: "`lambdas/api/apicommon/contract.py` is the single wire declaration and the TypeScript is generated from it; CI refuses a diff on the generated file, and the closed type vocabulary raises rather than emitting `unknown` or `any`."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-contract-is-declared-in-python-and-the-typescript-is-generated.md"
      - title: "The credential cache is keyed on the whole tag set (SPEC-196)"
        fence: "**The credential cache is keyed on the WHOLE tag set** — never the username alone, which freezes membership until the next cold start, and never nothing, which serves B the session of A. **A presigned URL is not a request** and takes `signing_client(covering=…)`, forcing a fresh session rather than clamping against a near-dead one. A short window is *correctly clamped*, so no clamp test can see it."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-credential-cache-is-keyed-on-the-whole-tag-set.md"
      - title: "The dev-unauth path is retired (SPEC-198, supersedes SPEC-002)"
        fence: "**The dev-unauth path is RETIRED** — it worked by calling S3 unsigned from the browser, and no unsigned call is left. The `VITE_` allowlist is now `lib/env.ts` alone; local dev points the SPA at an API."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-dev-unauth-path-is-retired.md"
      - title: "The error shape: a machine code, and operator text nobody renders (SPEC-197)"
        fence: "A failure body is `{\"error\": {code, requestId, detail?}}` with `code` from a closed enum; the browser chooses every user-facing sentence from the code, `detail` is rendered nowhere, and no API code may share a passthrough rule."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-error-shape-a-machine-code-and-operator-text-nobody-renders.md"
      - title: "The identity block is nested, and it stays nested (SPEC-200)"
        fence: "Every control-plane message from the API carries a nested `identity` block `{actor, delegated_by, assurance}`, and it stays nested; `delegated_by` is present as null, and nothing secret goes in it because the drain redacts top-level keys only."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-identity-block-is-nested-and-it-stays-nested.md"
      - title: "The identity grant is the only path to a request queue; no resource policy (SPEC-200)"
        fence: "Request queues are guarded by identity grants alone, with no `aws_sqs_queue_policy` in `infra/` and a sweep keeping `sqs:SendMessage` off the portal role; do NOT add a blanket `Deny` on the API's role ARN, which silences every outcome notification."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-identity-grant-is-the-only-path-to-a-request-queue-no-resource.md"
      - title: "The Identity Pool is retired, and no one's sign-in changed (SPEC-202)"
        fence: "The Cognito Identity Pool is deleted while the User Pool, Managed Login v2 and sign-in are untouched; the browser holds no AWS credentials, and since SPEC-262 no token either."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-identity-pool-is-retired-and-no-ones-sign-in-changed.md"
      - title: "The membership index is an authorization input, where the username directory is not (SPEC-203)"
        fence: "**The tag VALUES have two sources, chosen at COLD START, no fallback** — `MEMBERSHIP_SOURCE`, default `claims`, in no Terraform. The other is `memberships/{username}.json`, **admin** bucket: an authorization input, unlike the username directory, safe only because it is **user-unreachable, plane-written, CAS-written**. The user's own `shared-connections.json` is the same shape and **user-writable** — reading it is a bypass. Absence needs a **`s3:prefix`-conditioned `ListBucket`** or it reads as denial."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-membership-index-is-an-authorization-input-where-the-username.md"
      - title: "The planes trust a body field because of who may WRITE it, not because of cryptography (SPEC-201)"
        fence: "Planes trust the `identity` block because only the API may write their queues, so they verify no token and still authorize membership and ownership themselves; `cpcommon.actor` may not verify, and the flat top-level `actor` is never consulted."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-planes-trust-a-body-field-because-of-who-may-write-it-not-because.md"
      - title: "The portal server holds the session, and only the provider or the clock ends it (SPEC-257)"
        fence: "**The portal's Next.js server holds the session** in DynamoDB under the SHA-256 of an opaque `__Host-dq_session` cookie, **read by a name trimmed of space and tab only**: `trim()` strips U+00A0, and a cookie named 0xA0 then `__Host-` carries none of the prefix's protection. **Expiry is checked on every read**: the TTL deletes within days and DynamoDB returns the item until then. **A refresh is a compare-and-set** on `version` with `attribute_exists(#pk)`; without the condition `UpdateItem` recreates a session a sign-out deleted. A losing refresh **uses the stored token**, unless it was forced and the stored one has an earlier `iat`; a forced loser that always wrote its own answered 503 to as many as 13 of a burst of 20. **Only `invalid_grant`, a missing item or the session's expiry end a session**: a store fault, a timeout or `invalid_client` answers 503 and leaves the item. Every unsafe method under `/auth/` and `/api/` needs `Origin` equal to the portal, checked before any store read, because `SameSite=Lax` admits a sibling subdomain. **Nothing about a session lives in module scope**; the one thing held between requests is the feature-flag set, which is not session state, and **no token is ever kept there**."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-portal-server-holds-the-session-and-only-the-provider-or-the-clock-ends-it.md"
      - title: "The provider block is the API's verifier configuration, and it is server-side (SPEC-192)"
        fence: "The `OIDC_*` verifier configuration is API Lambda environment variables and never appears in the browser's document; `OIDC_JWKS_URI` is a field, not derived from the issuer, and since SPEC-262 the document carries no Cognito value at all. **`OIDC_AUDIENCE` is a set** (257): a comma-separated list of app client ids, a token's `aud` must be one of them, and an empty element is refused at both ends, because an empty set refuses every token and the join is on commas."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-provider-block-is-the-apis-verifier-configuration-and-it-is-server.md"
      - title: "The role's Lake Formation grants and the principal tag are ONE mechanism (2026-09-01)"
        fence: "Shared-space isolation is the intersection of the role-level Lake Formation grant and the tag-scoped Glue ARNs, retired together or not at all; no portal-role template may gain `glue:DeleteDatabase` or `glue:UpdateDatabase`."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-roles-lake-formation-grants-and-the-principal-tag-are-one-mechanism.md"
      - title: "The roster contradicted the connections list because a fan-out list was missing one verb"
        fence: "`acknowledge-membership` fans the roster out like add, remove and leave, and that fan-out cannot fail the run because the registry write has already committed; the browser renders the reader's own row `Active` regardless."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-roster-contradicted-the-connections-list-because-a-fan-out-list-was.md"
      - title: "The trust flip is two deploys, and the second cannot be rolled back (SPEC-201)"
        fence: "The trust flip took two deploys and recovery is forward only; a pre-cutover message, flat token and no block, is refused `unauthorized` with no notification and no drain record, and the plane allowed-field sets stay untightened to keep that reason."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-trust-flip-is-two-deploys-and-the-second-cannot-be-rolled-back.md"
      - title: "The username directory is built from S3, not Cognito (SPEC-146)"
        fence: "The username directory comes from a daily builder over the user-space bucket's top-level prefixes, with no Cognito call and no Cognito union; it is advisory and never an authorization input, so existence checks stay `admin_get_user`."
        status: "stable"
        path: "docs/decisions/identity-and-access/the-username-directory-is-built-from-s3-not-cognito.md"
      - title: "Two credential planes, declared per route, defaulting to the user plane (SPEC-196)"
        fence: "**Two credential planes, user by default, declared ON THE ROUTE — the failure fails OPEN.** A wrong client *succeeds* against the wrong identity. The plane is a **required field** on the contract's `Route`, a value that is neither of the two **raises**, and the route is set on the way **IN**: a warm container has no fresh context, so cleanup-on-exit alone lets the next request inherit a declaration. **An assume failure is a FAULT, never a denial** — STS says `AccessDenied` for a wrong trust policy, so the layer *wraps* it."
        status: "stable"
        path: "docs/decisions/identity-and-access/two-credential-planes-declared-per-route-defaulting-to-the-user-plane.md"
      - title: "Usernames"
        fence: "A username is the S3 prefix, the principal tag and the Glue database name, so the pre-signup Lambda validates it at signup against the catalog-safe rule `^[a-z][a-z0-9_]{2,62}$`."
        status: "stable"
        path: "docs/decisions/identity-and-access/usernames.md"
  - name: "Infrastructure, IAM and delivery"
    slug: "infrastructure"
    path: "docs/decisions/infrastructure/infrastructure.md"
    governs: ["infra/**", ".github/**", "lambdas/docker/**"]
    decisions:
      - title: "A build stamp belongs to the artefact; an environment name belongs to the environment"
        fence: "Tofu sets `ENV_NAME` on every Lambda from `var.environment`; `BUILD_VERSION` travels in the artefact, never in Tofu's environment map, and is read once at import, where a missing or unreadable stamp degrades to the sentinel and never raises."
        status: "stable"
        path: "docs/decisions/infrastructure/a-build-stamp-belongs-to-the-artefact-an-environment-name-belongs-to.md"
      - title: "A control plane's deploy grant is an entry in one map, and its propagation guard re-fires on triggers (SPEC-253)"
        fence: "**A control plane's deploy grant is one entry in `local.control_plane_grants`**, rendered from one core template plus an extras template only for statements no other plane has — never a copied template. Its `name` and `description` are ForceNew. Suites read a plane's grant through `lambdas/plane_grants.py`, never a file. **A `time_sleep` guarding grants added later needs `triggers`**: `replace_triggered_by` never fires on a create before OpenTofu 1.12, and CI runs 1.8, so a guard written that way looks right in every local plan on a newer tofu and pauses for nothing in CI."
        status: "stable"
        path: "docs/decisions/infrastructure/a-control-planes-deploy-grant-is-a-map-entry-and-its-guard-re-fires-on.md"
      - title: "A cutover is two merges, and only the second one destroys the rollback (SPEC-202)"
        fence: "**Origins are admitted ADDITIVELY** and narrowed only at the cutover — an allowlist naming one origin makes the other a rollback nobody can exercise. **A cutover is TWO merges:** the retirement, which touches nothing serving the app, then the live checks **while the rollback still works**, then the narrowing and the destroy. A half-finished retirement looks exactly like a finished one, so a deleted resource is proved gone **positively** (`NoSuchDistribution`, not \"absent from the plan\") and a grant outlives its resource by one apply — where SPEC-202 found the next trap: the Checkov accept list was holding that grant's own findings open, so removing it made both acceptances stale, which is a hard error."
        status: "stable"
        path: "docs/decisions/infrastructure/a-cutover-is-two-merges-and-only-the-second-one-destroys-the-rollback.md"
      - title: "A Fargate task volume cannot give a non-root container a writable path (SPEC-193)"
        fence: "The non-root, read-only container's writable paths are `linuxParameters.tmpfs` mounts, never task volumes, which arrive empty and root-owned and do not initialise from the image. One uid feeds both `user` and every mount option."
        status: "stable"
        path: "docs/decisions/infrastructure/a-fargate-task-volume-cannot-give-a-non-root-container-a-writable-path.md"
      - title: "A ForceNew packaging change is a rename in state plus 86 replacements, and the permissions are what nobody looks at (SPEC-213)"
        fence: "**`package_type` is FORCE-NEW: the cutover replaced all 86**, ordered only by **172 `moved` blocks** — without one, Terraform plans a create and a destroy with **no edge between them**, and it tolerates a `moved` whose `from` is not in state **silently**. So **reverting is not a rollback**; pointing at a previous sha's image is, and `image_uri` is *not* ForceNew, which is what lets CI move the fleet at all. **Every `aws_lambda_permission` binds to `function_arn`, never a name** — a name is config-known, plans **no diff**, and lets the replacement take the resource policy: an API-wide 500 behind a green apply and a green probe. Six planes' constructed ARN lists moved for the same reason. **CI points EVERY function every run** (\"which changed\" has no answer with one artefact; an un-pointed one runs an older image *working perfectly*), reconciles by NAME, then proves a sample STARTED — a check that took three designs, none of which an emulator can settle, because it diverges from Lambda on exactly the init-failure path."
        status: "stable"
        path: "docs/decisions/infrastructure/a-forcenew-packaging-change-is-a-rename-in-state-plus-86-replacements.md"
      - title: "A guard is retired by proving its replacement, then deleting (SPEC-214)"
        fence: "**Retire a guard by PROVING its replacement, then deleting** — the matrix reasoned about a table; the image RUNS every handler. Absence is what the API ANSWERS: a destroy of the wrong names deletes nothing and looks finished."
        status: "stable"
        path: "docs/decisions/infrastructure/a-guard-is-retired-by-proving-its-replacement-then-deleting.md"
      - title: "A module that waits on another reads no data source, because the wait defers the read"
        fence: "**A module-level `depends_on` defers every data source in that module, so none sits behind one** — a deferred document is `(known after apply)`, which no plan-time scan reads, and a deferred `for_each` is a hard error. Keep the edge; render documents with `templatefile()` and pass other reads from the root. A sweep refuses the shape. **A NEW IAM policy must be KNOWN at plan time, or the plan gate refuses it**, because Checkov passes a `(known after apply)` document unread; an updated one is only named in a warning. That decides a plane's PR grouping: an ARN a policy's `Resource` names is built from the resource's name in a local, and a `Principal` must exist when IAM writes the policy, so a role the same PR creates needs an explicit dependency on it or lands a PR earlier, as does a resource whose ARN AWS generates (a KMS key, a Cognito pool). Reasoning: `docs/decisions/gates-and-tests/a-scanners-configuration-is-its-command-line-and-what-it-discovers-is.md`, *What the scanner cannot read is refused too*."
        status: "stable"
        path: "docs/decisions/infrastructure/a-module-that-waits-on-another-reads-no-data-source-because-the-wait.md"
      - title: "A role that cannot list a bucket cannot be told an object is absent"
        fence: "**A role that cannot LIST a bucket cannot be told an object is ABSENT** — S3 answers `NoSuchKey` only to a caller holding `s3:ListBucket`, so every `except NoSuchKey: return None` needs a covering grant or its absence branch fails as a fault. Found live: an unregistered space raised `AccessDenied` out of `cpcommon.registry.load` instead of refusing. **A CONDITIONED grant is sufficient — having no statement is what breaks**, and the simulate misleads here, returning `implicitDeny` with no `s3:prefix` supplied because it answers what IAM decides given your context, never what the service supplies. So scope the condition to the keys read; do **not** widen to an unconditioned admin-bucket list (that discloses every space name, then every roster), and do **not** read `AccessDenied` as absence, which makes a real denial look like a fresh request. The population is swept from the AST, never listed."
        status: "stable"
        path: "docs/decisions/infrastructure/a-role-that-cannot-list-a-bucket-cannot-be-told-an-object-is-absent.md"
      - title: "A `TF_VAR_` variable reaches Terraform only if a run hands it over, so none renames the deployment"
        fence: "**An empty `TF_VAR_` is not an unset one.** It satisfies a required variable *and* overrides a default; an unset repo variable renders as exactly that. Guard with `validation`, not with the absence of a default. **And a set one is configuration only if a run hands it over** — no workflow builds a name from one Terraform is not given, a set one fails the plan and apply, and renaming the deployment is a reviewed change to `infra/` and the deploy, never a variable."
        status: "stable"
        path: "docs/decisions/infrastructure/a-tf-var-variable-reaches-terraform-only-if-a-run-hands-it-over-so-none.md"
      - title: "A value Terraform computes is read from state, never copied into a settings page (SPEC-215)"
        fence: "A value Terraform computes is read from state through `.github/config-outputs.json`, and the job refuses an absent or empty output. Only a genuine input stays a repository variable, and no second copy of the values (SSM, generated tfvars, cached outputs) is allowed."
        status: "stable"
        path: "docs/decisions/infrastructure/a-value-terraform-computes-is-read-from-state-never-copied-into-a.md"
      - title: "An account quota is invisible until the apply, and the apply is on `main` (SPEC-222)"
        fence: "**An ACCOUNT QUOTA is invisible to every local gate, so the APPLY is the only thing that knows — and it finds out on `main`, with a partial apply behind it.** `tofu validate` type-checks, `docker-lambda`'s validation block enforces the range AWS *documents*, and a plan never calls `CreateFunction`; a value inside the documented range and outside the account's passes all three and is refused at create. Measured: a Lambda at Lambda's documented 10,240 MB, against an account whose un-raised quota is 3,008. The write grant, the log groups and the sibling function had already applied. `Deploy Lambdas` then names the wreckage precisely — *\"planned but never pointed at this commit's code\"* — which is the reconcile gate's signature for a refused create rather than a generic failure. `test_fleet_derivation.py` holds every module's declaration against what this account will actually create; it is fleet-wide because the next author will have the same information the last one did, which is none. **These constants are account quotas and therefore MOVE** — unlike a documented maximum, which is a service limit — so raising the AWS quota and raising the constant are one change, and the guard is wrong in the *denying* direction until both happen."
        status: "stable"
        path: "docs/decisions/infrastructure/an-account-quota-is-invisible-until-the-apply-and-the-apply-is-on-main.md"
      - title: "An account wildcard is a scoping decision nobody made"
        fence: "**An ARN in a deploy grant names ONE account.** The account field is a scoping decision like any other, and a `*` there reads identically to a considered one. It is not inert everywhere: where a resource carries its own policy — SQS, ECR, `lambda:InvokeFunction`, EventBridge, and the Glue catalog under Lake Formation — a foreign account holding a `dat-*`-matching resource whose policy admits this role was reachable. Elsewhere (EC2, Logs, Lambda config, Step Functions, Pipes) the request evaluates in the owner's account with nothing to say yes, so the wildcard authorized nothing; pin it anyway, because the two are indistinguishable in a diff. **The exception is a resource AWS owns:** every managed prefix list is `arn:aws:ec2:<region>:aws:prefix-list/…`, and the SPA's egress rule names the S3 one — so that ARN is pinned to `aws`, not to this account. **An empty account field is legal** (S3, Route 53, API Gateway) and is not a wildcard. `test_no_deploy_grant_wildcards_the_account` walks the parsed document, not the `Resource` field, because two of these ARNs live in `Condition`s."
        status: "stable"
        path: "docs/decisions/infrastructure/an-account-wildcard-is-a-scoping-decision-nobody-made.md"
      - title: "The web tier is the only front door, and it is on only while someone is working (SPEC-255)"
        fence: "**EXACTLY ONE FRONT DOOR EXISTS, and it is the web tier**: the Next.js server on Fargate. A Node app has no static fallback, so with the switch off the portal's host does not resolve and the portal is down, which is accepted. Switch it with `TF_VAR_web_tier_enabled` and CI, never by writing to AWS, and off again when the work is done. **The portal's certificate renews only while the tier is on** (ACM renews only a certificate in use, from 60 days before expiry), so one that lapsed while off needs a reviewed re-issue before the tier can serve (`infra/info/web-tier.md`)."
        status: "stable"
        path: "docs/decisions/infrastructure/cloudfront-serves-the-portal-again-because-the-vpc-was-the-bill.md"
      - title: "`COGNITO_USER_POOL_ID` is a lazy requirement of three planes, not fleet-wide configuration"
        fence: "**`COGNITO_USER_POOL_ID` is no longer fleet-wide** — a lazy `config.require` on the three planes resolving a recipient, so a missing one raises **mid-request**, not at cold start."
        status: "stable"
        path: "docs/decisions/infrastructure/cognito-user-pool-id-is-a-lazy-requirement-of-three-planes-not-fleet.md"
      - title: "Configuration is a runtime document, and only the test runner has a fallback (SPEC-192, SPEC-255)"
        fence: "**Configuration is a RUNTIME document** (`/config.json`, rendered per request by the Next.js server, `no-store`, refused whole on version) with **no fallback outside the test runner** (`MODE === 'test'`). Its key set is wired in **four** places, asserted across all, and the server **exits 1 at start** naming a required variable unset or empty: it exits rather than throws, because a throw leaves a server answering 500 to every path. **The deploy READS the values from Terraform state** through `.github/config-outputs.json`, refusing an absent *or empty* output by name; only a genuine **input** is a repository variable, so retiring an origin means **re-pointing that map**. The API's **verifier** config is server-side, never in the browser's document. **Since SPEC-262 the document is four keys** (the two buckets, the flag environment and the upload ceiling): the API origin, region, app URL and three Cognito keys left every wiring site in one merge."
        status: "stable"
        path: "docs/decisions/infrastructure/configuration-is-a-runtime-document-and-a-production-build-has-no.md"
      - title: "`connect-src` comes from the task definition; every other CSP directive is a property of the bundle (SPEC-194, SPEC-255)"
        fence: "**CSP `connect-src` IS the app's network surface** — enumerate it from the hosts the app fetches, not the AWS services it uses; the omitted Hosted UI domain broke fresh sign-in for a day. **Since SPEC-262 it is exactly `'self'` and the two buckets**: the browser signs in and calls the API through its own origin. **Prove enforcement with a POSITIVE `securitypolicyviolation`** (`effectiveDirective: \"connect-src\"`, `disposition: \"enforce\"`) plus a same-origin negative control. It reaches the server as `PORTAL_CSP_CONNECT_SRC`, built at root as `csp_connect_src`; every other directive is `src/server/contentSecurityPolicy.ts`, and each page's policy carries a fresh nonce. **The server allowlists the source list at start and exits 1 naming the variable**: a quote or `;` in it would end or add directives on a server that still answers."
        status: "stable"
        path: "docs/decisions/infrastructure/connect-src-comes-from-the-task-definition-every-other-csp-directive-is.md"
      - title: "Consolidation is worth doing against a SWEEP, not against a list"
        fence: "Consolidate shared UI shapes against a sweep, never a spec's list: a `?raw` glob guard holds each shape to one home, with a guard-the-guard asserting every needle still matches its owner, and `components/` may export only components."
        status: "stable"
        path: "docs/decisions/infrastructure/consolidation-is-worth-doing-against-a-sweep-not-against-a-list.md"
      - title: "Deploy-role refresh deadlock has an in-repo lever (`skip_refresh`)"
        fence: "**The deploy role can lock itself out**: tighten or widen one of its own grants and plan, apply and **revert** all fail alike. `Deploy Infrastructure` takes `skip_refresh` to break it — always follow with a normal run. A green plan is not proof; IAM is eventually consistent. **Deploy-role IAM is in-scope work for any spec that provisions new infra**, and **grants land in their own PR before the resources that need them** — every grants-only PR in Arc B applied green first run. That is the whole claim: it does **not** prevent a red main, which this arc hit three times afterwards on things no grant review would have found."
        status: "stable"
        path: "docs/decisions/infrastructure/deploy-role-refresh-deadlock-has-an-in-repo-lever-skip-refresh.md"
      - title: "IaC"
        fence: "OpenTofu is the IaC tool (over CDK, Pulumi and SST). **A module is one architectural concept, and the root composes them flat**: a concept built once is a module the root calls once, a concept built more than once is a **building block** the root calls once per instance (`control-plane` ×8, `scheduled-function` ×4, `queue-consumer` ×2), and the root passes every dependency in as a constructed string. A plane's own configuration lives with its call (`infra/plane-<slug>.tf`, `infra/planes/<slug>/`), and a standalone function's with its own (`infra/function-<slug>.tf`, `infra/functions/<slug>/`). **A building block's inputs are what varies between its callers, found by diffing resolved values** — reading the HCL text misses a value hidden behind a local. **A refactor moves; it never recreates**: every changed address gets a `moved` block in `infra/moved.tf`, and the PR's plan showing only moves is the proof. IAM policies are `.tftpl` templates rendered with `templatefile()`."
        status: "stable"
        path: "docs/decisions/infrastructure/iac.md"
      - title: "One image for the whole Lambda fleet, and the sweep that pays for it (SPEC-212)"
        fence: "**ONE image, and all 86 Lambdas now RUN it** — shared code on `/opt/python`, function modules flat at the task root, **dependencies deliberately in site-packages** so the layout guard is a real set equality. **Shared code is what `lambdas/*-common/` HOLDS**, no list to be missing from, and a directory that is neither that nor a function is REFUSED, never defaulted. One shared task root is the new hazard: a duplicate name does not collide, it **silently wins** for the whole fleet, so collisions and shadowing are asserted **against the built image**. The import sweep runs through the runtime's **own bootstrap** — `--entrypoint python` omits `/opt/python`, and a reconstructed path that is a superset passes what production fails — and its expected count comes from **Terraform**, never from the same rule the sweep uses, or renaming a handler drops **both** sides and agrees. **The fleet's membership is `fleet.py`, read from the Terraform SOURCES** — a `tofu output` is last-applied state and the deploy workflows race on the push adding a function. No `.github/` list names functions."
        status: "stable"
        path: "docs/decisions/infrastructure/one-image-for-the-whole-lambda-fleet-and-the-sweep-that-pays-for-it.md"
      - title: "Plans queue apart from applies, and meet at the state lock"
        fence: "`deploy-infra.yml` queues each pull request's runs in a concurrency group keyed by its ref, and a push and a dispatch, the two events that apply, in `deploy-infra`. **A plan is still never computed beside an apply, because `tofu plan` takes the state lock, so both commands carry `-lock-timeout`.** Do not put plans back in the apply group: by default GitHub keeps one pending run per group and cancels it for any newer run, so a pull request evicted a pending apply and nothing re-ran it, and `queue: max` is no cure, since GitHub does not guarantee its order and an older apply could run after a newer one. Group names are shared by every workflow in the repository, so no other workflow's group may match one of these. Do not drop either timeout: the default 0s fails whichever command reaches the lock second, which is a lost apply when that is the apply, and nothing goes red until a plan and an apply overlap. Do not rename `deploy-infra`, which lets an apply queued under the old name run beside one under the new, and do not turn on `cancel-in-progress`, since a cancelled plan can leave the lock held. `lambdas/test_config_workflows.py` holds all of it."
        status: "stable"
        path: "docs/decisions/infrastructure/plans-queue-apart-from-applies-and-meet-at-the-state-lock.md"
      - title: "Response headers / CSP: the request proxy stamps a per-request nonce (SPEC-140, SPEC-255)"
        fence: "The request proxy (`src/proxy.ts`) serves the only page CSP and the seven security headers. **The nonce goes in `script-src` only**: one in `style-src` switches off the `'unsafe-inline'` Monaco needs, and `'unsafe-eval'` is development only. **A request carrying a body skips the proxy**, because Next would wait for the whole body before answering anything, and gets `next.config.ts`'s lockdown floor. Enumerate `connect-src` from the hosts the app fetches, prove enforcement with a positive `connect-src` violation plus a same-origin control, and diff scanner findings per check ID, never by count."
        status: "stable"
        path: "docs/decisions/infrastructure/response-headers-csp.md"
      - title: "Static-asset caching = three prefix-scoped sync passes (SPEC-141)"
        fence: "The three S3 sync passes no longer run because the image is the file set. Two findings stand: `--exclude` protects destination keys from `--delete`, and when some users see a broken app after a deploy, reach for the origin's headers, not an invalidation."
        status: "stable"
        path: "docs/decisions/infrastructure/static-asset-caching-three-prefix-scoped-sync-passes.md"
      - title: "The API function is not in the VPC (SPEC-193)"
        fence: "The API function is never attached to the VPC, which exists for the container; its module is asserted to carry no `vpc_config`, `aws_security_group` or `subnet_ids`."
        status: "stable"
        path: "docs/decisions/infrastructure/the-api-function-is-not-in-the-vpc.md"
      - title: "The functions a user reaches first are woken daily, because an idle image function rejects its first invoke"
        fence: "**A container-image Lambda idle for weeks goes INACTIVE and AWS REJECTS the first invoke**; only an invoke wakes it. So the three functions a user reaches first — the API and both Cognito triggers — are invoked once a day by a `*-keep-warm` EventBridge rule in the module that owns them, with a payload each handler treats as a no-op. **A target with no permission applies green and fails every invoke silently**, and a new Cognito trigger is kept warm only if it joins the rule: `lambdas/test_keep_warm.py` derives both from the Terraform."
        status: "stable"
        path: "docs/decisions/infrastructure/the-functions-a-user-reaches-first-are-woken-daily.md"
      - title: "The image is the file set, which retires a reconciliation pass and an orphan class (SPEC-194)"
        fence: "**The image IS the file set** — no reconciliation pass, no orphan class, and an honest 404 under `/_next/`, which the Next.js server gives a non-static `/_next/` path only through its `%5Fnext` route, since an unmatched path otherwise gets the not-found page's HTML. The S3 path it replaced deployed in three prefix-scoped passes, and its one finding that outlives it: **`--exclude` PROTECTS keys from `--delete`**, so a pass excluding a prefix can never reconcile it."
        status: "stable"
        path: "docs/decisions/infrastructure/the-image-is-the-file-set-which-retires-a-reconciliation-pass-and-an.md"
      - title: "The image tag is the commit sha, and `:latest` does not exist (SPEC-193)"
        fence: "Both ECR registries are `IMMUTABLE` and every image tag is a commit sha with no `:latest`, so a bad build is fixed by a new commit. CI owns which revision the service runs and must point it; Terraform owns `desired_count`. `task_definition` is ignored while `desired_count` is not — so **CI must point the service**, and a pipeline that only registers a revision leaves a `CannotPullContainerError` **indistinguishable from the endpoint failure the platform is tested for** (the Lambda fleet's registry rides the same rule)."
        status: "stable"
        path: "docs/decisions/infrastructure/the-image-tag-is-the-commit-sha-and-latest-does-not-exist.md"
      - title: "The Next.js server reproduces CloudFront's jobs, and two are divergences (SPEC-194, SPEC-255)"
        fence: "**The portal's server reproduces every job the distribution did bar two DIVERGENCES**: no brotli, no HSTS `preload`. **A header the request proxy sets overrides every other source**, a route handler's `Cache-Control` and Next's `immutable` included, so the proxy sets none. **An unmatched path answers the not-found page, HTML under a 404**: a missing `/_next/` chunk needs the `%5Fnext` route's plain-text 404, and `/healthz` must stay a route handler whose `ok` body the matrix asserts. **A guard ahead of Next answers a malformed path, a target that is not a path and every upgrade with 400 and the headers.** Assert on **responses**, never config text."
        status: "stable"
        path: "docs/decisions/infrastructure/the-nginx-configuration-reproduces-cloudfronts-jobs-and-three-are.md"
      - title: "The origins are admitted additively, and narrowed only at the cutover (SPEC-193)"
        fence: "A new origin is admitted beside the old one on every allowlist and narrowed only at the cutover. Since SPEC-262 each app client names exactly one origin — the server client the deployed one, the dev client `localhost:5173` — and both buckets' CORS name the deployed origin and `localhost:5173`; the API has **no CORS at all**, because no browser calls it. Do NOT add CORS to the API for a dev origin: `npm run dev` calls it through its own `/api/`."
        status: "stable"
        path: "docs/decisions/infrastructure/the-origins-are-admitted-additively-and-narrowed-only-at-the-cutover.md"
      - title: "The scopability measurement turns on which ARN the deny leg uses, and the population it guarded was two of seventeen"
        fence: "**Scopability is MEASURED, never assumed — and WHICH ARN you scope the deny leg to decides whether the measurement means anything.** `implicitDeny` is equally what a **wrong ARN** reads, the wrong *resource type* of the right service included. Use a **service-wide `arn:aws:<svc>:<region>:<acct>:*`**, which is type-agnostic and cannot be the wrong type; a \"validate it with a scopable sibling\" leg **does not work** and passes on the case it was derived from. Actions with no resource type sit alone in a wildcard; the only other forced wildcard is one a **measured condition key** narrows, exempting the ACTIONS it covers and never the statement — any-condition-exempts admits `iam:PassRole` on `\"*\"`. **A simulate matches PATTERNS, not the ARN the service passes** — it cannot tell you that a service calls something on your behalf, or that a condition key goes unpopulated, which are the two traps that cost this project an apply each. Contradicting intuition: `ec2:DescribeVpcAttribute` and `route53:GetChange` **are** scopable; `ecs:DescribeTaskDefinition` is not, and scoping it is the refresh deadlock arriving by your own hand. **A condition on a key the caller does not populate fails CLOSED**, and the refusal names neither. **A service may call an action on your behalf that appears in no action list** — ELB calls `ec2:GetSecurityGroupsForVpc` inside `CreateLoadBalancer`."
        status: "stable"
        path: "docs/decisions/infrastructure/the-scopability-measurement-turns-on-which-arn-the-deny-leg-uses-and.md"
      - title: "The SPA deploy decides from what is running, not from a path filter — and the Lambda image deliberately does not"
        fence: "`deploy-spa-image.yml` decides from live state against the deployed commit, re-points unless the PRIMARY deployment settled, and never skips on a dispatch. Every push reads the family only after each `deploy-infra.yml` push run at its commit or before it has finished, which holds a run that replaced an evicted one and a push of several commits; a push that fires an apply also asks after its own run by commit, and the list deciding which IS `deploy-infra.yml`'s push `paths:` — never a list of the task definition's apparent inputs, which other modules feed. Do not drop the by-commit question, the only one that refuses a dropped push event, and do not wait for a later push's run, which lets a run of applies outlast the window. Do not add a `paths:` filter, and while Lambda builds are on, leave the Lambda image building on every push: downstream workflows name `github.sha` as its tag. While `LAMBDA_BUILDS_ENABLED` is off, nothing builds it and `deploy-infra.yml` names the image the fleet runs."
        status: "stable"
        path: "docs/decisions/infrastructure/the-spa-deploy-decides-from-what-is-running-not-from-a-path-filter-and.md"
      - title: "The web tier has an off switch, and the balancer gave up its deletion protection for it"
        fence: "**The web tier has an OFF SWITCH** (`web_tier_enabled`, a string held to exactly `true` or `false`): `network` and `spa` go whole, so **nothing outside them may read their outputs or sit in the VPC**. The registry lives outside in `spa-image` so its images survive, and the session store, the server's Cognito client and its secret live outside so a switch-off neither drops every session nor schedules the key for deletion; the NAT gateway rides the switch, and the ALB carries **no deletion protection**, which is what lets one apply take the tier down. `infra/info/web-tier.md`."
        status: "stable"
        path: "docs/decisions/infrastructure/the-web-tier-has-an-off-switch-and-the-balancer-gave-up-its-deletion.md"
      - title: "One NAT gateway carries the portal server's two internet destinations, and endpoints carry everything AWS (SPEC-193, SPEC-257)"
        fence: "**The container platform (193; reversed in part by 257):** private subnets reach every AWS service through endpoints, and **one zonal NAT gateway on the web tier's switch is their only default route**, for the two destinations no endpoint serves: the Cognito domain's token endpoint and the API's custom domain. **Task start never depends on it** (the client secret comes through the `ssm` endpoint), so a start that fails is still an endpoint or a security-group fault. The gateway and its Elastic IP **wait for the internet gateway**, and only a switch-on from nothing can hit that order. A destination with no endpoint now leaves through the NAT rather than timing out, so **flow logs** are the record of what a task reached. The one-NAT assertion is repo-wide. The API function is **not** in the VPC and authorization lives in the **router**, both asserted as absences."
        status: "stable"
        path: "docs/decisions/infrastructure/there-is-no-nat-gateway-and-the-endpoints-are-the-whole-outbound-story.md"
  - name: "Storage, and the fact S3 is not a filesystem"
    slug: "storage"
    path: "docs/decisions/storage/storage.md"
    governs: ["lambdas/file-ops-*/**", "lambdas/file-send-*/**", "infra/modules/data/**", "infra/planes/file-ops/**", "infra/plane-file-ops.tf", "infra/planes/file-send/**", "infra/plane-file-send.tf", "apps/portal/src/features/file-browser/**", "apps/portal/src/features/file-send/**", "apps/portal/src/features/saved-queries/**", "apps/portal/src/features/connections/**"]
    decisions:
      - title: "A conflict is one item's outcome, and the list is created once and carried forward (SPEC-188)"
        fence: "Per-item outcomes live in one list that each verb takes as input and returns whole, merged only by `focommon.outcomes.carry_forward`; an item an earlier verb decided is never expanded, and only a proven absence is `source_missing`."
        status: "stable"
        path: "docs/decisions/storage/a-conflict-is-one-items-outcome-and-the-list-is-created-once-and.md"
      - title: "A file operation on more than one file belongs on a plane, and the boundary is the SELECTION (SPEC-187)"
        fence: "A file operation stays in the browser only when a non-empty selection is exactly one item and that item is a file; anything else, including one folder or a folder rename, goes to the plane, whichever the operation, and the rule has one home."
        status: "stable"
        path: "docs/decisions/storage/a-file-operation-on-more-than-one-file-belongs-on-a-plane-and-the.md"
      - title: "A folder name that lands on an app-managed folder's home is refused where it is typed"
        fence: "A typed folder name landing on the home of a `PICKER_LOCKED_FOLDERS` member is refused at every prompt that knows the landing, and Rename, same-folder copy and a conflict's rename also refuse plane-denied names; this is a courtesy for folders only, since uploads bypass it."
        status: "stable"
        path: "docs/decisions/storage/a-folder-name-that-lands-on-an-app-managed-folders-home-is-refused.md"
      - title: "A partial teardown never frees the space name (SPEC-151)"
        fence: "A teardown that could not finish leaves the registry record intact, because that record is the lock on the space name; per-item `delete_objects` and `batch_delete_table` errors raise rather than pass as HTTP 200."
        status: "stable"
        path: "docs/decisions/storage/a-partial-teardown-never-frees-the-space-name.md"
      - title: "A received file lands in `shared_files/{sender}/`, and one function builds every key (SPEC-165)"
        fence: "**A received file lands in `shared_files/{sender}/`, built by ONE function** — an AST sweep forbids a second. Keying by item **name** forces the two refusals an overlapping selection needs. **A duplicate is `(kind, key)`, never the key alone.** One key can arrive as both a file and a folder; collapsing on the key ships a zero-byte placeholder and reports success."
        status: "stable"
        path: "docs/decisions/storage/a-received-file-lands-in-shared-files-sender-and-one-function-builds.md"
      - title: "A save chooses its space, and one KEY rule decides what that replaces (SPEC-175)"
        fence: "A save opens on the linked tab's space, else the one remembered space, and `isLinkedSavedQuery` alone judges by KEY whether a save replaces the tab's file; saving into another space is a copy with no delete, and a typed `.sql` extension is lowercased."
        status: "stable"
        path: "docs/decisions/storage/a-save-chooses-its-space-and-one-key-rule-decides-what-that-replaces.md"
      - title: "A saved query is a FILE, and the folder holding it is ordinary except in one respect (SPEC-173)"
        fence: "**Saved queries are ordinary `.sql` files** in a visible folder with exactly one protection: the folder itself is undeletable. Every `DO_NOT_DELETE.txt` is hidden by **basename**."
        status: "stable"
        path: "docs/decisions/storage/a-saved-query-is-a-file-and-the-folder-holding-it-is-ordinary-except-in.md"
      - title: "An app-managed path is built by one function per tree, and a sweep refuses a second (SPEC-218, superseded in part by SPEC-219)"
        fence: "**An app-managed path is BUILT by three functions per tree** — the SINGULAR builder is where a write goes, the PLURAL one is every root-anchored comparison, and the SEGMENT one is every any-depth scan. The plural spelled both homes as literals while a moving folder had two, so that moving the write could not drag every comparison to a third place; with one home left it delegates, and each tree guards the delegation directly because no VALUE can tell a derived prefix from a literal one. A CI sweep refuses a declaration or construction outside the owners, and **no builder normalizes** (the FIFO group id digests one)."
        status: "stable"
        path: "docs/decisions/storage/an-app-managed-path-is-built-by-one-function-per-tree-and-a-sweep.md"
      - title: "An expected refusal is a return value, and a conflict is per item NAME (SPEC-166)"
        fence: "`check-target-absent` returns its expected refusals as records and leaves its `Catch` for unpredicted faults; a conflict is decided by item name from one delimited listing of the sender's inbox and refuses that recipient, merging and overwriting nothing."
        status: "stable"
        path: "docs/decisions/storage/an-expected-refusal-is-a-return-value-and-a-conflict-is-per-item-name.md"
      - title: "An item copied into itself is refused PER ITEM, where a containment breach fails the request (SPEC-187)"
        fence: "A refusal about the request, such as a key outside the root or two items colliding, fails it whole; one about a single item, such as a protected folder, a no-op, an into-itself copy or a reserved landing name, is that item's outcome, with source protection checked first."
        status: "stable"
        path: "docs/decisions/storage/an-item-copied-into-itself-is-refused-per-item-where-a-containment.md"
      - title: "An unreadable settings document is quarantined, never deleted and never overwritten (SPEC-159)"
        fence: "**An unreadable settings document is quarantined, never deleted and never overwritten**, and a **newer** schema is refused untouched — the parse is three-way, version checked before shape."
        status: "stable"
        path: "docs/decisions/storage/an-unreadable-settings-document-is-quarantined-never-deleted-and-never.md"
      - title: "An upload's shape is the server's decision, and a part is sized so the expiry premise stops mattering (SPEC-216)"
        fence: "`MULTIPART_THRESHOLD_BYTES` is `MULTIPART_PART_BYTES`, computed so a part finishes in half its presigned window on the slowest supported uplink; the server alone decides `PUT` or multipart, and the browser writes parts by index and checks the plan's arithmetic."
        status: "stable"
        path: "docs/decisions/storage/an-uploads-shape-is-the-servers-decision-and-a-part-is-sized-so-the.md"
      - title: "Both homes of a moving folder are admitted before either is written to (SPEC-219)"
        fence: "**A rule that builds its prefix from a PARAMETER is invisible to the app-managed-path sweep** — two were — so it owes a pair test instead. And **a pair test asserts which folder the refusal NAMES, not just its reason code**: once the parent prefix joins the same list, a rule that learned one home still refuses the other, same code, different rule. A pair test can also be structurally vacuous — where every second home is a descendant of a prefix already in the list, no key distinguishes the two builders, and only saying so keeps the test honest. What breaks a move of that folder is **depth**, not spelling: a `{root}{name}/` rule stops matching at depth two and denies nobody. `archive` is **three facts** and only the receipt folder moved; the vault segment and `arcommon.plan.PREFIX` stay, pinned equal by an `ACCEPTED_` tripwire."
        status: "stable"
        path: "docs/decisions/storage/both-homes-of-a-moving-folder-are-admitted-before-either-is-written-to.md"
      - title: "Bytes go to S3 presigned; small text goes through the API (SPEC-198)"
        fence: "**Bytes go to S3 presigned; small text goes through the API**, and the document route's **byte cap is what holds the line** — without it it is a second upload path that works perfectly to 6 MB. The cap is on the **stored** body and the response escapes it twice — Cyrillic goes out at 3.5 times its size — so the routes **measure the response**, and a write as the read it enables. The routes never parse and never re-serialise. Bytes go over **`XMLHttpRequest`**, which is a requirement: `fetch` fires no upload-progress event, so it uploads correctly and leaves the bar at 0% — assert an **intermediate** value. **The SERVER decides whether an upload is one `PUT` or multipart**, so the browser holds no threshold; a URL is minted immediately before redemption, **per file or per part, never batched**, and a retried part **re-mints**. Aggregate progress is the per-part **maximum**, monotonic across a retry. The 5 GiB ceiling is a refusal on the **declared** size — a courtesy, not enforcement, since the API keeps no record of an upload."
        status: "stable"
        path: "docs/decisions/storage/bytes-go-to-s3-presigned-small-text-goes-through-the-api.md"
      - title: "Every `DO_NOT_DELETE.txt` is hidden by BASENAME, and the whole arc needs no IaC change (SPEC-173)"
        fence: "Any object whose last segment is `DO_NOT_DELETE.txt` is hidden at any depth in either bucket, because the portal role's policy for each bucket denies deleting that basename anywhere; that Deny is why the saved-queries arc needs no IaC change, and a live refused delete is still owed."
        status: "stable"
        path: "docs/decisions/storage/every-do-not-delete-txt-is-hidden-by-basename-and-the-whole-arc-needs.md"
      - title: "File ops = filesystem UX"
        fence: "File operations present filesystem UX over S3, which has no move or rename: each is `CopyObject` + `DeleteObject`, folder operations are recursive and non-atomic, and collisions warn and confirm because versioning is off."
        status: "stable"
        path: "docs/decisions/storage/file-ops-filesystem-ux.md"
      - title: "One producer says every per-recipient outcome, and the link carries the recipient's own root (SPEC-167)"
        fence: "One verb at the end of the machine sends every per-recipient message, never a guard or a collector, and a failed recipient is told nothing; the recipient's link must carry their own root in `?prefix=`, or `FilesPage` silently discards it."
        status: "stable"
        path: "docs/decisions/storage/one-producer-says-every-per-recipient-outcome-and-the-link-carries-the.md"
      - title: "`saved_queries/` is gated on `query`, and the gate is not the refusal (SPEC-173)"
        fence: "`saved_queries/` is a `GATED_SURFACES.query` registry row: with the flag off it leaves the file browser's listing and the destination picker, which is presentation only, while the delete and rename refusal takes no flag and always holds."
        status: "stable"
        path: "docs/decisions/storage/saved-queries-is-gated-on-query-and-the-gate-is-not-the-refusal.md"
      - title: "The collision unit is the derived destination KEY, and that is what preserves merging (SPEC-188)"
        fence: "The destination guard heads each derived destination KEY, never the subtree, which is what keeps merging into an existing folder legal; a 403 counts as occupied in both modes, and `overwrite` must ask about every key where `refuse` may short-circuit."
        status: "stable"
        path: "docs/decisions/storage/the-collision-unit-is-the-derived-destination-key-and-that-is-what.md"
      - title: "The commit gate is per ITEM, so the graph proves less than SPEC-169's did (SPEC-189)"
        fence: "The per-item commit gate cannot be proved from the graph: the walk asserts only that an empty `deletable` set cannot reach `DeleteSource`, a collector test and `delete-source`'s subset check hold the rest, and both gates default to not deleting."
        status: "stable"
        path: "docs/decisions/storage/the-commit-gate-is-per-item-so-the-graph-proves-less-than-spec-169s-did.md"
      - title: "The data-quality reports folder is declared once per tree, in the app-managed owners"
        fence: "`_data-quality-reports/` is declared once per tree, as `DATA_QUALITY_REPORTS_FOLDER` in the app-managed owners; the writer and every refusal list take it from there, the sweep refuses a new declaration or construction, and the IAM templates still spell the name."
        status: "stable"
        path: "docs/decisions/storage/the-data-quality-reports-folder-is-declared-once-per-tree-in-the-app.md"
      - title: "The expansion caps are sized by memory and makespan, and the obvious models miss both (SPEC-165)"
        fence: "`SEND_MAX_OBJECTS` (20,000) is bounded by the plan held in memory and `SEND_MAX_TOTAL_BYTES` (1 TiB) by makespan at 500 MB/s, not bandwidth, and the timeout bound is per item plus per page; tests compute each cap, so re-derive rather than raise."
        status: "stable"
        path: "docs/decisions/storage/the-expansion-caps-are-sized-by-memory-and-makespan-and-the-obvious.md"
      - title: "The file-ops lock's loser WAITS where the table-builder's is refused (SPEC-187)"
        fence: "The file-ops lock is per space, so its loser waits, stealing a stale lock itself, and refuses by notification at a give-up bound strictly below the machine's `TimeoutSeconds`; a cross-space operation takes two locks in digest-sorted order or neither. The **space root is refused** as an item; the collision unit is the derived destination **key**, and a protected destination is judged there as well as at the prefix, since an item's name can land in a locked folder, and every planned key is judged against the role's any-depth write Deny before the transfer, as the source keys are against its delete Deny; a **403 counts as occupied**; the deletion takes **confirmed plan keys** — a prefix listing orphans an uncopied object."
        status: "stable"
        path: "docs/decisions/storage/the-file-ops-locks-loser-waits-where-the-table-builders-is-refused.md"
      - title: "The file-send exclusion rule is anchored at the space root, not the listing prefix (SPEC-165)"
        fence: "**The analytics exclusion rules anchor at the listing prefix**, which for file-send would be whichever item the user picked, so file-send carries its own predicate anchored at the space root — reusing them silently drops files."
        status: "stable"
        path: "docs/decisions/storage/the-file-send-exclusion-rule-is-anchored-at-the-space-root-not-the.md"
      - title: "The file-send plane is its own, and its front door is bounded by a chain (SPEC-164)"
        fence: "File send is its own control plane, never a mode on table share, and its front door keeps two caps, item count and serialised bytes, with the byte cap measured along the chain through `StartExecution`; do not reintroduce a single cap."
        status: "stable"
        path: "docs/decisions/storage/the-file-send-plane-is-its-own-and-its-front-door-is-bounded-by-a-chain.md"
      - title: "The folder-recursive functions are deleted, not ported, and the flag stops being a fallback (SPEC-198)"
        fence: "**The four folder-recursive browser functions are DELETED, not ported** — that loop belongs on the plane. So `asyncFileOperations` off makes a folder **unavailable** — and any multi-item selection too, since the gate refuses every shape the routing rule sends to the plane — refused **at the control**: Copy, Move and Delete are `aria-disabled` with the reason. The services' **per-item** `PlaneRequired` refusal, which lets the files beside a folder go through, is reachable only past the control: a copy or move whose destination resolves to no known space, or any gesture confirmed after the flag turned off while its dialog was open — the control decides when it renders, `dispatch` when it runs."
        status: "stable"
        path: "docs/decisions/storage/the-folder-recursive-functions-are-deleted-not-ported-and-the-flag.md"
      - title: "The folders moved, and six Deny mirrors did not move with them (SPEC-220)"
        fence: "**A rule that mirrors a SHARED-bucket Deny scans segments, and it must scan for the folder's segments rather than its NAME.** The shared Denies put a wildcard where the space name goes and an S3 resource wildcard matches `/`, so they reach the folder at any depth — which is why these rules exist. Six of them were written as `name in segments`, fed by no builder, and every one silently outlived the move: the Deny became `*/system_settings/archive/*` while they went on refusing `finance/archive/`, a folder that is now the user's. **This class fails SAFE**, which is what let it sit unnoticed behind a green suite — a pair test that only asserts the refusal cannot see it, and only a row expecting `null` at the retired name can. They all read `app_managed_segments` now."
        status: "stable"
        path: "docs/decisions/storage/the-folders-moved-and-six-deny-mirrors-did-not-move-with-them.md"
      - title: "The free-name probe moved to the API, not to the plane (SPEC-198, amends SPEC-187)"
        fence: "**The free-name probe moved to the API, not to the plane** — 999 round trips would be strictly worse than the loop it replaced. `numberedName` lives in Python only, and **exhaustion is now distinguishable from failure** (409 + `attempts`), which it was not."
        status: "stable"
        path: "docs/decisions/storage/the-free-name-probe-moved-to-the-api-not-to-the-plane.md"
      - title: "The source deletion removes only CONFIRMED-COPIED keys, never a prefix listing (SPEC-187, diverging from SPEC-169)"
        fence: "The source deletion removes only confirmed-copied keys, re-read per item from the plan, and never lists the source prefix, because an object written after expansion would be lost unrecoverably; the accepted cost is a visible orphan."
        status: "stable"
        path: "docs/decisions/storage/the-source-deletion-removes-only-confirmed-copied-keys-never-a-prefix.md"
      - title: "The source deletion: what it removes, and what it is conditional on (SPEC-189)"
        fence: "The source deletion works from plan keys, counting an already-gone key as success and a real mismatch as `source_changed`; the HEAD compare stays active until a live probe flips `CONDITIONAL_DELETE_ENABLED`, and only a move's deletes are conditional."
        status: "stable"
        path: "docs/decisions/storage/the-source-deletion-what-it-removes-and-what-it-is-conditional-on.md"
      - title: "The transfer caps are three, and each is measured against a different budget (SPEC-166)"
        fence: "`SEND_MAX_OBJECT_BYTES` (10 GiB) is bounded by the copy verb's timeout, `SEND_MAX_TRANSFER_ITEMS` (50,000) by manifest memory and `SEND_MAX_TRANSFER_BYTES` (3 TiB) by run makespan; `inspect-source` enforces all three, counting requested recipients."
        status: "stable"
        path: "docs/decisions/storage/the-transfer-caps-are-three-and-each-is-measured-against-a-different.md"
