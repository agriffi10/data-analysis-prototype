        fence: "**A notification's optional `link` is gated by `isSafeInAppPath`**, and a route that renders one must not become an existence oracle: the data-quality report view takes its space **from the route, never derived**, and an unreachable space renders denied while issuing **no S3 request at all**."
        status: "stable"
        path: "docs/decisions/control-planes/notifications.md"
