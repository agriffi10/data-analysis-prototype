      - title: "A notice with no dedup id names its run in the payload, so two runs ending alike stay two notices (control-plane-wide)"
        fence: "A notice with no dedup id carries `payload: {\"requestId\": …}` because the queue deduplicates it on its body, and a sweep refuses an `emit_notification` passing neither `dedup_id` nor `payload`; file-send and table-share successes take a token instead."
