      - title: "Every Lambda Task waits out a function waking from Inactive, because the invoke that wakes it is rejected"
        fence: "**Every Lambda Task in the eight machines carries a second retrier for the three errors Invoke raises on a function not ready to run** — `Lambda.ResourceNotReadyException`, `Lambda.ResourceConflictException`, `Lambda.CodeArtifactUserPendingException` — waiting 75 s in all. An image function idle for weeks goes Inactive and Lambda rejects the invoke that wakes it; **Step Functions matches error names exactly**, so the service errors every Task already retried never matched it. **AWS names no exception for the image case**, so all three are retried and the real one is owed a reading. Each is a refusal before any code runs, which is why `Convert` carries it too. **The three ceiling tests that count retries charge the 75 s once per function, read from the ASL**: raise it and file-ops, whose headroom is the tightest, goes red. An earlier retrier naming `States.ALL` or `States.TaskFailed` would shadow it; `test_state_machines_cpcommon.py` judges each name by the retrier that answers it."
        status: "stable"
