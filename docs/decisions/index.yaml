      - title: "Notifications deduplicate per recipient, so a borrowed request id cannot drop someone else's notice (control-plane-wide)"
        fence: "**Notifications deduplicate per RECIPIENT.** Most producers key a notice on `{requestId}:{outcome}`, and a request id is the caller's choice, so the requests queue's `deduplication_scope` is `messageGroup` and every sender's group is the recipient: two notices collapse only when they go to the same person. Deduplicated across the queue, a request borrowing another member's id dropped that member's notice. Per recipient. A notice sent with **no** dedup id is deduplicated on its body, and a generic sentence is the same for two runs, so it **names its run in the payload**; a sweep refuses a send that names none. A dedup id **replaces** the body as the key, so a token per outcome merges two notices one run words differently on purpose — a token names the reason and recipient too. Named run (`a-notice-with-no-dedup-id-names-its-run-in-the-payload-so-two-runs.md`)."
        status: "stable"
        path: "docs/decisions/control-planes/notifications-deduplicate-per-recipient-so-a-borrowed-request-id-cannot.md"
