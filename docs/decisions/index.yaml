      - title: "A report may carry the user's ROWS, and it is bounded by the size it is read through (SPEC-240)"
        fence: "**A durable artefact may carry the user's ROWS; nothing that fans out may.** A data-quality report holds up to five duplicated rows cell by cell — the first figure in this fleet that is the user's data rather than a measurement of it. The notification, the runs-index row and every log line still carry counts and keys only, held by an EQUALITY between two runs of the same report with and without samples, never a substring search for the fixture's values. And **the writer's cap is the only cap, because the reader's is a refusal**: above `apicommon.s3_config.MAX_DOCUMENT_BYTES` the page cannot open the report at all, so every other finding is lost with the part that made it big — assemble-report measures what it is about to write, DROPS the samples, then shortens the per-file lists from their ends, longest first, each counting what it left out, and never truncates a figure or an entry. The re-declared `DQ_REPORT_MAX_BYTES` is held EQUAL to that number, not under it, by a fleet-level test, since the two planes may not import each other. A third cap sits between them and is a different question: `csv`'s 131,072-character field limit, which one samples cell can exceed — raised from what the statement can return, **never below the reader's default**, and restored after the one read."
        status: "stable"
        path: "docs/decisions/control-planes/a-report-may-carry-the-users-rows-and-it-is-bounded-by-the-size-it-is.md"
