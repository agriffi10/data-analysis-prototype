      - title: "Data-quality outcome notifications (SPEC-114)"
        fence: "**A data-quality notification IS the completion channel** and must carry the report link, because the reports folder is hidden. Its runs index is appended under **ETag CAS** — S3 lists lexicographically, so a UUID key gives no chronology."
