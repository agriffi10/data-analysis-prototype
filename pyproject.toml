# Python tooling config for the Lambda suites under `lambdas/`.
# (The repo is an npm monorepo; this file is Python-only — Node tooling ignores it.)
#
# Coverage is wired into pytest's default args, so `pytest lambdas/` prints a
# per-file coverage table + total. Requires pytest-cov (see lambdas/requirements-dev.txt).

[tool.pytest.ini_options]
# Coverage floor for the Lambda fleet. Held at 85 deliberately: the suite is scoped to what a
# handler does, not to every function it reaches, so a higher floor would be met by adding
# tests around internals rather than by testing behaviour. Do not raise it to chase a number.
addopts = "--cov=lambdas --cov-report=term-missing --cov-report=html --cov-fail-under=85"

[tool.coverage.run]
# Report every source file under lambdas/, including ones no test imports (0%),
# so the summary reflects true coverage across all Lambda code.
source = ["lambdas"]
omit = [
    "*/test_*.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

# ── ruff ─────────────────────────────────────────────────────────────────────
# THE RULE SET IS CHOSEN HERE, NOT INHERITED.
#
# Before this block the repo had no ruff config, so it linted on ruff's DEFAULT set —
# and 0.16.0 widened that default from 59 rules to 413 overnight, turning a green main
# red with 500 findings in files nobody had touched (#311). Selecting explicitly means a
# ruff release can still add rules *inside* a family we asked for, but it can no longer
# decide which families we enforce. `lambdas/requirements-dev.txt` bounds the minor as
# the second half of that guarantee.
#
# CI runs `ruff check lambdas/` from the repo root; this file is the project root ruff
# resolves against.

[tool.ruff]
target-version = "py312"  # the Lambda runtime, and the floor of the CI matrix

[tool.ruff.lint]
select = [
    "F",                    # pyflakes — real errors
    "E4", "E7", "E9",       # pycodestyle errors. NOT E5: E501 line-too-long is unenforced
                            # today and turning it on is 430+ reflows, a separate decision.
    "W",                    # pycodestyle warnings
    "I",                    # import sorting
    "B",                    # bugbear
    "UP",                   # pyupgrade — the floor is 3.12, so keep the syntax current
    "SIM", "C4", "PIE", "RET", "FURB", "PERF",
    "RUF",
    "S",                    # bandit — this fleet handles tokens and user data
    "BLE", "TRY",           # exception hygiene
    "LOG", "G",             # logging call shape
    "DTZ",                  # naive datetimes
    "ASYNC", "YTT", "FLY", "INT", "TC", "FA", "PGH", "EXE", "ISC",
]

# Each entry is a decision, not a backlog. Anything merely unfixed belongs in a follow-up
# PR, not here.
ignore = [
    "E402",     # every Lambda module and suite does the sys.path/layer dance before
                # importing; the import position is structural here, not an oversight.
    "TRY003",   # user-facing wording lives at the raise site or in cpcommon.messages;
                # a bespoke exception class per message would add 149 empty names.
    "TRY300",   # "return in else" — reads worse than the early return this code uses.
    "TRY301",   # raise-within-try is how the parse-then-classify blocks are built.
    "TRY400",   # observability.error carries structured fields; logger.exception would
                # trade them for a stack string.
    "SIM105",   # the try/except/pass sites carry a written reason; contextlib.suppress
                # would hide it behind an import.
    "PERF203",  # try/except inside a loop is deliberate — one bad message must never
                # abort the rest of the batch (dlq_drain, log_sweep).
    "PERF401",  # the flagged loops are conditional appends; list.extend is not clearer.
    "S105", "S106", "S107",  # flags token/field NAMES ("idToken", "actor") as passwords.
    "S608",     # dqcommon/sql.py builds Athena DDL deliberately, with its own escaping
                # and identifier validation, which is that module's whole subject.
    "RUF003",   # ambiguous-unicode in COMMENTS: this codebase writes ×, → and — on purpose.
    "B904",     # `raise ... from` inside except. Worth doing, but it changes what lands
                # in error.stack — a store retained forever, with a tripwire test on its
                # contents (SPEC-110). Its own PR, not a side effect of a config change.
]

[tool.ruff.lint.per-file-ignores]
# Asserts ARE the test framework, and a test may reach for stdlib random.
"**/test_*.py" = ["S101", "S311"]
"**/conftest.py" = ["S101"]
"lambdas/shared-space-common/fakes.py" = ["S101"]  # test doubles, imported by suites only

# ── mypy ─────────────────────────────────────────────────────────────────────
# BLOCKING over the five shared layers — notch 2 of the ratchet SPEC-153 FR-009 started.
#
# `ci.yml` ran ruff and pytest and no type checker, for a fleet whose contract with the SPA
# is JSON envelope shapes crossing a Step Functions state payload. This starts where a
# signature change fans out — the five shared layers — rather than over 40+ verb packages.
#
# THE RULE SET IS CHOSEN HERE, NOT INHERITED, for the reason the ruff block above states at
# length: mypy's defaults move between releases, and a checker that silently widens what it
# enforces turns a green main red in files nobody touched. Every flag below is named even
# where it matches today's default, so a release changing a default is a no-op here.
# `lambdas/requirements-dev.txt` bounds the minor as the second half of that guarantee.
#
# THE RATCHET PATH, in order: (1) report-only over the shared layers — DONE, SPEC-153, at a
# 21-finding baseline, 19 by the time notch 2 measured it; (2) clear the baseline to zero and
# flip the CI step to blocking — DONE, and `scope` below is what is now held at zero;
# (3) widen `files` to the verb packages, report-only again; (4) `disallow_untyped_defs` on
# `cpcommon` alone. Each notch is its own PR with its own number to beat, exactly as the
# coverage floors are (SPEC-150 FR-002).
#
# NOTCH 2 FIXED TYPES, NOT BEHAVIOUR. Every finding was closed with an annotation, a `cast`
# at a genuinely dynamic boundary (`json.loads`, a boto3 response, a JWT claim), or a
# narrowing rewrite that computes the same answer — no control flow moved, and the suite is
# unchanged. A `cast` here is a claim about a boundary mypy cannot see, so it stays honest
# only while the boundary does: if one starts lying, fix the call site rather than widening
# the declared return type to match it.
[tool.mypy]
python_version = "3.12"

# The layer roots, so `from cpcommon import …` and shared-space-common's FLAT modules
# resolve the way conftest.py makes them resolve under pytest.
mypy_path = "lambdas/control-plane-common:lambdas/table-builder-common:lambdas/table-share-common:lambdas/data-quality-common:lambdas/shared-space-common:lambdas/file-send-common:lambdas/archive-common:lambdas/file-ops-common"

files = [
    ".github/scripts/lambda_plan_guard.py",
    "lambdas/control-plane-common/cpcommon",
    "lambdas/table-builder-common/tbcommon",
    "lambdas/table-share-common/tscommon",
    "lambdas/data-quality-common/dqcommon",
    "lambdas/shared-space-common",
    # SPEC-164. A new shared layer joins the ratchet WITH the spec that creates it: added
    # later it is a baseline of existing errors to argue about, added now it is free — this
    # one entered at zero. The digest line in CLAUDE.md says mypy blocks over the shared
    # layers, and a layer missing from this list would quietly make that untrue.
    "lambdas/file-send-common/fscommon",
    # SPEC-168, on SPEC-164's precedent and for its reason: a new shared layer joins the
    # ratchet WITH the spec that creates it. Added later it is a baseline of existing errors
    # to argue about; added now it is free, and this one entered at zero too.
    "lambdas/archive-common/arcommon",
    # A new shared layer joins the ratchet WITH the spec that creates it, on the precedent
    # above and for its reason: added later it is a baseline of existing errors to argue about;
    # added now it is free, and this one entered at zero too.
    "lambdas/file-ops-common/focommon",
    # Not a layer, and here for the same reason the layers are: it joins the ratchet WITH
    # the change that creates it, where it enters at zero. This one module decides which
    # Lambdas a push deploys, so it is the last place in the fleet that should be the one
    # the type checker cannot see.
    ".github/scripts/plan_deploy.py",
    # The single definition of the container image's layout, imported by both layout test
    # modules and run by the build. It joins the ratchet WITH the change that creates it, on the
    # precedent above and for its reason: it decides what a function can import, so it is the
    # last place in the fleet that should be invisible to the type checker. It entered at one
    # error — a `list[Path]` returned where `list[PurePath]` was declared — which was free to fix
    # now and an argument later.
    "lambdas/docker/assemble.py",
    ".github/scripts/lambda-image-sweep.py",
    # New code with no legacy to ratchet through, so it joins the BLOCKING list rather than
    # the report-only one — and it enters at zero, which is only free while it is new.
    "lambdas/api",
    # The generator joins the ratchet with the change that creates it, entering at zero on
    # the precedent above. It is the one module whose failure mode is a silent fallback
    # type, so it is the last place that should be invisible to the type checker.
    "scripts/generate_api_contract.py",
    # Joins on the same precedent, entering at zero. It decides whether a green is real, so
    # a wrong Optional or a widened dict here reports a pass nobody checked.
    "scripts/watch_ci.py",
    # The Terraform reader every infrastructure suite asserts through. It joins the ratchet with
    # the change that extends it, on the precedent above and for its reason: its failure mode is
    # a scanner that returns a SMALLER slice, which leaves every assertion over it green while
    # the guard has stopped covering the half it could not see. It entered at one error — a
    # tuple return annotated one element too narrow — free to fix now and an argument later.
    "lambdas/tf_blocks.py",
]
# The suites and the test doubles are not shipped and are not the contract.
exclude = '(/test_[^/]*\.py|/conftest\.py|/fakes\.py)$'

# Explicitly stated, defaults included.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_no_return = true
warn_unreachable = false        # the defensive `raise` after an exhaustive branch is a
                                # deliberate idiom here, not dead code.
no_implicit_optional = true
strict_equality = true
check_untyped_defs = false      # notch 4's job. Turning it on now would report on every
                                # unannotated verb helper at once and drown the baseline.
disallow_untyped_defs = false
ignore_missing_imports = false  # missing stubs are declared per-module below, never blanket.

# Third-party imports with no bundled stubs. Named individually so a NEW untyped dependency
# shows up as an error instead of being absorbed by a blanket ignore.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.config", "log_foundry", "log_foundry.*", "polars", "jwt", "jwt.*"]
ignore_missing_imports = true
