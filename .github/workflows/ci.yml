name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/portal
        run: npm run lint

      - name: Format check (prettier)
        working-directory: apps/portal
        run: npm run format:check

      - name: Test
        working-directory: apps/portal
        run: npm run test

      - name: Build
        working-directory: apps/portal
        run: npm run build

  lambdas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint + test tools
        run: pip install -r lambdas/requirements.txt "ruff>=0.6" "pytest>=8"

      - name: Lint (ruff)
        run: ruff check lambdas/

      - name: Test (pytest)
        run: pytest lambdas/
