name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/portal
        run: npm run lint

      - name: Test
        working-directory: apps/portal
        run: npm run test

      - name: Build
        working-directory: apps/portal
        run: npm run build
