name: CI

# Checks run on PRs only. main never tests or lints — it builds and deploys
# (deploy-app / deploy-lambdas / deploy-infra).
#
# The Build step below is the TYPECHECK gate, and it is here because relying on a
# local run did not hold: SPEC-145 added a member to a shared prop type, missed one
# test file's builder, passed every PR check, and broke main's Deploy App (#362).
# Two things made that invisible — vitest does not typecheck, and
# `tsc --noEmit -p apps/portal/tsconfig.json` exits 0 having checked NOTHING (that
# config is solution-style: project references only, no files/include). `tsc -b`,
# which `npm run build` runs, is the only invocation that covers the app AND its
# *.test.tsx files.
on:
  pull_request:
    branches: [main]

# A new push to a PR branch makes the run already in flight worthless — its result is
# about a commit nobody will merge. Without this, every superseded run went to
# completion and was billed in full: measured over 28 days, 91 of 289 CI runs were
# followed by another push to the same branch, and 9 of those were still executing when
# it landed. `security.yml` has had this since it shipped; `ci.yml` never got it.
#
# Safe here in a way it would NOT be in the deploy workflows: this workflow only runs
# tests, lint and a build. Cancelling a `tofu apply` or an `update-function-code`
# mid-flight is how you get a half-applied deploy, which is why deploy-app.yml sets
# `cancel-in-progress: false` rather than true.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Both jobs run in 4-6 minutes; 12 bounds a hung run well clear of that without
    # tripping on a slow runner. Without it a hang would sit against GitHub's 6h
    # default — the same gap the deploy workflows closed in #314.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The scope step below diffs against the pull request's base, and the default
          # shallow clone does not contain it. Three seconds, the same price the lambdas
          # job already pays for its own guard.
          fetch-depth: 0

      # WHAT THIS JOB CAN POSSIBLY LEARN. Every step after it is scoped to this answer, so a
      # pull request touching none of the app's inputs costs one billed minute instead of
      # seven — the Test step alone is 294 of this job's 366 seconds.
      #
      # Replayed against the last 60 merges to main: 30 skip, 30 run, so the average pull
      # request costs 4 minutes instead of 7. It is NOT the 73% that counting `apps/portal/`
      # alone suggests — the suite's out-of-tree reads below, the IAM templates especially,
      # buy a third of the saving back. That is the honest number and the cheaper one was
      # wrong rather than optimistic.
      #
      # The job still RUNS and still reports under the same check name — this is a step-level
      # skip, not a workflow-level `paths:` filter, precisely so that a required check by that
      # name can never sit pending forever.
      #
      # It fails in the EXPENSIVE direction on purpose. An unreachable base sets `app=true`
      # and runs everything, and a `git diff` that cannot be computed fails the job outright
      # rather than reporting an empty change set — a cheap green that tested nothing is
      # indistinguishable from a real one, which is the whole failure mode being avoided.
      - name: Work out whether this pull request can change the app
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # EVERY input this job's steps read — which is NOT the same as "the app's source".
          # The first four lines are the build; the rest are files OUTSIDE apps/portal that
          # the suite itself reads, through `?raw` and `import.meta.glob`, to assert the
          # browser agrees with the infrastructure and the planes. Leaving them out is not a
          # smaller saving, it is a silent one: a change to `arcommon/config.py` or to
          # `infra/main.tf` breaks a real set-equality guard and the job reports green. Both
          # were reproduced by planting the change and watching the suite redden while this
          # step said `app=false`, and both appear in the last two merges to main.
          #
          # `lambdas/test_ci_scope.py` sweeps the suite for out-of-tree reads and fails if
          # one is not covered here, so the list cannot drift as a ninth import is added.
          SCOPE_PATTERNS: |
            ^apps/portal/
            ^packages/
            ^package\.json$
            ^package-lock\.json$
            ^\.nvmrc$
            ^\.github/workflows/ci\.yml$
            ^\.github/workflows/deploy-app\.yml$
            ^config/feature-flags\.json$
            ^infra/main\.tf$
            ^infra/modules/[^/]+/policies/[^/]+\.json\.tftpl$
            ^lambdas/api/routes/feature_flags\.py$
            ^lambdas/archive-common/arcommon/config\.py$
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=Scope::base commit ${BASE} is unreachable; running every step"
            echo 'app=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assigned rather than piped straight into grep: `git diff` failing must kill the
          # job, and inside an `if` condition its exit status is swallowed — which would read
          # a broken diff as "nothing changed" and skip the suite.
          #
          # --no-renames because `--name-only` reports only a rename's DESTINATION. Moving a
          # file out of apps/portal would otherwise show up as the destination alone, answer
          # `app=false`, and break `tsc -b` on main with a green PR.
          CHANGED=$(git diff --name-only --no-renames "$BASE" HEAD)

          # A here-string, NOT `printf ... | grep -q`. Under `pipefail` grep exits at the
          # first match, printf takes SIGPIPE, and the pipeline reports 141 — so the `if`
          # takes the else branch and answers `app=false` for a pull request that DID touch
          # the app. It inverts once the change set passes the 64 KiB pipe buffer: measured
          # correct at 45 KB and inverted at 75 KB, in the cheap direction, silently.
          if grep -qE -f <(printf '%s' "$SCOPE_PATTERNS") <<<"$CHANGED"; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Scope::no app input changed; lint, build and the suite are skipped"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        if: steps.scope.outputs.app == 'true'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run lint

      - name: Format check (prettier)
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run format:check

      # Runs the SAME command deploy-app.yml does, so a green PR means that build
      # will compile. Deliberately BEFORE the test step: a type error surfaces in
      # under a minute instead of behind a ~5-minute suite. No VITE_* env is passed
      # — every one of them is a runtime value baked into the bundle, and this job
      # discards the bundle. What is being gated is `tsc -b`.
      - name: Build (typecheck + bundle)
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run build

      # The build's own assertion, and it can only run against a built bundle — so it
      # rides here rather than in the suite, where a missing dist/ would have to be a
      # skip, and a skip reads as a pass. It proves the dev fallback was eliminated;
      # the call sites are guarded by a `?raw` sweep inside the suite.
      - name: Assert the production bundle carries no VITE_ names
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run check:bundle

      - name: Test
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run test:coverage

  lambdas:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for one reason: the portal-role preservation guard compares the
          # permission templates against their pre-change blob with `git show`, and the
          # default shallow clone has no such blob. The guard FAILS rather than skips when
          # the blob is unreachable, so a shallow checkout would redden here rather than
          # quietly passing -- but it would redden for the wrong reason.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Every requirements file the install step below reads, named explicitly. The
          # default key is the ROOT requirements.txt alone, which this repository does not
          # have — a cache keyed on a file that does not exist restores nothing and reports
          # success, which is the failure mode that looks like a working cache.
          #
          # This buys wall-clock and one less network dependency on the critical path; it
          # does NOT move this job under the per-job billing minute (measured median 71 s,
          # of which the install is 12 and pytest is 37).
          cache: 'pip'
          cache-dependency-path: |
            lambdas/requirements.txt
            lambdas/requirements-dev.txt
            lambdas/control-plane-common/requirements.txt
            lambdas/table-builder-infer-schema/requirements.txt
            lambdas/data-quality-polars/requirements.txt

      # This job already owns the repo's Terraform suite — test_api_module, test_network_module,
      # test_spa_module and test_csp_policy all read infra/ as text. One of them now RUNS tofu
      # instead of reading it, because a variable's validation block can be asserted present
      # while its condition has been weakened to something that accepts anything, and only
      # evaluating it can tell those apart. The module under test declares no provider, so the
      # init is offline and needs no credentials.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          # The same constraint Deploy Infrastructure resolves, so the validations are
          # evaluated by the OpenTofu that will actually apply them.
          tofu_version: '~1.8'
          # The real binary, not the action's default Node wrapper. The wrapper exists to
          # capture stdout for step outputs and needs the full runner environment; the test
          # invokes tofu from Python with a deliberately minimal one, so that an outer
          # TF_VAR_* cannot contaminate what it is measuring. Under the wrapper `tofu init`
          # exits 1 before doing anything.
          tofu_wrapper: false

      - name: Install lint + test tools
        # control-plane-common/requirements.txt is installed so cpcommon's own layer
        # dependencies are importable under test — log-foundry (SPEC-127) is declared only
        # there, and cpcommon.observability imports it at module scope. Packaging already
        # reads that file in deploy-lambdas.yml's layer job; this is the test side of the
        # same declaration, so the two can't drift.
        #
        # polars (from the two polars layer requirements) so the table-builder
        # type-mapping + infer-schema tests (SPEC-069) and the data-quality
        # inspect-source probe tests (SPEC-110) run for real in CI rather than being
        # skipped. Both files pin the SAME polars version deliberately, so the second
        # install is a no-op — it is listed because the DQ tests genuinely depend on it,
        # and a future version split must surface here rather than silently resolving to
        # whichever was installed last.
        run: |
          pip install -r lambdas/requirements.txt -r lambdas/requirements-dev.txt
          pip install -r lambdas/control-plane-common/requirements.txt
          pip install -r lambdas/table-builder-infer-schema/requirements.txt
          pip install -r lambdas/data-quality-polars/requirements.txt

      - name: Lint (ruff)
        # `scripts/` joins the scan because SPEC-162 put a Python module there
        # (validate_feature_flags.py). Nothing else in that directory is Python today.
        run: ruff check lambdas/ scripts/ .github/scripts/

      # GATE ONE on the two-language contract. The wire is declared once in Python and the
      # TypeScript is emitted from it, so this catches drift in BOTH directions: a Python type
      # edited without regenerating, and the generated TypeScript edited by hand. Gate two is
      # `npm run build` in the app job, where a changed type fails at every call site.
      #
      # `--exit-code` on the generated file alone, not on the tree: a job that diffed everything
      # would also fail for an unrelated dirty file and teach a reader to ignore it.
      - name: Regenerate the API contract and refuse a diff
        run: |
          python3 scripts/generate_api_contract.py
          git diff --exit-code -- apps/portal/src/types/apiContract.generated.ts

      # The documentation layout is a gate because prose was not one. Every rule the script
      # holds already existed in CLAUDE.md or docs/process.md, and every one was violated
      # anyway: `## Specs` regrew to 371 lines of changelog against its own "prune, never
      # append"; the Key Decisions digest grew a 3,349-character entry against "one line
      # each"; docs/testing/ reached sixteen files; decisions/ listed 50 of 149 entries.
      # The budgets are ratchets at the measured level, like the coverage floors (SPEC-150) —
      # raising one to make this step pass is the failure mode it exists to catch.
      - name: Validate the documentation layout
        run: python3 scripts/validate_docs.py

      # A malformed feature-flag document must never reach a bucket, and the failure it
      # produces is silent — the browser falls back to all-on, which is indistinguishable
      # from a healthy environment. This is the first of the document's two validations;
      # deploy-config.yml runs the same check again immediately before the upload.
      - name: Validate the feature-flag document
        run: python3 scripts/validate_feature_flags.py

      # BLOCKING as of notch 2. It was report-only under SPEC-153 FR-009, whose baseline was
      # 21; SPEC-156 took it to 17 and SPEC-157's table_lock put it back to 19, which is what
      # notch 2 measured and cleared. The baseline is zero, so `continue-on-error` is gone —
      # a type error in
      # the shared layers now fails the build, which is the whole point of a ratchet — the
      # cleared number is only worth clearing if nothing can put findings back. Scope is
      # still the five shared layers; widening it to the verb packages is notch 3, and lands
      # report-only again. Config and the full ratchet path live in pyproject.toml's
      # [tool.mypy] block.
      - name: Typecheck (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest lambdas/
