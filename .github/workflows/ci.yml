name: CI

# Checks run on PRs only. main never tests or lints — it builds and deploys
# (deploy-spa-image / deploy-lambdas / deploy-infra / deploy-config).
#
# The Build step below is the TYPECHECK gate, and it is here because relying on a
# local run did not hold: SPEC-145 added a member to a shared prop type, missed one
# test file's builder, passed every PR check, and broke main's Deploy App (#362).
# Two things made that invisible — vitest does not typecheck, and
# `tsc --noEmit -p apps/portal/tsconfig.json` exits 0 having checked NOTHING (that
# config is solution-style: project references only, no files/include). `tsc -b`,
# which `npm run build` runs, is the only invocation that covers the app AND its
# *.test.tsx files.
#
# WHAT IS DISABLED, AND THE RESTORE RULE
#
# SIX steps are commented out to save Actions minutes. They run LOCALLY instead, on every
# pull request, after the diff reviews and immediately before the push -- docs/process/session-rhythm.md.
#
#   this job:     Lint (eslint) · Format check (prettier) · Test (vitest coverage)
#   lambdas job:  Lint (ruff) · Typecheck (mypy) · Test (pytest)
#
# Restore them TOGETHER or not at all: a half-restored gate reads as a full one, and the
# whole point of listing all six in one place is that no reader has to reconstruct the set.
#
# What this costs, stated rather than left to be discovered. A green check on this workflow
# is NO evidence that lint, the suites or either typecheck ran -- only that the app builds,
# carries no VITE_ names, and that the contract, docs and feature-flag documents are valid.
# The eslint pass carried two things nothing else covers: the `@aws-sdk/*` import ban, and
# `eslint-plugin-security` + `no-unsanitized`, which `security.yml` and `eslint.config.js`
# both described as the blocking half of SPEC-138. Those are now enforced by the pre-push
# run alone, so a session that skips it puts an injection sink on main behind a green PR.
on:
  pull_request:
    branches: [main]

# A new push to a PR branch makes the run already in flight worthless — its result is
# about a commit nobody will merge. Without this, every superseded run went to
# completion and was billed in full: measured over 28 days, 91 of 289 CI runs were
# followed by another push to the same branch, and 9 of those were still executing when
# it landed. `security.yml` has had this since it shipped; `ci.yml` never got it.
#
# Safe here in a way it would NOT be in the deploy workflows: this workflow only runs
# a build and a handful of cheap checks. Cancelling a `tofu apply` or an `update-function-code`
# mid-flight is how you get a half-applied deploy, which is why every deploy workflow sets
# `cancel-in-progress: false` rather than true.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Both jobs run in 4-6 minutes; 12 bounds a hung run well clear of that without
    # tripping on a slow runner. Without it a hang would sit against GitHub's 6h
    # default — the same gap the deploy workflows closed in #314.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The scope step below diffs against the pull request's base, and the default
          # shallow clone does not contain it. Three seconds, the same price the lambdas
          # job already pays for its own guard.
          fetch-depth: 0

      # WHAT THIS JOB CAN POSSIBLY LEARN. Every step after it is scoped to this answer, so a
      # pull request touching none of the app's inputs skips the install, the build and the
      # bundle check.
      #
      # Every number this step was sized against — one billed minute instead of seven, 29 of the
      # last 60 merges skipping, the Test step alone 294 of the job's 366 seconds — was measured
      # while Lint and Test were still IN this job. The disabled block below removed exactly the
      # expensive ones, so those figures are historical: re-measure before citing any of them,
      # and do not read the old saving as this step's current value.
      #
      # What the change does NOT touch is the SHAPE, which is the part worth keeping: the pattern
      # list is every input the remaining steps read, and that is not the same as "the app's
      # source" — the out-of-tree reads below, the IAM policy templates especially, are how a real
      # set-equality guard reports green on a change that breaks it.
      #
      # The job still RUNS and still reports under the same check name — this is a step-level
      # skip, not a workflow-level `paths:` filter, precisely so that a required check by that
      # name can never sit pending forever.
      #
      # It fails in the EXPENSIVE direction on purpose. An unreachable base sets `app=true`
      # and runs everything; a `git diff` that cannot be computed, and a pattern list `grep`
      # cannot compile, each fail the job outright rather than reporting an empty change set —
      # a cheap green that tested nothing is indistinguishable from a real one, which is the
      # whole failure mode being avoided.
      - name: Work out whether this pull request can change the app
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # EVERY input this job's steps read — which is NOT the same as "the app's source".
          # The first four lines are the build; the rest are files OUTSIDE apps/portal that
          # the suite itself reads, through `?raw` and `import.meta.glob`, to assert the
          # browser agrees with the infrastructure and the planes. Leaving them out is not a
          # smaller saving, it is a silent one: a change to `arcommon/config.py` or to
          # `infra/main.tf` breaks a real set-equality guard and the job reports green. Both
          # were reproduced by planting the change and watching the suite redden while this
          # step said `app=false`, and both appear in the last two merges to main.
          #
          # `lambdas/test_ci_scope.py` sweeps the suite for out-of-tree reads and fails if
          # one is not covered here, so the list cannot drift as a ninth import is added — but
          # that test now runs ONLY in a session's local pytest, never on a pull request, so a
          # drifting list is caught by the pre-push discipline or not at all.
          SCOPE_PATTERNS: |
            ^apps/portal/
            ^packages/
            ^package\.json$
            ^package-lock\.json$
            ^\.nvmrc$
            ^\.github/workflows/ci\.yml$
            ^config/feature-flags\.json$
            ^infra/main\.tf$
            ^infra/modules/[^/]+/policies/[^/]+\.json\.tftpl$
            ^infra/planes/[^/]+/[^/]+\.json\.tftpl$
            ^lambdas/api/routes/feature_flags\.py$
            ^lambdas/archive-common/arcommon/config\.py$
            ^lambdas/archive-common/archive_name_corpus\.json$
            ^lambdas/file-ops-common/focommon/config\.py$
            ^lambdas/control-plane-common/cpcommon/app_managed\.py$
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice title=Scope::base commit ${BASE} is unreachable; running every step"
            echo 'app=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assigned rather than piped straight into grep: `git diff` failing must kill the
          # job, and inside an `if` condition its exit status is swallowed — which would read
          # a broken diff as "nothing changed" and skip the suite.
          #
          # --no-renames because `--name-only` reports only a rename's DESTINATION. Moving a
          # file out of apps/portal would otherwise show up as the destination alone, answer
          # `app=false`, and break `tsc -b` on main with a green PR.
          #
          # `-z` because `--name-only` C-QUOTES a path that is not plain ASCII — wrapping it in
          # double quotes and escaping the bytes, so `"apps/portal/src/caf\303\251.tsx"` matches
          # no anchored pattern and a pull request that genuinely changes the app answers
          # `app=false`. `core.quotePath=false` fixes that for high bytes ALONE and leaves `"`,
          # `\` and control characters still quoted; `-z` emits every path raw, which closes the
          # class rather than one member of it. A newline inside a filename then splits one path
          # into two and both halves are tested, which for the PREFIX anchors over-selects in the
          # expensive direction — but not for the fully anchored IAM-template pattern, where
          # neither half matches and the path is lost in the cheap one. Measured, and left alone:
          # closing it means abandoning line-oriented matching for a filename nobody writes.
          CHANGED=$(git diff -z --name-only --no-renames "$BASE" HEAD | tr '\0' '\n')

          # THE CANARY, AND WHY IT IS A CANARY RATHER THAN A LIST OF FAILURE MODES.
          #
          # Every way this pattern list can stop working reads as `app=false` — "nothing
          # changed" — which skips the install, the build and the bundle check while printing
          # the same reassuring notice a genuine skip prints. Self-concealing, too:
          # `^\.github/workflows/ci\.yml$` is itself in the list, so the pull request that
          # breaks it skips its OWN build, merges green, and every later one skips as well.
          #
          # Enumerating those ways does not work, and that was learned by trying. Checking only
          # for grep exit >= 1 catches an unbalanced bracket and nothing else: GNU grep answers
          # a non-capturing group, a lookaround and a stray `\d` with exit ONE — an ordinary
          # "no match" — and two of those it does not even diagnose. An empty list is a third.
          # So the check is a POSITIVE CONTROL instead: a path the list must always select is
          # run through the very same invocation, and anything but a match stops the job. That
          # covers a list that is empty, uncompilable, silently reinterpreted, or edited until
          # it no longer selects the app — including ways nobody has thought of, which is the
          # point of a control over an enumeration. Measured against both engines this repo
          # meets: GNU grep 3.11 (the runner) is caught on all five, BSD grep 2.6 (a session's
          # own machine) on four, the exception being a non-capturing group it happens to match.
          #
          # It is deliberately coupled to `^apps/portal/`. That pattern going away is not a
          # refactor this job should survive quietly.
          canary='apps/portal/src/App.tsx'
          set +e
          grep -qE -f <(printf '%s' "$SCOPE_PATTERNS") <<<"$canary"
          canary_status=$?
          set -e
          if [ "$canary_status" -ne 0 ]; then
            echo "::error title=Scope::the pattern list no longer selects [$canary] (grep exited $canary_status). It is empty, unusable, or has stopped covering the app — this run cannot decide what to skip and will not guess."
            exit 1
          fi

          # The status is still read rather than tested inside an `if`, because grep answers
          # three ways and only two of them are answers: 0 matched, 1 did not, anything above
          # that is grep failing to perform the test at all. The canary above already refuses
          # the lists that produce the third, so this is the narrower diagnostic rather than
          # the guard — it says which of the two the run got.
          #
          # A here-string, NOT `printf ... | grep -q`. Under `pipefail` grep exits at the
          # first match, printf takes SIGPIPE, and the pipeline reports 141 — which would now
          # be read as grep failing rather than as a match. It inverts once the change set
          # passes the 64 KiB pipe buffer: measured correct at 45 KB and inverted at 75 KB, in
          # the cheap direction, silently.
          set +e
          grep -qE -f <(printf '%s' "$SCOPE_PATTERNS") <<<"$CHANGED"
          matched=$?
          set -e
          if [ "$matched" -gt 1 ]; then
            echo "::error title=Scope::grep exited $matched testing the change set, having matched the canary — so this is the change set it could not read, not the pattern list. This run cannot decide what to skip and will not guess."
            exit 1
          fi

          if [ "$matched" -eq 0 ]; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Scope::no app input changed; install, build and the bundle check are skipped"
            # The verdict with the evidence under it. A wrong `app=false` is the failure this
            # step keeps having, and without the change set in the log there is nothing to
            # diagnose one from — the notice alone cannot distinguish an honest skip from a
            # pattern list that has stopped covering an input.
            echo "The change set this verdict was taken over:"
            printf '%s\n' "$CHANGED"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        if: steps.scope.outputs.app == 'true'
        run: npm ci

      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # - name: Lint
      #   if: steps.scope.outputs.app == 'true'
      #   working-directory: apps/portal
      #   run: npm run lint

      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # - name: Format check (prettier)
      #   if: steps.scope.outputs.app == 'true'
      #   working-directory: apps/portal
      #   run: npm run format:check

      # Runs the SAME command the SPA image's Dockerfile does, so a green PR means the
      # image will build. It sat before the test step so a type error surfaced in under a
      # minute rather than behind a ~5-minute suite; that suite is disabled now, so the
      # ordering buys nothing and this is simply the first real step. No VITE_* env is passed
      # — every one of them is a runtime value the container serves from /config.json,
      # and this job discards the bundle. What is being gated is `tsc -b`.
      - name: Build (typecheck + bundle)
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run build

      # The build's own assertion, and it can only run against a built bundle — so it
      # rides here rather than in the suite, where a missing dist/ would have to be a
      # skip, and a skip reads as a pass. It proves the dev fallback was eliminated;
      # the call sites are guarded by a `?raw` sweep inside the suite.
      - name: Assert the production bundle carries no VITE_ names
        if: steps.scope.outputs.app == 'true'
        working-directory: apps/portal
        run: npm run check:bundle

      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # - name: Test
      #   if: steps.scope.outputs.app == 'true'
      #   working-directory: apps/portal
      #   run: npm run test:coverage

  lambdas:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for one reason: the portal-role preservation guard compares the
          # permission templates against their pre-change blob with `git show`, and the
          # default shallow clone has no such blob. The guard FAILS rather than skips when
          # the blob is unreachable, so a shallow checkout would redden here rather than
          # quietly passing -- but it would redden for the wrong reason.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # NO pip cache, because there is no pip install to cache. It keyed five requirements
          # files for the install step below, which is disabled with the suites it fed. A cache
          # keyed on files nothing reads restores nothing and reports success -- the failure
          # mode that looks like a working cache. Restore it WITH that step, not before.

      # SET UP OPENTOFU AND INSTALL LINT + TEST TOOLS BOTH LIVED HERE, AND BOTH ARE GONE.
      #
      # OpenTofu was here for the Terraform suite (test_api_module, test_network_module,
      # test_spa_module, test_csp_policy), one of which RUNS tofu rather than reading infra/ as
      # text -- a variable's validation block can be asserted present while its condition has
      # been weakened to accept anything, and only evaluating it tells those apart. The install
      # was here for pytest: cpcommon's layer dependencies, and polars twice for the
      # table-builder type-mapping and data-quality probe tests. Every one of those is a pytest
      # test, and pytest is disabled.
      #
      # What is left in this job reads NO third-party package at all -- the five validators are
      # stdlib plus local imports, proven by running each under `python3 -S`, which excludes
      # site-packages (positive control: `python3 -S -c "import boto3"` raises). So the job is
      # now HERMETIC, and that is the point rather than the seconds: with no pip install and no
      # tofu download it has no supply-chain surface and no network dependency, so a yanked
      # wheel or a registry outage cannot redden it.
      #
      # The PR-queue corpus is hermetic in the Python sense and needs `git`, `sh`, `bash` and `jq`
      # besides, which are on the runner rather than installed here. That is a weaker claim than
      # the other three make, so it is stated rather than folded in; the documentation validator
      # needs `awk` and `sh` the same way, for the frontmatter reader and the index generator.
      #
      # RESTORING THE SIX DISABLED STEPS MEANS RESTORING THESE TWO AS WELL. `Lint (ruff)`,
      # `Typecheck (mypy)` and `Test (pytest)` all need the install; the Terraform tests inside
      # pytest need tofu. Bringing back the steps alone gives a job that fails at the first
      # import, which is the half-restore the header's restore-together rule is about.

      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # - name: Lint (ruff)
      #   # `scripts/` joins the scan because SPEC-162 put a Python module there
      #   # (validate_feature_flags.py). Nothing else in that directory is Python today.
      #   run: ruff check lambdas/ scripts/ .github/scripts/

      # GATE ONE on the two-language contract. The wire is declared once in Python and the
      # TypeScript is emitted from it, so this catches drift in BOTH directions: a Python type
      # edited without regenerating, and the generated TypeScript edited by hand. Gate two is
      # `npm run build` in the app job, where a changed type fails at every call site.
      #
      # `--exit-code` on the generated file alone, not on the tree: a job that diffed everything
      # would also fail for an unrelated dirty file and teach a reader to ignore it.
      - name: Regenerate the API contract and refuse a diff
        run: |
          python3 scripts/generate_api_contract.py
          git diff --exit-code -- apps/portal/src/types/apiContract.generated.ts

      # The documentation layout is a gate because prose was not one. Every rule the script
      # holds already existed in CLAUDE.md or docs/process/, and every one was violated
      # anyway: `## Specs` regrew to 371 lines of changelog against its own "prune, never
      # append"; the Key Decisions digest grew a 3,349-character entry against "one line
      # each"; docs/testing/ reached sixteen files; decisions/ listed 50 of 149 entries.
      # The budgets are ratchets at the measured level, like the coverage floors (SPEC-150) —
      # raising one to make this step pass is the failure mode it exists to catch.
      - name: Validate the documentation layout
        run: python3 scripts/validate_docs.py

      # The corpus proves the validator's checks still FIRE. Running the validator against this
      # repo's own docs proves the docs pass and nothing about whether any check works, and a
      # gate whose checks have gone quiet looks exactly like a healthy repo. Ordered after the
      # validator deliberately: if both fail, the real breakage is the more useful message.
      - name: Prove the doc validator's checks still fire
        run: python3 scripts/validate_docs_test.py

      # The PR queue's pre-push hook is the gate that decides whether a branch reaches the
      # remote, and it is deployed OUTSIDE the repo -- so nothing else here executes it. Every
      # way it fails is silent: a pattern that stops matching, a check that stops firing, a
      # fail-open that swallows a refusal. It shipped enforcing five spec prefixes, those specs
      # closed, and it then allowed every push while still looking installed. It refuses two
      # things -- a push without the lock, and a push whose commits do not contain the remote's
      # current main -- and the second reads the remote, so the fixture is a real checkout with
      # a real bare origin whose trunk each case moves.
      #
      # This runs the real `install.sh` into a throwaway checkout and drives the wrapper it
      # writes, in both directions, then breaks each of the hook's checks in turn -- every plant
      # naming the cases it must break -- to prove no fixture is vacuous. It cannot cover one
      # thing: CI is GNU grep, sed and awk, and the hook only ever runs on a developer's machine.
      # The queue's main-green check is corpused here too, through a fake `gh` that runs the
      # queue's real `--jq` with the runner's `jq` -- which is why that tool is named above.
      - name: Prove the PR queue's pre-push hook still refuses
        run: python3 scripts/pr-queue/pre_push_test.py

      # The same hook, driven through REAL `git push` invocations rather than a fabricated stdin
      # -- the hook's contract is git's stdin format and the installer's wrapper, and a corpus
      # that hand-feeds both keeps passing after either breaks. Its sweep plants each check too.
      # Then the installer's own corpus: the pattern states, the held-lock and foreign-hook
      # refusals, and the trunk asked of the remote. Both build throwaway repos under $TMPDIR.
      - name: Prove the hook refuses real pushes, and the installer its misconfigurations
        run: |
          sh scripts/pr-queue-test.sh
          sh scripts/pr-queue/install-test.sh

      # A malformed feature-flag document must never reach a bucket, and the failure it
      # produces is silent — the browser falls back to all-on, which is indistinguishable
      # from a healthy environment. This is the first of the document's two validations;
      # deploy-config.yml runs the same check again immediately before the upload.
      - name: Validate the feature-flag document
        run: python3 scripts/validate_feature_flags.py

      # Three app-managed folders are about to move under a real `system_settings/` prefix, and
      # the failure that move invites is silent: a rule anchored at depth one stops matching at
      # depth two and refuses nobody. The names are declared once per tree and every anchored
      # construction goes through one builder; this refuses a new literal or a hand-built prefix
      # anywhere else. Unconditional, like the validators above it: a `steps.scope` condition in
      # this job would read an output that does not exist and skip the step on every run.
      - name: Refuse an app-managed path declared or built outside its owner
        run: python3 scripts/validate_app_managed_paths.py

      # The corpus proves each of the sweep's rules still FIRES, and that the two steps above are
      # wired unconditionally. Running the sweep against this tree proves the tree is clean and
      # nothing about whether any rule works.
      - name: Prove the app-managed path sweep still refuses
        run: python3 scripts/validate_app_managed_paths_test.py

      # BLOCKING as of notch 2. It was report-only under SPEC-153 FR-009, whose baseline was
      # 21; SPEC-156 took it to 17 and SPEC-157's table_lock put it back to 19, which is what
      # notch 2 measured and cleared. The baseline is zero, so `continue-on-error` is gone —
      # a type error in
      # the shared layers now fails the build, which is the whole point of a ratchet — the
      # cleared number is only worth clearing if nothing can put findings back. Scope is
      # the shared sources; widening it to the verb packages is notch 3, and lands
      # report-only again. Config and the full ratchet path live in pyproject.toml's
      # [tool.mypy] block.
      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # The ratchet reasoning above still holds; only the place it is enforced has moved, so
      # a type error in the shared layers now reaches main behind a green PR unless the
      # pushing session ran mypy and honoured its exit code.
      # - name: Typecheck (mypy)
      #   run: mypy

      # DISABLED -- see "WHAT IS DISABLED, AND THE RESTORE RULE" in the header above.
      # - name: Test (pytest)
      #   run: pytest lambdas/
