name: CI

# Checks run on PRs only. main never tests or lints — it builds and deploys
# (deploy-app / deploy-lambdas / deploy-infra).
#
# The Build step below is the TYPECHECK gate, and it is here because relying on a
# local run did not hold: SPEC-145 added a member to a shared prop type, missed one
# test file's builder, passed every PR check, and broke main's Deploy App (#362).
# Two things made that invisible — vitest does not typecheck, and
# `tsc --noEmit -p apps/portal/tsconfig.json` exits 0 having checked NOTHING (that
# config is solution-style: project references only, no files/include). `tsc -b`,
# which `npm run build` runs, is the only invocation that covers the app AND its
# *.test.tsx files.
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Both jobs run in 4-6 minutes; 12 bounds a hung run well clear of that without
    # tripping on a slow runner. Without it a hang would sit against GitHub's 6h
    # default — the same gap the deploy workflows closed in #314.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/portal
        run: npm run lint

      - name: Format check (prettier)
        working-directory: apps/portal
        run: npm run format:check

      # Runs the SAME command deploy-app.yml does, so a green PR means that build
      # will compile. Deliberately BEFORE the test step: a type error surfaces in
      # under a minute instead of behind a ~5-minute suite. No VITE_* env is passed
      # — every one of them is a runtime value baked into the bundle, and this job
      # discards the bundle. What is being gated is `tsc -b`.
      - name: Build (typecheck + bundle)
        working-directory: apps/portal
        run: npm run build

      - name: Test
        working-directory: apps/portal
        run: npm run test:coverage

  lambdas:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lint + test tools
        # control-plane-common/requirements.txt is installed so cpcommon's own layer
        # dependencies are importable under test — log-foundry (SPEC-127) is declared only
        # there, and cpcommon.observability imports it at module scope. Packaging already
        # reads that file in deploy-lambdas.yml's layer job; this is the test side of the
        # same declaration, so the two can't drift.
        #
        # polars (from the two polars layer requirements) so the table-builder
        # type-mapping + infer-schema tests (SPEC-069) and the data-quality
        # inspect-source probe tests (SPEC-110) run for real in CI rather than being
        # skipped. Both files pin the SAME polars version deliberately, so the second
        # install is a no-op — it is listed because the DQ tests genuinely depend on it,
        # and a future version split must surface here rather than silently resolving to
        # whichever was installed last.
        run: |
          pip install -r lambdas/requirements.txt -r lambdas/requirements-dev.txt
          pip install -r lambdas/control-plane-common/requirements.txt
          pip install -r lambdas/table-builder-infer-schema/requirements.txt
          pip install -r lambdas/data-quality-polars/requirements.txt

      - name: Lint (ruff)
        run: ruff check lambdas/

      # BLOCKING as of notch 2 (was report-only under SPEC-153 FR-009, at a 19-finding
      # baseline). The baseline is cleared, so `continue-on-error` is gone: a type error in
      # the shared layers now fails the build, which is the whole point of a ratchet — the
      # cleared number is only worth clearing if nothing can put findings back. Scope is
      # still the five shared layers; widening it to the verb packages is notch 3, and lands
      # report-only again. Config and the full ratchet path live in pyproject.toml's
      # [tool.mypy] block.
      - name: Typecheck (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest lambdas/
