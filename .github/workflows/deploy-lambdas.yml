name: Deploy Lambdas

# Builds and deploys the actual Lambda code (Terraform only manages the function
# infrastructure + a placeholder; see infra/modules/auth/lambda.tf). For each
# function under lambdas/, this installs the shared requirements, zips the
# package, uploads it to the artifacts bucket, and runs update-function-code.
#
# Shared-space functions (SPEC-062) get their deps + shared common code from a
# Lambda LAYER instead of bundling them: the `layer` job builds + publishes the
# `shared-space-common` layer once, and each shared-space function attaches it via
# update-function-configuration. Terraform ignores the function `layers` attribute,
# so CI owns the layer the same way it owns the code.

on:
  push:
    branches: [main]
    paths: ['lambdas/**']
  workflow_dispatch:

# Resource names are derived deterministically from the same project/environment
# the IaC uses (defaults match infra/variables.tf). Override via repo Variables
# only if you changed TF_VAR_project_name / TF_VAR_environment.
env:
  PROJECT_NAME: ${{ vars.TF_VAR_project_name || 'dat' }}
  ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}

jobs:
  # ── Shared-code layer (SPEC-062) ───────────────────────────────────────────
  # Publishes the `shared-space-common` layer = external deps (PyJWT[crypto]) +
  # the shared common modules, published once. The shared-space functions attach
  # the resulting version ARN (below). Repo's first Lambda layer; a later spec
  # reuses the mechanism for heavier external libraries.
  layer:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build layer package
        run: |
          set -euo pipefail
          LAYER_DIR="build/layer/python"
          rm -rf build/layer && mkdir -p "$LAYER_DIR"
          # External deps for the layer (manylinux wheels, compatible with the
          # python3.12 Lambda runtime — same as the previous per-function bundling).
          pip install --quiet --requirement lambdas/requirements.txt --target "$LAYER_DIR"
          # Shared common modules — PRODUCTION files only (never test_*.py / fakes.py).
          # Keep this list in sync with lambdas/shared-space-common/.
          for m in config clients auth registry membership cache notify teardown; do
            cp "lambdas/shared-space-common/$m.py" "$LAYER_DIR"/
          done
          (cd build/layer && zip --quiet --recurse-paths ../shared-space-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-shared-space-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared common code + deps for the shared-space control plane (SPEC-062)." \
            --zip-file "fileb://build/shared-space-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── polars layer (SPEC-066) ────────────────────────────────────────────────
  # Publishes the `table-builder-polars` layer = polars (Rust-native Parquet/CSV/JSON
  # readers, no pyarrow), attached ONLY to the table-builder infer-schema function
  # (SPEC-069). Built the same way as the shared-space-common layer (the heavy artifact
  # can't be vendored into Terraform), pinned via lambdas/table-builder-infer-schema/
  # requirements.txt, with the unzipped size measured + capped well under Lambda's
  # 250 MB limit (SPEC-066 FR-003).
  polars_layer:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build polars layer package
        run: |
          set -euo pipefail
          LAYER_DIR="build/polars-layer/python"
          rm -rf build/polars-layer && mkdir -p "$LAYER_DIR"
          # Plain pip install on the linux x86_64 / python3.12 runner pulls the
          # manylinux polars wheel, ABI-compatible with the python3.12 Lambda runtime
          # (Amazon Linux 2023) — the same proven approach as the shared-space-common
          # layer job above. (polars ships no pyarrow dep, so the layer stays small.)
          pip install --quiet \
            --requirement lambdas/table-builder-infer-schema/requirements.txt \
            --target "$LAYER_DIR"
          UNZIPPED_KB=$(du -sk "$LAYER_DIR" | cut -f1)
          echo "table-builder-polars layer unzipped size: $((UNZIPPED_KB / 1024)) MB"
          # Lambda's hard limit is 250 MB unzipped (layers + function); fail early with
          # headroom (240 MB) if a future polars bump blows past it (SPEC-066 FR-003).
          if [ "$UNZIPPED_KB" -gt 245760 ]; then
            echo "::error::table-builder-polars layer exceeds 240 MB unzipped ($((UNZIPPED_KB / 1024)) MB)."
            exit 1
          fi
          (cd build/polars-layer && zip --quiet --recurse-paths ../table-builder-polars-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-table-builder-polars"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "polars (Parquet/CSV/JSON readers) for the table-builder infer-schema verb (SPEC-066/069)." \
            --zip-file "fileb://build/table-builder-polars-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── table-builder-common layer (SPEC-067) ──────────────────────────────────
  # Publishes the `table-builder-common` layer = external deps (PyJWT[crypto]) + the
  # `tbcommon` package (shared auth/registry/clients/config/errors for the verb
  # Lambdas). The table-builder verbs with real code (validate-authorize now; more in
  # SPEC-068/070) attach it instead of bundling. A PACKAGE (python/tbcommon/), not flat
  # modules, so its names don't collide with shared-space-common's under pytest.
  table_builder_layer:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build layer package
        run: |
          set -euo pipefail
          LAYER_DIR="build/tbcommon-layer/python"
          rm -rf build/tbcommon-layer && mkdir -p "$LAYER_DIR"
          # External deps (manylinux wheels, python3.12-compatible) — PyJWT[crypto].
          pip install --quiet --requirement lambdas/requirements.txt --target "$LAYER_DIR"
          # The shared package — production code only (no __pycache__).
          cp -r lambdas/table-builder-common/tbcommon "$LAYER_DIR"/tbcommon
          find "$LAYER_DIR"/tbcommon -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd build/tbcommon-layer && zip --quiet --recurse-paths ../table-builder-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-table-builder-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared tbcommon package + deps (PyJWT) for the table-builder verb Lambdas (SPEC-067)." \
            --zip-file "fileb://build/table-builder-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [layer, polars_layer, table_builder_layer]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        # One entry per function. `name` is both the lambdas/ subdir and the
        # function-name suffix ({project}-{env}-{name}). `layer: true` functions
        # (SPEC-062) get deps + shared code from the shared-space-common layer instead
        # of bundling the shared requirements, and attach it after deploy. `polars: true`
        # functions (SPEC-066) attach the table-builder-polars layer after deploy.
        lambda:
          - { name: pre-signup, layer: false, polars: false, tbcommon: false }
          - { name: post-confirmation, layer: false, polars: false, tbcommon: false }
          - { name: notifications-writer, layer: false, polars: false, tbcommon: false }
          - { name: shared-space-validate, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-create, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-add-members, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-remove-members, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-leave, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-delete, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-forget, layer: true, polars: false, tbcommon: false }
          - { name: shared-space-acknowledge-membership, layer: true, polars: false, tbcommon: false }
          # Table-builder verbs. `tbcommon: true` attaches the table-builder-common layer
          # — ALL five verbs use the shared tbcommon package now (config/clients/errors +
          # notify, SPEC-067/068/069/070/072). infer-schema ALSO attaches the polars layer
          # (both layers, SPEC-069). execute-ddl imports `from tbcommon import config`
          # (SPEC-070) + `notify` (SPEC-072), so it needs the layer too.
          - { name: table-builder-validate-authorize, layer: false, polars: false, tbcommon: true }
          - { name: table-builder-check-table-absent, layer: false, polars: false, tbcommon: true }
          - { name: table-builder-inspect-source, layer: false, polars: false, tbcommon: true }
          - { name: table-builder-infer-schema, layer: false, polars: true, tbcommon: true }
          - { name: table-builder-execute-ddl, layer: false, polars: false, tbcommon: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          set -euo pipefail
          BUILD_DIR="build/${{ matrix.lambda.name }}"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          # Layer functions (shared-space-common OR table-builder-common) get their deps
          # from the layer; others bundle the shared requirements.
          if [ "${{ matrix.lambda.layer }}" != "true" ] && [ "${{ matrix.lambda.tbcommon }}" != "true" ]; then
            pip install --quiet --requirement lambdas/requirements.txt --target "$BUILD_DIR"
          fi
          cp lambdas/${{ matrix.lambda.name }}/*.py "$BUILD_DIR"/
          # Never ship tests.
          rm -f "$BUILD_DIR"/test_*.py
          (cd "$BUILD_DIR" && zip --quiet --recurse-paths "../${{ matrix.lambda.name }}.zip" .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact and deploy
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT_NAME}-lambda-artifacts-${ACCOUNT_ID}"
          FUNCTION="${PROJECT_NAME}-${ENVIRONMENT}-${{ matrix.lambda.name }}"
          KEY="${{ matrix.lambda.name }}/${GITHUB_SHA}.zip"

          # The function + artifacts bucket are created by deploy-infra.yml. When a
          # merge touches both infra/ and lambdas/, both workflows fire on the same
          # push and this one can win the race — so wait for the infrastructure to
          # exist (up to ~5 min) before deploying, instead of failing with
          # NoSuchBucket / ResourceNotFound.
          for attempt in $(seq 1 30); do
            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null \
               && aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
              echo "Infrastructure ready for ${FUNCTION}."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Bucket ${BUCKET} or function ${FUNCTION} not ready after ~5 min. Run Deploy Infrastructure first."
              exit 1
            fi
            echo "Waiting for infrastructure (attempt ${attempt}/30)…"
            sleep 10
          done

          aws s3 cp "build/${{ matrix.lambda.name }}.zip" "s3://${BUCKET}/${KEY}"
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --s3-bucket "$BUCKET" \
            --s3-key "$KEY" \
            --publish
          aws lambda wait function-updated --function-name "$FUNCTION"

          # Attach the function's layers. update-function-configuration --layers REPLACES
          # the whole list, so a function needing more than one layer (infer-schema =
          # polars + table-builder-common, SPEC-069) must pass them together in one call.
          LAYERS=()
          [ "${{ matrix.lambda.layer }}" = "true" ]    && LAYERS+=("${{ needs.layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.polars }}" = "true" ]   && LAYERS+=("${{ needs.polars_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.tbcommon }}" = "true" ] && LAYERS+=("${{ needs.table_builder_layer.outputs.layer_arn }}")
          if [ "${#LAYERS[@]}" -gt 0 ]; then
            aws lambda update-function-configuration \
              --function-name "$FUNCTION" \
              --layers "${LAYERS[@]}"
            aws lambda wait function-updated --function-name "$FUNCTION"
          fi
