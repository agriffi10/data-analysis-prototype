name: Deploy Lambdas

# Points every Lambda at the fleet's one container image. Terraform owns the function and carries
# `ignore_changes = [image_uri]`, so it will never move a function forward — only
# `update-function-code --image-uri` does, and this workflow is the only thing that calls it.
#
# EVERY function, every run. The narrowing this workflow used to do — deploy only what a diff
# touched — was correct while each function carried its own zip and its own layer ARNs. It is a
# category error now: there is ONE artefact for the whole fleet, so "which functions changed" has
# no answer, and a function left un-pointed runs an older image and reports a stale BUILD_VERSION
# while working perfectly. That is the trap this arc is written around, so the answer is to point
# all of them and reconcile the names afterwards.

on:
  # The workflow file itself is in the path filter, for the reason SPEC-139 added it to
  # deploy-infra.yml: without it this workflow can be edited and merged having never run.
  # That is not hypothetical — #320 bumped every action in the repo off the EOL node20
  # runtime, and this file's `configure-aws-credentials` call sites went to main completely
  # unexercised, because changing a workflow is not changing `lambdas/**`.
  #
  # The probe's table and script are here because
  # they decide what this workflow proves, and a change to either that never ran is a gate nobody
  # has seen work.
  push:
    branches: [main]
    paths:
      - 'lambdas/**'
      - '.github/workflows/deploy-lambdas.yml'
      - '.github/lambda-probes.json'
      # The fleet's membership is Terraform's now, so a plane gaining a verb has to deploy —
      # and it touches neither `lambdas/**` nor this file.
      - 'infra/modules/**'
      - 'lambdas/fleet.py'
      - '.github/scripts/point-lambda.sh'
      - '.github/scripts/probe-cold-start.sh'

  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          THE ROLLBACK. Empty deploys this commit's image. A previous commit's sha points every
          function back at the image that sha built — the registry is immutable and tagged by sha,
          so naming one names exactly the artefact that ran then. No code change, and no revert:
          reverting the cutover would delete the `moved` blocks and re-race 86 creates.
        required: false
        default: ''

# Resource names are derived deterministically from the same project/environment
# the IaC uses (defaults match infra/variables.tf). Override via repo Variables
# only if you changed TF_VAR_project_name / TF_VAR_environment.
env:
  PROJECT_NAME: ${{ vars.TF_VAR_project_name || 'dat' }}
  ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}

# Two merges landing close together used to run two deploys at once, racing
# `update-function-code` and `update-function-configuration` on the same functions —
# and the loser's `wait function-updated` can return against the WINNER's version, so
# the older commit's code silently wins. Queue instead.
#
# `cancel-in-progress: false` is deliberate and is not the cost setting: cancelling a
# deploy mid-shard leaves some functions on the new code and some on the old, which is
# the one outcome worse than waiting. The cost fix here is the sharding below.
#
# Known consequence, so nobody diagnoses it as a fault: GitHub holds at most ONE pending
# run per group, so three merges in quick succession evict the middle one as `cancelled`.
# It puts a cancelled Deploy Lambdas run on main, which the project's "always confirm main
# went green" rule would otherwise send someone chasing.
#
# For a PUSH that eviction is now harmless, and for a better reason than the diff-anchoring it
# used to need: every run points the WHOLE fleet at its own commit's image, so an evicted run
# leaves nothing uncovered — the next one does all of it.
#
# FOR A ROLLBACK DISPATCH IT IS NOT HARMLESS, and this is the one place to know it. If a merge
# lands while the forward dispatch is pending, the forward run can be the one evicted — and the
# fleet stays on the rollback image, SERVING PERFECTLY, with main green. That is this arc's
# signature failure wearing the rollback's clothes. Confirm a rollback by reading `Code.ImageUri`
# back off a function, never by "main went green".
concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

jobs:
  # ── What is deployed, and against which image ───────────────────────────────
  # The whole fleet, always, read from THIS COMMIT'S Terraform sources by `lambdas/fleet.py`.
  #
  # NOT `tofu output`, and the distinction is the one that matters here. A `tofu output` is
  # LAST-APPLIED state, and this workflow and `deploy-infra.yml` fire on the same push with no
  # ordering between them — so on the one push that adds a function, the output does not have it
  # yet. That function would never be pointed, and the reconciliation below would compare a plan
  # that never mentioned it against a deploy that never did it and agree. The function then runs
  # whatever image its module created it with, working perfectly, with main green: this arc's
  # signature failure, produced by its own cleanup.
  #
  # The commit's own declaration is what the deleted table provided, so that is what the sharding
  # reads. The applied output is still read — by the `pointed` job, where "did we deploy what is
  # actually out there" is the question being asked.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      functions: ${{ steps.plan.outputs.functions }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      # ONCE, HERE, not 86 times in the shards. `point-lambda.sh` waits up to five minutes per
      # function for a tag to appear, so a mistyped rollback tag would otherwise cost over an hour
      # of billed runtime before anyone learned it was wrong.
      - name: Check the image this run will point at
        env:
          PROJECT: ${{ vars.TF_VAR_project_name || 'dat' }}
          ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${IMAGE_TAG:-$GITHUB_SHA}"
          NAME="${PROJECT}-${ENVIRONMENT}-lambda"
          if [ -n "${IMAGE_TAG}" ]; then
            # A ROLLBACK must name an image that already exists. This commit's own image, by
            # contrast, is built by a workflow firing on the same push, so it is waited for per
            # function rather than required now.
            if ! aws ecr describe-images --repository-name "$NAME" \
                 --image-ids "imageTag=${TAG}" >/dev/null 2>&1; then
              echo "::error title=Unknown tag::${NAME}:${TAG} is not in the registry. A rollback names an image that already exists — check the sha, and that its 'Deploy Lambda image' run went green."
              exit 1
            fi
            echo "::notice title=Rollback::pointing every function at ${NAME}:${TAG}"
          else
            echo "::notice title=Deploy::pointing every function at ${NAME}:${TAG} (this commit)"
          fi

      - name: The whole fleet
        id: plan
        run: |
          set -euo pipefail
          # `fleet.py` REFUSES rather than returning a short list, so a derivation it cannot make
          # fails here. Piping it would report jq's status instead of its own.
          PLAN=$(python3 lambdas/fleet.py --plan)
          echo "$PLAN" | jq .
          COUNT=$(jq '.functions | length' <<<"$PLAN")
          echo "Pointing the whole fleet: ${COUNT} functions over $(jq -r .shard_count <<<"$PLAN") shards." >> "$GITHUB_STEP_SUMMARY"

          # Belt and braces over the refusal above: a derivation that somehow returned nothing
          # would shard to zero jobs and report success having deployed nothing, and "did not run"
          # is never "clean".
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::the deploy plan named no functions. Every run points the whole fleet, so an empty plan means the fleet could not be derived from infra/modules."
            exit 1
          fi

          {
            printf 'functions=%s\n' "$(jq -c .functions <<<"$PLAN")"
            printf 'shards=%s\n'    "$(jq -c .shards    <<<"$PLAN")"
            printf 'shard_count=%s\n' "$(jq -r .shard_count <<<"$PLAN")"
          } >> "$GITHUB_OUTPUT"

  # largest line on the Actions bill. GitHub rounds every job up to a full billed
  # minute, and all 73 of these finish in ~29 seconds — so the shape cost 73 minutes
  # for ~22 minutes of work, and it grew by a permanent minute with every function
  # the project added. Measured over 28 days it was 46% of the repo's Actions spend,
  # and 53% of that was rounding alone.
  #
  # The functions are now sharded: each job deploys its share sequentially, so the
  # per-job minute is amortised over a dozen functions instead of paid per function.
  # Shard COUNT is the tuning knob and the cost curve is flat between ~4 and ~8 (each
  # job comfortably exceeds a minute either way); six keeps every shard around four
  # minutes, which leaves room for the function count to grow without a shard
  # crossing a minute boundary and re-inflating the bill.
  #
  # The fleet is data a shard READS, which is why it is not a `strategy.matrix`: a matrix
  # creates one job per entry and cannot express "these twelve in one job".
  deploy:
    needs: [plan]
    runs-on: ubuntu-latest
    # Sized against a SHARD, and RE-DERIVED now that every run points the whole fleet rather
    # than a diff's worth. 86 functions across 6 shards is ~15 each, not thirteen; a container
    # update is an API call plus two waiters, ~25s, so ~6.5 min, and the image race adds up to 5
    # min ONCE (the first function waits, the rest find the tag already there). ~12 min is the
    # realistic worst case and this is 2.5x it.
    #
    # Deliberately NOT the pathological sum. Each function can in principle spend 5 min
    # in the get-function loop plus three `aws lambda wait` calls at up to 5 min each,
    # which across thirteen functions is hours — but that only happens when Lambda's API
    # is degraded, where failing the shard is the correct outcome and burning three
    # billed hours to discover it is not.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    strategy:
      # A function that fails must not cancel the shards deploying unrelated ones.
      # Under one-job-per-function the default cancelled 72 PENDING jobs; with six
      # shards in flight it would cancel work already half-done, which leaves a
      # partial deploy in more places rather than fewer.
      fail-fast: false
      matrix:
        # Computed, not fixed. Sharding four functions across six jobs would spend six
        # billed minutes to save none — the count scales with the work the plan found.
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      # The whole fleet.
      PLANNED: ${{ needs.plan.outputs.functions }}
      # Empty on a push; a previous sha on a rollback dispatch. point-lambda.sh defaults it to
      # this commit, so every other caller is unaffected.
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a
          # connect timeout to STS cost ~7 minutes per attempt, so one job spent 82
          # minutes failing. Three still retries a fast-failing transient; the slow
          # case is bounded by `timeout-minutes` above.
          retry-max-attempts: 3

      - name: Deploy this shard
        run: |
          set -euo pipefail

          # No artifacts bucket to wait for any more: nothing is uploaded. The only artefact is
          # the image, and point-lambda.sh waits for that tag itself.

          # A read loop rather than `mapfile` (bash 4+), so the whole path can be dry-run on a
          # Mac before it is pushed.
          FUNCS=()
          while IFS= read -r fn; do
            [ -n "$fn" ] && FUNCS+=("$fn")
          done < <(jq -r --argjson s "$SHARD" --argjson n "$SHARD_COUNT" \
            'to_entries[] | select(.key % $n == $s) | .value' <<<"$PLANNED")

          if [ "${#FUNCS[@]}" -eq 0 ]; then
            echo "::error::Shard ${SHARD}/${SHARD_COUNT} selected no functions — the table or the sharding expression is wrong, and a silently empty shard deploys nothing while reporting success."
            exit 1
          fi

          echo "Shard ${SHARD} of ${SHARD_COUNT}: ${#FUNCS[@]} functions"
          printf '  %s\n' "${FUNCS[@]}"

          # Every function gets its attempt even after one fails, and the shard fails
          # at the end naming all of them. Under one-job-per-function an unrelated
          # failure never stopped a deploy, and sharding must not quietly change that.
          FAILED=()
          : > "deployed-${SHARD}.txt"
          for NAME in "${FUNCS[@]}"; do
            echo "::group::${NAME}"
            if bash .github/scripts/point-lambda.sh "$NAME"; then
              echo "✓ ${NAME}"
              # Written only on success, and read back by the `pointed` job below. A shard that
              # dies mid-loop contributes what it actually did rather than what it intended.
              echo "$NAME" >> "deployed-${SHARD}.txt"
            else
              echo "::error::${NAME} failed to deploy."
              FAILED+=("$NAME")
            fi
            echo "::endgroup::"
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Shard ${SHARD} failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "Shard ${SHARD}: all ${#FUNCS[@]} functions deployed."

      # Uploaded even when the shard failed, so the reconciliation below sees the partial truth.
      - name: Record what this shard pointed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pointed-${{ matrix.shard }}
          path: deployed-${{ matrix.shard }}.txt
          retention-days: 3
          if-no-files-found: ignore

  # ── Did every function actually get pointed? ────────────────────────────────
  # THE TRAP THIS JOB EXISTS FOR, and it is the one this whole arc is written around. Terraform
  # ignores `image_uri` after creation, so it will never move a function onto a new image; only
  # `update-function-code` does. A pipeline that builds an image, pushes it, and points nothing at
  # it leaves every function on the previous image — and every one of them KEEPS WORKING. Nothing
  # goes red. The SPA's ECS service hit exactly this, where a pipeline that only registered a task
  # definition left a CannotPullContainerError indistinguishable from the endpoint failure the
  # platform was tested for.
  #
  # It reconciles NAMES, not a count. A count tells you a number is wrong; the names tell you which
  # functions are running last week's code, which is the question anyone reading this actually has.
  #
  # `if: always()` and a `needs` on a job with `fail-fast: false`: a shard that failed must still
  # be reconciled, or the one run where this matters most is the one where it does not run.
  pointed:
    needs: [plan, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reading the APPLIED fleet needs both, which this job did not previously want. The pinned
      # version matches every other workflow that inits this backend.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '~1.8'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: OpenTofu init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_VAR_state_bucket }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_VAR_state_lock_table }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Download every shard's record
        uses: actions/download-artifact@v4
        with:
          pattern: pointed-*
          path: pointed
          merge-multiple: true

      - name: Reconcile against what the deploy planned
        env:
          PLANNED: ${{ needs.plan.outputs.functions }}
          # Named so the success line below cannot say `GITHUB_SHA` on a rollback, which is the
          # one run where a reader most needs to be told which image the fleet is on.
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail

          cat pointed/*.txt 2>/dev/null | sort -u > pointed.txt || : > pointed.txt
          jq -r '.[]' <<<"$PLANNED" | sort -u > planned.txt

          # A reconciliation over two empty files agrees perfectly. The plan job only reaches here
          # with a non-empty set, so an empty planned.txt means the output did not survive.
          if [ ! -s planned.txt ]; then
            echo "::error::the deploy plan named no functions, so this reconciliation would pass having compared nothing."
            exit 1
          fi

          # AGAINST THE APPLIED FLEET, which is a real comparison rather than a marshalling check.
          # `planned` came from this COMMIT's Terraform sources; this comes from the state Terraform
          # has actually applied. The two derivations are independent and they answer different
          # questions, which is exactly why comparing them is worth a job:
          #
          #   * in `planned` and not applied — Deploy Infrastructure has not created it yet. On the
          #     push that adds a function that is expected and benign: the deploy waits for the
          #     function and the two agree next run. It is reported, not failed.
          #   * applied and not in `planned` — a deployed function this commit does not declare. It
          #     is running an image nobody pointed and NOTHING ELSE WOULD SAY SO, which is the trap
          #     this job exists for. That fails.
          APPLIED=$(cd infra && tofu output -json lambda_function_names)
          if ! jq -e 'type == "array" and length > 0' >/dev/null <<<"$APPLIED"; then
            echo "::error::could not read lambda_function_names from Terraform state. An unreadable output is not an empty fleet, and every comparison below would pass over it."
            exit 1
          fi
          jq -r '.[]' <<<"$APPLIED" | sort -u > applied.txt

          NEW=$(comm -23 planned.txt applied.txt)
          if [ -n "$NEW" ]; then
            echo "::notice title=Not yet applied::$(wc -l <<<"$NEW" | tr -d ' ') function(s) this commit declares are not in Terraform state yet — expected on the push that adds one:"
            printf '  %s\n' $NEW
          fi

          # THE SYMMETRIC RACE IS NAMED HERE, because the error would otherwise diagnose it
          # backwards. A push that REMOVES a function reaches this branch too, for as long as
          # Deploy Infrastructure has not applied the destroy — and this job usually runs after
          # that apply, but "usually" is not a guarantee when the apply is queued, slow or red.
          ORPHANED=$(comm -13 planned.txt applied.txt)
          if [ -n "$ORPHANED" ]; then
            echo "::error::these functions are DEPLOYED and this commit does not declare them:"
            printf '  %s\n' $ORPHANED
            echo "::error::Either nothing pointed them at this run's image, or this commit REMOVED them and Deploy Infrastructure has not applied the destroy yet. Check that run: if it is still going or failed, re-dispatch this workflow once it is green rather than treating these as un-pointed."
            exit 1
          fi

          MISSED=$(comm -23 planned.txt pointed.txt)
          if [ -n "$MISSED" ]; then
            echo "::error::these functions were planned but never pointed at this commit's code:"
            printf '  %s\n' $MISSED
            echo "::error::$(wc -l <<<"$MISSED" | tr -d ' ') function(s) are running an earlier image or package."
            exit 1
          fi
          echo "All $(wc -l < planned.txt | tr -d ' ') functions were pointed at ${TAG}."

  # ── Does the deployed artefact actually START? ──────────────────────────────
  # SPEC-213 FR-006. Every gate in this repo has at some point been blind to a cold start:
  # SPEC-137's broken import passed review, unit tests and `update-function-code`, and only the
  # deployed function knew. The image's own matrix imports every handler module inside the built
  # artefact, which is the stronger check — but it runs against an image, not against a function,
  # and it cannot see a deployed function whose configuration stops it starting.
  #
  # A SAMPLE, not the fleet: exactly the set the deploy role holds `lambda:InvokeFunction` for,
  # which is six planes' `validate-authorize` verb, shared-spaces' operator backfill (a verb would
  # need a grant that does not exist, and the backfill defaults to a read-only mode) and each
  # standalone. `lambdas/test_cold_start_probe.py` derives that set from the grants themselves and
  # fails if the probe table drifts from it in either direction — a probe without a grant fails
  # loudly, a grant without a probe is invisible. What it cannot see is a plane that ships with no
  # grant at all; that, and the 71 functions the sample does not reach, are in docs/testing/owed.md.
  #
  # It runs after `pointed`, so the functions it invokes are on THIS run's image.
  probe:
    needs: [pointed]
    runs-on: ubuntu-latest
    # DERIVED, not chosen. Fourteen sequential invocations, each bounded by the function's own
    # Lambda timeout: two carry 300s (log-sweep, user-directory-build) and the rest 30-60s, so the
    # pathological case is ~16 min, plus checkout and the OIDC assume. 25 is that with room, and
    # the run only approaches it if a probed function is hanging — which is a failure worth waiting
    # for rather than one to cut short.
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      # Invoked directly rather than guarded by an `if`: a probe that can be skipped is a gate that
      # reports clean on the run where it did not run.
      - name: Invoke one function per plane and every standalone
        run: .github/scripts/probe-cold-start.sh
