name: Deploy Lambdas

# Builds and deploys the actual Lambda code (Terraform only manages the function
# infrastructure + a placeholder; see infra/modules/auth/lambda.tf). For each
# function under lambdas/, this installs the shared requirements, zips the
# package, uploads it to the artifacts bucket, and runs update-function-code.
#
# Shared-space functions (SPEC-062) get their shared code from a Lambda LAYER instead
# of bundling it: the `layer` job builds + publishes the `shared-space-common` layer
# once, and each shared-space function attaches it via update-function-configuration.
# Terraform ignores the function `layers` attribute, so CI owns the layer the same way
# it owns the code. Since SPEC-125 they attach `cpcommon` alongside it — two layers —
# and shared-space-common carries DOMAIN code only, with no external deps of its own.

on:
  # The workflow file itself is in the path filter, for the reason SPEC-139 added it to
  # deploy-infra.yml: without it this workflow can be edited and merged having never run.
  # That is not hypothetical — #320 bumped every action in the repo off the EOL node20
  # runtime, and this file's eight `configure-aws-credentials` call sites went to main
  # completely unexercised, because changing a workflow is not changing `lambdas/**`.
  #
  # The two JSON tables and the two scripts are in the filter for exactly that reason,
  # and the reason is stronger for them than for the workflow: this workflow's real
  # behaviour now lives in them. Editing lambda-functions.json is how a function is
  # added or its layers changed, and editing lambda-layers.json is how a layer's
  # contents change — both of which must deploy, and neither of which touches
  # `lambdas/**`. Without these entries a merge that only re-points a layer would go to
  # main having deployed nothing, and the next unrelated lambdas/ push would carry it.
  push:
    branches: [main]
    paths:
      - 'lambdas/**'
      - '.github/workflows/deploy-lambdas.yml'
      - '.github/lambda-functions.json'
      - '.github/lambda-layers.json'
      - '.github/scripts/deploy-lambda.sh'
      - '.github/scripts/build-layer.sh'
  workflow_dispatch:

# Resource names are derived deterministically from the same project/environment
# the IaC uses (defaults match infra/variables.tf). Override via repo Variables
# only if you changed TF_VAR_project_name / TF_VAR_environment.
env:
  PROJECT_NAME: ${{ vars.TF_VAR_project_name || 'dat' }}
  ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}

# Two merges landing close together used to run two deploys at once, racing
# `update-function-code` and `update-function-configuration` on the same functions —
# and the loser's `wait function-updated` can return against the WINNER's version, so
# the older commit's code silently wins. Queue instead.
#
# `cancel-in-progress: false` is deliberate and is not the cost setting: cancelling a
# deploy mid-shard leaves some functions on the new code and some on the old, which is
# the one outcome worse than waiting. The cost fix here is the sharding below.
#
# Known consequence, so nobody diagnoses it as a fault: GitHub holds at most ONE pending
# run per group, so three merges in quick succession evict the middle one as `cancelled`.
# That is benign here — the third run's commit is a superset of the second's — but it
# does put a cancelled Deploy Lambdas run on main, which the project's "always confirm
# main went green" rule would otherwise send someone chasing.
concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

jobs:
  # ── What does this push actually need? ──────────────────────────────────────
  # This workflow rebuilt and redeployed all 73 functions on every push. The median
  # push touches four function directories, so ~69 were re-uploading identical code.
  #
  # The reason that was not simply wasteful is the thing to understand before changing
  # anything here: `publish-layer-version` MINTS A NEW VERSION on every call, a function
  # pins its layers by ARN, so republishing all ten layers every run meant every function
  # genuinely DID need re-pointing. Skipping functions is only correct because unchanged
  # layers now resolve to the version already published instead of a fresh one — the two
  # halves are one change and neither works alone.
  #
  # The rules live in .github/scripts/plan_deploy.py, which is pure and offline so that
  # lambdas/test_plan_deploy.py can drive it over the real tables. Everything it cannot
  # reason about confidently falls back to the whole fleet: a function it wrongly omits
  # keeps running against a layer that has moved on, and that is invisible until a cold
  # start (SPEC-137 broke real Cognito signups exactly that way).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      functions: ${{ steps.plan.outputs.functions }}
      publish: ${{ steps.plan.outputs.publish }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      any: ${{ steps.plan.outputs.any }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The plan is a diff against the previous commit, so the history has to be here.
          fetch-depth: 0

      - name: Work out what changed
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          FORCE=""
          # A dispatch carries no diff, and a `before` that is absent, all-zeros or no
          # longer in the history (force-push, first push on a new branch) is not a diff
          # either. Treating any of those as "nothing changed" would silently deploy
          # nothing, so they all mean "deploy everything".
          if [ "${{ github.event_name }}" != "push" ]; then
            FORCE="--all"
            echo "Not a push — planning a full deploy."
          elif [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FORCE="--all"
            echo "No usable previous commit (${BEFORE:-unset}) — planning a full deploy."
          fi

          OLD_ARGS=()
          if [ -z "$FORCE" ]; then
            git diff --name-only "${BEFORE}" "${GITHUB_SHA}" > changed.txt
            echo "Changed paths:"; sed 's/^/  /' changed.txt
            # The tables as they were, so a table change narrows to the rows that moved
            # instead of forcing the fleet. If either cannot be read the planner falls
            # back on its own — the flag is simply not passed.
            if git show "${BEFORE}:.github/lambda-functions.json" > old-functions.json 2>/dev/null; then
              OLD_ARGS+=(--old-functions old-functions.json)
            fi
            if git show "${BEFORE}:.github/lambda-layers.json" > old-layers.json 2>/dev/null; then
              OLD_ARGS+=(--old-layers old-layers.json)
            fi
          else
            : > changed.txt
          fi

          PLAN=$(python3 .github/scripts/plan_deploy.py \
            ${FORCE:+$FORCE} ${OLD_ARGS[@]+"${OLD_ARGS[@]}"} --changed-from changed.txt)

          echo "$PLAN" | jq .
          echo "$(jq -r .reason <<<"$PLAN")" >> "$GITHUB_STEP_SUMMARY"

          {
            printf 'functions=%s\n' "$(jq -c .functions <<<"$PLAN")"
            printf 'publish=%s\n'   "$(jq -c .publish   <<<"$PLAN")"
            printf 'shards=%s\n'    "$(jq -c .shards    <<<"$PLAN")"
            printf 'shard_count=%s\n' "$(jq -r .shard_count <<<"$PLAN")"
            printf 'any=%s\n'       "$(jq -r 'if (.functions | length) > 0 then "true" else "false" end' <<<"$PLAN")"
          } >> "$GITHUB_OUTPUT"

  # ── Layers, ALL of them, in one job ────────────────────────────────────────
  # This was ten separate jobs. Each took 14-29 seconds and GitHub bills a whole
  # minute per job, so ten layers cost ten billed minutes for about three minutes of
  # work — the same rounding tax the deploy matrix below was paying, one order down.
  #
  # Separate jobs looked justified because each layer built differently. Written out
  # as a table it is three shapes: pip-install a requirements file, copy a package
  # directory, or copy an explicit list of flat modules — and two layers use two of
  # them at once. The table is .github/lambda-layers.json and the shapes are
  # .github/scripts/build-layer.sh.
  #
  # The job publishes every layer and emits ONE json output mapping flag -> {arn, kb},
  # which the deploy shards read. Ten jobs meant twenty `needs.*.outputs.*` references
  # in the deploy job; a missing one of those is a function deployed without its layer,
  # which fails at COLD START where no test and no deploy can see it (SPEC-137 broke
  # real Cognito signups exactly that way). One map, one lookup, and deploy-lambda.sh
  # refuses any function whose layer resolves to an empty ARN.
  layers:
    needs: [plan]
    # Nothing to deploy means nothing to publish. Skipped rather than run-and-no-op so a
    # docs-only push that happens to touch lambdas/ costs no billed minutes at all.
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      layers: ${{ steps.publish.outputs.layers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a
          # connect timeout to STS cost ~7 minutes per attempt, so one job spent 82
          # minutes failing. Three still retries a fast-failing transient; the slow
          # case is bounded by `timeout-minutes` above.
          retry-max-attempts: 3

      - name: Build and publish every layer
        id: publish
        run: |
          set -euo pipefail

          FLAGS=()
          while IFS= read -r flag; do
            [ -n "$flag" ] && FLAGS+=("$flag")
          done < <(jq -r '.[].flag' .github/lambda-layers.json)

          # Which of them the plan says actually changed. Every layer is still BUILT —
          # the combined per-function size guard needs its unzipped size either way — but
          # only these are PUBLISHED. The rest resolve to the version already published,
          # which is what leaves the functions attaching them correctly pointed without
          # redeploying any of them.
          PUBLISH_SET=$(jq -r '.[]' <<<'${{ needs.plan.outputs.publish }}' | tr '\n' ' ')
          echo "Publishing: ${PUBLISH_SET:-none (all reused)}"

          if [ "${#FLAGS[@]}" -eq 0 ]; then
            echo "::error::no layers in .github/lambda-layers.json — every function would deploy with no layer attached and fail at cold start."
            exit 1
          fi

          # Every layer is attempted even after one fails, so a broken layer reports
          # alongside the others instead of hiding them behind the first error.
          RESULTS=""
          FAILED=()
          for FLAG in "${FLAGS[@]}"; do
            echo "::group::${FLAG}"
            case " $PUBLISH_SET " in *" $FLAG "*) DO_PUBLISH=true ;; *) DO_PUBLISH=false ;; esac
            if line=$(bash .github/scripts/build-layer.sh "$FLAG" "$DO_PUBLISH"); then
              RESULTS="${RESULTS}${line}"$'\n'
            else
              echo "::error::layer ${FLAG} failed to build or publish."
              FAILED+=("$FLAG")
            fi
            echo "::endgroup::"
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::layers failed: ${FAILED[*]}"
            exit 1
          fi

          # flag -> {arn, kb}, as one compact json value on one line.
          MAP=$(printf '%s' "$RESULTS" | jq -Rn '
            [inputs | select(length > 0) | split("\t")
             | {key: .[0], value: {arn: .[1], kb: .[2]}}] | from_entries')

          # Refuse to hand the deploy an incomplete map rather than letting it discover
          # a missing layer per function.
          expected=$(jq 'length' .github/lambda-layers.json)
          actual=$(jq 'length' <<<"$MAP")
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::published ${actual} layers but the table names ${expected} — refusing to deploy against an incomplete layer map."
            exit 1
          fi

          echo "$MAP" | jq .
          printf 'layers=%s\n' "$MAP" >> "$GITHUB_OUTPUT"

  # largest line on the Actions bill. GitHub rounds every job up to a full billed
  # minute, and all 73 of these finish in ~29 seconds — so the shape cost 73 minutes
  # for ~22 minutes of work, and it grew by a permanent minute with every function
  # the project added. Measured over 28 days it was 46% of the repo's Actions spend,
  # and 53% of that was rounding alone.
  #
  # The functions are now sharded: each job deploys its share sequentially, so the
  # per-job minute is amortised over a dozen functions instead of paid per function.
  # Shard COUNT is the tuning knob and the cost curve is flat between ~4 and ~8 (each
  # job comfortably exceeds a minute either way); six keeps every shard around four
  # minutes, which leaves room for the function count to grow without a shard
  # crossing a minute boundary and re-inflating the bill.
  #
  # The function table moved to .github/lambda-functions.json. A `strategy.matrix`
  # cannot express "these twelve in one job", and the table was always read as data
  # by lambdas/test_deploy_matrix.py — which now parses JSON instead of regexing YAML.
  deploy:
    needs: [plan, layers]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Sized against a SHARD, not a function, which is the change sharding makes to this
    # number. Thirteen functions at ~20s each is ~4.5 min; the infra race adds up to 5
    # min ONCE (the first function waits for Deploy Infrastructure, the rest find it
    # already there), so ~10 min is the realistic worst case and this is 3x it.
    #
    # Deliberately NOT the pathological sum. Each function can in principle spend 5 min
    # in the get-function loop plus three `aws lambda wait` calls at up to 5 min each,
    # which across thirteen functions is hours — but that only happens when Lambda's API
    # is degraded, where failing the shard is the correct outcome and burning three
    # billed hours to discover it is not.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    strategy:
      # A function that fails must not cancel the shards deploying unrelated ones.
      # Under one-job-per-function the default cancelled 72 PENDING jobs; with six
      # shards in flight it would cancel work already half-done, which leaves a
      # partial deploy in more places rather than fewer.
      fail-fast: false
      matrix:
        # Computed, not fixed. Sharding four functions across six jobs would spend six
        # billed minutes to save none — the count scales with the work the plan found.
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      # The functions THIS PUSH needs, not the whole table.
      PLANNED: ${{ needs.plan.outputs.functions }}
      # flag -> {arn, kb} for every published layer, from the one layers job.
      # deploy-lambda.sh refuses to deploy a function whose layer is missing from this
      # map rather than shipping it to fail at COLD START, where no test and no deploy
      # can see it — which is how SPEC-137 broke real Cognito signups.
      LAYERS_JSON: ${{ needs.layers.outputs.layers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a
          # connect timeout to STS cost ~7 minutes per attempt, so one job spent 82
          # minutes failing. Three still retries a fast-failing transient; the slow
          # case is bounded by `timeout-minutes` above.
          retry-max-attempts: 3

      - name: Deploy this shard
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export BUCKET="${PROJECT_NAME}-lambda-artifacts-${ACCOUNT_ID}"

          # Wait for the artifacts bucket ONCE per shard rather than once per
          # function. Same race as before (a merge touching infra/ and lambdas/ fires
          # both workflows on one push), but the bucket is shared by every function in
          # the shard, so polling it per function was 12 redundant round trips.
          for attempt in $(seq 1 30); do
            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              echo "Artifacts bucket ready."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Bucket ${BUCKET} not ready after ~5 min. Run Deploy Infrastructure first."
              exit 1
            fi
            echo "Waiting for ${BUCKET} (attempt ${attempt}/30)…"
            sleep 10
          done

          # A read loop rather than `mapfile` (bash 4+), matching deploy-lambda.sh, so the
          # whole path can be dry-run on a Mac before it is pushed.
          FUNCS=()
          while IFS= read -r fn; do
            [ -n "$fn" ] && FUNCS+=("$fn")
          done < <(jq -r --argjson s "$SHARD" --argjson n "$SHARD_COUNT" \
            'to_entries[] | select(.key % $n == $s) | .value' <<<"$PLANNED")

          if [ "${#FUNCS[@]}" -eq 0 ]; then
            echo "::error::Shard ${SHARD}/${SHARD_COUNT} selected no functions — the table or the sharding expression is wrong, and a silently empty shard deploys nothing while reporting success."
            exit 1
          fi

          echo "Shard ${SHARD} of ${SHARD_COUNT}: ${#FUNCS[@]} functions"
          printf '  %s\n' "${FUNCS[@]}"

          # Every function gets its attempt even after one fails, and the shard fails
          # at the end naming all of them. Under one-job-per-function an unrelated
          # failure never stopped a deploy, and sharding must not quietly change that.
          FAILED=()
          for NAME in "${FUNCS[@]}"; do
            echo "::group::${NAME}"
            if bash .github/scripts/deploy-lambda.sh "$NAME"; then
              echo "✓ ${NAME}"
            else
              echo "::error::${NAME} failed to deploy."
              FAILED+=("$NAME")
            fi
            echo "::endgroup::"
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Shard ${SHARD} failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "Shard ${SHARD}: all ${#FUNCS[@]} functions deployed."
