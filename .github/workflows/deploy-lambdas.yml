name: Deploy Lambdas

# Builds and deploys the actual Lambda code (Terraform only manages the function
# infrastructure + a placeholder; see infra/modules/auth/lambda.tf). For each
# function under lambdas/, this installs the shared requirements, zips the
# package, uploads it to the artifacts bucket, and runs update-function-code.
#
# Shared-space functions (SPEC-062) get their shared code from a Lambda LAYER instead
# of bundling it: the `layer` job builds + publishes the `shared-space-common` layer
# once, and each shared-space function attaches it via update-function-configuration.
# Terraform ignores the function `layers` attribute, so CI owns the layer the same way
# it owns the code. Since SPEC-125 they attach `cpcommon` alongside it — two layers —
# and shared-space-common carries DOMAIN code only, with no external deps of its own.

on:
  # The workflow file itself is in the path filter, for the reason SPEC-139 added it to
  # deploy-infra.yml: without it this workflow can be edited and merged having never run.
  # That is not hypothetical — #320 bumped every action in the repo off the EOL node20
  # runtime, and this file's eight `configure-aws-credentials` call sites went to main
  # completely unexercised, because changing a workflow is not changing `lambdas/**`.
  push:
    branches: [main]
    paths: ['lambdas/**', '.github/workflows/deploy-lambdas.yml']
  workflow_dispatch:

# Resource names are derived deterministically from the same project/environment
# the IaC uses (defaults match infra/variables.tf). Override via repo Variables
# only if you changed TF_VAR_project_name / TF_VAR_environment.
env:
  PROJECT_NAME: ${{ vars.TF_VAR_project_name || 'dat' }}
  ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}

jobs:
  # ── Shared-code layer (SPEC-062) ───────────────────────────────────────────
  # Publishes the `shared-space-common` layer = external deps (PyJWT[crypto]) +
  # the shared common modules, published once. The shared-space functions attach
  # the resulting version ARN (below). Repo's first Lambda layer; a later spec
  # reuses the mechanism for heavier external libraries.
  layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/layer/python"
          rm -rf build/layer && mkdir -p "$LAYER_DIR"
          # SPEC-125: NO pip install here any more. PyJWT[crypto] was this layer's only
          # external dep, and it is now declared once in the cpcommon layer that every
          # shared-space function also attaches — installing it twice would put two copies
          # of cryptography on the same function's 250 MB ceiling.
          # Shared common modules — PRODUCTION files only (never test_*.py / fakes.py).
          # Keep this list in sync with lambdas/shared-space-common/. `clients` is gone
          # (SPEC-125 deleted it in favour of cpcommon.clients).
          for m in config casio auth registry membership cache notify messages teardown; do
            cp "lambdas/shared-space-common/$m.py" "$LAYER_DIR"/
          done
          echo "unzipped_kb=$(du -sk "$LAYER_DIR" | cut -f1)" >> "$GITHUB_OUTPUT"
          (cd build/layer && zip --quiet --recurse-paths ../shared-space-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a connect
          # timeout to STS cost ~7 minutes per attempt, so one job spent 82 minutes failing.
          # Three still retries a fast-failing transient; the slow case is bounded by
          # `timeout-minutes` above, because v4 has no wall-clock option of its own
          # (`action-timeout-s` arrived after it).
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-shared-space-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared-space DOMAIN code (registry/cache/membership/teardown/casio/auth-adapter). Deps + the shared client/config/JWT surface come from the cpcommon layer (SPEC-062, slimmed by SPEC-125)." \
            --zip-file "fileb://build/shared-space-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── polars layer (SPEC-066) ────────────────────────────────────────────────
  # Publishes the `table-builder-polars` layer = polars (Rust-native Parquet/CSV/JSON
  # readers, no pyarrow), attached ONLY to the table-builder infer-schema function
  # (SPEC-069). Built the same way as the shared-space-common layer (the heavy artifact
  # can't be vendored into Terraform), pinned via lambdas/table-builder-infer-schema/
  # requirements.txt, with the unzipped size measured + capped well under Lambda's
  # 250 MB limit (SPEC-066 FR-003).
  polars_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build polars layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/polars-layer/python"
          rm -rf build/polars-layer && mkdir -p "$LAYER_DIR"
          # Plain pip install on the linux x86_64 / python3.12 runner pulls the
          # manylinux polars wheel, ABI-compatible with the python3.12 Lambda runtime
          # (Amazon Linux 2023) — the same proven approach as the shared-space-common
          # layer job above. (polars ships no pyarrow dep, so the layer stays small.)
          pip install --quiet \
            --requirement lambdas/table-builder-infer-schema/requirements.txt \
            --target "$LAYER_DIR"
          UNZIPPED_KB=$(du -sk "$LAYER_DIR" | cut -f1)
          echo "table-builder-polars layer unzipped size: $((UNZIPPED_KB / 1024)) MB"
          echo "unzipped_kb=${UNZIPPED_KB}" >> "$GITHUB_OUTPUT"
          # Lambda's hard limit is 250 MB unzipped (layers + function); fail early with
          # headroom (240 MB) if a future polars bump blows past it (SPEC-066 FR-003).
          # NOTE: this per-layer check is NOT sufficient on its own — the 250 MB ceiling
          # is per-FUNCTION across ALL attached layers plus code, so the deploy job below
          # also runs a COMBINED per-function guard (SPEC-107 FR-004).
          if [ "$UNZIPPED_KB" -gt 245760 ]; then
            echo "::error::table-builder-polars layer exceeds 240 MB unzipped ($((UNZIPPED_KB / 1024)) MB)."
            exit 1
          fi
          (cd build/polars-layer && zip --quiet --recurse-paths ../table-builder-polars-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-table-builder-polars"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "polars (Parquet/CSV/JSON readers) for the table-builder infer-schema verb (SPEC-066/069)." \
            --zip-file "fileb://build/table-builder-polars-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── table-builder-common layer (SPEC-067) ──────────────────────────────────
  # Publishes the `table-builder-common` layer = external deps (PyJWT[crypto]) + the
  # `tbcommon` package (shared auth/registry/clients/config/errors for the verb
  # Lambdas). The table-builder verbs with real code (validate-authorize now; more in
  # SPEC-068/070) attach it instead of bundling. A PACKAGE (python/tbcommon/), not flat
  # modules, so its names don't collide with shared-space-common's under pytest.
  table_builder_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/tbcommon-layer/python"
          rm -rf build/tbcommon-layer && mkdir -p "$LAYER_DIR"
          # No external deps here — PyJWT[crypto] is declared ONCE in the cpcommon layer
          # (SPEC-107 FR-001), which every table-builder verb also attaches. This layer
          # carries only the domain package (production code, no __pycache__).
          cp -r lambdas/table-builder-common/tbcommon "$LAYER_DIR"/tbcommon
          find "$LAYER_DIR"/tbcommon -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "unzipped_kb=$(du -sk "$LAYER_DIR" | cut -f1)" >> "$GITHUB_OUTPUT"
          (cd build/tbcommon-layer && zip --quiet --recurse-paths ../table-builder-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-table-builder-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared tbcommon package + deps (PyJWT) for the table-builder verb Lambdas (SPEC-067)." \
            --zip-file "fileb://build/table-builder-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── table-share-common layer (SPEC-088) ────────────────────────────────────
  # Publishes the `table-share-common` layer = external deps (PyJWT[crypto]) + the
  # `tscommon` package (shared config/clients/auth/registry/copy/notify namespaces
  # for the table-share verb Lambdas — stubs in SPEC-088, filled by SPEC-089→094).
  # A PACKAGE (python/tscommon/), not flat modules, so its names don't collide with
  # shared-space-common's or tbcommon's under pytest. All five table-share verbs
  # attach it (matrix `tscommon: true`).
  table_share_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/tscommon-layer/python"
          rm -rf build/tscommon-layer && mkdir -p "$LAYER_DIR"
          # No external deps here — PyJWT[crypto] is declared ONCE in the cpcommon layer
          # (SPEC-107 FR-001), which every table-share verb also attaches. This layer
          # carries only the domain package (production code, no __pycache__).
          cp -r lambdas/table-share-common/tscommon "$LAYER_DIR"/tscommon
          find "$LAYER_DIR"/tscommon -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "unzipped_kb=$(du -sk "$LAYER_DIR" | cut -f1)" >> "$GITHUB_OUTPUT"
          (cd build/tscommon-layer && zip --quiet --recurse-paths ../table-share-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-table-share-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared tscommon package + deps (PyJWT) for the table-share verb Lambdas (SPEC-088)." \
            --zip-file "fileb://build/table-share-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── control-plane-common layer (SPEC-107) ──────────────────────────────────
  # Publishes the `control-plane-common` layer = external deps (PyJWT[crypto],
  # declared ONCE here) + the `cpcommon` package (shared auth/clients/config/errors/
  # registry/s3_listing/notify/messages/events for EVERY control-plane verb). All ten
  # table-builder + table-share verbs attach it alongside their domain layer; the future
  # data-quality / file-converter verbs will too. A PACKAGE (python/cpcommon/), not flat
  # modules, so its names don't collide with the domain layers' under pytest.
  cpcommon_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/cpcommon-layer/python"
          rm -rf build/cpcommon-layer && mkdir -p "$LAYER_DIR"
          # External deps (manylinux wheels, python3.12-compatible) — PyJWT[crypto],
          # declared once for all control planes (SPEC-107 FR-001).
          pip install --quiet --requirement lambdas/control-plane-common/requirements.txt --target "$LAYER_DIR"
          # The shared package — production code only (no __pycache__).
          cp -r lambdas/control-plane-common/cpcommon "$LAYER_DIR"/cpcommon
          find "$LAYER_DIR"/cpcommon -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "unzipped_kb=$(du -sk "$LAYER_DIR" | cut -f1)" >> "$GITHUB_OUTPUT"
          (cd build/cpcommon-layer && zip --quiet --recurse-paths ../control-plane-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-control-plane-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared cpcommon package + deps (PyJWT) for every control-plane verb Lambda (SPEC-107)." \
            --zip-file "fileb://build/control-plane-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── data-quality-common layer (SPEC-108) ───────────────────────────────────
  # Publishes the `data-quality-common` layer = the `dqcommon` package (the DOMAIN
  # surface: config caps, sql, report, messages, index_store). NO external deps: PyJWT
  # lives once in cpcommon (SPEC-107 FR-001), polars is its own layer below (attached to
  # inspect-source only), and this arc has no Excel engine. All nine data-quality verbs
  # attach this alongside cpcommon.
  dqcommon_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/dqcommon-layer/python"
          rm -rf build/dqcommon-layer && mkdir -p "$LAYER_DIR"
          # No pip install — dqcommon declares no external dependencies (see above).
          cp -r lambdas/data-quality-common/dqcommon "$LAYER_DIR"/dqcommon
          find "$LAYER_DIR"/dqcommon -name '__pycache__' -type d -prune -exec rm -rf {} +
          echo "unzipped_kb=$(du -sk "$LAYER_DIR" | cut -f1)" >> "$GITHUB_OUTPUT"
          (cd build/dqcommon-layer && zip --quiet --recurse-paths ../data-quality-common-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-data-quality-common"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Shared dqcommon domain package for the data-quality verb Lambdas (SPEC-108)." \
            --zip-file "fileb://build/data-quality-common-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  # ── data-quality polars layer (SPEC-108 FR-003) ────────────────────────────
  # polars for the data-quality inspect-source verb ONLY. Unavoidable: Athena requires an
  # explicit column list for Parquet/JSON external tables and does not auto-detect a
  # Parquet schema, so inspect-source must read Parquet footers itself. No fastexcel —
  # this arc does not support Excel. A SEPARATE layer from the table-builder polars layer
  # so each arc's deploy-role grant stays name-scoped to its own arc.
  dq_polars_layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
      unzipped_kb: ${{ steps.build.outputs.unzipped_kb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build polars layer package
        id: build
        run: |
          set -euo pipefail
          LAYER_DIR="build/dq-polars-layer/python"
          rm -rf build/dq-polars-layer && mkdir -p "$LAYER_DIR"
          pip install --quiet \
            --requirement lambdas/data-quality-polars/requirements.txt \
            --target "$LAYER_DIR"
          UNZIPPED_KB=$(du -sk "$LAYER_DIR" | cut -f1)
          echo "data-quality-polars layer unzipped size: $((UNZIPPED_KB / 1024)) MB"
          echo "unzipped_kb=${UNZIPPED_KB}" >> "$GITHUB_OUTPUT"
          # Per-layer sanity cap. NOT sufficient on its own — the 250 MB ceiling is per
          # FUNCTION across all layers plus code, which the combined guard in the deploy
          # job checks (SPEC-107 FR-004). inspect-source (cpcommon + dqcommon + polars) is
          # the function that guard actually has to work for.
          if [ "$UNZIPPED_KB" -gt 245760 ]; then
            echo "::error::data-quality-polars layer exceeds 240 MB unzipped ($((UNZIPPED_KB / 1024)) MB)."
            exit 1
          fi
          (cd build/dq-polars-layer && zip --quiet --recurse-paths ../data-quality-polars-layer.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Publish layer version
        id: publish
        run: |
          set -euo pipefail
          LAYER_NAME="${PROJECT_NAME}-${ENVIRONMENT}-data-quality-polars"
          ARN=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "polars (Parquet footer / CSV / JSON probe) for the data-quality inspect-source verb (SPEC-108/110)." \
            --zip-file "fileb://build/data-quality-polars-layer.zip" \
            --compatible-runtimes python3.12 \
            --query LayerVersionArn --output text)
          echo "Published ${ARN}"
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [layer, polars_layer, table_builder_layer, table_share_layer, cpcommon_layer, dqcommon_layer, dq_polars_layer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        # One entry per function. `name` is both the lambdas/ subdir and the
        # function-name suffix ({project}-{env}-{name}). `layer: true` functions
        # (SPEC-062) get deps + shared code from the shared-space-common layer instead
        # of bundling the shared requirements, and attach it after deploy. `polars: true`
        # functions (SPEC-066) attach the table-builder-polars layer after deploy.
        lambda:
          # The first three SINGLETON functions — no control plane, no domain layer. They
          # attach cpcommon for `observability` (SPEC-137 FR-001), and notifications-writer
          # also for `auth`/`clients` since SPEC-156 FR-004. They are safe here because
          # `cpcommon/__init__.py` imports no submodules and `cpcommon.config` resolves each
          # variable on FIRST ACCESS rather than at import — so a function that sets three of
          # the six (notifications-writer) or none of them (the two Cognito triggers) imports
          # fine, and what it must set is only what it reads. Until SPEC-156 the `_require` ran
          # at import (PR #196), which is exactly why notifications-writer could not use the
          # layer's verifier and grew a second copy of it.
          # (SPEC-146's user-directory-build is a singleton on different terms — see below.)
          #
          # SPEC-137 shipped the instrumented CODE without these three flags, so all three
          # deployed `from cpcommon import observability` with no cpcommon layer attached —
          # ModuleNotFoundError at cold start. On pre-signup that is a Cognito trigger, so it
          # failed real user signups. Nothing caught it: pytest puts the layer on sys.path
          # (lambdas/conftest.py), and `update-function-code` succeeds against a function that
          # cannot import. The guard is now test_deploy_matrix_cpcommon.py, which reads THIS
          # matrix and fails when a module importing cpcommon is missing the flag.
          - { name: pre-signup, layer: false, polars: false, tbcommon: false, cpcommon: true }
          - { name: post-confirmation, layer: false, polars: false, tbcommon: false, cpcommon: true }
          - { name: notifications-writer, layer: false, polars: false, tbcommon: false, cpcommon: true }
          # user-directory-build is a singleton too, but NOT of the kind above: it imports
          # `config` and `clients` alongside `observability` and READS the bucket names, so it
          # needs the variables the two Cognito triggers do not. (Before SPEC-156 the layer's
          # `_require` ran at import and the distinction was cold-start crash vs. no crash; now
          # it is a failure at the read, on whichever branch reads first — narrower, and still
          # a failure.) All six are therefore set in modules/user-directory/lambda.tf,
          # and lambdas/user-directory-build/test_build_directory.py asserts that file against
          # config.py's own `_require` list rather than against a hand-kept copy — so a seventh
          # required variable fails a test instead of a cold start (SPEC-146 FR-008).
          - { name: user-directory-build, layer: false, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-validate, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-create, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-add-members, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-remove-members, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-leave, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-delete, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-forget, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-acknowledge-membership, layer: true, polars: false, tbcommon: false, cpcommon: true }
          - { name: shared-space-notify-failure, layer: true, polars: false, tbcommon: false, cpcommon: true }
          # Table-builder verbs. `tbcommon: true` attaches the table-builder-common layer
          # — ALL five verbs use the shared tbcommon package now (config/clients/errors +
          # notify, SPEC-067/068/069/070/072). infer-schema ALSO attaches the polars layer
          # (both layers, SPEC-069). execute-ddl imports `from tbcommon import config`
          # (SPEC-070) + `notify` (SPEC-072), so it needs the layer too.
          - { name: table-builder-validate-authorize, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-check-table-absent, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-load-table-definition, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-inspect-source, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-infer-schema, layer: false, polars: true, tbcommon: true, cpcommon: true }
          - { name: table-builder-diff-schema, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-apply-refresh, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-execute-ddl, layer: false, polars: false, tbcommon: true, cpcommon: true }
          - { name: table-builder-notify-failure, layer: false, polars: false, tbcommon: true, cpcommon: true }
          # Table-share verbs (SPEC-088). `tscommon: true` attaches the table-share-common
          # layer — all five verbs share the tscommon package (stub namespaces now; real
          # helpers land with SPEC-089→094).
          - { name: table-share-validate-authorize, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          - { name: table-share-inspect-source, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          - { name: table-share-check-target-absent, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          - { name: table-share-copy-objects, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          - { name: table-share-create-table, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          - { name: table-share-notify-failure, layer: false, polars: false, tbcommon: false, tscommon: true, cpcommon: true }
          # Data-quality verbs (SPEC-108). All nine attach cpcommon + dqcommon; only
          # inspect-source also attaches the data-quality polars layer (it must read
          # Parquet footers — Athena needs an explicit column list). Stub handlers now;
          # real logic lands with SPEC-109→112/114.
          - { name: data-quality-validate-authorize, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-inspect-source, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true, dqpolars: true }
          - { name: data-quality-create-temp-tables, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-start-profile-query, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-check-query, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-byte-scan, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-assemble-report, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-drop-temp-tables, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          - { name: data-quality-notify-failure, layer: false, polars: false, tbcommon: false, cpcommon: true, dqcommon: true }
          # Control-plane DLQ drain (SPEC-126). ONE function on all four request DLQs.
          # cpcommon only — it verifies the dead-lettered token and emits a notification,
          # and touches no domain surface at all.
          - { name: control-plane-dlq-drain, layer: false, polars: false, tbcommon: false, cpcommon: true }
          # Structured-logging sweep (SPEC-127). cpcommon only — it needs
          # cpcommon.observability (which is where log-foundry is pinned) and clients, and
          # touches no domain surface. It is also the only PRODUCER in SPEC-127: it instruments
          # itself, which is what proves the pipe end to end without instrumenting a plane.
          - { name: log-sweep, layer: false, polars: false, tbcommon: false, cpcommon: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          set -euo pipefail
          BUILD_DIR="build/${{ matrix.lambda.name }}"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          # Layer functions get their deps from a layer; others bundle the shared
          # requirements. `cpcommon: true` is part of this test because cpcommon is where
          # PyJWT[crypto] is declared now (SPEC-107 FR-001) — a function attaching it must
          # NOT also bundle a second copy (it would double-count against the combined
          # size guard below, and drift).
          if [ "${{ matrix.lambda.layer }}" != "true" ] \
             && [ "${{ matrix.lambda.tbcommon }}" != "true" ] \
             && [ "${{ matrix.lambda.tscommon }}" != "true" ] \
             && [ "${{ matrix.lambda.cpcommon }}" != "true" ]; then
            pip install --quiet --requirement lambdas/requirements.txt --target "$BUILD_DIR"
          fi
          cp lambdas/${{ matrix.lambda.name }}/*.py "$BUILD_DIR"/
          # Never ship tests.
          rm -f "$BUILD_DIR"/test_*.py
          (cd "$BUILD_DIR" && zip --quiet --recurse-paths "../${{ matrix.lambda.name }}.zip" .)

      # ── Combined per-function size guard (SPEC-107 FR-004) ────────────────────
      # Lambda's 250 MB unzipped ceiling is per FUNCTION — the function package PLUS
      # every attached layer, combined. The per-LAYER guards (polars job, etc.) measure
      # one layer in isolation and CANNOT see a combined overflow (e.g. cpcommon +
      # fccommon + polars on one function). This sums the package + the layers THIS
      # function attaches and fails above 240 MB, naming the function, its layers, and
      # the measured total — BEFORE anything publishes or attaches.
      - name: Combined layer + package size guard
        run: |
          set -euo pipefail
          BUILD_DIR="build/${{ matrix.lambda.name }}"
          PKG_KB=$(du -sk "$BUILD_DIR" | cut -f1)
          TOTAL_KB=$PKG_KB
          NAMES="package(${PKG_KB}KB)"
          add() { TOTAL_KB=$((TOTAL_KB + $1)); NAMES="${NAMES} + $2(${1}KB)"; }
          [ "${{ matrix.lambda.layer }}" = "true" ]    && add "${{ needs.layer.outputs.unzipped_kb }}" shared-space-common
          [ "${{ matrix.lambda.polars }}" = "true" ]   && add "${{ needs.polars_layer.outputs.unzipped_kb }}" table-builder-polars
          [ "${{ matrix.lambda.tbcommon }}" = "true" ] && add "${{ needs.table_builder_layer.outputs.unzipped_kb }}" table-builder-common
          [ "${{ matrix.lambda.tscommon }}" = "true" ] && add "${{ needs.table_share_layer.outputs.unzipped_kb }}" table-share-common
          [ "${{ matrix.lambda.cpcommon }}" = "true" ] && add "${{ needs.cpcommon_layer.outputs.unzipped_kb }}" control-plane-common
          [ "${{ matrix.lambda.dqcommon }}" = "true" ] && add "${{ needs.dqcommon_layer.outputs.unzipped_kb }}" data-quality-common
          [ "${{ matrix.lambda.dqpolars }}" = "true" ] && add "${{ needs.dq_polars_layer.outputs.unzipped_kb }}" data-quality-polars
          echo "${{ matrix.lambda.name }} combined unzipped: $((TOTAL_KB / 1024)) MB  [${NAMES}]"
          if [ "$TOTAL_KB" -gt 245760 ]; then
            echo "::error::${{ matrix.lambda.name }} exceeds 240 MB unzipped: $((TOTAL_KB / 1024)) MB across ${NAMES} (Lambda's hard limit is 250 MB per function, package + all layers)."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Upload artifact and deploy
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT_NAME}-lambda-artifacts-${ACCOUNT_ID}"
          FUNCTION="${PROJECT_NAME}-${ENVIRONMENT}-${{ matrix.lambda.name }}"
          KEY="${{ matrix.lambda.name }}/${GITHUB_SHA}.zip"

          # The function + artifacts bucket are created by deploy-infra.yml. When a
          # merge touches both infra/ and lambdas/, both workflows fire on the same
          # push and this one can win the race — so wait for the infrastructure to
          # exist (up to ~5 min) before deploying, instead of failing with
          # NoSuchBucket / ResourceNotFound.
          for attempt in $(seq 1 30); do
            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null \
               && aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
              echo "Infrastructure ready for ${FUNCTION}."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Bucket ${BUCKET} or function ${FUNCTION} not ready after ~5 min. Run Deploy Infrastructure first."
              exit 1
            fi
            echo "Waiting for infrastructure (attempt ${attempt}/30)…"
            sleep 10
          done

          # A just-created function can still be in state Pending/Creating (the same
          # push's Deploy Infrastructure run), and update-function-code then fails
          # with ResourceConflictException — wait for Active first (hit on SPEC-088).
          aws lambda wait function-active-v2 --function-name "$FUNCTION"

          aws s3 cp "build/${{ matrix.lambda.name }}.zip" "s3://${BUCKET}/${KEY}"
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --s3-bucket "$BUCKET" \
            --s3-key "$KEY" \
            --publish
          aws lambda wait function-updated --function-name "$FUNCTION"

          # Attach the function's layers. update-function-configuration --layers REPLACES
          # the whole list, so a function needing more than one layer (infer-schema =
          # cpcommon + table-builder-common + polars, SPEC-069/107) must pass them
          # together in one call. Every table-builder / table-share verb now also attaches
          # the cpcommon layer (SPEC-107).
          LAYERS=()
          [ "${{ matrix.lambda.cpcommon }}" = "true" ] && LAYERS+=("${{ needs.cpcommon_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.layer }}" = "true" ]    && LAYERS+=("${{ needs.layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.polars }}" = "true" ]   && LAYERS+=("${{ needs.polars_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.tbcommon }}" = "true" ] && LAYERS+=("${{ needs.table_builder_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.tscommon }}" = "true" ] && LAYERS+=("${{ needs.table_share_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.dqcommon }}" = "true" ] && LAYERS+=("${{ needs.dqcommon_layer.outputs.layer_arn }}")
          [ "${{ matrix.lambda.dqpolars }}" = "true" ] && LAYERS+=("${{ needs.dq_polars_layer.outputs.layer_arn }}")
          if [ "${#LAYERS[@]}" -gt 0 ]; then
            aws lambda update-function-configuration \
              --function-name "$FUNCTION" \
              --layers "${LAYERS[@]}"
            aws lambda wait function-updated --function-name "$FUNCTION"
          fi
