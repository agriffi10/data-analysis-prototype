name: Publish Config

# Publishes the feature-flag document to every environment's user-space bucket (SPEC-162).
#
# SEPARATE FROM THE SPA'S OWN DEPLOY ON PURPOSE. Flipping a flag must not require rebuilding and
# redeploying the SPA — the document is fetched at runtime, so a publish is the whole change.
# That is also why the upload carries `no-cache`: a flag flipped now must be in force on the
# next fetch, not after a bundle's worth of cache lifetime.
#
# A red publish is a red deploy. Watch it to completion like the other three.

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      # The validator reads this workflow's matrix for its upload targets, so a change to
      # either of these can invalidate a document that was valid when it merged.
      - '.github/workflows/deploy-config.yml'
      - 'scripts/validate_feature_flags.py'
      # The destination bucket is now DERIVED from these two, so an edit to either can
      # change where this document lands. Without them a mapping or resolver change would
      # not retrigger the publish, which is the same staleness the two lines above guard.
      - '.github/config-outputs.json'
      - '.github/scripts/resolve-config.sh'
  workflow_dispatch:

# One publish at a time. The upload addresses a single fixed key, so two concurrent runs
# would race to last-writer-wins on it; serializing makes the last merge the winner, which
# is the correct outcome for a deploy. Not cancel-in-progress, for the same reason no deploy
# workflow is: a cancelled run leaves the question of what is live open.
concurrency:
  group: deploy-config
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        # THIS MATRIX IS THE ONLY DECLARATION OF WHERE THE DOCUMENT IS PUBLISHED, and
        # `scripts/validate_feature_flags.py` reads it: an `environment_name` here with no
        # matching key in config/feature-flags.json's `environments` block fails the job, and
        # so does the reverse. Keep the key named `environment_name` — plain `environment:` is
        # a GitHub Actions job keyword, and the validator refuses to treat one as the other.
        #
        # `bucket_key` names a RUNTIME CONFIGURATION KEY, resolved below from Terraform
        # state through `.github/config-outputs.json` — the same map, and so the same value,
        # the app's own document is built from. It named a repository variable until that
        # variable stopped being the source of truth; a key naming no entry in the map is
        # refused by `scripts/validate_feature_flags.py`, before any AWS call, because an
        # unresolvable key would otherwise reach the copy below as an empty string and
        # target `s3:///_config/...`.
        include:
          - environment_name: prod
            bucket_key: userSpaceBucket

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before any AWS call: a malformed document must never reach a bucket, and the same
      # check ran on the PR. This is the second run, against what is actually about to be
      # uploaded. No package install — the validator is standard-library only for exactly
      # this reason.
      - name: Validate the flag document
        run: python3 scripts/validate_feature_flags.py

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '~1.8'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      # The same backend `deploy-infra.yml` inits against, and the same pinned version.
      - name: OpenTofu init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_VAR_state_bucket }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_VAR_state_lock_table }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # THE DESTINATION COMES FROM TERRAFORM, and the hand-written empty-variable guard this
      # replaces is gone rather than kept beside it: one refusal, in one place, for every
      # value the deploy derives. An absent or empty output fails here, naming the key and
      # the output — the same refusal every consumer of this script gets.
      - name: Resolve the configuration from Terraform state
        id: config
        working-directory: infra
        run: ../.github/scripts/resolve-config.sh --mapping ../.github/config-outputs.json

      # ONE EXACT KEY. No `sync`, no `--delete`, no prefix: `_directory/usernames.json` lives
      # one prefix over in this same bucket, and a mis-scoped reconcile that removed it would
      # break username typeahead everywhere (SPEC-146/147) for a feature nothing user-facing
      # depends on yet.
      #
      # THROUGH `env:`, NOT SPLICED INTO THE SCRIPT. Every other consumer of a resolved value
      # reads it as an environment variable; this was the one interpolated directly into a
      # `run:` body, where GitHub substitutes the text BEFORE the shell sees it — so a value
      # carrying a quote would end the argument and run whatever followed. The bucket name
      # comes from this repo's own state and AWS constrains it to `[a-z0-9.-]`, so it cannot
      # happen today; it is written this way because the resolver spends ten lines keeping the
      # value newline-safe on the way out, and one spliced consumer undoes that.
      - name: Publish the flag document
        env:
          BUCKET: ${{ steps.config.outputs[matrix.bucket_key] }}
        run: |
          aws s3 cp config/feature-flags.json \
            "s3://${BUCKET}/_config/feature-flags.json" \
            --cache-control 'no-cache' \
            --content-type 'application/json'
