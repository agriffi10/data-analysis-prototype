name: Security

# Security scanning across all three surfaces: the SPA (apps/portal), the Lambdas
# (lambdas/) and the IaC (infra/). SPEC-138.
#
# NOT on push to main. `main` builds and deploys — it does not lint or test (see the
# comment at the top of ci.yml). Drift between merges is covered by the weekly schedule.
on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: GitHub's scheduler queues the top of
    # the hour heavily, and a security sweep has no reason to sit in that queue.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── THE GATE ───────────────────────────────────────────────────────────────────
  # `report` — the scanner runs, publishes to the job summary and an artifact, and the
  #            job concludes green.
  # `block`  — a finding fails the job, and therefore the PR.
  #
  # Anything else is a hard error (.github/scripts/apply-gate.sh); a typo must never
  # silently mean "report".
  #
  # SPEC-138 shipped every scanner as `report` — a deliberate first step, because with an
  # unmeasured finding set a day-one gate either reddens main or forces a fix-everything
  # change too large to review honestly. docs/security-baseline.md recorded that first run
  # and proposed a threshold per scanner.
  #
  # GITLEAKS and PIP_AUDIT went `block` on 2026-08-02. Both measured ZERO — no secret across
  # all 357 commits, no advisory across 13 packages — so turning them on cost no remediation
  # at all, and there is no defensible reason to accept a first committed secret or a first
  # vulnerable Python dependency.
  #
  # SEMGREP and CHECKOV joined them on 2026-08-09, each after the one thing standing between
  # it and zero was dealt with:
  #   * Semgrep had exactly one finding, a Flask rule with no Flask under it. It is excluded
  #     by rule ID in the Lambdas scan; the scan is otherwise unnarrowed.
  #   * Checkov could never gate its TOTAL — 373 failures over 22 rules, mostly deliberate
  #     accepts. `GATE_CHECKOV` reads a NARROWED count: only the check IDs in
  #     .github/checkov-enforced.txt, all 52 of them measured at zero. Everything else is
  #     still published and still does not block.
  #
  # NPM_AUDIT stays `report` and cannot yet be `block`: this script has no severity
  # threshold, and the runtime scope still carries accepted dompurify advisories (transitive
  # through monaco, which vendors its own copy). It fails on findings > 0, so the count is not
  # what stands in the way — the acceptance is. See docs/security-baseline.md.
  #
  # Note what is NOT listed here: the two ESLint security plugins (SPEC-138 FR-003). They
  # run in `npm run lint`, which ci.yml NO LONGER INVOKES -- that step is disabled to save
  # Actions minutes -- so the pass that catches injection sinks now runs only in a session's
  # local pre-push gate. Nothing in this workflow covers it and nothing turns red to say so,
  # which means a sink reaches main behind a green PR whenever that gate is skipped.
  GATE_SEMGREP: block
  GATE_NPM_AUDIT: report
  GATE_PIP_AUDIT: block
  GATE_GITLEAKS: block
  GATE_CHECKOV: block
  GATE_ZAP: report

  # ── VERSIONS ───────────────────────────────────────────────────────────────────
  # EVERY SCANNER IS PINNED. Not caution for its own sake: ruff 0.16.0 widened its
  # default rule set from 59 rules to 413 and turned a green main red with 500 findings
  # in files nobody had touched (#311, recorded in pyproject.toml). A security scanner
  # that gains rules on release does exactly that, to every open PR at once, with a
  # scarier label on it. Unpinned, this workflow would be a recurring outage.
  #
  # Bumping one of these is a deliberate, reviewable PR whose diff is the new findings.
  SEMGREP_VERSION: '1.172.0'
  PIP_AUDIT_VERSION: '2.10.1'
  CHECKOV_VERSION: '3.3.9'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  # ── SAST ─────────────────────────────────────────────────────────────────────────
  # Semgrep OSS. Registry rulesets rather than hand-written rules: p/owasp-top-ten is the
  # OWASP coverage this spec was asked for, and the per-language sets carry the framework
  # idioms. No account or token is needed for registry rulesets.
  # ── Every scanner, in ONE job ────────────────────────────────────────────────
  # These were five separate jobs. Each finished in 12-71 seconds and GitHub bills a
  # whole minute per job, so the five cost five billed minutes for about three minutes
  # of scanning — 55% of this workflow's bill was rounding, on every PR.
  #
  # Merging them changes NO coverage: the same five scanners, the same versions, the
  # same gates, the same artifacts. What it changes is that they now share one checkout
  # and one toolchain setup instead of repeating both five times.
  #
  # ── The gate validation was the SIXTH such job, and is now this job's first step ──
  # It ran for a measured 5-11 seconds and was billed a whole minute on every pull
  # request: 49 billed minutes for 6 minutes of work over 2026-08-30..09-01, the worst
  # rounding ratio in the repository.
  #
  # It was a separate job for a real reason, and that reason is answered rather than
  # dropped. The argument was that `needs: gates` is a hard ordering no arrangement of
  # steps reproduces, because every step here is `if: always()` and would run straight
  # through a failed validation. What reproduces it is naming the validation's own
  # outcome: it carries `id: gates` and NO `if:`, so it runs under the default
  # `success()`, and every step below is `always() && steps.gates.outcome == 'success'`.
  # A bad GATE_* value therefore skips all five scanners exactly as a failed `needs` did,
  # and the run still cannot be green while enforcing nothing.
  #
  # `dast` no longer needs it either — it validates the same six values itself, so a
  # failing scanner cannot stop the DAST baseline from reporting, which a `needs: scan`
  # would have introduced.
  #
  # EVERY scanner step is `if: always()`. In five separate jobs no scanner could be
  # skipped by another's failure; merged, the default `success()` would let one broken
  # scanner silently skip the four after it, and this workflow's rule is that "did not
  # run" is never "clean" (SPEC-138). A failing scanner still fails the job — and now the
  # four that follow it still report.
  scan:
    name: Scanners (Semgrep, npm audit, pip-audit, gitleaks, Checkov)
    runs-on: ubuntu-latest
    # NOT the sum of the five it replaces (85). Serialising them means a single hung
    # scanner now burns the whole budget as BILLED minutes, where before it burned its
    # own job's 20 and the other four still finished — so the merge has to bring the
    # ceiling down, not carry it over. The five together measure ~3 minutes at p90;
    # 30 is ten times that, and a scanner that genuinely needs more should fail here
    # and be looked at rather than quietly costing half an hour a run.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # gitleaks scans the branch's FULL HISTORY, so its checkout must not be shallow.
        # It had its own job and its own checkout before; sharing one now means this
        # setting is load-bearing for the whole job.
        with:
          fetch-depth: 0

      # FIRST, and deliberately WITHOUT `if:` — the default `success()` is what makes this
      # a gate rather than a report. Every scanner below tests `steps.gates.outcome`, so a
      # GATE_* value this workflow does not understand skips all five instead of letting
      # the run go green while enforcing nothing.
      - name: Validate every gate value
        id: gates
        run: |
          chmod +x .github/scripts/apply-gate.sh
          for name in SEMGREP NPM_AUDIT PIP_AUDIT GITLEAKS CHECKOV ZAP; do
            var="GATE_${name}"
            .github/scripts/apply-gate.sh "$name" "${!var}" 0
          done

      - name: Record the gate configuration in the summary
        run: |
          {
            echo "## Security scan"
            echo
            echo "| Scanner | Gate |"
            echo "|---|---|"
            for name in SEMGREP NPM_AUDIT PIP_AUDIT GITLEAKS CHECKOV ZAP; do
              var="GATE_${name}"
              echo "| ${name} | \`${!var}\` |"
            done
            echo
            echo "\`report\` scanners publish findings and conclude green (SPEC-138)."
            echo "There is no GitHub Security tab on this repository — this summary and the"
            echo "uploaded artifacts are where findings live."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # `.nvmrc`, exactly as the npm-audit job had it. Pinning a literal here would
          # let the audit run against a different Node than the one the repo targets.
          node-version-file: .nvmrc

      # ── Semgrep ─────────────────────────────────────────────────────
      - name: Install Semgrep
        if: always() && steps.gates.outcome == 'success'
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan the SPA
        if: always() && steps.gates.outcome == 'success'
        # --metrics=off: semgrep's default ("auto") phones home when registry rules are
        # used. This is a private repository; its file paths and rule hits are not usage
        # telemetry we are choosing to send.
        #
        # Vendored code and build output are excluded. A vulnerable dependency is
        # npm audit's finding (FR-004), not SAST's, and scanning node_modules would bury
        # the handful of real results under thousands of them.
        #
        # Test files ARE scanned. A hard-coded credential-shaped string in a test is worth
        # seeing even if the disposition ends up "accepted".
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/react \
            --config p/typescript \
            --config p/javascript \
            --metrics=off \
            --json --output semgrep-portal.json \
            --exclude=node_modules --exclude=dist --exclude=coverage \
            apps/portal/src
          rc=$?
          set -e
          # 0 = clean, 1 = findings, >=2 = semgrep itself failed. A scanner that could not
          # run must fail the job even under gate=report: "0 findings" from a broken
          # scanner is worse than no scanner, because it reads as evidence. This repo has
          # already paid for that once — SPEC-137 shipped behind three gates that were all
          # satisfied by an import that could never resolve.
          if [ $rc -ge 2 ]; then
            echo "::error title=Semgrep::semgrep exited $rc — the scan did not complete."
            exit $rc
          fi

      - name: Scan the Lambdas
        if: always() && steps.gates.outcome == 'success'
        # --exclude-rule: the one accepted false positive, and the reason GATE_SEMGREP can be
        # `block`. `p/owasp-top-ten` pulls Flask's rules in as part of its Python set, and
        # `directly-returned-format-string` is a template-injection check about returning a
        # format string as an HTTP response. There is no Flask and no HTTP response anywhere
        # in this fleet — the control planes are queue-driven Lambdas.
        #
        # Excluded by RULE ID, not by narrowing the ruleset: dropping p/owasp-top-ten to
        # silence one rule would drop everything else it brings. If a second exclusion is
        # ever needed it gets its own disposition in docs/security-baseline.md; a test
        # asserts there is exactly one.
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --metrics=off \
            --json --output semgrep-lambdas.json \
            --exclude=__pycache__ \
            --exclude-rule=python.flask.security.audit.directly-returned-format-string.directly-returned-format-string \
            lambdas
          rc=$?
          set -e
          if [ $rc -ge 2 ]; then
            echo "::error title=Semgrep::semgrep exited $rc — the scan did not complete."
            exit $rc
          fi

      - name: Summarize (Semgrep)
        if: always() && steps.gates.outcome == 'success'
        run: |
          total=0
          for pair in "SPA:semgrep-portal.json" "Lambdas:semgrep-lambdas.json"; do
            label="${pair%%:*}"; file="${pair##*:}"
            [ -f "$file" ] || { echo "::warning::$file missing — the $label scan did not produce output."; continue; }

            count=$(jq '.results | length' "$file")
            : > body.md
            if [ "$count" -gt 0 ]; then
              {
                echo "| Severity | Rule | Location |"
                echo "|---|---|---|"
                # Capped, and the cap is stated rather than silent — a truncated table
                # that looks complete is how a reviewer concludes they have seen
                # everything. The artifact always holds the full set.
                jq -r '.results[] | "| \(.extra.severity) | `\(.check_id)` | `\(.path):\(.start.line)` |"' "$file" | head -100
                if [ "$count" -gt 100 ]; then
                  echo
                  echo "_Showing the first 100 of ${count}. The full set is in the \`semgrep\` artifact._"
                fi
              } > body.md
            fi
            .github/scripts/summary-section.sh "Semgrep — $label" "$count" body.md
            total=$((total + count))

            # PARSE COVERAGE, reported separately and always. Semgrep downgrades a file it
            # cannot fully parse to a warning and carries on, so a region of code can be
            # silently unscanned while the job prints "0 findings". That number is only
            # meaningful next to this one. (At time of writing: 5 test files, on the
            # `vi.fn<...>()` explicit-type-argument syntax.)
            errs=$(jq '.errors | length' "$file")
            if [ "$errs" -gt 0 ]; then
              {
                echo "> **$errs file(s) parsed only partially** — regions of these were not scanned, so the finding count above does not cover them:"
                echo ">"
                jq -r '[.errors[].path] | unique | .[] | "> - `\(.)`"' "$file"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "SEMGREP_FINDINGS=$total" >> "$GITHUB_ENV"

      - name: Upload raw output (Semgrep)
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: semgrep
          path: semgrep-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate (Semgrep)
        if: always() && steps.gates.outcome == 'success'
        run: .github/scripts/apply-gate.sh Semgrep "$GATE_SEMGREP" "${SEMGREP_FINDINGS:-0}"

  # ── DEPENDENCIES (npm) ───────────────────────────────────────────────────────────
  # Two scopes, reported SEPARATELY, because for a static SPA they mean different things:
  #   --omit=dev  is what actually reaches a user's browser. This is the gating candidate.
  #   full        adds the build toolchain — a supply-chain concern, but not a runtime one.
  # The distinction sets the order of work, and severity does not: this repo has cleared
  # HIGHs that reached no user and is still carrying lower-rated advisories that do ship.
  # One combined number would lose exactly that. Which packages sit on which side changes;
  # docs/security-baseline.md holds the current roll-call.

      # ── npm audit ───────────────────────────────────────────────────
      - name: Install dependencies
        if: always() && steps.gates.outcome == 'success'
        run: npm ci

      - name: Audit (npm audit)
        if: always() && steps.gates.outcome == 'success'
        run: |
          set +e
          npm audit --json --omit=dev > npm-audit-runtime.json
          npm audit --json > npm-audit-full.json
          set -e
          # npm audit exits non-zero merely because vulnerabilities exist, which under
          # gate=report is not a failure. What IS a failure is unparseable output — that
          # means the audit did not run, and a missing total must never read as zero.
          for f in npm-audit-runtime.json npm-audit-full.json; do
            if ! jq -e '.metadata.vulnerabilities.total' "$f" >/dev/null 2>&1; then
              echo "::error title=npm audit::$f is not valid audit output — the audit did not complete."
              exit 1
            fi
          done

      - name: Summarize (npm audit)
        if: always() && steps.gates.outcome == 'success'
        run: |
          total=0
          for pair in "Runtime (--omit=dev — ships to the browser):npm-audit-runtime.json" \
                      "Full (adds the build toolchain):npm-audit-full.json"; do
            label="${pair%%:*}"; file="${pair##*:}"
            [ -f "$file" ] || continue
            count=$(jq '.metadata.vulnerabilities.total' "$file")
            : > body.md
            if [ "$count" -gt 0 ]; then
              {
                echo "| Severity | Package | Vulnerable range | Fix |"
                echo "|---|---|---|---|"
                jq -r '.vulnerabilities | to_entries[] | "| \(.value.severity) | `\(.key)` | `\(.value.range)` | " +
                       (if .value.fixAvailable == true then "available"
                        elif .value.fixAvailable == false then "**none**"
                        else "`\(.value.fixAvailable.name)@\(.value.fixAvailable.version)`" +
                             (if .value.fixAvailable.isSemVerMajor then " (breaking)" else "" end)
                        end) + " |"' "$file"
              } > body.md
            fi
            .github/scripts/summary-section.sh "npm audit — $label" "$count" body.md
            total=$((total + count))
          done
          # The gate reads the RUNTIME total. A build-time advisory is real but it is not
          # the thing a user is exposed to, and gating both on one number would make the
          # runtime signal impossible to act on independently. The full-scope count is
          # published above regardless.
          echo "NPM_FINDINGS=$(jq '.metadata.vulnerabilities.total' npm-audit-runtime.json)" >> "$GITHUB_ENV"

      - name: Upload raw output (npm audit)
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          path: npm-audit-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate (npm audit)
        if: always() && steps.gates.outcome == 'success'
        run: .github/scripts/apply-gate.sh "npm audit" "$GATE_NPM_AUDIT" "${NPM_FINDINGS:-0}"

  # ── DEPENDENCIES (Python) ────────────────────────────────────────────────────────

      # ── pip-audit ───────────────────────────────────────────────────
      - name: Install pip-audit
        if: always() && steps.gates.outcome == 'success'
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit every requirements file
        if: always() && steps.gates.outcome == 'success'
        # DISCOVERED BY GLOB, never listed. A new layer's requirements.txt must be audited
        # the day it is added — this fleet grows a layer per control plane, and a list here
        # would silently stop covering the newest one. That is how ci.yml's install block
        # has to be maintained by hand; this does not.
        run: |
          args=()
          while IFS= read -r req; do
            echo "auditing: $req"
            args+=(-r "$req")
          done < <(find lambdas -name 'requirements*.txt' | sort)
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error title=pip-audit::no requirements files found under lambdas/ — the glob is wrong."
            exit 1
          fi
          set +e
          pip-audit "${args[@]}" --format json --progress-spinner off > pip-audit.json
          rc=$?
          set -e
          if ! jq -e '.dependencies' pip-audit.json >/dev/null 2>&1; then
            echo "::error title=pip-audit::exited $rc without valid output — the audit did not complete."
            exit 1
          fi

      - name: Summarize (pip-audit)
        if: always() && steps.gates.outcome == 'success'
        run: |
          count=$(jq '[.dependencies[] | select(.vulns | length > 0)] | length' pip-audit.json)
          audited=$(jq '.dependencies | length' pip-audit.json)
          : > body.md
          if [ "$count" -gt 0 ]; then
            {
              echo "| Package | Installed | Advisory | Fixed in |"
              echo "|---|---|---|---|"
              jq -r '.dependencies[] | select(.vulns | length > 0) | . as $d | .vulns[] |
                     "| `\($d.name)` | `\($d.version)` | \(.id) | " +
                     (if (.fix_versions | length) > 0 then "`\(.fix_versions | join(", "))`" else "**none**" end) + " |"' \
                     pip-audit.json
            } > body.md
          fi
          .github/scripts/summary-section.sh "pip-audit — $audited package(s) audited" "$count" body.md
          echo "PIP_FINDINGS=$count" >> "$GITHUB_ENV"

      - name: Upload raw output (pip-audit)
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate (pip-audit)
        if: always() && steps.gates.outcome == 'success'
        run: .github/scripts/apply-gate.sh pip-audit "$GATE_PIP_AUDIT" "${PIP_FINDINGS:-0}"

  # ── SECRETS ──────────────────────────────────────────────────────────────────────

      # ── gitleaks ────────────────────────────────────────────────────
      - name: Install gitleaks
        if: always() && steps.gates.outcome == 'success'
        # The binary directly, not gitleaks-action: that action requires a GITLEAKS_LICENSE
        # for organization accounts. This repo is on a personal account today, and coupling
        # the secret scan to that fact would break it the day the repo moves to an org.
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan (gitleaks)
        if: always() && steps.gates.outcome == 'success'
        # --redact: a secret scanner that prints the secret into a CI log has widened the
        # exposure, not closed it. The repo's own field rule (docs/decisions/control-planes.md — tokens and
        # emails never leave the process) applies to CI output for the same reason.
        run: |
          set +e
          ./gitleaks git --redact --report-format json --report-path gitleaks.json .
          rc=$?
          set -e
          # 0 = clean, 1 = leaks found, anything else = gitleaks failed.
          if [ $rc -gt 1 ]; then
            echo "::error title=gitleaks::exited $rc — the scan did not complete."
            exit $rc
          fi

      - name: Summarize (gitleaks)
        if: always() && steps.gates.outcome == 'success'
        run: |
          count=0
          [ -f gitleaks.json ] && count=$(jq 'length' gitleaks.json)
          : > body.md
          if [ "$count" -gt 0 ]; then
            {
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              # Deliberately no Secret/Match column — the finding is actionable from its
              # location, and reproducing the value here would undo --redact.
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:8])` |"' gitleaks.json
            } > body.md
          fi
          .github/scripts/summary-section.sh "gitleaks — full history" "$count" body.md
          echo "GITLEAKS_FINDINGS=$count" >> "$GITHUB_ENV"

      - name: Upload raw output (gitleaks)
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks
          path: gitleaks.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Apply gate (gitleaks)
        if: always() && steps.gates.outcome == 'success'
        run: .github/scripts/apply-gate.sh gitleaks "$GATE_GITLEAKS" "${GITLEAKS_FINDINGS:-0}"

  # ── IaC ──────────────────────────────────────────────────────────────────────────
  #
  # ⚠ KNOWN BLIND SPOT — READ THIS BEFORE TRUSTING A GREEN CHECKOV JOB.
  #
  # Checkov parses `.tf`. The IAM policies that implement this system's ENTIRE isolation
  # model live in `.tftpl` templates rendered by templatefile() at plan time, and Checkov
  # sees those as opaque strings. The ${aws:PrincipalTag/username} conditions, the shared
  # portal role's scoping, the per-bucket DATA_LOCATION_ACCESS grants, the control-plane
  # role boundaries — NONE of that is covered here.
  #
  # A green job on this step means "no resource-level misconfiguration in the HCL". It is
  # not, and must not be read as, evidence that the authorization model is sound.
  #
  # THAT GAP IS NOW COVERED ELSEWHERE (SPEC-139): deploy-infra.yml's plan job scans the
  # rendered `tofu show -json` plan, where the policies are real documents. It evaluates
  # 431 IAM checks against 55 IAM resources; this step evaluates zero. Read the two
  # together — they are complementary, and neither subsumes the other. This one runs on
  # every PR and weekly; that one runs only when infra/** changes, which is the only way
  # an IAM policy can change.

      # ── Checkov ─────────────────────────────────────────────────────
      - name: Install Checkov
        if: always() && steps.gates.outcome == 'success'
        run: pip install "checkov==${CHECKOV_VERSION}"

      # Both Checkov scans below go through .github/scripts/checkov-scan.sh, which refuses to
      # scan if Checkov reports taking configuration from anywhere but its command line: a
      # `.checkov.yml` in the scanned directory, the repo root or $HOME, or a flag's
      # environment variable. That refusal never fires on a normal run, so this proves it
      # still does, against the scanner just installed, before either gate relies on it.
      - name: Prove the scans refuse configuration they were not given
        if: always() && steps.gates.outcome == 'success'
        run: .github/scripts/checkov-scan-test.sh

      - name: Scan infra/
        if: always() && steps.gates.outcome == 'success'
        # --soft-fail: checkov exits 1 merely because checks failed, which under
        # gate=report is not a job failure. The count comes from the JSON instead, and the
        # "did it actually run" question is answered by the JSON being parseable — not by
        # an exit code that means two different things.
        #
        # OpenTofu's .tf parses as terraform; there is no separate framework for it.
        #
        # NO --quiet: it strips passed_checks, and the enforced gate below cannot tell "this
        # check passed" from "this check never ran" without them. Those two must never look
        # alike. deploy-infra.yml's plan scan carries the same constraint for the same
        # reason, and a test in lambdas/test_security_gates.py pins the flag's absence.
        #
        # THROUGH checkov-scan.sh, never bare, for the reason given at the corpus step above.
        # A refusal writes nothing, so the JSON check below fails the step.
        run: |
          .github/scripts/checkov-scan.sh -d infra \
            --framework terraform \
            --skip-path '.terraform' \
            --output json --compact --soft-fail > checkov.json || true
          if ! jq -e '(if type=="array" then .[0] else . end) | .summary.failed' checkov.json >/dev/null 2>&1; then
            echo "::error title=Checkov::output is not valid — the scan did not complete."
            exit 1
          fi

      - name: Summarize (Checkov)
        if: always() && steps.gates.outcome == 'success'
        run: |
          norm='(if type=="array" then .[0] else . end)'
          count=$(jq "$norm | .summary.failed" checkov.json)
          passed=$(jq "$norm | .summary.passed" checkov.json)
          parse_errs=$(jq "$norm | .summary.parsing_errors" checkov.json)
          : > body.md
          if [ "$count" -gt 0 ]; then
            {
              # GROUPED BY RULE, not one row per resource. 305 failures across 25 rules is
              # the real shape here — 32 Lambdas each missing the same VPC check is one
              # decision to make, not 32. A flat list would be unreadable and would hide
              # the handful of rules that matter among the ones that do not apply.
              echo "| Count | Check | Rule | Example resource |"
              echo "|---|---|---|---|"
              jq -r "$norm | .results.failed_checks | group_by(.check_id) | sort_by(-length) | .[] |
                     \"| \(length) | \`\(.[0].check_id)\` | \(.[0].check_name) | \`\(.[0].resource)\` |\"" checkov.json
              echo
              echo "_${passed} check(s) passed. Per-resource detail is in the \`checkov\` artifact._"
              echo
              echo "> **Coverage gap:** the IAM policies in \`.tftpl\` templates are opaque to Checkov."
              echo "> A green result here says nothing about the \`\${aws:PrincipalTag/username}\` isolation model."
              echo
              echo "> **What blocks:** only the check IDs in \`.github/checkov-enforced.txt\`, each held at zero."
              echo "> The count above is every failure, most with a documented disposition in \`docs/security-baseline.md\`."
            } > body.md
          fi
          .github/scripts/summary-section.sh "Checkov — infra/" "$count" body.md

          # Unparsed HCL is unscanned HCL. Same failure shape as Semgrep's partial parses:
          # the failure count is only meaningful if everything was actually read.
          if [ "$parse_errs" -gt 0 ]; then
            echo "::error title=Checkov::$parse_errs file(s) failed to parse — infra/ was not fully scanned."
            exit 1
          fi

          # The FULL count, published above. The gate reads the enforced subset instead,
          # computed in the next step — this write exists so that a run which somehow ends
          # between here and there leaves the gate holding a failing number rather than
          # nothing. It is belt to the sentinel's braces, not the primary defence.
          echo "CHECKOV_FINDINGS=$count" >> "$GITHUB_ENV"

      # THE GATE'S NUMERATOR. `count` above is every failure, most of them documented
      # accepts (no VPC, no CMK, no X-Ray); blocking on it would mean suppressing twenty
      # rules to enforce five. This narrows it to the checks .github/checkov-enforced.txt
      # holds at zero. The script hard-errors if an enforced ID was evaluated against
      # nothing, so a typo or a renamed check cannot read as enforcement.
      #
      # ASSIGN, THEN ECHO — never `echo "VAR=$(script)"`. A command substitution that fails
      # inside an argument to `echo` does NOT fail the step: `echo` exits 0, `set -e` sees
      # success, and the empty value it wrote wins over the pessimistic record above. An
      # assignment is the one construct whose substitution failure `set -e` acts on. Every
      # hard error this script raises reached the gate as a silent green until this changed.

      - name: Narrow to the enforced checks
        if: always() && steps.gates.outcome == 'success'
        run: |
          findings=$(.github/scripts/checkov-enforced.sh checkov.json .github/checkov-enforced.txt)
          echo "CHECKOV_FINDINGS=$findings" >> "$GITHUB_ENV"

      # ── Checkov, dockerfile framework ───────────────────────────────
      # THE SAME PINNED SCANNER, A SECOND FRAMEWORK. Nothing is added, removed or re-pinned:
      # `CHECKOV_VERSION` above installs one binary and this asks it a second question, about
      # the Lambda fleet's container image. Before this, no scanner in this repository looked
      # at any Dockerfile.
      #
      # SCOPED TO ONE FILE, and that is a decision rather than an oversight.
      # `apps/portal/Dockerfile` is also unscanned, and it PASSES `CKV_DOCKER_3` (it sets
      # `USER 101`) where a Lambda image cannot — so a single shared enforce list would have to
      # drop that check and could then never enforce it for the SPA. Covering both properly
      # wants a list per Dockerfile; the gap is recorded in docs/security-baseline.md rather
      # than half-closed here.
      #
      # `--soft-fail`, the parse check and the wrapper for the same reasons the terraform scan
      # gives: the exit code means two different things, "did not run" is never "clean", and
      # the scan's configuration is its command line and nothing Checkov finds on disk.
      - name: Scan lambdas/Dockerfile
        if: always() && steps.gates.outcome == 'success'
        run: |
          .github/scripts/checkov-scan.sh -f lambdas/Dockerfile \
            --framework dockerfile \
            --output json --compact --soft-fail > checkov-dockerfile.json || true
          if ! jq -e '(if type=="array" then .[0] else . end) | .summary.failed' checkov-dockerfile.json >/dev/null 2>&1; then
            echo "::error title=Checkov (dockerfile)::output is not valid — the scan did not complete."
            exit 1
          fi

      # Its findings ADD to the gate's numerator rather than replacing it, so one number still
      # decides the job and a regression in either framework blocks. Assign-then-echo, never
      # `echo "VAR=$(script)"`, for the reason stated above the terraform narrowing.
      # ITS FINDINGS ADD TO THE GATE'S NUMERATOR, so one number still decides the job and a
      # regression in either framework blocks. Assign-then-echo, never `echo "VAR=$(script)"`,
      # for the reason stated above the terraform narrowing.
      #
      # NO NUMERIC DEFAULT ON THE RUNNING TOTAL. `${CHECKOV_FINDINGS:-0}` would substitute on
      # EMPTY as well as unset, so a terraform narrowing that hard-errored — leaving the variable
      # unwritten — would become "clean" here, which is precisely the shape apply-gate.sh's
      # `no-count` sentinel exists to refuse. If the terraform half did not produce a number,
      # this leaves it unproduced and the gate hard-errors on it.
      - name: Narrow the dockerfile scan to its enforced checks
        if: always() && steps.gates.outcome == 'success'
        run: |
          findings=$(.github/scripts/checkov-enforced.sh checkov-dockerfile.json .github/checkov-dockerfile-enforced.txt)
          echo "CHECKOV_DOCKERFILE_FINDINGS=$findings" >> "$GITHUB_ENV"
          if [ -z "${CHECKOV_FINDINGS:-}" ]; then
            echo "::error title=Checkov::the terraform narrowing produced no count, so the two frameworks cannot be totalled. Refusing to substitute a zero."
            exit 1
          fi
          echo "CHECKOV_FINDINGS=$(( CHECKOV_FINDINGS + findings ))" >> "$GITHUB_ENV"

      - name: Summarize (Checkov, dockerfile)
        if: always() && steps.gates.outcome == 'success'
        run: |
          norm='(if type=="array" then .[0] else . end)'
          passed=$(jq "$norm | .summary.passed" checkov-dockerfile.json)
          failed=$(jq "$norm | .summary.failed" checkov-dockerfile.json)
          : > docker-body.md
          {
            echo "\`lambdas/Dockerfile\`: ${passed} passed, ${failed} failed;"
            echo "**${CHECKOV_DOCKERFILE_FINDINGS:-?}** on an enforced check."
            echo
            echo "> The two standing failures — no \`HEALTHCHECK\` and no \`USER\` — are properties of"
            echo "> a Lambda container rather than of this one, and are dispositioned in"
            echo "> \`docs/security-baseline.md\`. \`apps/portal/Dockerfile\` is not scanned; see the same file."
          } >> docker-body.md
          .github/scripts/summary-section.sh "Checkov — lambdas/Dockerfile" "$failed" docker-body.md

      - name: Upload raw output (Checkov)
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: checkov
          path: |
            checkov.json
            checkov-dockerfile.json
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate (Checkov)
        if: always() && steps.gates.outcome == 'success'
        # `no-count`, not `0`. `:-` substitutes on empty as well as unset, so a default of 0
        # turns "the narrowing step never wrote a number" into "clean" — the exact shape this
        # workflow exists to refuse. apply-gate.sh rejects a non-numeric count as a hard
        # error, which is what an absent count is. ZAP's `no-report` does the same thing.
        run: .github/scripts/apply-gate.sh Checkov "$GATE_CHECKOV" "${CHECKOV_FINDINGS:-no-count}"

  # ── DAST ─────────────────────────────────────────────────────────────────────────
  # OWASP ZAP baseline against the deployed portal.
  #
  # NOT on pull_request: a PR has not been deployed, so scanning would hit whatever main
  # last shipped and attribute the result to the wrong change — worse than not scanning.
  #
  # The scan is UNAUTHENTICATED and passive. It spiders and reports; it does not attack.
  # Against a Cognito-gated SPA that means it reaches the static shell and the response headers
  # the container serves, so what it can find is essentially OWASP A05 Security
  # Misconfiguration: CSP, HSTS, X-Content-Type-Options, X-Frame-Options, cookie flags.
  # A green run here is NOT evidence about anything behind the login.

  dast:
    name: DAST (OWASP ZAP baseline)
    # No `needs:`. It used to depend on the `gates` job; now that the validation is a step
    # rather than a job, `needs: scan` would be the only way to inherit it — and that is a
    # DIFFERENT guarantee: it would let a failing scanner stop this baseline from running
    # at all, in a workflow whose rule is that "did not run" is never "clean". Validating
    # the same six values here costs one second and keeps the two jobs independent.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same six values `scan` validates, for the same reason and by the same script:
      # GATE_ZAP is read below, and a value this workflow does not understand must fail the
      # run rather than be treated as `report`.
      - name: Validate every gate value
        run: |
          chmod +x .github/scripts/apply-gate.sh
          for name in SEMGREP NPM_AUDIT PIP_AUDIT GITLEAKS CHECKOV ZAP; do
            var="GATE_${name}"
            .github/scripts/apply-gate.sh "$name" "${!var}" 0
          done

      - name: Resolve the target
        id: target
        run: |
          url="${{ vars.VITE_APP_URL }}"
          if [ -z "$url" ]; then
            # Skip loudly rather than fail, and never fall back to a default target —
            # scanning a host we did not mean to scan is worse than not scanning.
            echo "::warning title=ZAP::vars.VITE_APP_URL is not set — skipping the DAST scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: ZAP baseline scan
        if: steps.target.outputs.skip == 'false'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          # The action opens a GitHub issue per run by default. On a report-only baseline
          # that is a weekly issue restating the same response headers.
          allow_issue_writing: false
          # NO `-J` HERE. The action already passes `-J report_json.json` and appends
          # cmd_options after it, so a second `-J` wins on argparse and the file the
          # action then reads back is never written — it fails the step with "File
          # report_json.json does not exist", *outside* the `fail_action` guard. That
          # is what reddened the 2026-08-03 scan, which had otherwise completed
          # cleanly (FAIL-NEW: 0, WARN-NEW: 15). `-a` alone is what we actually want.
          cmd_options: '-a'
          fail_action: false

      - name: Summarize
        if: always() && steps.target.outputs.skip == 'false'
        run: |
          count=0
          : > body.md
          report=report_json.json
          if [ -n "$report" ] && [ -s "$report" ]; then
            count=$(jq '[.site[]?.alerts[]?] | length' "$report")
            if [ "$count" -gt 0 ]; then
              {
                echo "| Risk | Alert | Instances |"
                echo "|---|---|---|"
                jq -r '[.site[]?.alerts[]?] | .[] | "| \(.riskdesc) | \(.alert) | \(.instances | length) |"' "$report"
                echo
                echo "> Unauthenticated scan of the pre-login surface only. Says nothing about pages behind Cognito."
              } > body.md
            fi
          else
            # SPEC-153 FR-008. This used to warn and then pass `0` to the gate anyway —
            # harmless under `report`, but under `block` a scanner that produced nothing
            # would have read as a clean pass, which is exactly what docs/decisions/gates-and-tests.md forbids
            # with "'did not run' is never 'clean'". A scan that ran and left no readable
            # report is a BROKEN SCAN, and a broken scan fails its job in every gate mode.
            # This is a different condition from the deliberate no-target skip above, which
            # is a written decision and is unchanged: that path never reaches this step.
            echo "::error title=ZAP::the scan ran but produced no readable JSON report at" \
                 "'$report'. This is a BROKEN SCAN, not a clean one — no finding count can" \
                 "be derived from it. (A scan that completed and found nothing writes a" \
                 "report with an empty alerts array and is reported as 0 findings.)"
            .github/scripts/summary-section.sh \
              "OWASP ZAP baseline — ${{ steps.target.outputs.url }}" "scan produced no report" body.md
            exit 1
          fi
          .github/scripts/summary-section.sh "OWASP ZAP baseline — ${{ steps.target.outputs.url }}" "$count" body.md
          echo "ZAP_FINDINGS=$count" >> "$GITHUB_ENV"

      - name: Upload raw output
        if: always() && steps.target.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: zap
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate
        if: always() && steps.target.outputs.skip == 'false'
        # The default is a SENTINEL, not 0 (SPEC-153 FR-008). ZAP_FINDINGS is unset only when
        # Summarize did not reach its export — i.e. the scan produced no report — and
        # apply-gate.sh hard-errors on a non-numeric count in every gate mode. Defaulting to
        # 0 here would have printed "ZAP: no findings" on a job that never counted anything.
        run: .github/scripts/apply-gate.sh ZAP "$GATE_ZAP" "${ZAP_FINDINGS:-no-report}"
