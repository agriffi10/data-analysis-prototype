name: Deploy App

on:
  push:
    branches: [main]

# SERIALIZE DEPLOYS. Without this, two merges close together run two jobs in parallel and
# job A's "Reconcile deletions" pass lists assets/ at ITS execution time, deleting every
# key absent from A's dist/ — including the chunks B has just uploaded — while B's
# index.html is already live at the root. That is the exact white screen SPEC-141 exists to
# fix, arriving by a different route. The window is not theoretical: the delete pass runs
# ~47 s into the job.
#
# cancel-in-progress is FALSE, unlike security.yml's scanner runs. Cancelling a deploy
# mid-sync leaves the bucket half-updated — a new index.html pointing at chunks the
# cancelled job never uploaded — which is worse than the queueing it saves. Every push to
# main must complete; the last one to run wins, which is the correct outcome for a deploy.
concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # THE VALUES COME FROM TERRAFORM STATE, not from a settings page. Every derived value
      # this job renders — the API's origin, the bucket names, the Cognito identifiers — is
      # something Terraform computes, and each one used to arrive as a repository variable a
      # person had copied out of `tofu output` by hand. That made a repoint in infrastructure
      # silently wrong in the browser until somebody remembered to re-copy it, and an unset
      # variable interpolated to the EMPTY STRING, which satisfies a required Terraform
      # variable, overrides its default, and passes every presence test there is.
      #
      # The four steps below replace that transport: set up OpenTofu, assume the deploy role,
      # init the same backend `deploy-infra.yml` uses, and resolve. No grant was added —
      # reading state is one the role has always held, and that is asserted in
      # `lambdas/test_config_outputs.py` rather than assumed.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '~1.8'

      # BEFORE THE RESOLVE, because the state lives in S3 and reading it is an AWS call. It is
      # a read: the resolve's refusal still lands before anything in this job WRITES, which is
      # what keeps a failed resolve from leaving a half-updated site behind.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a connect
          # timeout to STS cost ~7 minutes per attempt, so one job spent 82 minutes failing.
          # Three still retries a fast-failing transient; the slow case is bounded by
          # `timeout-minutes` above, because v4 has no wall-clock option of its own
          # (`action-timeout-s` arrived after it).
          retry-max-attempts: 3

      # The same backend `deploy-infra.yml` inits against, and the same pinned version. A test
      # DERIVES the set of workflows declaring an OpenTofu version and asserts they agree on
      # one constraint string — derived rather than counted, because another consumer is
      # coming and a hard-coded count would keep passing while that one drifted.
      - name: OpenTofu init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_VAR_state_bucket }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_VAR_state_lock_table }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # ONE `tofu output -json`, one step output per configuration key. An absent or empty
      # value fails the job here, naming both the configuration key and the output it came
      # from — the failure this replaces was an empty string that reached AWS as
      # `s3:///_config/...`, far from its cause.
      - name: Resolve the configuration from Terraform state
        id: config
        working-directory: infra
        run: ../.github/scripts/resolve-config.sh --mapping ../.github/config-outputs.json

      # THE ONE VALUE TERRAFORM COMPUTES AND ALSO CONSUMES. `appUrl` is resolved from the
      # distribution here, while `TF_VAR_app_url` — still a repository variable, because an
      # input cannot be read from the thing it configures — is what builds Cognito's callback
      # and logout lists. Before this change both came from that one variable and could not
      # disagree; now they are two statements of one origin, and a divergence would send a
      # sign-in started on the portal back to an origin Cognito does not allow. That failure
      # is a broken sign-in with nothing red anywhere, so it is compared here rather than
      # left to a browser to discover.
      #
      # Failing HERE leaves the live document and the live app untouched, which is why the
      # comparison is in this workflow and not a Terraform precondition: a precondition would
      # put the same claim in front of every infrastructure apply, where being wrong costs a
      # red pipeline instead of a skipped deploy.
      - name: Assert the app URL agrees with the Cognito callback origin
        env:
          RESOLVED: ${{ steps.config.outputs.appUrl }}
          DECLARED: ${{ vars.VITE_APP_URL }}
        run: |
          if [ -n "$DECLARED" ] && [ "$DECLARED" != "$RESOLVED" ]; then
            echo "::error::appUrl drift: the document would serve '$RESOLVED' while Cognito's"
            echo "::error::callback list is built from VITE_APP_URL='$DECLARED'. Sign-in would"
            echo "::error::fail with nothing else reporting a fault. Reconcile them."
            exit 1
          fi

      - name: Build
        working-directory: apps/portal
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.config.outputs.apiBaseUrl }}
          VITE_AWS_REGION: ${{ steps.config.outputs.awsRegion }}
          VITE_APP_URL: ${{ steps.config.outputs.appUrl }}
          # Which feature-flag block this build resolves (SPEC-162). Unset ships a bundle
          # that ignores every per-environment override while looking entirely healthy.
          # A genuine INPUT — no resource can tell you which environment this is — so it
          # stays a repository variable, as does the upload cap below.
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.config.outputs.cognitoUserPoolId }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.config.outputs.cognitoUserPoolClientId }}
          VITE_COGNITO_DOMAIN: ${{ steps.config.outputs.cognitoDomain }}
          VITE_S3_USER_SPACE_BUCKET: ${{ steps.config.outputs.userSpaceBucket }}
          VITE_S3_SHARED_SPACE_BUCKET: ${{ steps.config.outputs.sharedSpaceBucket }}
          VITE_MAX_UPLOAD_BYTES: ${{ vars.VITE_MAX_UPLOAD_BYTES }}

      # THE DOCUMENT PRODUCTION ACTUALLY READS. The build env above is inlined into the
      # bundle and is the DEV fallback only; every value a deployed portal resolves comes
      # from here, so a key missing in this block ships a document without it while the
      # build, `.env.example` and the classification all stay in agreement. A test asserts
      # this block names every key, and reads each from the same source the build does —
      # which is now one resolved output per key rather than one repository variable, so the
      # two blocks cannot disagree about where a value came from.
      #
      # One env var per key, `CONFIG_`-prefixed, so the rendering needs no second list of
      # names to drift from. An empty value still reads as unset here, but a derived key can
      # no longer BE empty: the resolve step above fails the job first.
      #
      # Rendered OUTSIDE dist/: SPEC-141's passes must each own a disjoint set of keys,
      # and a file under dist/ would be uploaded by the shell pass as well as by the
      # upload below, taking whichever --cache-control ran last.
      - name: Render the runtime configuration document
        env:
          CONFIG_apiBaseUrl: ${{ steps.config.outputs.apiBaseUrl }}
          CONFIG_appUrl: ${{ steps.config.outputs.appUrl }}
          CONFIG_awsRegion: ${{ steps.config.outputs.awsRegion }}
          CONFIG_environment: ${{ vars.VITE_ENVIRONMENT }}
          CONFIG_maxUploadBytes: ${{ vars.VITE_MAX_UPLOAD_BYTES }}
          CONFIG_cognitoUserPoolId: ${{ steps.config.outputs.cognitoUserPoolId }}
          CONFIG_cognitoUserPoolClientId: ${{ steps.config.outputs.cognitoUserPoolClientId }}
          CONFIG_cognitoDomain: ${{ steps.config.outputs.cognitoDomain }}
          CONFIG_userSpaceBucket: ${{ steps.config.outputs.userSpaceBucket }}
          CONFIG_sharedSpaceBucket: ${{ steps.config.outputs.sharedSpaceBucket }}
        run: |
          # The keys the document may carry, named rather than taken from whatever the
          # runner happens to have. A bare `startswith("CONFIG_")` scoop publishes any
          # same-prefixed variable a workflow-level env, a composite action or a
          # self-hosted runner introduces — into a world-readable document. Both lists
          # below are asserted against the classification by test.
          KEYS='apiBaseUrl appUrl awsRegion environment maxUploadBytes cognitoUserPoolId cognitoUserPoolClientId cognitoDomain userSpaceBucket sharedSpaceBucket'
          REQUIRED='apiBaseUrl appUrl awsRegion userSpaceBucket cognitoUserPoolId cognitoUserPoolClientId cognitoDomain'

          jq -n --arg keys "$KEYS" '($keys | split(" ")) as $allowed
            | {version: 1} + ($ENV
              | with_entries(select(.key | startswith("CONFIG_")))
              | with_entries(.key |= sub("^CONFIG_"; ""))
              | with_entries(select(.key as $k | $allowed | index($k))))' > "$RUNNER_TEMP/config.json"

          # The rendering itself, not just the env block above: an edit to the filter that
          # drops an OPTIONAL key would ship a document without it, past every other check
          # here, and present as one feature quietly unconfigured.
          jq -e --arg keys "$KEYS" '((keys - ["version"]) | sort) == ($keys | split(" ") | sort)' \
            "$RUNNER_TEMP/config.json" > /dev/null

          # REFUSE TO PUBLISH A DOCUMENT THAT CANNOT BOOT. The derived keys can no longer
          # arrive empty — the resolve step fails first — but the two genuine inputs still
          # come from repository variables, and an unset one renders as "". A required key
          # rendered empty is a portal that shows every user a boot failure. Failing here
          # leaves the live document — and the live app — untouched.
          missing=$(jq -r --arg required "$REQUIRED" \
            '($required | split(" ")) - [to_entries[] | select(.value != "") | .key] | join(", ")' \
            "$RUNNER_TEMP/config.json")
          if [ -n "$missing" ]; then
            echo "::error::config.json would ship without: $missing"
            exit 1
          fi

      # Three passes, and the shape is load-bearing (SPEC-141).
      #
      # WHY NOT ONE PASS: nothing carried Cache-Control, so browsers applied HEURISTIC
      # freshness to index.html. Combined with `--delete` removing the superseded hashed
      # bundles, a returning browser asks for /assets/index-<oldhash>.js — which no longer
      # exists — and gets a WHITE SCREEN, not stale content. CloudFront is not involved:
      # the deploy already invalidates /*, so the CDN never serves a stale shell. The bug
      # is entirely in the browser cache, which invalidation cannot reach.
      #
      # THE `--delete` / `--exclude` INTERACTION, stated the right way round: --exclude
      # PROTECTS destination keys from --delete. The CLI filters the reverse (destination)
      # generator with the same patterns re-rooted at the destination — awscli
      # customizations/s3/filters.py builds `dst_patterns` alongside `patterns`, and
      # subcommands.py gives `rev_generator` its own filter — so an excluded object is
      # never a deletion candidate at all.
      #
      # The consequence that shapes these passes: a pass that excludes a prefix can never
      # RECONCILE that prefix. `--delete --exclude 'assets/*'` would keep every stale chunk
      # forever. So one pass cannot both write a single --cache-control value and reconcile
      # the whole bucket — which is why the deletions live on their own pass (see below).
      #
      # Scope by PREFIX (dist/assets/ -> s3://…/assets/) rather than by exclude, so each
      # pass owns a disjoint set of keys and no file is uploaded by more than one pass — a
      # second pass over an already-uploaded file would re-upload it with THAT pass's
      # --cache-control, silently overwriting the immutable header.
      #
      # ORDER: assets up first (so a new shell never points at a chunk that isn't there
      # yet), then the shell, then deletions. The invalidation runs after all three.
      #
      # THE ORPHAN CLASS THIS TOLERATES: the single --delete pass is scoped to assets/,
      # so a stale ROOT-level object (a favicon we stop shipping) is never removed from
      # the bucket and must be deleted by hand.
      #
      # SUPERSEDED IN PART: that class is a property of THIS delivery path, and there are
      # two now. The container image IS the file set — nothing to reconcile, no key
      # surviving a build, no pass ordering — so it has neither the passes nor the orphan.
      # Both retire outright when the distribution does. Until then this workflow keeps
      # deploying on every push and remains the working portal and the rollback.
      #
      # THAT IS A SPEC CHOICE, NOT A CLI CONSTRAINT, and the distinction matters because an
      # earlier version of this comment presented it as the latter. Adding --delete to the
      # shell pass above WOULD reconcile stale root objects, and --exclude would protect
      # every asset key from that same deletion (verified against the CLI's dst_patterns);
      # the assets pass below still reconciles chunks, so nothing would be retained. The
      # only thing forbidding it is SPEC-141's acceptance criterion "exactly one sync pass
      # carries --delete" — written on the mistaken reading of --exclude that this comment
      # block now corrects. Revisit the AC deliberately if the manual cleanup becomes
      # annoying; the cost to weigh is that a root-scoped --delete removes anything in the
      # bucket not produced by dist/ (nothing else writes it today).
      - name: Sync hashed assets to S3 (immutable)
        run: |
          aws s3 sync apps/portal/dist/assets/ s3://${{ secrets.S3_STATIC_BUCKET }}/assets/ \
            --cache-control 'public, max-age=31536000, immutable'

      # AN UPLOAD, AND DELIBERATELY NOT A SYNC PASS. It carries one object that no other
      # pass owns: `--delete` is scoped to assets/, and the shell pass only ever sees
      # dist/, which this file is rendered outside of.
      #
      # BEFORE the shell, for the reason the assets pass goes first: a new index.html must
      # never be live against the previous document.
      #
      # `no-store`, because a document answered from a cache populated in the previous
      # environment renders a working, fully-functional portal pointed at the wrong
      # account, and nothing on screen distinguishes it from a healthy one. The
      # distribution has a cache behaviour of its own for this path so that the guarantee
      # does not rest on this one flag.
      - name: Publish the runtime configuration document
        run: |
          aws s3 cp "$RUNNER_TEMP/config.json" s3://${{ secrets.S3_STATIC_BUCKET }}/config.json \
            --cache-control 'no-store' --content-type 'application/json'

      - name: Sync the shell to S3 (revalidate always)
        run: |
          aws s3 sync apps/portal/dist/ s3://${{ secrets.S3_STATIC_BUCKET }}/ \
            --exclude 'assets/*' --cache-control 'no-cache'

      # Byte-for-byte the assets pass above plus --delete: everything it would upload is
      # already uploaded, so this only reconciles deletions. Repeating the SAME
      # --cache-control is the point — if it ever does re-upload a file, the header it
      # writes is the one that file should have had anyway.
      #
      # THE RESIDUAL RACE, accepted rather than fixed: a user with the SPA ALREADY OPEN
      # who triggers a lazy import after this pass has removed the old chunk still gets a
      # 404 inside a Suspense boundary. BOTH lazy routes are exposed — /query (App.tsx:17,
      # which also lazy-loads Monaco's SqlEditor beneath it, SPEC-035) and /connections
      # (App.tsx:20) — so a fix must not be scoped to Monaco. The fix is retaining
      # superseded bundles behind an S3 lifecycle rule, which needs object lifecycle
      # management and a retention policy — out of scope for SPEC-141.
      # Once the shell revalidates (the pass above), a reload recovers.
      - name: Reconcile deletions
        run: |
          aws s3 sync apps/portal/dist/assets/ s3://${{ secrets.S3_STATIC_BUCKET }}/assets/ \
            --delete --cache-control 'public, max-age=31536000, immutable'

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
