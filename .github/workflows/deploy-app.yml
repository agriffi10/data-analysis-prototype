name: Deploy App

on:
  push:
    branches: [main]

# SERIALIZE DEPLOYS. Without this, two merges close together run two jobs in parallel and
# job A's "Reconcile deletions" pass lists assets/ at ITS execution time, deleting every
# key absent from A's dist/ — including the chunks B has just uploaded — while B's
# index.html is already live at the root. That is the exact white screen SPEC-141 exists to
# fix, arriving by a different route. The window is not theoretical: the delete pass runs
# ~47 s into the job.
#
# cancel-in-progress is FALSE, unlike security.yml's scanner runs. Cancelling a deploy
# mid-sync leaves the bucket half-updated — a new index.html pointing at chunks the
# cancelled job never uploaded — which is worse than the queueing it saves. Every push to
# main must complete; the last one to run wins, which is the correct outcome for a deploy.
concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: apps/portal
        run: npm run build
        env:
          VITE_AWS_REGION: ${{ vars.AWS_REGION }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          # Which feature-flag block this build resolves (SPEC-162). Unset ships a bundle
          # that ignores every per-environment override while looking entirely healthy.
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ vars.VITE_COGNITO_USER_POOL_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_IDENTITY_POOL_ID: ${{ vars.VITE_COGNITO_IDENTITY_POOL_ID }}
          VITE_S3_USER_SPACE_BUCKET: ${{ vars.VITE_S3_USER_SPACE_BUCKET }}
          VITE_S3_SHARED_SPACE_BUCKET: ${{ vars.VITE_S3_SHARED_SPACE_BUCKET }}
          VITE_ATHENA_WORKGROUP: ${{ vars.VITE_ATHENA_WORKGROUP }}
          VITE_MAX_UPLOAD_BYTES: ${{ vars.VITE_MAX_UPLOAD_BYTES }}
          VITE_SHARED_SPACE_QUEUE_URL: ${{ vars.VITE_SHARED_SPACE_QUEUE_URL }}
          VITE_NOTIFICATIONS_QUEUE_URL: ${{ vars.VITE_NOTIFICATIONS_QUEUE_URL }}
          VITE_TABLE_BUILD_QUEUE_URL: ${{ vars.VITE_TABLE_BUILD_QUEUE_URL }}
          VITE_TABLE_SHARE_QUEUE_URL: ${{ vars.VITE_TABLE_SHARE_QUEUE_URL }}
          VITE_FILE_SEND_QUEUE_URL: ${{ vars.VITE_FILE_SEND_QUEUE_URL }}
          VITE_ARCHIVE_QUEUE_URL: ${{ vars.VITE_ARCHIVE_QUEUE_URL }}
          VITE_DATA_QUALITY_QUEUE_URL: ${{ vars.VITE_DATA_QUALITY_QUEUE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a connect
          # timeout to STS cost ~7 minutes per attempt, so one job spent 82 minutes failing.
          # Three still retries a fast-failing transient; the slow case is bounded by
          # `timeout-minutes` above, because v4 has no wall-clock option of its own
          # (`action-timeout-s` arrived after it).
          retry-max-attempts: 3

      # Three passes, and the shape is load-bearing (SPEC-141).
      #
      # WHY NOT ONE PASS: nothing carried Cache-Control, so browsers applied HEURISTIC
      # freshness to index.html. Combined with `--delete` removing the superseded hashed
      # bundles, a returning browser asks for /assets/index-<oldhash>.js — which no longer
      # exists — and gets a WHITE SCREEN, not stale content. CloudFront is not involved:
      # the deploy already invalidates /*, so the CDN never serves a stale shell. The bug
      # is entirely in the browser cache, which invalidation cannot reach.
      #
      # THE `--delete` / `--exclude` INTERACTION, stated the right way round: --exclude
      # PROTECTS destination keys from --delete. The CLI filters the reverse (destination)
      # generator with the same patterns re-rooted at the destination — awscli
      # customizations/s3/filters.py builds `dst_patterns` alongside `patterns`, and
      # subcommands.py gives `rev_generator` its own filter — so an excluded object is
      # never a deletion candidate at all.
      #
      # The consequence that shapes these passes: a pass that excludes a prefix can never
      # RECONCILE that prefix. `--delete --exclude 'assets/*'` would keep every stale chunk
      # forever. So one pass cannot both write a single --cache-control value and reconcile
      # the whole bucket — which is why the deletions live on their own pass (see below).
      #
      # Scope by PREFIX (dist/assets/ -> s3://…/assets/) rather than by exclude, so each
      # pass owns a disjoint set of keys and no file is uploaded by more than one pass — a
      # second pass over an already-uploaded file would re-upload it with THAT pass's
      # --cache-control, silently overwriting the immutable header.
      #
      # ORDER: assets up first (so a new shell never points at a chunk that isn't there
      # yet), then the shell, then deletions. The invalidation runs after all three.
      #
      # THE ORPHAN CLASS THIS TOLERATES: the single --delete pass is scoped to assets/,
      # so a stale ROOT-level object (a favicon we stop shipping) is never removed from
      # the bucket and must be deleted by hand.
      #
      # THAT IS A SPEC CHOICE, NOT A CLI CONSTRAINT, and the distinction matters because an
      # earlier version of this comment presented it as the latter. Adding --delete to the
      # shell pass above WOULD reconcile stale root objects, and --exclude would protect
      # every asset key from that same deletion (verified against the CLI's dst_patterns);
      # the assets pass below still reconciles chunks, so nothing would be retained. The
      # only thing forbidding it is SPEC-141's acceptance criterion "exactly one sync pass
      # carries --delete" — written on the mistaken reading of --exclude that this comment
      # block now corrects. Revisit the AC deliberately if the manual cleanup becomes
      # annoying; the cost to weigh is that a root-scoped --delete removes anything in the
      # bucket not produced by dist/ (nothing else writes it today).
      - name: Sync hashed assets to S3 (immutable)
        run: |
          aws s3 sync apps/portal/dist/assets/ s3://${{ secrets.S3_STATIC_BUCKET }}/assets/ \
            --cache-control 'public, max-age=31536000, immutable'

      - name: Sync the shell to S3 (revalidate always)
        run: |
          aws s3 sync apps/portal/dist/ s3://${{ secrets.S3_STATIC_BUCKET }}/ \
            --exclude 'assets/*' --cache-control 'no-cache'

      # Byte-for-byte the assets pass above plus --delete: everything it would upload is
      # already uploaded, so this only reconciles deletions. Repeating the SAME
      # --cache-control is the point — if it ever does re-upload a file, the header it
      # writes is the one that file should have had anyway.
      #
      # THE RESIDUAL RACE, accepted rather than fixed: a user with the SPA ALREADY OPEN
      # who triggers a lazy import after this pass has removed the old chunk still gets a
      # 404 inside a Suspense boundary. BOTH lazy routes are exposed — /query (App.tsx:17,
      # which also lazy-loads Monaco's SqlEditor beneath it, SPEC-035) and /connections
      # (App.tsx:20) — so a fix must not be scoped to Monaco. The fix is retaining
      # superseded bundles behind an S3 lifecycle rule, which needs object lifecycle
      # management and a retention policy — out of scope for SPEC-141.
      # Once the shell revalidates (the pass above), a reload recovers.
      - name: Reconcile deletions
        run: |
          aws s3 sync apps/portal/dist/assets/ s3://${{ secrets.S3_STATIC_BUCKET }}/assets/ \
            --delete --cache-control 'public, max-age=31536000, immutable'

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
