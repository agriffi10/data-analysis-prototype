name: Push the placeholder SPA image

# Builds apps/portal/Dockerfile.placeholder and pushes it to the SPA registry, so the
# container platform can be verified before the real image exists.
#
# WHY THIS EXISTS AT ALL. The platform's central claim is that a Fargate task in a private
# subnet with no NAT gateway can pull from ECR through VPC endpoints. Only a real pull
# settles it, a pull needs an image, and pushing one needs an identity holding
# ecr:GetAuthorizationToken plus five layer and manifest actions. The deploy role held none
# of those until the grant that accompanies this file, and no other identity in this project
# is provisioned to push — so the verification step was blocked on a person, in three
# consecutive sessions, rather than on anything technical.
#
# IT IS DELIBERATELY DISPATCH-ONLY. Nothing here belongs on a push trigger: the placeholder
# is verification scaffolding, not a deployment, and the spec that builds the REAL image
# replaces this file with a pipeline that builds from source on every commit, waits for
# service stability, and fails on a bad task set. Delete this workflow when that lands.
#
# IT IS ALSO IDEMPOTENT, which matters more than it sounds. The full sequence is: push the
# image, set the two repository variables, apply (Terraform registers a task definition
# revision carrying that tag), then point the service at that revision. Only the first and
# last steps are this workflow's, so it must be runnable a second time to do the last one —
# an existing tag is therefore a SKIP, not a failure, and `image_tag` lets a run address an
# image an earlier commit pushed.

on:
  workflow_dispatch:
    inputs:
      desired_count:
        description: 'Tasks to leave the service running after the push (0 leaves the service alone).'
        required: false
        default: '1'
      image_tag:
        description: 'Tag to ensure is present. Empty means this commit. Naming an EXISTING tag skips the build and only points the service.'
        required: false
        default: ''

concurrency:
  group: push-placeholder-image
  cancel-in-progress: false

jobs:
  push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure the image is in the registry
        id: push
        env:
          PROJECT: ${{ vars.TF_VAR_project_name || 'dat' }}
          ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # CONSTRUCTED, THEN VERIFIED — and the first version of this step got it backwards.
          # It asked ECR for "the repository ending in -spa" to avoid keeping a second copy of
          # Terraform's naming convention here. That call is a LIST: an unfiltered
          # describe-repositories authorizes against `repository/*`, while the deploy role is
          # scoped to `repository/{project}-*-spa*`, so it was refused — the "safer" shape
          # needed a strictly WIDER grant than the one it was avoiding a guess about.
          #
          # So the name is built from the same two variables Terraform builds it from, and then
          # confirmed with a describe that NAMES it. That call authorizes against the repository's
          # own ARN, which is granted, and a wrong name fails here saying so rather than deep
          # inside docker push.
          NAME="${PROJECT}-${ENVIRONMENT}-spa"
          if ! REPO=$(aws ecr describe-repositories --repository-names "$NAME" \
                        --query 'repositories[0].repositoryUri' --output text 2>/dev/null); then
            echo "::error title=Registry::no repository named $NAME. Terraform builds it from project_name and environment; set TF_VAR_project_name / TF_VAR_environment if this deployment does not use the defaults."
            exit 1
          fi
          SHA="${IMAGE_TAG_INPUT:-}"
          [ -n "$SHA" ] || SHA="${GITHUB_SHA}"

          # PRESENT IS DONE, not an error. The repository is IMMUTABLE, so a tag cannot be
          # re-pushed — but this workflow's job is "make sure that image is there and the service
          # runs it", and the second half is worth reaching on its own. Treating an existing tag
          # as a failure made the workflow un-runnable exactly when only the pointing was needed,
          # which is the state a first attempt leaves behind.
          if aws ecr describe-images --repository-name "$NAME" \
               --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "::notice title=Already present::$NAME:$SHA is in the registry; skipping the build."
            echo "image_tag=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"

          # linux/amd64 EXPLICITLY: the task definition declares X86_64, and an arm64 image
          # fails at task start with a manifest error that reads nothing like an
          # architecture mismatch. The runner is amd64 today; stating it keeps that from
          # being load-bearing and unwritten.
          docker build --platform linux/amd64 \
            -f apps/portal/Dockerfile.placeholder \
            -t "$REPO:$SHA" .
          docker push "$REPO:$SHA"

          echo "image_tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pushed $REPO:$SHA"

      - name: Point the service at the revision carrying this image
        if: inputs.desired_count != '0'
        env:
          PROJECT: ${{ vars.TF_VAR_project_name || 'dat' }}
          ENVIRONMENT: ${{ vars.TF_VAR_environment || 'prod' }}
          IMAGE_TAG: ${{ steps.push.outputs.image_tag }}
          COUNT: ${{ inputs.desired_count }}
        run: |
          set -euo pipefail

          CLUSTER="${PROJECT}-${ENVIRONMENT}-spa"
          FAMILY="${PROJECT}-${ENVIRONMENT}-spa"

          # WHY THIS STEP EXISTS, and why an earlier version of it printed instructions instead.
          # It reasoned that Terraform owns the task definition and would revert anything set
          # here. That is true of `desired_count` and FALSE of the task definition: the service
          # carries `ignore_changes = [task_definition]` precisely so CI owns which revision runs.
          # Printing instructions left the service pinned to revision 1 — the placeholder tag,
          # which does not exist — and the pull failed with CannotPullContainerError naming a tag
          # nobody pushed. That reads exactly like the endpoint failure this platform is tested
          # for, which is the worst possible way to be wrong here.
          #
          # THE REVISION MUST CARRY THE IMAGE THIS RUN PUSHED. Terraform registers it on the apply
          # that reads TF_VAR_spa_image_tag, so this step is a no-op until that apply has run —
          # and it says so rather than pointing the service at a revision holding something else.
          WANT="$IMAGE_TAG"
          FOUND=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
                    --query 'taskDefinition.[revision,containerDefinitions[0].image]' --output text)
          REVISION=$(printf '%s' "$FOUND" | cut -f1)
          IMAGE=$(printf '%s' "$FOUND" | cut -f2)

          if [ "${IMAGE##*:}" != "$WANT" ]; then
            echo "::warning title=Not pointed::the newest task definition ($FAMILY:$REVISION) runs ${IMAGE##*:}, not $WANT. Set the two repository variables and run Deploy Infrastructure, then dispatch this workflow again — it will point the service without rebuilding."
            echo "  gh variable set TF_VAR_spa_image_tag     --body '$WANT'"
            echo "  gh variable set TF_VAR_spa_desired_count --body '$COUNT'"
            echo "  gh workflow run 'Deploy Infrastructure'"
            exit 0
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "$FAMILY" \
            --task-definition "$FAMILY:$REVISION" --query 'service.taskDefinition' --output text
          echo "::notice title=Pointed::$FAMILY:$REVISION, running ${IMAGE##*:}"
