name: Deploy SPA image

# Builds the SPA image on every push to main, proves it, pushes it to the registry tagged by
# commit sha, registers a task-definition revision carrying that tag, points the service at it and
# WAITS — then asserts the service actually settled on what this run built.
#
# STILL NO `paths:` FILTER — the workflow runs on every push — but it now decides what it has to
# DO by comparing this commit against the one the service is RUNNING. A filter cannot see the two
# things that make a deploy necessary with no image change at all: a task-definition revision
# Terraform registered on its own, and a previous run that failed. The comparison sees both,
# because its baseline is read back from the service rather than assumed.
#
# WHAT IS TRADED, said plainly because it is the whole point. The running image is no longer HEAD;
# it is the last commit that changed an input to the image. "Which commit is in production" is
# still answered exactly — by the tag the service runs, which is still a commit sha and still an
# image in the registry — it is just no longer the same answer as "the tip of main". Replayed over
# the 40 merges before this change, running both path tests exactly as the step does: 15 would have
# built, 4 would have re-pointed without building, and 21 would have done neither.
#
# THE BASELINE IS THE DEPLOYED COMMIT, never HEAD~1. A run that skips, and a run that fails, both
# leave the next one comparing against what is still actually running — so a missed deploy heals on
# the next merge instead of compounding, which a comparison against the previous commit would not.
# Every unreadable answer fails in the EXPENSIVE direction: no service, a placeholder image, a tag
# that is not a commit, a commit this clone cannot reach, and the run builds and deploys.
#
# THE DISPATCH PATH IS NOT A CONVENIENCE. Two situations need it and neither is hypothetical.
# Terraform registers task-definition revisions of its own — the service carries
# `ignore_changes = [task_definition]` precisely so CI owns which revision runs — so a change to
# the runtime-configuration map or the CSP produces a revision nobody points the service at, and
# the running container keeps the old value until the next push to main. And if this pipeline
# lands broken, the registry is IMMUTABLE: the failing sha cannot be re-pushed, and no local
# identity may write to production. A dispatch with an existing tag re-points without rebuilding.
#
# A RE-POINT AT AN OLDER TAG DOES NOT OUTLAST THE NEXT PUSH TO MAIN if anything the image reads
# changed since that tag. That run reads the tag back as its baseline, so the commit rolled back
# from is inside its diff and main is rebuilt over the rollback. A rollback buys time for a
# revert to land; it does not stand in for one.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to deploy. Empty means this commit, built unless the registry already holds it. Naming an EXISTING tag skips the build and only re-points the service, until the next push to main rebuilds main over it.'
        required: false
        default: ''

# Two overlapping deploys of one service is last-writer-wins, and cancelling one mid-flight leaves
# a half-rolled service — so runs queue rather than race, and none is cancelled. The same reasoning
# every deploy workflow here carries.
concurrency:
  group: deploy-spa-image
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The build is ~3 minutes, the matrix ~2, and `wait services-stable` caps itself at 10. Twenty-five
    # bounds a hung run clear of that without sitting against GitHub's six-hour default.
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The scope step below diffs against the commit the service is running, and the default
          # shallow clone does not contain it. The same three seconds `ci.yml` already pays.
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and a connect timeout to STS once
          # cost ~7 minutes per attempt — one job spent 82 minutes failing.
          retry-max-attempts: 3

      - name: Resolve the registry, the cluster and the tag
        id: names
        env:
          PROJECT: dat
          ENVIRONMENT: prod
          TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # CONSTRUCTED FROM THE SAME TWO VARIABLES TERRAFORM BUILDS IT FROM, then confirmed with a
          # describe that NAMES it. An unfiltered describe-repositories authorizes against
          # `repository/*` while the deploy role is scoped to this repository — so asking the
          # registry "which one ends in -spa" needs a strictly WIDER grant than constructing the
          # name does, and it was refused when it was tried.
          NAME="${PROJECT}-${ENVIRONMENT}-spa"
          if ! REPO=$(aws ecr describe-repositories --repository-names "$NAME" \
                        --query 'repositories[0].repositoryUri' --output text 2>/dev/null); then
            echo "::error title=Registry::no repository named $NAME, which is the name Terraform builds from its project_name and environment defaults. Run Deploy Infrastructure."
            exit 1
          fi

          # A DISPATCH NAMES AN IMAGE THAT ALREADY EXISTS; it does not name a new one. Building
          # under an arbitrary string bakes it as BUILD_VERSION and as the revision label, so the
          # stamp stops being the commit that produced the image — which is the one question the
          # whole tagging scheme exists to answer.
          if [ -n "$TAG_INPUT" ] && [ "$TAG_INPUT" != "$GITHUB_SHA" ] \
             && ! aws ecr describe-images --repository-name "$NAME" --image-ids imageTag="$TAG_INPUT" >/dev/null 2>&1; then
            echo "::error title=Unknown tag::$TAG_INPUT is not in the registry. This input re-points at an image that already exists; leave it empty to build this commit."
            exit 1
          fi
          {
            echo "repo=$REPO"
            echo "family=$NAME"
            echo "cluster=$NAME"
            echo "service=$NAME"
          } >> "$GITHUB_OUTPUT"

      # WHAT THIS RUN HAS TO DO — two questions with different answers, so there are two outputs.
      # Whether this commit can change the IMAGE, and whether the SERVICE needs pointing at
      # anything. A documentation merge answers no to both and the job ends after this step.
      #
      # THE IMAGE LIST IS `spa-image.yml`'s `paths:`, and reusing it is the point rather than a
      # convenience. That gate already skips PROVING the image when none of those paths changed,
      # so the repository has already committed to that set being the image's inputs; using it
      # here adds no new assumption, and `lambdas/test_ci_scope.py` asserts the two stay identical.
      # What does change is the price of the list being wrong. A miss on the pull-request side
      # left an image unproven and main built it anyway; a miss here leaves production running the
      # old bundle behind a green deploy. Add a path to both lists or to neither.
      #
      # THE TASK LIST IS SEPARATE, AND SMALLER. Terraform registers task-definition revisions of
      # its own out of `infra/main.tf` (the runtime-configuration map) and `infra/modules/spa/`
      # (the definition itself), and the service carries `ignore_changes = [task_definition]`
      # precisely so nothing but this workflow points at one. The revision comparison at the end
      # catches a revision that already exists; this list is for the RACE, where the apply has not
      # registered it yet — the two workflows fire on the same push with no ordering between them,
      # which is the same race the register step already polls through.
      - name: Work out whether this commit can change what is running
        id: scope
        env:
          NAME: ${{ steps.names.outputs.family }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.service }}
          TAG_INPUT: ${{ inputs.image_tag }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          IMAGE_PATTERNS: |
            ^apps/portal/
            ^packages/
            ^package\.json$
            ^package-lock\.json$
            ^\.nvmrc$
            ^\.dockerignore$
            ^\.github/scripts/spa-image-matrix\.sh$
            ^\.github/workflows/spa-image\.yml$
            ^\.github/workflows/deploy-spa-image\.yml$
          TASK_PATTERNS: |
            ^infra/main\.tf$
            ^infra/modules/spa/
        run: |
          set -euo pipefail

          emit() {
            {
              echo "tag=$1"
              echo "build=$2"
              echo "deploy=$3"
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan::tag=$1 build=$2 deploy=$3"
          }

          # A RE-RUN FINDS ITS OWN TAG ALREADY PUSHED, and the repository is IMMUTABLE — so a
          # rebuild would get all the way to the push and fail there. Present means built.
          # Assigns rather than echoes: a `::notice` inside a command substitution is captured
          # instead of printed, and would then be read back as the answer.
          #
          # ONLY EVER ASKED ABOUT THIS COMMIT, and the refusal below is what keeps it that way.
          # The `else` cannot tell `ImageNotFoundException` from a throttle or an expired
          # credential, which is harmless for HEAD — building HEAD and tagging it HEAD is right
          # either way — and is not harmless for an OLDER sha: a failed read would answer "absent",
          # this run would build the CURRENT tree, stamp it with the previous commit's sha, and
          # push it under that tag. Against an IMMUTABLE repository that fails at the push blaming
          # tag immutability rather than the throttle; against one whose lifecycle policy had
          # expired the image it succeeds, and the tag permanently names a build of a different
          # tree. Every re-point path answers `skip` by construction instead: it points at an image
          # already known to exist — the one the service is running, or the one a dispatch named
          # and `names` found in the registry.
          decide_build() {
            if [ "$1" != "$GITHUB_SHA" ]; then
              echo "::error title=Internal::decide_build was asked about $1, which is not this commit. A re-point must answer skip by construction rather than asking the registry."
              exit 1
            fi
            if aws ecr describe-images --repository-name "$NAME" --image-ids imageTag="$1" >/dev/null 2>&1; then
              echo "::notice title=Already present::$NAME:$1 is in the registry; this run only points the service."
              BUILD=skip
            else
              BUILD=run
            fi
          }

          # A DISPATCH NEVER SKIPS. It is the recovery lever, and the reason to reach for it is
          # always something this step's own reasoning cannot see — so it does what the workflow
          # did before this step existed: build this commit, or re-point at a tag that exists.
          #
          # A NAMED TAG THAT IS NOT THIS COMMIT IS A RE-POINT, and answers `skip` by construction
          # like every other. The condition is the one `names` tests before refusing a tag the
          # registry does not hold, so every tag that reaches this branch was found there — and
          # handing it to `decide_build` instead would ask the registry about an older sha, which
          # is the question that function refuses. This commit's own sha, named or left empty, is
          # the one `names` never checks, so it is asked about rather than assumed.
          #
          # FOUND UNDER THE SPELLING THIS STEP WRITES OUT, which only the tag grammar guarantees.
          # The CLI trims the value `names` hands it and strips quotes from around it, so ` abc `
          # and `'abc'` are both looked up as `abc` — found, then written out as typed, naming an
          # image that does not exist. Inside the grammar the CLI sends the value verbatim, and
          # every tag this workflow pushes is a commit sha. It also keeps a newline out of
          # `$GITHUB_OUTPUT`.
          if [ "$DISPATCHED" = 'true' ]; then
            if [ -n "$TAG_INPUT" ] && [ "$TAG_INPUT" != "$GITHUB_SHA" ]; then
              tag_grammar='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
              if ! [[ "$TAG_INPUT" =~ $tag_grammar ]]; then
                echo "::error title=Malformed tag::the image_tag input is not a bare image tag — letters, digits, '_', '.' and '-', with no spaces or quotes. Name the commit sha the image was pushed under."
                exit 1
              fi
              emit "$TAG_INPUT" skip run
            else
              decide_build "$GITHUB_SHA"
              emit "$GITHUB_SHA" "$BUILD" run
            fi
            exit 0
          fi

          # THE BASELINE IS READ BACK FROM THE SERVICE. Reading it rather than assuming it is what
          # makes a skipped or failed previous run heal on the next merge: the diff is always
          # against what is genuinely running, never against the previous commit.
          #
          # A PRIVATE FILE RATHER THAN A FIXED NAME. This script is executed verbatim by the
          # suite, over a throwaway repository and a stubbed `aws`, on a machine whose temp
          # directory every other run shares — so a fixed name is ONE file for all of them. Two
          # runs truncating and rewriting it interleave: the loud half is jq reading a `null` one
          # fixture wrote spliced over the service JSON another did, and the quiet half is a clean
          # read of the OTHER fixture's service, which answers "no baseline, build and deploy"
          # and is indistinguishable from a verdict.
          service_json=$(mktemp)
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json > "$service_json" 2>/dev/null \
            || echo 'null' > "$service_json"
          running_arn=$(jq -r '.taskDefinition // ""' "$service_json")
          rollout=$(jq -r '[.deployments[]? | select(.status == "PRIMARY")][0].rolloutState // "NONE"' "$service_json")
          desired=$(jq -r '.desiredCount // 0' "$service_json")
          running=$(jq -r '.runningCount // 0' "$service_json")
          deployed_image=''
          # ONE EMPTINESS TEST, AND IT DECIDES NOTHING — it only skips a call that would fail.
          # jq collapses both shapes an absent service takes (`services[0]` over an empty list is
          # `null`, and an errored call was replaced with `null` above) into the empty string, so
          # a comparison against the literal `null` or `None` could never fire; and removing this
          # test entirely changes no answer, because describing an empty task definition errors,
          # `|| true` empties the image, and the no-baseline branch below reaches the same verdict.
          # It survives mutation for that reason, which is worth saying rather than covering with
          # a test that would be asserting the branch is redundant.
          if [ -n "$running_arn" ]; then
            deployed_image=$(aws ecs describe-task-definition --task-definition "$running_arn" \
                               --query 'taskDefinition.containerDefinitions[?name==`spa`].image' \
                               --output text 2>/dev/null || true)
          fi
          deployed_tag="${deployed_image##*:}"

          # NO BASELINE MEANS BUILD AND DEPLOY. A service that does not exist yet, the placeholder
          # image, a tag that is not a commit, a commit this clone cannot reach: each leaves the
          # comparison below with nothing to compare against, and a cheap green that deployed
          # nothing is indistinguishable from a real one.
          if ! grep -qE '^[0-9a-f]{40}$' <<<"$deployed_tag"; then
            echo "::notice title=No baseline::the service runs [${deployed_image:-nothing}]; building and deploying this commit"
            decide_build "$GITHUB_SHA"
            emit "$GITHUB_SHA" "$BUILD" run
            exit 0
          fi
          if ! git cat-file -e "${deployed_tag}^{commit}" 2>/dev/null; then
            echo "::notice title=No baseline::deployed commit $deployed_tag is unreachable here; building and deploying this commit"
            decide_build "$GITHUB_SHA"
            emit "$GITHUB_SHA" "$BUILD" run
            exit 0
          fi

          # Assigned rather than tested inside the `if`: a `git diff` that fails must kill the job,
          # and inside a condition its exit status is swallowed — which would read a broken diff as
          # "nothing changed" and skip a deploy that was needed.
          #
          # --no-renames because `--name-only` reports only a rename's DESTINATION. A file moved
          # OUT of apps/portal would otherwise not appear under an apps/portal path at all, and the
          # bundle would go stale behind a green run.
          #
          # `-z` because `--name-only` C-QUOTES a path that is not plain ASCII — wrapping it in
          # double quotes and escaping the bytes, so `"apps/portal/src/caf\303\251.tsx"` matches
          # no anchored pattern and a file that changes the bundle reads as "nothing changed".
          # `core.quotePath=false` fixes that for high bytes ALONE and leaves `"`, `\` and control
          # characters still quoted; `-z` emits every path raw, which closes the class rather than
          # one member of it. A newline inside a filename then splits one path into two, and both
          # halves are tested — which over-selects, in the expensive direction.
          CHANGED=$(git diff -z --name-only --no-renames "$deployed_tag" HEAD | tr '\0' '\n')

          # THE RACE IS A PROPERTY OF THIS PUSH, so the task-definition list is tested against this
          # push's own change set rather than against `$CHANGED`. `$CHANGED` is measured from the
          # image the service runs and does NOT advance when a run only re-points, so one merge
          # touching `infra/main.tf` would go on matching for every merge after it — registering a
          # revision and rolling the production tasks, having changed nothing, until the next
          # commit that builds. Measured before this was fixed: 11 of 15 re-points were that.
          #
          # `HEAD^` AND NOT `github.event.before`, with the bound stated rather than discovered.
          # Every merge to main here is a squash, so a push is one commit and the two agree. They
          # differ for a push carrying SEVERAL commits, where a configuration change in any but
          # the tip is missed — and the cost of that is one merge of latency, because the
          # newest-revision comparison below re-points as soon as the apply has landed. Closing it
          # exactly means `github.event.before`, which is all-zeros on a first push and can name
          # an orphan after a force-push, so it would need this same guard for a case that does
          # not arise. Accepted deliberately.
          if git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            PUSHED=$(git diff -z --name-only --no-renames 'HEAD^' HEAD | tr '\0' '\n')
          else
            PUSHED="$CHANGED"
          fi

          # GREP ANSWERS THREE WAYS AND ONLY TWO OF THEM ARE ANSWERS: 0 matched, 1 did not,
          # anything above that is grep failing to perform the test at all. Written as a bare `if`
          # the third collapses into the second — so a pattern list GNU grep refuses, which is what
          # one PCRE construct in the block below produces, reads as "nothing changed" and skips
          # the deploy. Tested rather than assumed, and a failure to test is fatal.
          #
          # A here-string, NOT `printf … | grep -q`. Under `pipefail` grep exits at the first
          # match, printf takes SIGPIPE, and the pipeline reports 141 — which would now be read as
          # grep failing rather than as a match. Measured in `ci.yml`, over the same idiom.
          matches() {
            local status
            set +e
            grep -qE -f <(printf '%s' "$1") <<<"$2"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "::error title=Scope::grep exited $status testing the change set. The pattern list is unusable — POSIX ERE has no non-capturing group or lookaround — so this run cannot decide what to do and will not guess."
              exit 1
            fi
            return "$status"
          }

          if matches "$IMAGE_PATTERNS" "$CHANGED"; then
            decide_build "$GITHUB_SHA"
            emit "$GITHUB_SHA" "$BUILD" run
            exit 0
          fi

          if matches "$TASK_PATTERNS" "$PUSHED"; then
            echo "::notice title=Configuration::this commit changes an input to the task definition; pointing the service without rebuilding, in case the apply has not registered its revision yet"
            emit "$deployed_tag" skip run
            exit 0
          fi

          # THE REVISION TERRAFORM ALREADY REGISTERED. `describe-task-definition` on the FAMILY
          # answers with its newest ACTIVE revision, so a disagreement with what the service runs
          # is a revision nobody has pointed at — the state the dispatch lever used to be the only
          # cure for.
          # FAILS THE WAY THE OTHER TWO READS DO. Left bare this was the only AWS call in the
          # step that could kill it, and it did so with no annotation at all — so a throttle on the
          # first read deployed and a throttle on this one reddened main, from a step whose name
          # gives an operator nothing to go on.
          newest_arn=$(aws ecs describe-task-definition --task-definition "$NAME" \
                         --query 'taskDefinition.taskDefinitionArn' --output text 2>/dev/null || true)
          if [ -z "$newest_arn" ] || [ "$newest_arn" = 'None' ]; then
            echo "::warning title=Unreadable::could not read the newest revision of $NAME, so this run cannot tell whether one is unpointed; deploying rather than guessing."
            emit "$deployed_tag" skip run
            exit 0
          fi
          if [ "$newest_arn" != "$running_arn" ]; then
            echo "::notice title=Newer revision::the newest revision is $newest_arn and the service runs $running_arn; pointing without rebuilding"
            emit "$deployed_tag" skip run
            exit 0
          fi

          # A REVISION THE SERVICE WAS POINTED AT IS NOT A DEPLOYMENT THAT LANDED, and this is
          # the last place that difference can be caught. The circuit breaker runs with rollback
          # DISABLED — deliberately, so a bad image fails the workflow — which means a failed
          # rollout leaves PRIMARY sitting on the revision that failed, and `describe-services`
          # reports it as the service's task definition. Skipping on that reading is how a failed
          # deploy becomes permanent: the re-run diffs against a commit whose tasks never started,
          # finds no change, and reports green over the bundle from before it.
          #
          # It is also the per-merge health assertion. `Assert the service settled` cannot run on
          # a skipped deploy, so without this a run that checked nothing would look exactly like a
          # run that checked everything.
          if [ "$rollout" != 'COMPLETED' ] || [ "$running" != "$desired" ] || [ "$desired" = '0' ]; then
            echo "::notice title=Not settled::nothing changed since $deployed_tag, but the service is at rollout=$rollout with $running/$desired tasks — re-pointing rather than skipping."
            emit "$deployed_tag" skip run
            exit 0
          fi

          # THE ANSWER FIRST, THE EVIDENCE AFTER, and neither through a pipe. The failure this
          # design is exposed to is an IMAGE_PATTERNS list missing a real input: the bundle
          # changes, this step says nothing changed, and production serves the old one behind a
          # green run. Printing the change set is what turns "why is my change not live" into
          # reading the log. But printing it MUST NOT be able to lose the answer — `printf … |
          # head -n 60` is the SIGPIPE trap this file documents for `grep` seventy lines above,
          # arriving by the back door: past the 64 KiB pipe buffer `head` leaves after 60 lines,
          # printf takes SIGPIPE, `pipefail` reports 141 and `errexit` kills the step before it
          # emits anything — a red main on the one merge this whole change exists to make a
          # no-op. Measured on ubuntu at ~3000 paths. So `emit` runs first, and the printing uses
          # here-strings, which have no pipe to break.
          emit "$deployed_tag" skip skip
          echo "::notice title=Nothing to do::no input to the image or to the task definition changed since $deployed_tag, which is the settled commit the service is running ($running/$desired tasks)."
          if [ -n "$CHANGED" ]; then
            count=$(grep -c '' <<<"$CHANGED")
            echo "the $count changed path(s) this decision was made over, none of which matched either list:"
            head -n 60 <<<"$CHANGED"
            if [ "$count" -gt 60 ]; then
              echo "  … and $((count - 60)) more, not printed"
            fi
          fi

      # linux/amd64 EXPLICITLY: the task definition declares X86_64, and an arm64 image fails at
      # task start with a manifest error that reads nothing like the architecture mismatch it is.
      - name: Build
        if: steps.scope.outputs.build == 'run'
        # Through `env:`, like every other value here. The tag a build sees is always this commit,
        # but the one the register and assert steps see can originate in a dispatch input, and a
        # value interpolated straight into `run:` is a command-injection sink.
        env:
          TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f apps/portal/Dockerfile \
            --build-arg BUILD_VERSION="$TAG" \
            -t "spa:$TAG" .

      # BEFORE THE PUSH, so a wrong cache header never reaches a registry it cannot be deleted from.
      # This is the same script the pull-request gate runs, against the same image.
      - name: Assert the behaviour matrix
        if: steps.scope.outputs.build == 'run'
        env:
          TAG: ${{ steps.scope.outputs.tag }}
        run: .github/scripts/spa-image-matrix.sh "spa:$TAG" "$TAG"

      - name: Push
        if: steps.scope.outputs.build == 'run'
        env:
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker tag "spa:${TAG}" "${REPO}:${TAG}"
          docker push "${REPO}:${TAG}"

      - name: Register a revision carrying this image
        id: register
        if: steps.scope.outputs.deploy == 'run'
        env:
          FAMILY: ${{ steps.names.outputs.family }}
          REPO: ${{ steps.names.outputs.repo }}
          TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail

          # PRIVATE FILES RATHER THAN FIXED NAMES: a name under the shared temp directory is one
          # file for every run on the machine, and two of them writing it interleave.
          described_json=$(mktemp)
          base_json=$(mktemp)
          next_json=$(mktemp)

          # CLONED FROM THE FAMILY'S NEWEST ACTIVE REVISION, never from the one the service is
          # currently running. After a rollback the service points at an OLDER revision, and
          # cloning that would silently revert whatever Terraform last added to the environment
          # block — a configuration key or a CSP term, gone, with a green deploy.
          #
          # TAGS ARE ASKED FOR EXPLICITLY. describe-task-definition omits them by default, so a
          # clone without --include TAGS produces revisions that are untagged from here on, and
          # every cost report and tag-based query silently stops seeing the running task.
          aws ecs describe-task-definition --task-definition "$FAMILY" --include TAGS \
            --output json > "$described_json"

          # The read-only fields the register call refuses. Left in, it fails with a parameter
          # error that reads as a malformed request rather than as a copied field. Tags travel
          # beside the definition in the response and inside it in the request.
          jq '.taskDefinition
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy, .deregisteredAt)' "$described_json" > "$base_json"

          jq --slurpfile described "$described_json" --arg image "${REPO}:${TAG}" \
            '.containerDefinitions |= map(if .name == "spa" then .image = $image else . end)
             | if ($described[0].tags // []) == [] then . else .tags = $described[0].tags end' \
            "$base_json" > "$next_json"

          # THE ENVIRONMENT BLOCK MUST SURVIVE THE CLONE, and this is where that is checked rather
          # than discovered. Terraform derives one CONFIG_ entry per key of the runtime-configuration
          # map, so a clone that lost the block — or a Terraform apply that never ran — produces a
          # container that refuses to start, and the workflow would otherwise report only that the
          # deployment failed.
          declared=$(awk '/spa_runtime_config = \{/{f=1;next} f&&/^  \}/{exit} f&&/^    [A-Za-z_][A-Za-z0-9_]* *=/{n++} END{print n+0}' infra/main.tf)
          if [ "$declared" -eq 0 ]; then
            echo "::error title=Parse::could not count the runtime-configuration keys in infra/main.tf. A zero here would make the check below pass on an empty environment block."
            exit 1
          fi

          # WAITS RATHER THAN FAILING ON THE FIRST READ, because the two workflows race. A commit
          # that adds a configuration key triggers this pipeline AND the infrastructure apply, with
          # no ordering between them: read too early and the newest revision predates the apply, so
          # the count is short and main goes red on exactly the commits that change configuration.
          # Read too late and it is fine. Polling makes the outcome deterministic instead of a
          # coin-flip, and still fails loudly if the apply never happened at all.
          carried=0
          for _ in $(seq 1 20); do
            carried=$(jq '[.containerDefinitions[] | select(.name=="spa") | .environment[] | select(.name | startswith("CONFIG_"))] | length' "$next_json")
            [ "$carried" -eq "$declared" ] && break
            echo "the newest revision carries $carried of $declared configuration keys; waiting for the infrastructure apply"
            sleep 15
            aws ecs describe-task-definition --task-definition "$FAMILY" --include TAGS \
              --output json > "$described_json"
            jq '.taskDefinition
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' "$described_json" > "$base_json"
            jq --slurpfile described "$described_json" --arg image "${REPO}:${TAG}" \
              '.containerDefinitions |= map(if .name == "spa" then .image = $image else . end)
               | if ($described[0].tags // []) == [] then . else .tags = $described[0].tags end' \
              "$base_json" > "$next_json"
          done

          if [ "$carried" -ne "$declared" ]; then
            echo "::error title=Configuration::the revision carries $carried CONFIG_ entries; root declares $declared, and five minutes was not enough for the infrastructure apply to register one that matches. A container missing part of its document refuses to start."
            exit 1
          fi
          if ! jq -e '[.containerDefinitions[] | select(.name=="spa") | .environment[] | select(.name=="PORTAL_CSP_CONNECT_SRC")] | length == 1' "$next_json" >/dev/null; then
            echo "::error title=Configuration::the revision does not carry PORTAL_CSP_CONNECT_SRC. The container would refuse to start."
            exit 1
          fi

          # THE SWAP IS A `map` OVER A PREDICATE, AND A PREDICATE THAT MATCHES NOTHING RETURNS THE
          # LIST UNCHANGED. There is no error in that: register succeeds, update-service points at a
          # revision carrying the PREVIOUS image, the task is healthy, the wait returns and every
          # assertion in the final step passes — a green deploy of whatever was running before,
          # which for the first run is the placeholder. So the swap is checked rather than assumed.
          if ! jq -e --arg want "${REPO}:${TAG}" \
               '[.containerDefinitions[] | select(.name == "spa" and .image == $want)] | length == 1' \
               "$next_json" >/dev/null; then
            echo "::error title=Image::the clone does not carry ${REPO}:${TAG}. The container name the swap matches on has diverged from the one in the task definition."
            jq -r '.containerDefinitions[] | "  \(.name) -> \(.image)"' "$next_json"
            exit 1
          fi

          ARN=$(aws ecs register-task-definition --cli-input-json "file://$next_json" \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "::notice title=Registered::$ARN carrying ${TAG} and $carried configuration keys"

      - name: Point the service and wait for it to settle
        if: steps.scope.outputs.deploy == 'run'
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.service }}
          ARN: ${{ steps.register.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$ARN" --query 'service.taskDefinition' --output text

          # `update-service` returns success the moment the API accepts the request, so a container
          # that crashes at start would leave this workflow green over a service still running last
          # week's image. Waiting is what makes a bad image able to fail the deploy.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Assert the service settled on THIS revision
        # Runs even when the wait failed, so a rollback is reported as a rollback rather than as
        # "Max attempts exceeded" — the wait caps at 40 polls of 15 seconds and a rollback usually
        # outlasts that.
        if: always() && steps.register.outputs.arn != ''
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.service }}
          ARN: ${{ steps.register.outputs.arn }}
          EXPECTED_TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail

          # A PRIVATE FILE RATHER THAN A FIXED NAME, for the reason the scope step gives.
          service_json=$(mktemp)

          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json > "$service_json"

          desired=$(jq -r '.desiredCount' "$service_json")
          running=$(jq -r '.runningCount' "$service_json")
          primary=$(jq -r '.deployments[] | select(.status=="PRIMARY") | .taskDefinition' "$service_json")
          rollout=$(jq -r '.deployments[] | select(.status=="PRIMARY") | .rolloutState // "NONE"' "$service_json")

          echo "desired=$desired running=$running rollout=$rollout"
          echo "primary=$primary"
          echo "wanted =$ARN"

          # A SERVICE AT ZERO MAKES EVERY CHECK BELOW VACUOUS. `services-stable` returns instantly
          # when nothing is meant to be running, `describe-services` reports the revision
          # update-service just set, and a deliberately broken image deploys green. The count is a
          # repository variable a human sets, so this fails loudly rather than skipping.
          if [ "$desired" -eq 0 ]; then
            echo "::error title=Not deployed::the service's desired count is 0, so nothing was proved. Set TF_VAR_spa_desired_count and run Deploy Infrastructure."
            exit 1
          fi
          # THE CHECK THAT ACTUALLY CATCHES A BAD IMAGE TODAY, and it is worth being exact about
          # which one that is. The circuit breaker runs with rollback DISABLED, so a failing
          # deployment does not revert: PRIMARY stays on the revision this run registered, and the
          # ARN comparison below cannot fire. `runningCount` does not catch it either — it counts
          # the OLD deployment's healthy tasks, which satisfy the desired count while the new ones
          # are dying. So detection rests here, on the rollout state, with the wait's own timeout
          # as the thing that gets us to this point.
          #
          # `COMPLETED` and nothing else. Tolerating an absent state would make this vacuous
          # exactly when the field stops being reported, which is the shape a check must not have.
          #
          # POLLED, because `rolloutState` LAGS `wait services-stable` — measured: the wait
          # returned, the new task was running and the old one had drained, and this field still
          # read `IN_PROGRESS` a second later. Reading it once turns a successful deploy red on a
          # race. Polling keeps the check's teeth: a genuinely failed rollout reports `FAILED` and
          # never reaches `COMPLETED`, so it still fails — just on the state rather than the clock.
          for _ in $(seq 1 24); do
            [ "$rollout" = "COMPLETED" ] && break
            [ "$rollout" = "FAILED" ] && break
            sleep 5
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0]' --output json > "$service_json"
            rollout=$(jq -r '.deployments[] | select(.status=="PRIMARY") | .rolloutState // "NONE"' "$service_json")
            desired=$(jq -r '.desiredCount' "$service_json")
            running=$(jq -r '.runningCount' "$service_json")
            primary=$(jq -r '.deployments[] | select(.status=="PRIMARY") | .taskDefinition' "$service_json")
            echo "  rollout=$rollout running=$running/$desired"
          done

          if [ "$rollout" != "COMPLETED" ]; then
            echo "::error title=Deployment did not complete::rollout state is $rollout after two minutes."
            jq -r '.deployments[] | "  \(.status) \(.taskDefinition) \(.rolloutState // "-") \(.rolloutStateReason // "-")"' "$service_json"
            jq -r '.events[:5][] | "  \(.message)"' "$service_json"
            exit 1
          fi

          # Read after the poll, not before it: mid-rollout the counts legitimately disagree.
          if [ "$running" -ne "$desired" ]; then
            echo "::error title=Not running::$running of $desired tasks are running."
            jq -r '.deployments[] | "  \(.status) \(.taskDefinition) \(.rolloutState // "-") \(.rolloutStateReason // "-")"' "$service_json"
            jq -r '.events[:5][] | "  \(.message)"' "$service_json"
            exit 1
          fi

          # LIVE ONLY IF ROLLBACK IS EVER ENABLED, and kept for that reason. A rolled-back service
          # is stable and healthy — running the PREVIOUS image — so stability would then be no
          # evidence at all about what this run deployed. Keeping it costs nothing and means
          # enabling rollback does not silently remove a check.
          if [ "$primary" != "$ARN" ]; then
            echo "::error title=Not this revision::the service settled on $primary, not the revision this run registered. Rollout: $rollout"
            jq -r '.deployments[] | "  \(.status) \(.taskDefinition) \(.rolloutState // "-") \(.rolloutStateReason // "-")"' "$service_json"
            exit 1
          fi

          # THE ARN IS NOT THE IMAGE. Comparing ARNs proves which revision the service settled on;
          # it proves nothing about what that revision runs. Read back from the settled revision so
          # the workflow's success statement is about the thing that was actually deployed.
          settled_image=$(aws ecs describe-task-definition --task-definition "$ARN" \
            --query 'taskDefinition.containerDefinitions[?name==`spa`].image' --output text)
          if [ -z "$settled_image" ]; then
            echo "::error title=Unreadable::could not read the settled revision's image."
            exit 1
          fi
          if [ "${settled_image##*:}" != "$EXPECTED_TAG" ]; then
            echo "::error title=Wrong image::the settled revision runs ${settled_image##*:}, not $EXPECTED_TAG."
            exit 1
          fi

          echo "::notice title=Deployed::$ARN running $settled_image, $running/$desired tasks"
