name: Deploy Infrastructure

on:
  # The workflow file itself is in the path filter: a change to how we plan, validate or
  # SCAN the infrastructure must re-run against the real infrastructure. Without it this
  # workflow can be edited — including the IAM scan below — and merged having never once
  # executed, which is how a security check ships broken and looks fine. The same holds for
  # every script and list its steps read, the IAM gate's accept-list among them.
  # lambdas/test_config_workflows.py fails when a run block names a file this list omits; a
  # file only a script reaches is kept here by hand: lambdas/tf_blocks.py, and
  # checkov-enforced.sh and checkov-tf-population.sh, which the Checkov corpus runs.
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml',
            '.github/scripts/checkov-scan.sh', '.github/scripts/checkov-scan-test.sh',
            '.github/scripts/lambda_plan_guard.py', '.github/scripts/tf_var_guard.py',
            '.github/scripts/summary-section.sh', '.github/scripts/checkov-plan-iam.sh',
            '.github/checkov-plan-accepted.txt', '.github/scripts/apply-gate.sh',
            '.github/scripts/checkov-enforced.sh', '.github/scripts/checkov-tf-population.sh',
            'lambdas/fixtures/pre_cutover_plan.json',
            'lambdas/fleet.py', 'lambdas/tf_blocks.py']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml',
            '.github/scripts/checkov-scan.sh', '.github/scripts/checkov-scan-test.sh',
            '.github/scripts/lambda_plan_guard.py', '.github/scripts/tf_var_guard.py',
            '.github/scripts/summary-section.sh', '.github/scripts/checkov-plan-iam.sh',
            '.github/checkov-plan-accepted.txt', '.github/scripts/apply-gate.sh',
            '.github/scripts/checkov-enforced.sh', '.github/scripts/checkov-tf-population.sh',
            'lambdas/fixtures/pre_cutover_plan.json',
            'lambdas/fleet.py', 'lambdas/tf_blocks.py']
  # Manual recovery lever. The push trigger above is the normal path, but GitHub
  # can silently DROP a push event (it did for the SPEC-111 merge 930c12e — zero
  # workflow runs were created, so the apply never happened and the deployed state
  # drifted from main with no way to reconcile it). workflow_dispatch is the escape
  # hatch: run this workflow by hand against main to apply whatever main currently
  # holds. It plans nothing (that is a PR-only check) — it applies, exactly like a
  # push does, so the risk profile is identical to the existing main-applies design.
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: >-
          Apply with -refresh=false. RECOVERY ONLY. Use when tofu cannot refresh because
          the deploy role is missing a permission that only this apply can grant — the
          refresh deadlock in infra/info/deploy-role-iam.md. It applies from cached state,
          so anything changed outside tofu since the last run will not be seen.
        type: boolean
        default: false
        required: false

env:
  # SPEC-139. Checkov over the RENDERED plan, which is the only way this repo's IAM
  # policies get scanned at all: they are produced by templatefile() from .tftpl, so in
  # security.yml's .tf scan the `policy` attribute is an unevaluated function call and
  # every IAM check is skipped. Measured — the .tf scan's 305 findings contain zero IAM
  # policy-document checks; a plan JSON with one rendered wildcard policy fires nine.
  #
  # Pinned to the same version as security.yml, for the same reason (#311).
  CHECKOV_VERSION: '3.3.9'
  # `report` | `block`, applied by .github/scripts/apply-gate.sh.
  #
  # BLOCKING as of 2026-08-09, on a narrowed count: IAM findings that are not on
  # .github/checkov-plan-accepted.txt. That list is EMPTY as of 2026-09-02, so the count is
  # every IAM finding on the plan — the two it carried were the deploy role's `cloudfront:*`
  # statement, and they went with it. The list stays keyed by check ID AND resource, because
  # the next acceptance must not suppress the same rule on another policy. The isolation
  # policies have never had one.
  GATE_CHECKOV_PLAN: block
  # Normalises Checkov's three output shapes to one with .summary and .results — see the
  # comment at the scan step. Declared once so the validation and the summary cannot drift.
  CHECKOV_NORM: >-
    (if type=="array" then .[0] else . end)
    | (if has("summary") then . else {summary: ., results: {failed_checks: [], passed_checks: []}} end)

# This workflow had NO concurrency group, so two merges landing close together ran two
# `tofu apply`s against one remote state. The S3 backend's lock turns that into a hard
# failure rather than corruption, but the failure is a lost apply and a lock that may
# need clearing by hand — and the deploy role's own IAM is exactly where a half-applied
# change is worst (the refresh-deadlock lever in CLAUDE.md is the recovery for it).
#
# `cancel-in-progress: false` is the whole point: queue the second run, never cancel the
# first. Cancelling an apply mid-flight is the one outcome worse than waiting for it.
# This is a correctness fix, not a cost one — a queued run still bills.
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  # fmt-check / validate / plan are PR-only checks. main does not re-run them —
  # it applies what the PR already planned. A manual workflow_dispatch skips them
  # too and goes straight to apply, same as a push.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '~1.8'

      - name: OpenTofu format check
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Cap the OIDC assume-role retries. The default is 12, and on 2026-07-27 a connect
          # timeout to STS cost ~7 minutes per attempt, so one job spent 82 minutes failing.
          # Three still retries a fast-failing transient; the slow case is bounded by
          # `timeout-minutes` above, because v4 has no wall-clock option of its own
          # (`action-timeout-s` arrived after it).
          retry-max-attempts: 3

      - name: OpenTofu init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_VAR_state_bucket }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_VAR_state_lock_table }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: OpenTofu validate
        working-directory: infra
        run: tofu validate

      # `tofu validate` walks the ROOT's module graph, so a module nothing calls yet is checked by
      # nothing at all — measured: a module referencing an undeclared variable leaves the root
      # validate reporting "Success!". `docker-lambda` is in exactly that state until the cutover
      # calls it, which is the one window where a mistake in it would surface for the first time
      # on the apply that replaces all 86 functions.
      - name: Validate every module the root does not reach
        run: |
          set -euo pipefail
          checked=0
          for module in infra/modules/*/; do
            grep -qE "\./modules/$(basename "$module")\"?$|\./modules/$(basename "$module")\"" infra/*.tf && continue
            echo "::group::$(basename "$module")"
            tofu -chdir="$module" init -backend=false >/dev/null
            tofu -chdir="$module" validate
            checked=$((checked + 1))
            echo "::endgroup::"
          done
          echo "validated ${checked} module(s) the root does not call."

      - name: OpenTofu plan
        working-directory: infra
        # -out saves the plan so `tofu show -json` can render it for Checkov (SPEC-139).
        # The human-readable output still streams to stdout, so /tmp/plan.txt and the PR
        # comment below are byte-for-byte what they were.
        # `set -o pipefail` is what makes this step's exit code the PLAN's. Without it the
        # pipeline reports `tee`'s status, so `tofu plan` could exit 1 — and did — while the
        # step, the job and the PR check all reported success. OpenTofu still WRITES -out on a
        # failed plan, so the Checkov and IAM gates downstream then scanned a partial plan and
        # passed it. A plan gate that cannot fail is not a gate.
        #
        # The guard runs HERE rather than as a step of its own because the environment it checks
        # is this step's: a TF_VAR_ variable that is set and not in the block below reads as
        # configuration while Terraform builds from its default. The apply step runs it too.
        run: |
          python3 ../.github/scripts/tf_var_guard.py
          set -o pipefail && tofu plan -no-color -out=tfplan 2>&1 | tee /tmp/plan.txt
        env:
          REPO_VARS: ${{ toJSON(vars) }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_github_repo }}
          TF_VAR_state_bucket: ${{ secrets.TF_VAR_state_bucket }}
          TF_VAR_state_lock_table: ${{ secrets.TF_VAR_state_lock_table }}
          TF_VAR_parent_domain: ${{ vars.TF_VAR_parent_domain }}
          TF_VAR_route53_zone_id: ${{ vars.TF_VAR_route53_zone_id }}
          TF_VAR_spa_subdomain: ${{ vars.TF_VAR_spa_subdomain || 'portal' }}
          TF_VAR_api_subdomain: ${{ vars.TF_VAR_api_subdomain || 'api' }}
          # The || fallbacks are not cosmetic: an UNSET repo variable renders as the empty
          # string, which satisfies a required variable and overrides a default. Each of these
          # also carries a validation block, which is the durable half — this line is one
          # careless edit away from being lost.
          TF_VAR_spa_desired_count: ${{ vars.TF_VAR_spa_desired_count || '0' }}
          TF_VAR_spa_image_tag: ${{ vars.TF_VAR_spa_image_tag || 'placeholder' }}
          # The web tier's off switch. Unset means on, so nothing is torn down by a variable
          # nobody set; exactly 'false' turns it off. infra/info/web-tier.md.
          TF_VAR_web_tier_enabled: ${{ vars.TF_VAR_web_tier_enabled || 'true' }}
          # The commit being applied. Unlike spa_image_tag this carries no fallback and no
          # repository variable: it is an input github.sha already knows, and a stale
          # default would create functions from an image nobody meant.
          TF_VAR_lambda_image_tag: ${{ github.sha }}
          # THE SAME repository variable the task definition renders CONFIG_maxUploadBytes from,
          # which is what the container serves in /config.json. One renderer now, but the variable
          # still feeds Terraform here as well — sourcing either from anywhere else makes the
          # infrastructure and the served document disagree with no symptom on screen.
          TF_VAR_max_upload_bytes: ${{ vars.VITE_MAX_UPLOAD_BYTES || '5368709120' }}
          # SPEC-186 FR-004. The module's own comment points operators at a gitignored
          # terraform.tfvars, but a LOCAL apply is not available here: the laptop IAM user
          # cannot read the data buckets (their policies allowlist the portal, deploy and
          # execution roles), so tofu reads them as absent and plans to DESTROY AND RECREATE
          # dat-prod-user-space and dat-prod-archive. Measured 2026-08-14 — 13 to destroy.
          # So the ARNs arrive here instead, from a repo variable rather than from git.
          # A JSON list, because the variable is a list(string). `|| '[]'` is load-bearing, and
          # measured: unset, the env is the empty string, which tofu parses as an HCL expression
          # and rejects with `Error: Missing expression`, failing the whole plan.
          TF_VAR_verification_principal_arns: ${{ vars.TF_VAR_verification_principal_arns || '[]' }}

      - name: Post plan to PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(0, 65000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## OpenTofu Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      # ── IAM POLICY SCAN (SPEC-139) ──────────────────────────────────────────────
      # This is the ONLY place the isolation model gets scanned. security.yml runs
      # Checkov over the .tf tree, where every `policy` attribute is a templatefile()
      # call it cannot evaluate — so `${aws:PrincipalTag/username}`, the shared portal
      # role's scoping and the DATA_LOCATION_ACCESS grants are opaque strings there.
      # `tofu show -json` renders them, and the terraform_plan framework reads them as
      # IAM. Placed after the PR comment so a scanner problem never costs the reviewer
      # their plan.
      - name: Render the plan as JSON
        working-directory: infra
        run: |
          tofu show -json tfplan > plan.json
          if ! jq -e '.planned_values' plan.json >/dev/null 2>&1; then
            echo "::error title=Checkov (plan)::plan.json is not valid plan output — refusing to report zero."
            exit 1
          fi

      # The fixture SPEC-213 FR-002 compares the cutover against, captured from the plan as it is
      # BEFORE anything moves. It is uploaded rather than written into the repo by CI: a fixture a
      # pipeline can regenerate is a fixture that agrees with whatever the code currently says,
      # which is the one thing it must never do. Committed by hand, once, and frozen.
      #
      # This step is not the gate — `Assert the planned Lambda fleet`, two steps below, is. That
      # one hard-fails when the fixture is missing rather than skipping; this one only extracts.
      #
      # AND IT MUST NOT FAIL THE JOB, which it did until a plane was added. `capture` refuses a
      # plan carrying an unknown parity value, correctly — a fixture captured from a plan with
      # pending changes would record a value that is about to move. But a plan that adds a queue
      # and threads its URL into an existing function's environment ALWAYS carries one, so under
      # `set -e` an extractor whose own comment says it is not the gate failed the whole plan job
      # on the first PR that added a plane. It now says why it could not extract and continues;
      # the upload below tolerates the absent file, and the gate two steps down still runs.
      - name: Capture the Lambda parity fixture
        run: |
          set -uo pipefail
          if python3 .github/scripts/lambda_plan_guard.py capture \
              --plan infra/plan.json --out /tmp/pre_cutover_plan.json; then
            head -c 400 /tmp/pre_cutover_plan.json
          else
            echo "::notice title=Lambda parity fixture::not extracted from this plan (it carries a value that is unknown until apply). The frozen fixture is unaffected and the gate below still runs."
          fi

      - name: Upload the Lambda parity fixture
        uses: actions/upload-artifact@v4
        with:
          name: lambda-parity-fixture
          path: /tmp/pre_cutover_plan.json
          retention-days: 7
          if-no-files-found: ignore

      # THE GATE. Invoked directly, never guarded: a missing fixture is a hard error rather than a
      # skip, because a check that passes when its own input is absent reads as enforcement while
      # enforcing nothing.
      #
      # `--package-type Image` is the world as it is: every function is a container running the
      # fleet's one image. The guard landed a PR early carrying BOTH modes and was proven against
      # the zip fleet first, so the cutover changed this one word rather than the gate.
      #
      # The repository is described BY NAME, never unfiltered: an unfiltered describe-repositories
      # authorizes against `repository/*`, while the deploy role is scoped to this registry and
      # the SPA's — so asking "which one ends in -lambda" needs a strictly wider grant than
      # constructing the name does.
      - name: Assert the planned Lambda fleet
        env:
          PROJECT: dat
          ENVIRONMENT: prod
        run: |
          set -euo pipefail
          REPOSITORY=$(aws ecr describe-repositories \
            --repository-names "${PROJECT}-${ENVIRONMENT}-lambda" \
            --query 'repositories[0].repositoryUri' --output text)

          # Written to a FILE, not passed as a process substitution. `<(…)` hands the guard a
          # readable stream whatever the command inside did, so a derivation that failed would
          # arrive as an empty table — and this step's `set -e` never sees the exit status of a
          # command it did not run in the foreground. A plain assignment fails here instead.
          python3 lambdas/fleet.py --rows > fleet-rows.json

          python3 .github/scripts/lambda_plan_guard.py check \
            --plan infra/plan.json \
            --fixture lambdas/fixtures/pre_cutover_plan.json \
            --package-type Image \
            --image-repository "$REPOSITORY" \
            --table fleet-rows.json \
            --project "$PROJECT" \
            --environment "$ENVIRONMENT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      # The scan below refuses any configuration Checkov reports taking from outside its
      # command line. That refusal never fires on a normal run, so this proves it still does,
      # against the scanner just installed, before the gate relies on it. It also proves the
      # numerator refuses an IAM finding Checkov reports skipped, which this scan records only
      # if it is ever given --repo-root-for-plan-enrichment, and a new policy the plan marks
      # unknown until apply, which Checkov scores without reading.
      - name: Prove the scan refuses configuration it was not given
        run: .github/scripts/checkov-scan-test.sh

      - name: Scan the rendered plan
        working-directory: infra
        # No --quiet: it strips passed_checks from the JSON, and without those the
        # IAM-coverage assertion below cannot tell "no IAM check ran" from "every IAM
        # check passed". Those two must never look alike — the first is the bug this
        # spec exists to prevent recurring.
        #
        # THROUGH checkov-scan.sh, never bare. Checkov also reads a `.checkov.yml` from the
        # working directory, which is infra/ here, or from $HOME, even with -f. Measured with
        # this invocation on a fixture plan: one holding `skip-check: [CKV_AWS_355]` took that
        # finding off while every other IAM check still ran, so the coverage assertion below
        # passed and the gate counted the rest. The wrapper refuses to scan instead, and
        # writes nothing, so the JSON check below fails the step.
        run: |
          ../.github/scripts/checkov-scan.sh -f plan.json \
            --framework terraform_plan \
            --output json --compact --soft-fail > checkov-plan.json || true
          # Checkov emits THREE shapes: a list (multi-framework), an object with .summary
          # and .results, or — when it found nothing to scan — a BARE summary object with
          # no .summary key at all. The third is the dangerous one: naive parsing yields
          # null, and `[ null -gt 0 ]` is a shell error, not a zero. Normalise all three.
          if ! jq -e "$CHECKOV_NORM | .summary.failed" checkov-plan.json >/dev/null 2>&1; then
            echo "::error title=Checkov (plan)::output is not valid — the scan did not complete."
            exit 1
          fi

      - name: Summarize
        if: always()
        working-directory: infra
        run: |
          norm="$CHECKOV_NORM"
          [ -f checkov-plan.json ] || { echo "::error::checkov-plan.json missing."; exit 1; }
          count=$(jq "$norm | .summary.failed" checkov-plan.json)
          passed=$(jq "$norm | .summary.passed" checkov-plan.json)
          # Recorded FIRST, before any analysis that could fail. If a later line in this
          # step errors, the gate must still see the real count — `${VAR:-0}` turning a
          # broken summary into a clean-looking zero is the failure mode this whole
          # workflow exists to prevent.
          echo "CHECKOV_PLAN_FINDINGS=$count" >> "$GITHUB_ENV"
          parse_errs=$(jq "$norm | .summary.parsing_errors" checkov-plan.json)

          # THE POINT OF THE EXERCISE, asserted rather than assumed. If the plan carries
          # IAM policies but no IAM check was evaluated against them, this has silently
          # regressed to the state SPEC-138 was stuck in — and a regressed run looks
          # exactly like a clean one. A policy unknown until apply still counts as evaluated
          # here, because Checkov passes the checks it runs on one; the next step refuses a new
          # one and names an updated one.
          # Select resource BLOCKS structurally (an object carrying both `type` and
          # `address`) rather than trusting any key named `resources` to hold them. The
          # first version walked `.. | .resources?` and blew up on a real plan —
          # `Cannot index string with string "type"` — because some resource's own
          # attributes include a `resources` list of plain strings. Fixture plans never
          # had one, so it passed every local test and failed on the first plan that
          # actually had changes in it.
          iam_resources=$(jq '[.planned_values.root_module | .. | objects
                               | select((.type? | type) == "string" and (.address? | type) == "string")
                               | select(.type | test("^aws_iam_(policy|role_policy|role|group_policy|user_policy)$"))] | length' plan.json)
          iam_evaluated=$(jq "$norm | [(.results.failed_checks // [])[], (.results.passed_checks // [])[]] |
                               map(select(.resource | test(\"(^|[.])aws_iam_\"))) | length" checkov-plan.json)
          iam_failed=$(jq "$norm | (.results.failed_checks // []) |
                            map(select(.resource | test(\"(^|[.])aws_iam_\"))) | length" checkov-plan.json)

          : > body.md
          if [ "$count" -gt 0 ]; then
            {
              echo "**${iam_failed} of these are IAM policy findings** — the class security.yml cannot see."
              echo
              echo "| Count | Check | Rule | Example resource |"
              echo "|---|---|---|---|"
              jq -r "$norm | .results.failed_checks | group_by(.check_id) | sort_by(-length) | .[] |
                     \"| \(length) | \`\(.[0].check_id)\` | \(.[0].check_name) | \`\(.[0].resource)\` |\"" checkov-plan.json
              echo
              echo "_${passed} check(s) passed. Scanned the RENDERED plan, so policy documents were read as IAM._"
            } > body.md
          fi
          ../.github/scripts/summary-section.sh "Checkov — rendered plan (IAM)" "$count" body.md

          if [ "$iam_resources" -gt 0 ] && [ "$iam_evaluated" -eq 0 ]; then
            echo "::error title=Checkov (plan)::the plan holds $iam_resources IAM resource(s) but NO IAM check was evaluated. The policies went unread — this is the SPEC-138 blind spot returning."
            exit 1
          fi
          echo "IAM resources in plan: $iam_resources; IAM checks evaluated: $iam_evaluated; IAM findings: $iam_failed"

          if [ "$parse_errs" -gt 0 ]; then
            echo "::error title=Checkov (plan)::$parse_errs parsing error(s) — the plan was not fully scanned."
            exit 1
          fi
          echo "CHECKOV_PLAN_FINDINGS recorded above as the full count; the next step narrows it"

      # THE GATE'S NUMERATOR, and the reason this job exists. `count` above is every
      # finding, including the non-IAM rules security.yml already reports and disposes of
      # (no VPC, no CMK, no X-Ray) — gating those here would fail this job for reasons that
      # have nothing to do with what the scan is for. This narrows to IAM findings that are
      # not on .github/checkov-plan-accepted.txt. It reads plan.json too: a NEW IAM policy the
      # plan marks unknown until apply, which the scan scored without reading, is a hard error,
      # and an UPDATED one is named in a warning and the job summary instead, because a module's
      # depends_on defers documents whose content has not changed.
      #
      # ASSIGN, THEN ECHO — never `echo "VAR=$(script)"`. A failing command substitution
      # inside an argument to `echo` does not fail the step (echo exits 0), and the empty
      # value it writes then wins over the full count recorded above. Only an assignment's
      # substitution failure trips `set -e`.
      - name: Narrow to unaccepted IAM findings
        working-directory: infra
        run: |
          findings=$(../.github/scripts/checkov-plan-iam.sh checkov-plan.json ../.github/checkov-plan-accepted.txt plan.json)
          echo "CHECKOV_PLAN_FINDINGS=$findings" >> "$GITHUB_ENV"

      # The Checkov RESULT is publishable. The plan that produced it is not — see the
      # cleanup step below.
      - name: Upload Checkov result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-plan
          path: infra/checkov-plan.json
          retention-days: 30
          if-no-files-found: warn

      - name: Apply gate
        if: always()
        # `no-count`, not `0`: `:-` substitutes on empty as well as unset, so defaulting to
        # zero would turn "no number was ever written" into "clean". apply-gate.sh treats a
        # non-numeric count as a hard error, which is exactly what an absent count is.
        run: .github/scripts/apply-gate.sh "Checkov (plan)" "$GATE_CHECKOV_PLAN" "${CHECKOV_PLAN_FINDINGS:-no-count}"

      # A rendered plan is strictly more revealing than the .tf it came from: resolved
      # ARNs, account identifiers, and every policy document in full. SPEC-138 uploads
      # each scanner's raw input; this one deliberately does not, and the files are
      # removed so a step added to this job later cannot pick them up by accident.
      - name: Remove the plan files
        if: always()
        working-directory: infra
        run: rm -f plan.json tfplan

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 60, not 30. A job timeout cancels `tofu apply` mid-run WITH THE STATE LOCK HELD, which is
    # a lost apply and a lock to clear by hand. It was raised for the CloudFront teardown, which
    # ran long because a distribution is destroyed by disabling it and waiting for every edge to
    # catch up; the distribution is gone and the ceiling stays, because it costs nothing to carry
    # and the next long destroy would otherwise find it at half an hour.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '~1.8'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: OpenTofu init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_VAR_state_bucket }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_VAR_state_lock_table }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # A container function cannot be CREATED pointing at a tag the registry does not hold. After
      # creation the value is ignored, so the constraint is real exactly once per function — but
      # "once" includes every function this apply creates, and `deploy-lambda-image.yml` carries no
      # `paths:` filter, so it fires on the SAME PUSH as this apply and the two race. Losing that
      # race fails CreateFunction partway through the fleet.
      #
      # IT FAILS ON A DISPATCH TOO, and that is deliberate rather than an oversight. The dispatch
      # path exists for a dropped push event — which drops the IMAGE build as well, so main's tip
      # has no image at all, and warning-and-continuing would turn a clean refusal into an
      # InvalidParameterValueException with functions already destroyed. The recovery needs no new
      # input: dispatch `Deploy Lambda image` (an empty tag builds this commit), then dispatch this
      # workflow.
      #
      # A poll rather than a `data "aws_ecr_image"`: the plan job runs on pull requests, where
      # github.sha is a MERGE COMMIT whose image was never pushed, and a data source would fail
      # every PR.
      - name: Wait for this commit's Lambda image
        env:
          PROJECT: dat
          ENVIRONMENT: prod
        run: |
          set -euo pipefail
          NAME="${PROJECT}-${ENVIRONMENT}-lambda"
          for attempt in $(seq 1 60); do
            if aws ecr describe-images --repository-name "$NAME" \
                 --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "::notice title=Image ready::${NAME}:${GITHUB_SHA} is in the registry."
              exit 0
            fi
            echo "Waiting for ${NAME}:${GITHUB_SHA} (attempt ${attempt}/60)…"
            sleep 10
          done
          echo "::error title=No image::${NAME}:${GITHUB_SHA} is not in the registry after ~10 min. Check the 'Deploy Lambda image' run for this commit; an apply that CREATES a function from a tag the registry does not hold fails partway through the fleet. To recover, dispatch 'Deploy Lambda image' with an empty tag, then dispatch this workflow."
          exit 1

      - name: OpenTofu apply
        working-directory: infra
        # -refresh=false is a RECOVERY LEVER, off by default and only reachable via
        # workflow_dispatch. It exists because a deploy role can lock itself out: tighten
        # one of its own grants, and the next refresh needs the permission the pending
        # change would restore, so plan/apply/revert all fail identically. Applying from
        # cached state installs the fix and unblocks normal runs.
        #
        # Every use should be followed by an ordinary run to confirm the refresh works
        # again — an apply that skipped refresh has proved nothing about drift.
        run: |
          python3 ../.github/scripts/tf_var_guard.py
          REFRESH_FLAG=""
          if [ "${{ inputs.skip_refresh }}" = "true" ]; then
            REFRESH_FLAG="-refresh=false"
            echo "::warning title=Recovery mode::Applying with -refresh=false. State is NOT refreshed; drift will not be detected. Run this workflow again normally afterwards."
          fi
          tofu apply -auto-approve $REFRESH_FLAG
        env:
          # See the plan step: the guard on the first line of `run` checks this block.
          REPO_VARS: ${{ toJSON(vars) }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_github_repo }}
          TF_VAR_state_bucket: ${{ secrets.TF_VAR_state_bucket }}
          TF_VAR_state_lock_table: ${{ secrets.TF_VAR_state_lock_table }}
          TF_VAR_parent_domain: ${{ vars.TF_VAR_parent_domain }}
          TF_VAR_route53_zone_id: ${{ vars.TF_VAR_route53_zone_id }}
          TF_VAR_spa_subdomain: ${{ vars.TF_VAR_spa_subdomain || 'portal' }}
          TF_VAR_api_subdomain: ${{ vars.TF_VAR_api_subdomain || 'api' }}
          # The || fallbacks are not cosmetic: an UNSET repo variable renders as the empty
          # string, which satisfies a required variable and overrides a default. Each of these
          # also carries a validation block, which is the durable half — this line is one
          # careless edit away from being lost.
          TF_VAR_spa_desired_count: ${{ vars.TF_VAR_spa_desired_count || '0' }}
          TF_VAR_spa_image_tag: ${{ vars.TF_VAR_spa_image_tag || 'placeholder' }}
          # The web tier's off switch. Unset means on, so nothing is torn down by a variable
          # nobody set; exactly 'false' turns it off. infra/info/web-tier.md.
          TF_VAR_web_tier_enabled: ${{ vars.TF_VAR_web_tier_enabled || 'true' }}
          # The commit being applied. Unlike spa_image_tag this carries no fallback and no
          # repository variable: it is an input github.sha already knows, and a stale
          # default would create functions from an image nobody meant.
          TF_VAR_lambda_image_tag: ${{ github.sha }}
          # THE SAME repository variable the task definition renders CONFIG_maxUploadBytes from,
          # which is what the container serves in /config.json. One renderer now, but the variable
          # still feeds Terraform here as well — sourcing either from anywhere else makes the
          # infrastructure and the served document disagree with no symptom on screen.
          TF_VAR_max_upload_bytes: ${{ vars.VITE_MAX_UPLOAD_BYTES || '5368709120' }}
          # SPEC-186 FR-004 — see the plan job's env block for why this is not a tfvars file.
          TF_VAR_verification_principal_arns: ${{ vars.TF_VAR_verification_principal_arns || '[]' }}

      # Managed Login (managed_login_version = 2, set in module.auth) needs a
      # branding style per app client or the v2 login/signup pages fail to render.
      # The native aws_cognito_managed_login_branding resource only exists in the
      # AWS provider's 6.x line; this repo is pinned to ~> 5.0, so we ensure
      # Cognito's provided default here (CI owns this imperative step, the same
      # split used for Lambda code). Idempotent: a re-run hits
      # ManagedLoginBrandingExistsException, which we treat as success; any other
      # failure (e.g. AccessDenied) fails the deploy rather than masking it.
      - name: Ensure Managed Login default branding
        working-directory: infra
        run: |
          USER_POOL_ID=$(tofu output -raw cognito_user_pool_id)
          CLIENT_ID=$(tofu output -raw cognito_user_pool_client_id)
          if aws cognito-idp create-managed-login-branding \
               --user-pool-id "$USER_POOL_ID" \
               --client-id "$CLIENT_ID" \
               --use-cognito-provided-values \
               --region "${{ vars.AWS_REGION }}" >/dev/null 2>err.log; then
            echo "Created Cognito-provided default Managed Login branding."
          elif grep -q "ManagedLoginBrandingExistsException" err.log; then
            echo "Managed Login branding already exists — nothing to do."
          else
            echo "Failed to ensure Managed Login branding:" >&2
            cat err.log >&2
            exit 1
          fi
