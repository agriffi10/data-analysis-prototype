name: Deploy SPA static

# Builds the SPA and puts it in the static portal's bucket, while the web tier is off and CloudFront
# serves the portal. config.json is not here: Terraform owns that object.
#
# NO `paths:` FILTER, because a filter cannot see a previous run that failed: production would stay
# on the old bundle behind green merges until the next change to the app. Every push heals it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized, and a running deploy is never cancelled. A reconcile pass listing assets/ while another
# run uploads deletes the newer chunks with the newer shell already live, and a cancelled run leaves
# a shell pointing at chunks it never uploaded.
concurrency:
  group: deploy-spa-static
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.TF_VAR_web_tier_enabled == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w apps/portal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Resolve the bucket and the distribution
        id: names
        env:
          SPA_HOST: ${{ vars.TF_VAR_spa_subdomain }}.${{ vars.TF_VAR_parent_domain }}
        run: |
          set -euo pipefail

          # The names Terraform builds from its project_name and environment defaults.
          BUCKET=dat-prod-portal-static
          aws s3api head-bucket --bucket "$BUCKET"

          DISTRIBUTION=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='$SPA_HOST']].Id | [0]" --output text)
          if [ -z "$DISTRIBUTION" ] || [ "$DISTRIBUTION" = "None" ]; then
            echo "::error title=Distribution::no distribution has the alias $SPA_HOST. Run Deploy Infrastructure."
            exit 1
          fi
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DISTRIBUTION"
          } >> "$GITHUB_OUTPUT"

      # Assets first, so a new shell never points at a chunk that is not there yet. Each pass owns a
      # disjoint set of keys: a second pass over a file would overwrite its cache header. The .gz
      # files are the container's; CloudFront compresses at the edge.
      - name: Sync hashed assets (immutable)
        run: |
          aws s3 sync apps/portal/dist/assets/ "s3://${{ steps.names.outputs.bucket }}/assets/" \
            --exclude '*.gz' --cache-control 'public, max-age=31536000, immutable'

      # no-cache because a browser applying heuristic freshness to index.html asks for a chunk the
      # reconcile below has deleted, and renders a white screen. No --delete: config.json lives here.
      - name: Sync the shell (revalidate always)
        run: |
          aws s3 sync apps/portal/dist/ "s3://${{ steps.names.outputs.bucket }}/" \
            --exclude 'assets/*' --exclude '*.gz' --cache-control 'no-cache'

      - name: Reconcile deleted assets
        run: |
          aws s3 sync apps/portal/dist/assets/ "s3://${{ steps.names.outputs.bucket }}/assets/" \
            --delete --exclude '*.gz' --cache-control 'public, max-age=31536000, immutable'

      - name: Invalidate the edge cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.names.outputs.distribution }}" --paths '/*'
