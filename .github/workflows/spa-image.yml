name: SPA image

# The image's behaviour gate, on PULL REQUESTS. Every criterion the image is built against is a
# response header, a status code or a file in a layer, and nothing in the other two suites observes
# any of them — no Vitest test sees nginx, no pytest sees a Dockerfile. Without this job the whole
# specification is documentation.
#
# IT RUNS BEFORE MERGE, deliberately. The deploy workflow runs the same script against the same
# image before it pushes, but a gate that only runs after merge cannot block anything — it can only
# redden main and tell you afterwards.
#
# PATH-FILTERED, unlike the deploy workflow. This job only proves the image, so a commit that
# changes no input to it has nothing to prove. The deploy workflow is deliberately NOT filtered:
# the container has to track main exactly like the CloudFront bundle does, or "which commit is in
# production" stops having an answer.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/**'
      # The Dockerfile's first COPY, and `npm ci` runs off them: a root lockfile bump changes the
      # bundle and can break the build, which is exactly the change class that would otherwise
      # land without this gate running.
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.dockerignore'
      - '.github/scripts/spa-image-matrix.sh'
      - '.github/workflows/spa-image.yml'
      - '.github/workflows/deploy-spa-image.yml'

concurrency:
  group: spa-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Build the image and assert its behaviour
    runs-on: ubuntu-latest
    # The build is ~3 minutes and the matrix ~2. Twelve bounds a hung run well clear of that
    # without sitting against GitHub's six-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # linux/amd64 EXPLICITLY, matching the deploy build and the X86_64 the task definition
      # declares. The runner is amd64 today; stating it keeps that from being load-bearing and
      # unwritten, which is the trap the placeholder image's own comment block recorded.
      - name: Build
        run: |
          docker build --platform linux/amd64 \
            -f apps/portal/Dockerfile \
            --build-arg BUILD_VERSION="${GITHUB_SHA}" \
            -t "spa:${GITHUB_SHA}" .

      - name: Assert the behaviour matrix
        run: .github/scripts/spa-image-matrix.sh "spa:${GITHUB_SHA}" "${GITHUB_SHA}"
